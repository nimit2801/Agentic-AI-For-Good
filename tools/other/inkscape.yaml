name: Inkscape
description: Open-source vector graphics editor for SVG illustration, diagrams, and icon work. Inkscape is used to design diagrams, UI icons, and vector assets that document AI systems or ship with agent and model product interfaces.
tagline: Free SVG vector editor for diagrams and icons

github_url: https://github.com/inkscape/inkscape
website_url: https://inkscape.org/
docs_url: https://inkscape.org/learn/

category: Other
tags: [svg, vector, editor, desktop, design, open-source]
pricing: free
is_open_source: true
license: GPL-2.0-or-later
install_command: brew install --cask inkscape

problem_solved: |
  AI product and research teams need vector diagrams, icons, and SVG
  assets without a paid illustration suite. Inkscape edits SVG with
  paths, text, and export so architecture diagrams, dataset figures,
  and UI icons stay in an open format that agents and web apps can
  render.

use_cases:
  - Draw architecture diagrams for RAG, agent, and training pipelines
  - Design SVG icons and logos for an AI product interface
  - Export vector figures used in model cards and evaluation reports
  - Convert SVG assets for web and mobile agent UIs
  - Edit path-based annotations or overlays used in vision demos
