name: Wiki.js
description: Open-source wiki engine for documenting products, runbooks, and AI system knowledge with Git-backed pages, access control, and a modern editor.
tagline: Modern open-source wiki for team knowledge

github_url: https://github.com/requarks/wiki
website_url: https://js.wiki
docs_url: https://docs.requarks.io

category: Other
tags: [wiki, documentation, knowledge-base, git, self-hosted, markdown]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  AI and platform teams scatter runbooks, model cards, and internal docs across wikis,
  docs sites, and Git repos that nobody can search together. Wiki.js gives a self-hosted
  wiki with Git storage, access control, and a modern editor so that operational knowledge
  for models, agents, and data pipelines lives in one searchable place.

use_cases:
  - Host internal runbooks and model cards next to the engineering wiki
  - Keep Git-backed documentation that reviewers can edit in the browser
  - Share AI platform how-tos with access control for different teams
  - Replace outdated Confluence or MediaWiki installs with a lighter wiki
