name: Miniflux
description: Minimalist self-hosted RSS reader with a clean UI, keyboard shortcuts, and an API. Follows papers, blogs, and changelogs without the clutter of a full news aggregator SaaS.
tagline: Minimalist self-hosted RSS reader

github_url: https://github.com/miniflux/v2
website_url: https://miniflux.app
docs_url: https://miniflux.app/docs/index.html

category: Other
tags: [rss, feeds, self-hosted, reader, go, privacy]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Feed readers are either bloated SaaS or abandoned PHP apps. Miniflux
  is a small Go RSS reader you self-host with an API and keyboard UI
  so researchers can follow sources without ads or a vendor account.

use_cases:
  - Follow AI papers, changelogs, and blogs in a keyboard-driven reader
  - Pipe unread items through the API into an LLM summarization job
  - Self-host subscriptions for a research group without Feedly
  - Filter feeds and mark entries from a minimal web UI
