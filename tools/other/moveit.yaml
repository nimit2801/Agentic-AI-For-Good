name: MoveIt
description: Motion planning framework for ROS 2 manipulators. Teams plan collision-free trajectories, pick-and-place, and Cartesian paths with inverse kinematics, planning pipelines, and perception plugins.
tagline: ROS 2 motion planning for robot manipulators

github_url: https://github.com/moveit/moveit2
website_url: https://moveit.ai/
docs_url: https://moveit.ai/

category: Other
tags: [c++, ros, robotics, motion-planning, manipulation, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Collision-free arm motion in ROS usually means gluing IK, planners, and controllers by hand. MoveIt is the ROS 2 planning framework so manipulator teams get trajectories, pick-and-place, and Cartesian paths with a shared planning scene.

use_cases:
  - Plan collision-free manipulator trajectories in a ROS 2 cell
  - Run pick-and-place with perception plugins and a planning scene
  - Compute Cartesian and joint-space paths for industrial arms
  - Integrate inverse kinematics and OMPL planners in one pipeline
