name: Orca
description: Orca is an esoteric live-coding language for procedural sequencers. Each letter is an operator on a 2D grid that sends MIDI, OSC, and UDP to DAWs, modular racks, and SuperCollider.
tagline: Grid-based livecoding language for MIDI, OSC, and UDP

github_url: https://github.com/hundredrabbits/Orca
website_url: https://100r.co/site/orca.html
docs_url: https://100r.co/site/orca.html

category: Other
tags: [orca, live-coding, midi, osc, sequencer, esolang, music]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Most live-coding tools are text editors talking to a synth engine. Orca
  is a 2D grid where every letter is an operator, so performers build
  Euclidean rhythms, clocks, and sequencers visually and bang MIDI, OSC,
  or UDP into Ableton, Renoise, VCV Rack, or SuperCollider without writing
  a synth.

use_cases:
  - Build a Euclidean MIDI sequencer on a 2D operator grid
  - Send OSC and UDP from a live Orca patch into SuperCollider or VCV Rack
  - Perform a hardware-free procedural sequencer in the browser or desktop app
  - Drive Ableton or Renoise clips from Orca clocks, delays, and random operators
