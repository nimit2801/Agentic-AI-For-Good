name: VCV Rack
description: VCV Rack is an open virtual Eurorack studio. Musicians patch virtual modules on a grid so modular synthesis, CV routing, and plugin hosting stay software-native without buying hardware racks.
tagline: Open virtual Eurorack modular studio

github_url: https://github.com/VCVRack/Rack
website_url: https://vcvrack.com/
docs_url: https://vcvrack.com/manual/

install_command: brew install --cask vcv-rack

category: Other
tags: [vcv-rack, eurorack, modular, synthesizer, audio, cv, music]
pricing: freemium
is_open_source: true
license: GPL-3.0

problem_solved: |
  Hardware Eurorack is expensive and immobile. Closed modular hosts
  lock patches to a vendor. VCV Rack is an open virtual rack so
  musicians patch CV, oscillators, and effects on a laptop.

use_cases:
  - Patch a virtual Eurorack system without hardware modules
  - Host VCV and third-party modules for live or studio work
  - Prototype CV routing and modulation before buying hardware
  - Render modular patches as stems for a DAW or ML audio set
