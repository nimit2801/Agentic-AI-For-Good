name: ROS 2
description: ROS 2 is the Robot Operating System, a middleware for building robot software. It provides communication, hardware drivers, simulation, and tooling so teams compose perception, planning, and control as distributed nodes across research and production robots.
tagline: Middleware and tooling for building distributed robot software

github_url: https://github.com/ros2/ros2
website_url: https://www.ros.org
docs_url: https://docs.ros.org

category: Other
tags: [c++, python, robotics, middleware, ros, simulation, drivers, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Robot software is many processes talking to sensors, planners, and
  actuators. ROS 2 is the standard middleware with DDS communication,
  packages, and tools so teams share drivers, run simulation, and
  deploy perception and control without inventing a custom bus.

use_cases:
  - Compose perception, planning, and control as ROS 2 nodes on a robot
  - Reuse community drivers and messages for cameras, lidar, and IMUs
  - Simulate a robot stack in Gazebo or Isaac Sim through ROS 2 bridges
  - Deploy the same graph from laptop bring-up to production hardware
