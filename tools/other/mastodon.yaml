name: Mastodon
description: Self-hosted, federated microblogging server on the ActivityPub social web. Run your own instance so an AI lab, conference, or builder community can publish without a single vendor timeline.
tagline: Federated microblogging you host yourself

github_url: https://github.com/mastodon/mastodon
website_url: https://joinmastodon.org
docs_url: https://docs.joinmastodon.org

category: Other
tags: [social, federated, activitypub, self-hosted, microblogging, ruby]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Centralized social networks own the timeline, the graph, and the moderation policy.
  Mastodon is a self-hosted microblogging server on ActivityPub, so a lab or builder
  community can publish short updates, follow other instances, and keep the social
  graph on infrastructure they control.

use_cases:
  - Run a lab or conference instance for research updates
  - Publish model-release notes on a federated timeline you host
  - Follow other ActivityPub servers without a single vendor
  - Moderate a builder community with local instance rules
