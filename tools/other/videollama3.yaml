name: VideoLLaMA3
description: DAMO NLP frontier multimodal models for image and video understanding, with 2B and 7B Qwen2.5 checkpoints on Hugging Face. Open inference via Transformers, FlashAttention, and demos that score strongly on VideoMME and LVBench.
tagline: Frontier open models for image and video understanding

github_url: https://github.com/DAMO-NLP-SG/VideoLLaMA3
website_url: https://huggingface.co/collections/DAMO-NLP-SG/videollama3-678cdda9281a0e32fe79af15
docs_url: https://github.com/DAMO-NLP-SG/VideoLLaMA3#readme

category: Other
tags: [python, multimodal, video, vision-language, qwen, huggingface, transformers]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Open video LLMs lag closed models on long-clip QA and mixed image
  plus video chat. VideoLLaMA3 ships 2B and 7B Qwen2.5 checkpoints
  with Transformers inference so teams can run frontier video
  understanding without a proprietary API.

use_cases:
  - Load VideoLLaMA3-7B with Transformers for open-ended video question answering
  - Run the image-only VideoLLaMA3-7B-Image checkpoint on screenshots and documents
  - Fine-tune VideoLLaMA3 from the training extras and VL3-Syn7M recaptioned data
  - Compare 7B video VLMs on VideoMME and LVBench using the official evaluation path
