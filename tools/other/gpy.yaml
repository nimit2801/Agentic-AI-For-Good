name: GPy
description: Gaussian process framework in Python from the Sheffield ML group. Teams build GP regression, classification, and latent-variable models with kernels, sparse approximations, and plotting utilities.
tagline: Gaussian process toolbox for regression and classification

github_url: https://github.com/SheffieldML/GPy
website_url: https://sheffieldml.github.io/GPy/
docs_url: https://gpy.readthedocs.io

install_command: pip install GPy

category: Other
tags: [python, gaussian-process, bayesian, kernels, machine-learning, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Gaussian process models in Python need kernels, sparse approximations, and plotting in one toolbox. GPy is the Sheffield ML framework so teams can build GP regression, classification, and latent-variable models without assembling SciPy primitives by hand.

use_cases:
  - Fit GP regression and classification models with custom kernels
  - Use sparse Gaussian processes on larger tabular datasets
  - Build GPLVM latent-variable models for unsupervised structure
  - Plot posterior mean and uncertainty from a trained GPy model
