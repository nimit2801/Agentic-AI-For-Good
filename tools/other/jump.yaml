name: JuMP
description: Julia modeling language for mathematical optimization covering linear, mixed-integer, conic, semidefinite, and nonlinear problems. Teams write models in Julia and dispatch to solvers such as HiGHS, IPOPT, and Gurobi.
tagline: Julia algebraic modeling language for optimization

github_url: https://github.com/jump-dev/JuMP.jl
website_url: https://jump.dev/JuMP.jl/stable/
docs_url: https://jump.dev/JuMP.jl/stable/

category: Other
tags: [julia, optimization, modeling, milp, nlp, open-source]
pricing: free
is_open_source: true
license: MPL-2.0

problem_solved: |
  Algebraic modeling in Julia needs a first-class DSL, not a Python wrapper. JuMP is an MPL modeling language so researchers can write LP, MILP, conic, and NLP models in Julia and swap solvers without rewriting the model.

use_cases:
  - Model mixed-integer linear programs in Julia
  - Solve nonlinear and conic programs with IPOPT or other backends
  - Prototype energy or logistics models with solver-agnostic JuMP code
  - Teach operations research with interactive Julia notebooks
