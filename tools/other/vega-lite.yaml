name: Vega-Lite
description: Vega-Lite is a concise JSON grammar for interactive charts on top of Vega. It compiles compact specs into Vega so teams publish statistical graphics without writing low-level scenegraph marks.
tagline: Concise grammar of interactive graphics on top of Vega

github_url: https://github.com/vega/vega-lite
website_url: https://vega.github.io/vega-lite/
docs_url: https://vega.github.io/vega-lite/docs/

category: Other
tags: [vega-lite, visualization, charts, grammar, json, d3, interactive, data-viz]
pricing: free
is_open_source: true
license: BSD-3-Clause

install_command: npm install vega-lite

problem_solved: |
  Vega specs are powerful but verbose for everyday statistical
  charts. Vega-Lite compiles a short JSON grammar into Vega so
  experiment dashboards, model-eval plots, and notebooks get
  interactive graphics without hand-writing scenegraph marks.

use_cases:
  - Publish an interactive scatter or bar chart from a JSON spec
  - Embed Vega-Lite plots in a model-eval or experiment dashboard
  - Compile compact chart specs to Vega for a web notebook
  - Share layered statistical graphics without custom D3 code
