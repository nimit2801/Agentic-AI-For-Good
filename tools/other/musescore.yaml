name: MuseScore
description: MuseScore is free open-source music notation software. Composers write, play, and export scores so sheet music and MIDI leave a desktop app without a commercial notation suite.
tagline: Open-source music notation software for scores and MIDI

github_url: https://github.com/musescore/MuseScore
website_url: https://musescore.org/
docs_url: https://musescore.org/en/handbook

install_command: brew install --cask musescore

category: Other
tags: [musescore, notation, sheet-music, midi, music, score, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Writing and sharing sheet music usually requires a paid notation
  suite. MuseScore is an open desktop app for engraving, playback,
  and MIDI export so composers and educators produce scores without
  a commercial license.

use_cases:
  - Engrave a score and export MusicXML or PDF
  - Play back notation through a SoundFont for rehearsal
  - Export MIDI from a score into a generative music pipeline
  - Teach music notation without a paid suite
