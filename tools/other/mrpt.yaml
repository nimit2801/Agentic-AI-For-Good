name: MRPT
description: MRPT is the Mobile Robot Programming Toolkit, a C++ library for SLAM, localization, maps, and sensors. It provides 2D/3D mapping, particle filters, observation types, and apps so research robots process range, vision, and odometry data.
tagline: C++ toolkit for mobile robot SLAM, maps, and sensors

github_url: https://github.com/MRPT/mrpt
website_url: https://www.mrpt.org
docs_url: https://docs.mrpt.org/reference/latest/

category: Other
tags: [c++, robotics, slam, localization, mapping, sensors, particle-filter]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Mobile robot research needs maps, particle filters, and sensor
  models in one library. MRPT provides SLAM, localization, and
  observation types for range, vision, and odometry so teams prototype
  mapping and navigation without assembling a stack from scratch.

use_cases:
  - Run 2D or 3D SLAM on a mobile robot with lidar and odometry
  - Localize in a grid or metric map using particle filters
  - Convert sensor observations into MRPT map representations
  - Prototype mapping apps with MRPT visualization and datasets
