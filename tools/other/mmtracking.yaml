name: MMTracking
description: |-
  OpenMMLab video perception toolbox supporting video object detection, multiple object tracking, single object tracking and video instance segmentation.
problem_solved: |-
  Developers need a unified framework for video perception tasks rather than maintaining separate tools for each task.
use_cases:
  - "Video object detection pipelines"
  - "Multi-object tracking in surveillance systems"
  - "Single object tracking for robotics applications"
  - "Video instance segmentation for content analysis"
github_url: https://github.com/open-mmlab/mmtracking
website_url: https://mmtracking.readthedocs.io/
docs_url: https://mmtracking.readthedocs.io/en/latest/
install_command: pip install mmtrack
category: Other
is_open_source: true
pricing: free
