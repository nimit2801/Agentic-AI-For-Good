name: Pyramid Flow
description: Pyramid Flow is a pyramidal flow matching model for efficient video generation that produces high-quality videos using a multi-resolution training approach, reducing compute requirements while maintaining temporal coherence.
tagline: Efficient video generation with pyramidal flow matching

github_url: https://github.com/jy0205/Pyramid-Flow
website_url: https://pyramid-flow.github.io/
docs_url: https://github.com/jy0205/Pyramid-Flow#readme

category: Other
tags: [video-generation, diffusion, flow-matching, computer-vision, pytorch, generative-ai]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Training video generation models is prohibitively expensive due to the high resolution and long temporal sequences needed for coherent motion. Pyramid Flow uses a pyramidal training strategy that starts at low resolution and progressively adds detail, significantly reducing compute requirements while producing temporally consistent, high-quality videos competitive with full-resolution approaches.

use_cases:
  - Generate short video clips from text prompts for content creation
  - Produce training data for video understanding models with controlled motion
  - Create animated visualizations for marketing and storytelling
  - Research efficient video generative modeling with reduced compute budgets
