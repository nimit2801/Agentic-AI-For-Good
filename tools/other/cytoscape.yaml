name: Cytoscape
description: Open-source platform for visualizing complex networks. Cytoscape maps molecular, social, and knowledge graphs with attribute overlays so researchers inspect pathways and interaction networks instead of raw adjacency tables.
tagline: Visualize and analyze complex biological and social networks

github_url: https://github.com/cytoscape/cytoscape
website_url: https://cytoscape.org
docs_url: https://manual.cytoscape.org

category: Other
tags: [java, networks, bioinformatics, visualization, knowledge-graph, open-source]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Interaction data is stored as tables that hide topology. Cytoscape
  loads molecular, social, and knowledge graphs, maps attributes to
  visual styles, and runs app-based analysis so pathway and RAG
  teams inspect neighborhoods instead of scrolling adjacency lists.

use_cases:
  - Visualize protein-protein interaction networks with pathway overlays
  - Import GraphML or SIF graphs and style nodes by experimental attributes
  - Explore knowledge graphs from LLM pipelines as interactive networks
  - Cluster communities in a social or citation graph with Cytoscape Apps
