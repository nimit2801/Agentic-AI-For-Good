name: QGroundControl
description: QGroundControl is a cross-platform MAVLink ground station for PX4 and ArduPilot drones. It runs on Android, iOS, macOS, Linux, and Windows, covering vehicle setup, mission planning, maps, and live telemetry for research and field UAV operations.
tagline: Cross-platform MAVLink ground control station for PX4 and ArduPilot

github_url: https://github.com/mavlink/qgroundcontrol
website_url: https://qgroundcontrol.com
docs_url: https://docs.qgroundcontrol.com

category: Other
tags: [c++, robotics, drones, mavlink, uav, ground-station, px4, ardupilot]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Flying PX4 or ArduPilot without a ground station means no maps, params,
  or mission uploads. QGroundControl is the MAVLink GCS for setup, planning,
  telemetry, and firmware on phones and desktops so teams operate UAVs
  without writing a custom station.

use_cases:
  - Plan waypoint missions and upload them to a PX4 or ArduPilot vehicle
  - Calibrate sensors and tune parameters from a laptop or tablet in the field
  - Monitor live telemetry, maps, and video while a research drone is airborne
  - Flash firmware and run preflight checks before a test flight
