name: Anki
description: Spaced-repetition flashcard program that schedules reviews so you remember more with less drill. Use it to retain APIs, paper findings, and on-call runbooks instead of rereading notes that fade.
tagline: Spaced repetition flashcards that stick

github_url: https://github.com/ankitects/anki
website_url: https://apps.ankiweb.net
docs_url: https://docs.ankiweb.net

category: Other
tags: [spaced-repetition, flashcards, learning, desktop, python, open-source]
pricing: free
is_open_source: true
license: AGPL-3.0
install_command: brew install --cask anki

problem_solved: |
  Notes and docs fade. ML engineers need a scheduler that surfaces APIs, paper findings,
  and on-call runbooks right before they would forget them. Anki is a spaced-repetition
  flashcard program with a programmable scheduler, shared decks, and add-ons, so review
  time goes to the cards that are about to drop out of memory.

use_cases:
  - Drill API surfaces and CLI flags for tools you use weekly
  - Retain findings from papers without rereading the PDF
  - Build an on-call runbook deck for incident commands
  - Share community decks for a new framework or model family
