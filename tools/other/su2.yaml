name: SU2
description: Open-source suite for multiphysics simulation and design, focused on CFD and adjoint-based shape optimization. Aerospace and energy teams run compressible and incompressible flow, then optimize geometries from a C++ codebase.
tagline: Open-source CFD and adjoint shape-optimization suite

github_url: https://github.com/su2code/SU2
website_url: https://su2code.github.io
docs_url: https://su2code.github.io/docs_v7

category: Other
tags: [c++, cfd, aerodynamics, adjoint, optimization, multiphysics, open-source]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Aircraft and energy design loops need CFD plus adjoint gradients without a closed commercial code. SU2 is an LGPL multiphysics suite so teams can run compressible flow and shape optimization on the same open-source stack.

use_cases:
  - Run compressible or incompressible CFD on aircraft geometries
  - Compute adjoint gradients for aerodynamic shape optimization
  - Couple SU2 flow solves with a design-optimization loop
  - Teach CFD and adjoint methods on an open-source C++ code
