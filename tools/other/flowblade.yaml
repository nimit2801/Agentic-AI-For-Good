name: Flowblade
description: Multitrack video editor for Linux with a film-style insert/overwrite workflow. Flowblade cuts, composites, and renders footage so teams can assemble training clips and demo reels on an open GNU/Linux stack.
tagline: Linux multitrack video editor

github_url: https://github.com/jliljebl/flowblade
website_url: https://jliljebl.github.io/flowblade/
docs_url: https://jliljebl.github.io/flowblade/

category: Other
tags: [video, editor, linux, nle, open-source, mlt]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Assembling vision and generative-video datasets often needs a
  multitrack NLE. Commercial editors lock that work to macOS or
  Windows. Flowblade is a Linux editor with insert editing and MLT
  so those cuts and renders stay on an open workstation.

use_cases:
  - Cut and concatenate clips used as video-model training data
  - Overlay labels or mattes onto footage before a vision pipeline
  - Render demo reels of generative video on a Linux workstation
  - Assemble evaluation fixtures from raw camera and screen captures
  - Composite simple titles onto agent-demo recordings
