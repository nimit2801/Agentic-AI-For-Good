name: DynamiCrafter
description: Video diffusion model that animates open-domain still images into coherent videos by injecting image context into a text-to-video prior, including high-resolution image-to-video generation.
tagline: Animate open-domain images with video diffusion priors

github_url: https://github.com/Doubiiu/DynamiCrafter
website_url: https://doubiiu.github.io/projects/DynamiCrafter/

category: Other
tags: [video-generation, image-to-video, diffusion, animation, generative-ai]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Generic image-to-video models struggle with open-domain stills, weak motion, or
  identity drift. DynamiCrafter injects image context into a video diffusion prior
  so arbitrary photos become coherent clips, including higher-resolution I2V that
  VideoCrafter points to as its dedicated image-to-video successor.

use_cases:
  - Animate a still product, landscape, or portrait photo into a short video
  - Generate image-to-video clips at higher resolution than earlier VideoCrafter I2V
  - Combine a reference image with a text prompt to control motion and scene
  - Build an open image-to-video demo without a closed commercial API
