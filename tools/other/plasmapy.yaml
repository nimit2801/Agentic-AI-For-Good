name: PlasmaPy
description: Open source Python package for plasma research and education. PlasmaPy gives plasma scientists shared particle, plasma parameter, and diagnostic helpers on top of the scientific Python stack, analogous to what Astropy provides for astronomy.
tagline: Python toolkit for plasma science

github_url: https://github.com/PlasmaPy/PlasmaPy
website_url: https://docs.plasmapy.org
docs_url: https://docs.plasmapy.org
install_command: pip install plasmapy

category: Other
tags: [python, plasma, physics, scientific-computing, astropy, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Plasma research code is often one-off notebooks that reimplement particle properties, plasma frequencies, and diagnostic formulas. PlasmaPy centralizes those calculations in a community Python package so labs share tested helpers instead of rewriting the same physics.

use_cases:
  - Compute plasma parameters and particle properties in Python
  - Teach plasma physics with a shared open-source toolkit
  - Analyze laboratory and space plasma diagnostics
  - Build research notebooks on top of Astropy-compatible plasma helpers
