name: CryptPad
description: End-to-end encrypted collaborative office suite you self-host. Pads, sheets, kanban, and code stay encrypted on the server so a lab can co-edit without Google Docs.
tagline: E2E-encrypted Google Docs alternative

github_url: https://github.com/cryptpad/cryptpad
website_url: https://cryptpad.org
docs_url: https://docs.cryptpad.org

category: Other
tags: [collaboration, e2ee, privacy, self-hosted, office, javascript]
pricing: freemium
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Google Docs and Notion see every draft. A lab that co-edits RFCs, sheets,
  and kanban boards should keep plaintext off the host. CryptPad is an
  end-to-end encrypted office suite you self-host, so the server stores
  ciphertext and collaborators share via a link without a SaaS account.

use_cases:
  - Co-edit encrypted pads instead of Google Docs
  - Share a spreadsheet with a partner who has no account
  - Host a private kanban for an unreleased model launch
  - Keep research notes encrypted at rest on your own instance
