name: Trilinos
description: Collection of reusable scientific computing packages for HPC. Teams assemble solvers, discretizations, and nonlinear methods for large-scale PDE, optimization, and multiphysics codes on supercomputers.
tagline: HPC scientific computing packages for solvers and PDEs

github_url: https://github.com/trilinos/Trilinos
website_url: https://trilinos.org/
docs_url: https://trilinos.github.io/

category: Other
tags: [c++, hpc, solvers, pde, scientific-computing, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Supercomputer PDE and optimization codes need solvers, preconditioners, and discretizations that scale. Trilinos is a BSD collection of packages so research teams can assemble Krylov solvers, nonlinear methods, and multiphysics without a single monolithic stack.

use_cases:
  - Assemble scalable Krylov solvers and preconditioners for PDEs
  - Run nonlinear and optimization methods on HPC clusters
  - Couple multiphysics packages in a custom research code
  - Port a scientific solver from a workstation to a supercomputer
