name: JUCE
description: JUCE is an open-source C++ framework for desktop and mobile apps, including VST, AU, LV2, and AAX audio plugins. Developers build DAWs and instruments with one UI and audio stack.
tagline: C++ framework for audio apps and plugin formats

github_url: https://github.com/juce-framework/JUCE
website_url: https://juce.com
docs_url: https://docs.juce.com/

category: Other
tags: [juce, cpp, audio, vst, au, plugins, dsp, framework]
pricing: freemium
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Shipping an audio plugin means targeting VST, AU, AAX, and LV2
  plus a UI toolkit. JUCE is a C++ framework that wraps those
  formats and desktop/mobile UI so teams write one instrument or
  DAW and export to the hosts musicians actually use.

use_cases:
  - Build a VST3 or AU plugin from a single C++ codebase
  - Prototype a synth or effect UI with JUCE components
  - Ship a desktop audio app on macOS, Windows, and Linux
  - Wrap a DSP algorithm as an LV2 or AAX plugin
