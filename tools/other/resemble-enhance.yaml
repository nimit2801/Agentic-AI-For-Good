name: Resemble Enhance
description: |
  Resemble Enhance is an AI-powered audio processing tool that improves speech quality by performing denoising and perceptual enhancement. It consists of two modules: a denoiser that separates speech from background noise, and an enhancer that restores audio distortions and extends bandwidth. Trained on high-quality 44.1kHz speech data, it delivers broadcast-quality speech enhancement.
problem_solved: |
  Poor audio quality from noisy environments, low-bandwidth recordings, and compressed VoIP calls degrades speech intelligibility for downstream speech recognition and communication. Resemble Enhance solves this with a two-stage AI pipeline — first separating speech from noise, then restoring perceptual quality and extending bandwidth — producing clean, broadcast-ready audio from any input source.
use_cases:
  - "Denoise and enhance speech recordings for podcast and content production"
  - "Improve audio quality of voice calls and meeting recordings for AI transcription"
  - "Restore and upscale archival audio recordings with bandwidth extension"
category: Other
github_url: https://github.com/resemble-ai/resemble-enhance
website_url: https://www.resemble.ai/enhance/
is_open_source: true
install_command: pip install resemble-enhance
