name: music21
description: music21 is a Python toolkit for computer-aided musical analysis and computational musicology. Researchers parse scores, MIDI, and MusicXML to query harmony, melody, and corpus statistics in code.
tagline: Python toolkit for computational musicology

github_url: https://github.com/cuthbertLab/music21
website_url: https://www.music21.org/
docs_url: https://www.music21.org/music21docs/

install_command: pip install music21

category: Other
tags: [music21, python, musicology, midi, musicxml, analysis, corpus]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Studying harmony, melody, and large score corpora in code needs a
  music-aware data model, not a DAW. music21 parses scores, MIDI, and
  MusicXML so researchers query theory, generate examples, and train
  symbolic-music models without a closed notation suite.

use_cases:
  - Parse MusicXML or MIDI and query chords, keys, and intervals
  - Run corpus studies across a collection of scores in Python
  - Generate or transform symbolic music for composition experiments
  - Prepare symbolic features for a music ML training pipeline
