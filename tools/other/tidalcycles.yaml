name: TidalCycles
description: TidalCycles is a Haskell pattern language for live-coding music. Performers write cyclic patterns that send events to SuperCollider, MIDI, or other targets instead of drawing clips in a DAW.
tagline: Haskell pattern language for live-coding music

website_url: https://tidalcycles.org
docs_url: https://tidalcycles.org/docs/

category: Other
tags: [tidalcycles, live-coding, haskell, music, patterns, supercollider, audio]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Live-coding music with cycles, polyrhythms, and sample chopping is
  awkward in a DAW timeline or in raw SuperCollider. TidalCycles is a
  Haskell pattern language so performers write cyclic patterns that
  send events to SuperCollider, MIDI, or other targets in real time.

use_cases:
  - Live-code cyclic drum and synth patterns that talk to SuperCollider
  - Transform polyrhythms with Tidal pattern combinators during a set
  - Sequence samples and MIDI from a Haskell live-coding session
  - Teach algorithmic music with a pattern language instead of a piano roll
