name: FreeFEM
description: Open-source finite-element PDE solver with a domain-specific language for variational forms. Researchers write 2D and 3D multiphysics models in a FreeFEM script and run them without assembling a custom C++ FEM code.
tagline: Scriptable finite-element solver for variational PDEs

github_url: https://github.com/FreeFem/FreeFem-sources
website_url: https://freefem.org
docs_url: https://doc.freefem.org

category: Other
tags: [c++, fem, pde, multiphysics, dsl, simulation, open-source]
pricing: free
is_open_source: true
license: LGPL-3.0

problem_solved: |
  PDE research often needs a variational FEM solver without writing a full C++ assembly stack. FreeFEM is an LGPL finite-element environment so scientists can write weak forms in a DSL and solve 2D or 3D multiphysics problems.

use_cases:
  - Write a variational PDE in the FreeFEM scripting language
  - Solve 2D or 3D multiphysics models without custom C++ assembly
  - Prototype FEM discretizations for fluids, solids, or electromagnetics
  - Teach finite-element methods with a high-level weak-form DSL
