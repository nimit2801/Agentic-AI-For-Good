name: Makie.jl
description: Interactive data visualization and plotting library for Julia. Scientists compose 2D and 3D plots, animations, and GUIs that run in GLMakie, CairoMakie, or WGLMakie without leaving the Julia scientific stack.
tagline: Interactive 2D and 3D plotting for Julia

github_url: https://github.com/MakieOrg/Makie.jl
website_url: https://docs.makie.org/stable
docs_url: https://docs.makie.org/stable
install_command: julia -e 'using Pkg; Pkg.add("Makie")'

category: Other
tags: [julia, visualization, plotting, 3d, scientific-computing, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Julia scientific codes often export data to Python or MATLAB just to plot. Makie.jl is a Julia visualization stack so researchers can compose 2D and 3D plots, animations, and interactive GUIs in the same language as the simulation.

use_cases:
  - Plot 2D and 3D scientific data interactively in Julia
  - Render publication figures with CairoMakie
  - Build GPU-accelerated visualizations with GLMakie
  - Share interactive plots in the browser with WGLMakie
