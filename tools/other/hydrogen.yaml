name: Hydrogen
description: Hydrogen is an advanced open-source drum machine for Linux, macOS, and Windows. Producers sequence patterns, kits, and samples so beat programming leaves a desktop app without a commercial drum plugin.
tagline: Open-source drum machine and pattern sequencer

github_url: https://github.com/hydrogen-music/hydrogen
website_url: http://www.hydrogen-music.org
docs_url: http://www.hydrogen-music.org/documentation/

category: Other
tags: [hydrogen, drum-machine, sequencer, audio, music, samples, midi]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Beat programming often locks producers into paid drum plugins and
  closed kit formats. Hydrogen is a cross-platform drum machine so
  musicians sequence patterns, kits, and samples, then export MIDI or
  audio without a commercial drum-machine license.

use_cases:
  - Sequence drum patterns and kits for a song or live set
  - Build a custom sample kit and play it from MIDI
  - Export MIDI or audio from Hydrogen into a DAW session
  - Teach beat programming without a paid drum plugin
