name: SFML
description: Simple and Fast Multimedia Library is a C++ multimedia toolkit for windows, graphics, audio, and input. SFML sits between raw OpenGL and a full engine, which makes it useful for interactive ML demos, teaching, and lightweight visualization apps.
tagline: Simple C++ multimedia library for graphics, audio, and input

github_url: https://github.com/SFML/SFML
website_url: https://www.sfml-dev.org
docs_url: https://www.sfml-dev.org/learn.php
install_command: brew install sfml

category: Other
tags: [cpp, graphics, audio, input, multimedia, gamedev, visualization]
pricing: free
is_open_source: true
license: Zlib

problem_solved: |
  Interactive C++ demos need a window, 2D drawing, audio, and input without
  the weight of a game engine or the boilerplate of raw OpenGL plus OS APIs.
  SFML wraps those pieces in a small object-oriented C++ API so visualization
  tools, teaching apps, and prototypes can render and handle events quickly.

use_cases:
  - Build a 2D visualization or teaching demo in C++ without a full game engine
  - Play audio and handle keyboard or mouse input in a lightweight ML viewer
  - Prototype interactive graphics tools that must run on Windows, macOS, and Linux
  - Teach multimedia programming with a small, readable C++ API
