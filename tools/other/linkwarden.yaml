name: Linkwarden
description: Self-hosted collaborative bookmark manager that saves screenshots, PDFs, and HTML of each page, then lets teams read, annotate, and tag links. Cloud or self-host so research bookmarks survive link rot instead of living only in a browser.
tagline: Self-hosted bookmarks with full-page archives

github_url: https://github.com/linkwarden/linkwarden
website_url: https://linkwarden.app
docs_url: https://docs.linkwarden.app

category: Other
tags: [bookmarks, archive, read-it-later, self-hosted, annotations, research]
pricing: freemium
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Browser bookmarks rot and Pocket locks clips in a vendor cloud. Linkwarden
  stores collections with screenshots, PDFs, and HTML so research links stay
  readable after the original page dies, with tags, reader view, and optional
  local AI tagging for a team archive.

use_cases:
  - Archive papers, docs, and blog posts as screenshot, PDF, and HTML
  - Highlight and annotate saved pages in a reader view
  - Share collections with a research team instead of a private bookmark bar
  - Auto-tag saved links with optional local AI tagging
  - Replace Pocket or Raindrop with a self-hosted archive that survives link rot
