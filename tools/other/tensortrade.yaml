name: TensorTrade
description: TensorTrade is an open source reinforcement learning framework for training, evaluating, and deploying robust trading agents. It provides modular components for defining trading environments, reward schemes, and action schemes, enabling researchers to apply deep RL algorithms to financial markets with a consistent API.
tagline: Reinforcement learning framework for algorithmic trading

github_url: https://github.com/tensortrade-org/tensortrade
website_url: https://discord.gg/ZZ7BGWh
docs_url: https://www.tensortrade.org/

install_command: pip install tensortrade

category: Other
tags:
  - reinforcement-learning
  - trading
  - finance
  - algorithmic-trading
  - deep-learning
  - agents
pricing: free
is_open_source: true
license: Apache 2.0

problem_solved: |
  Applying reinforcement learning to financial markets requires bridging the gap between
  generic RL frameworks and the specific requirements of trading: live data feeds, order
  execution simulation, portfolio management, and risk-aware reward functions. TensorTrade
  addresses this by providing modular trading-specific abstractions including exchange
  simulators, portfolio allocators, and risk metrics — enabling researchers to focus on
  algorithm design rather than market infrastructure.

use_cases:
  - "Train reinforcement learning agents for portfolio allocation across multiple assets"
  - "Backtest trading strategies using historical market data with realistic execution simulation"
  - "Deploy live trading bots that adapt to market conditions via continuous RL training"
  - "Research novel reward schemes combining profit, risk-adjusted returns, and drawdown penalties"