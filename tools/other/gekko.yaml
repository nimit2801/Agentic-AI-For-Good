name: GEKKO
description: Python package for machine learning and dynamic optimization of DAE systems. Process and control teams formulate ODE, DAE, and mixed-integer problems and solve them with APMonitor backends from a small Python API.
tagline: Python API for machine learning and dynamic optimization

github_url: https://github.com/BYU-PRISM/GEKKO
website_url: https://apmonitor.com/gekko
docs_url: https://gekko.readthedocs.io

install_command: pip install gekko

category: Other
tags: [python, optimization, dae, mpc, process-control, machine-learning, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Dynamic process optimization in Python usually means stitching an integrator, an NLP solver, and a modeling layer. GEKKO is an MIT Python API so teams can formulate DAEs and mixed-integer dynamic programs and solve them through APMonitor.

use_cases:
  - Formulate ODE or DAE process models in Python
  - Run nonlinear MPC or dynamic parameter estimation
  - Solve mixed-integer dynamic optimization from a small API
  - Combine machine-learning models with physics-based DAEs
