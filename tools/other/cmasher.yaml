name: CMasher
description: Scientific colormaps for accessible, informative plots. CMasher adds perceptually uniform sequential, diverging, and cyclic maps so papers and dashboards avoid rainbow scales that hide structure.
tagline: Scientific colormaps for cmashing plots

github_url: https://github.com/1313e/CMasher
website_url: https://cmasher.readthedocs.io
docs_url: https://cmasher.readthedocs.io
install_command: pip install cmasher

category: Other
tags: [python, colormaps, matplotlib, visualization, accessibility, scientific]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Default rainbow colormaps distort magnitude and fail colorblind
  readers. CMasher ships perceptually uniform sequential, diverging,
  and cyclic maps so scientific figures stay readable in print and
  on screen.

use_cases:
  - Swap a jet colormap for a CMasher sequential map on a heatmap
  - Color a cyclic phase field with a perceptually uniform cycle
  - Register CMasher maps with matplotlib for a paper figure set
  - Pick a diverging map for residual or anomaly plots
