name: Kavita
description: Self-hosted reading server for manga, comics, EPUB, and PDF with web readers that work on phone, tablet, and desktop. Share a research and fiction library with metadata, collections, and role-based users on hardware you control.
tagline: Self-hosted manga, comic, and ebook reading server

github_url: https://github.com/Kareadita/Kavita
website_url: https://www.kavitareader.com
docs_url: https://wiki.kavitareader.com/getting-started

category: Other
tags: [ebooks, comics, manga, self-hosted, pdf, reading]
pricing: freemium
is_open_source: true
license: GPL-3.0

problem_solved: |
  Reading collections are locked into Kindle, Comixology, or shared folders
  with no library UX. Kavita indexes CBR, CBZ, EPUB, and PDF, serves
  responsive readers, and manages users so a lab or household can share
  comics and research PDFs from a NAS.

use_cases:
  - Host a private manga and comic library on a home or lab NAS
  - Serve EPUB and PDF research collections with per-user progress
  - Share a reading library with role-based access for a small team
  - Organize comics and books into collections and reading lists
  - Replace cloud readers with a self-hosted web UI on any device
