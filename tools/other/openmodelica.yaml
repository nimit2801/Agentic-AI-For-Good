name: OpenModelica
description: Open-source Modelica environment for modeling, compiling, and simulating cyber-physical systems. Engineers write acausal Modelica models and generate C code for ODE and DAE simulation without a commercial Modelica tool.
tagline: Open-source Modelica compiler and simulator

github_url: https://github.com/OpenModelica/OpenModelica
website_url: https://openmodelica.org
docs_url: https://openmodelica.org/doc/OpenModelicaUsersGuide/latest/

category: Other
tags: [modelica, simulation, dae, cyber-physical, compiler, open-source]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Cyber-physical system models are often locked to commercial Modelica tools. OpenModelica is an AGPL Modelica compiler and simulator so engineers can write acausal models and generate C simulation code without a vendor license.

use_cases:
  - Compile and simulate acausal Modelica models of plants and machines
  - Generate C code from a Modelica model for ODE or DAE simulation
  - Teach equation-based modeling without a commercial Modelica IDE
  - Couple OpenModelica with Python for parameter sweeps
