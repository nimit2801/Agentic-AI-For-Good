name: SpikingJelly
description: SpikingJelly is an open-source deep learning framework for Spiking Neural Networks based on PyTorch. It provides tools for building, training, and simulating energy-efficient SNNs that mimic biological neural dynamics, supporting event-based datasets and neuromorphic hardware deployment.
tagline: Deep learning framework for Spiking Neural Networks

github_url: https://github.com/fangwei123456/spikingjelly
website_url: https://spikingjelly.readthedocs.io
docs_url: https://spikingjelly.readthedocs.io/

install_command: pip install spikingjelly

category: Other
tags:
  - spiking-neural-networks
  - neuromorphic
  - deep-learning
  - pytorch
  - event-based
  - energy-efficient
pricing: free
is_open_source: true
license: NOASSERTION

problem_solved: |
  Traditional artificial neural networks are computationally expensive and power-hungry,
  making them unsuitable for edge and neuromorphic hardware. Spiking Neural Networks
  offer a biologically inspired alternative that processes information via discrete spikes,
  enabling orders-of-magnitude lower energy consumption. SpikingJelly makes SNN research
  accessible by providing a PyTorch-based framework with built-in neuron models, surrogate
  gradient training, and support for event-based vision datasets and neuromorphic chips.

use_cases:
  - "Train energy-efficient image classifiers on event-based datasets like DVS128 and CIFAR10-DVS"
  - "Deploy low-power neural networks on neuromorphic hardware such as Intel Loihi and Dynap-SE"
  - "Research surrogate gradient methods for training deep Spiking Neural Networks"
  - "Build brain-inspired vision models for robotics and edge AI applications"