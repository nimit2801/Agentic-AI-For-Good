name: CloudCompare
description: CloudCompare is an open 3D point cloud and mesh processing application. It supports registration, segmentation, distance computation, and visualization so mapping and robotics teams inspect LiDAR data without a closed GIS suite.
tagline: Open 3D point cloud and mesh processing desktop application

github_url: https://github.com/CloudCompare/CloudCompare
website_url: https://www.cloudcompare.org
docs_url: https://www.cloudcompare.org/doc/wiki/

category: Other
tags: [c++, point-cloud, lidar, 3d, mapping, visualization, mesh, gis]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  LiDAR and photogrammetry clouds are huge and hard to inspect. CloudCompare
  is an open desktop app for registration, distances, and segmentation so
  mapping teams process point clouds without a closed GIS tool.

use_cases:
  - Register two LiDAR scans and measure cloud-to-cloud distances
  - Segment and colorize large photogrammetry or UAV point clouds
  - Compare as-built scans against a CAD or mesh model
  - Export cleaned clouds for SLAM, GIS, or reconstruction pipelines
