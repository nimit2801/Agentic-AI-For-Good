name: LeRobot
description: LeRobot is Hugging Face's open library for real-world robotics ML. It ships datasets, pretrained policies, and hardware adapters so teams train and evaluate robot learning models without assembling a custom stack.
tagline: Hugging Face library for real-world robot learning

github_url: https://github.com/huggingface/lerobot
website_url: https://huggingface.co/docs/lerobot
docs_url: https://huggingface.co/docs/lerobot
install_command: pip install lerobot

category: Other
tags: [python, robotics, imitation-learning, huggingface, policies, datasets]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Robot learning usually means gluing cameras, teleop logs, and policy
  code by hand. LeRobot gives Hugging Face-style datasets, pretrained
  policies, and hardware adapters so teams train imitation and RL
  robots without a custom stack.

use_cases:
  - Train an imitation-learning policy from Hugging Face robot datasets
  - Fine-tune a pretrained LeRobot policy on a new manipulator
  - Log teleop demonstrations into a shared dataset format
  - Evaluate real-world robot policies with a common training loop
