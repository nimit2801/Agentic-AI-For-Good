name: Defold
description: Defold is a completely free game engine for development of desktop, console, mobile and web games. It provides a visual editor, Lua scripting, and a lightweight runtime optimized for 2D and 3D games.
tagline: Free game engine for cross-platform 2D and 3D games

github_url: https://github.com/defold/defold
website_url: https://defold.com
docs_url: https://defold.com/learn

category: Other
tags: [game-engine, lua, 2d, 3d, cross-platform, gamedev]
pricing: free
is_open_source: true

problem_solved: |
  Game developers need a lightweight, free engine with a visual editor and fast iteration without
  licensing fees or revenue sharing. Defold offers a complete toolchain with a built-in editor,
  asset pipeline, and deployment to all major platforms while remaining completely free to use.

use_cases:
  - Building 2D mobile games with physics, particle effects, and sprite animation
  - Developing cross-platform indie games for desktop, console, and web
  - Rapid game prototyping with a visual scene editor and hot-reload Lua scripts
  - Creating interactive multimedia applications and educational games
