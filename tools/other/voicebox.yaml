name: Voicebox
description: An open-source local AI voice studio for cloning voices, generating speech, and dictating into any app. Voicebox runs the full voice I/O stack on your machine and can bind distinct voices to coding agents over MCP.
tagline: Local AI voice studio for clone, dictate, and agent talk

github_url: https://github.com/jamiepine/voicebox
website_url: https://voicebox.sh
docs_url: https://docs.voicebox.sh

category: Other
tags: [tts, voice-cloning, speech, local, mcp, agents, python]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Talking to coding agents or generating speech usually means a cloud TTS API and a
  voice you do not own. Voicebox is a local studio that clones voices, speaks, and
  dictates into any app, with MCP so Claude Code or Cursor can talk in a pinned
  voice. Audio stays on the machine instead of a hosted speech service.

use_cases:
  - Clone a voice from a short sample and generate speech locally without a cloud TTS API
  - Dictate into any macOS app with a system hotkey and paste the transcript into the focused field
  - Bind Claude Code and Cursor to different Voicebox voices over MCP so you can tell agents apart
  - Run Chatterbox multilingual TTS for languages beyond English on a local GPU
