name: Jellyfin
description: Free software media server that organizes movies, TV, music, and photos on your own hardware. Used to host lecture recordings, visual datasets, and internal media libraries without a commercial streaming lock-in.
tagline: Self-hosted media server for movies, TV, and music

github_url: https://github.com/jellyfin/jellyfin
website_url: https://jellyfin.org
docs_url: https://jellyfin.org/docs/

category: Other
tags: [self-hosted, media-server, video, streaming, privacy, gpl]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Lecture recordings, demo videos, and visual datasets often sit in Plex or
  consumer clouds with license and privacy constraints. Jellyfin is a free
  media server that indexes local libraries and streams to clients so teams
  keep archives on their own hardware.

use_cases:
  - Host internal lecture and demo video libraries on lab hardware
  - Stream visual datasets and recorded experiments to browsers and apps
  - Replace commercial media servers for private team collections
  - Organize photos, music, and video under one self-hosted catalog
