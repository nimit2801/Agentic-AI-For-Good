name: Yacht
description: Web UI for Docker with template-based one-click deploys. Treat a lab host like an app store instead of writing compose files for every stack.
tagline: Docker UI with one-click templates

github_url: https://github.com/Yacht-sh/Yacht
website_url: https://github.com/Yacht-sh/Yacht
docs_url: https://github.com/Yacht-sh/Yacht#readme

category: Other
tags: [docker, self-hosted, vue, containers, homelab]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Portainer manages containers; Yacht adds an app-store of templates so a
  lab can one-click deploy Grafana, Immich, or a notebook stack without
  writing compose YAML for every service. Self-host the UI and keep Docker
  on the same box.

use_cases:
  - One-click deploy common lab stacks from templates
  - Manage Docker containers from a browser
  - Share a template catalog with a small team
  - Replace ad-hoc compose files for homelab apps
