name: OpenMDAO
description: NASA open-source Python platform for multidisciplinary design analysis and optimization with analytic derivatives. Engineering teams decompose coupled models and run gradient-based MDO with hundreds of design variables in parallel.
tagline: Multidisciplinary design optimization in Python

github_url: https://github.com/OpenMDAO/OpenMDAO
website_url: http://openmdao.org
docs_url: https://openmdao.org/newdocs/versions/latest/

install_command: pip install openmdao

category: Other
tags: [python, optimization, mdo, nasa, derivatives, engineering, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Coupled engineering models with hundreds of design variables need analytic derivatives and a way to decompose subsystems. OpenMDAO is NASA's Python MDO platform so teams can assemble components, compute total derivatives, and run gradient-based optimization without hand-coding adjoints across the whole system.

use_cases:
  - Optimize a coupled aero-structural model with analytic derivatives
  - Decompose a multidisciplinary model into components and groups
  - Run large-scale gradient-based MDO on HPC with parallel derivatives
  - Teach multidisciplinary design optimization with a Python API
