name: ACADOS
description: Fast solvers for nonlinear optimal control and model predictive control on embedded hardware. Robotics and process-control teams generate SQP and real-time iteration solvers from Python or MATLAB and deploy them on MCUs.
tagline: Embedded solvers for nonlinear optimal control

github_url: https://github.com/acados/acados
website_url: https://docs.acados.org
docs_url: https://docs.acados.org

category: Other
tags: [c, python, optimal-control, mpc, robotics, embedded, open-source]
pricing: free
is_open_source: true
license: BSD-2-Clause

problem_solved: |
  Nonlinear MPC on robots and process plants needs solvers that fit in milliseconds on embedded CPUs. ACADOS generates SQP and real-time iteration solvers from a Python or MATLAB model so control teams can deploy NMPC without writing a custom QP stack.

use_cases:
  - Deploy nonlinear MPC on an embedded flight or chassis controller
  - Generate SQP solvers from a CasADi model for robot tracking
  - Run real-time iteration NMPC in a process-control loop
  - Benchmark QP backends for embedded optimal control
