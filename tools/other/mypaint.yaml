name: MyPaint
description: Lightweight painting program built for Wacom-style graphics tablets, with a large brush engine and infinite canvas. MyPaint is used to sketch labels, concept art, and synthetic drawing data without a heavy raster suite.
tagline: Tablet-first open-source painting app

github_url: https://github.com/mypaint/mypaint
website_url: https://mypaint.app
docs_url: https://github.com/mypaint/mypaint/wiki

category: Other
tags: [painting, drawing, tablet, brushes, desktop, open-source]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Sketching labels and concept art for vision datasets should not
  require Photoshop or a full Krita setup. MyPaint focuses on tablet
  brushes and an infinite canvas so artists can produce strokes and
  sketches that feed drawing or sketch-to-image pipelines.

use_cases:
  - Sketch line-art used as conditioning for an image model
  - Produce handwritten-style strokes for a drawing dataset
  - Paint concept frames for a generative storyboard
  - Capture pressure-sensitive brush data from a Wacom tablet
  - Draft UI-agent mock illustrations without a commercial painter
