name: AugLy
description: A data augmentations library for audio, image, text, and video from Meta AI. AugLy provides over 100 augmentation transforms across modalities to help build more robust AI models by simulating real-world data variations during training.
tagline: Multimodal data augmentation library for audio, image, text, and video

github_url: https://github.com/facebookresearch/AugLy
website_url: https://ai.facebook.com/blog/augly-a-new-data-augmentation-library-to-help-build-more-robust-ai-models/
docs_url: https://github.com/facebookresearch/AugLy

install_command: pip install augly

