name: PyWavelets
description: Python library for 1-D, 2-D, and n-D discrete and continuous wavelet transforms. It ships Haar, Daubechies, and dozens of other families plus inverse transforms so signal and image pipelines can denoise, compress, and extract features without leaving NumPy.
tagline: Wavelet transforms in Python for signal and image work

github_url: https://github.com/PyWavelets/pywt
website_url: https://pywavelets.readthedocs.io
docs_url: https://pywavelets.readthedocs.io
install_command: pip install PyWavelets

category: Other
tags: [python, wavelets, dsp, signal-processing, image-processing, numpy, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Signal and image pipelines need Haar, Daubechies, and continuous wavelet
  bases without leaving NumPy. SciPy covers a thin slice of wavelet math.
  PyWavelets gives 1-D through n-D DWT, CWT, inverse transforms, and
  dozens of families so ML and scientific code can denoise, compress, and
  extract features in one package.

use_cases:
  - Denoise sensor time series with discrete wavelet thresholding
  - Extract multi-scale features from medical or satellite images
  - Compress scientific arrays with wavelet coefficient truncation
  - Run continuous wavelet transforms for time-frequency analysis
