name: InstantMesh
description: InstantMesh generates a 3D mesh from a single image using sparse-view large reconstruction models. Teams turn product photos or generated images into meshes without multi-view capture or a full NeRF train.
tagline: Single-image 3D mesh generation with sparse-view reconstruction

github_url: https://github.com/TencentARC/InstantMesh
website_url: https://github.com/TencentARC/InstantMesh
docs_url: https://github.com/TencentARC/InstantMesh

category: Other
tags: [python, 3d, mesh, reconstruction, computer-vision, tencent]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Turning one photo into a 3D asset usually means a NeRF train or a
  multi-view rig. InstantMesh uses sparse-view reconstruction models
  so teams get a mesh from a single image for products, agents, or
  simulation assets.

use_cases:
  - Generate a 3D mesh from a single product or object photo
  - Turn generated images into assets for a simulation or game engine
  - Prototype image-to-mesh pipelines without a multi-view capture setup
  - Feed reconstructed meshes into Nerfstudio or downstream 3D tools
