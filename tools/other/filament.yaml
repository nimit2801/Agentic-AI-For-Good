name: Filament
description: Google real-time physically based rendering engine for Android, iOS, Linux, macOS, Windows, and WebGL. Filament is a small PBR renderer with glTF 2.0, Vulkan, Metal, and WebGPU backends for mobile, desktop, and neural rendering viewers.
tagline: Compact physically based renderer for mobile and desktop

github_url: https://github.com/google/filament
website_url: https://google.github.io/filament/
docs_url: https://google.github.io/filament/Filament.html

category: Other
tags: [cpp, android, pbr, rendering, gltf, google, gpu]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Mobile and desktop 3D viewers need film-quality PBR without a full
  game engine. Filament is a small physically based renderer with
  glTF, Vulkan, Metal, and WebGPU backends so apps and neural
  rendering tools show accurate materials on device.

use_cases:
  - Render glTF 2.0 assets with PBR on Android, iOS, or WebGL
  - Embed a compact Vulkan or Metal viewport in a 3D ML inspection app
  - Preview physically based materials without shipping Unity or Unreal
  - Build a cross-platform product configurator on Filament
