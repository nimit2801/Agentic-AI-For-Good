name: Unique3D
description: NeurIPS 2024 high-quality single-image 3D mesh generation. Unique3D predicts multi-view images and normals then reconstructs a textured mesh so a product or character photo becomes a usable 3D asset without a capture rig.
tagline: High-quality 3D meshes from a single image

github_url: https://github.com/AiuniAI/Unique3D
website_url: https://wukailu.github.io/Unique3D/
docs_url: https://github.com/AiuniAI/Unique3D

category: Other
tags: [python, pytorch, 3d-generation, mesh, diffusion, neurips, computer-vision]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Single-image 3D often yields noisy, unusable meshes. Unique3D
  focuses on high-quality multi-view RGB and normals plus an
  efficient reconstruction path so one photo becomes a clean
  textured mesh for games, e-commerce, and VFX instead of a blob.

use_cases:
  - Generate a textured mesh from a single product or character photo
  - Produce multi-view RGB and normal maps for mesh reconstruction
  - Bootstrap 3D assets for games or e-commerce without a scan
  - Compare single-image mesh quality against Wonder3D and InstantMesh
