name: Babylon.js
description: Babylon.js is a WebGL and WebGPU JavaScript 3D engine for games, product viz, and XR in the browser. Teams use it to render agent simulations, digital twins, and interactive ML demos without a native engine.
tagline: WebGL and WebGPU 3D engine for games, XR, and interactive demos

github_url: https://github.com/BabylonJS/Babylon.js
website_url: https://www.babylonjs.com
docs_url: https://doc.babylonjs.com
install_command: npm install @babylonjs/core

category: Other
tags: [javascript, typescript, 3d, webgl, webgpu, graphics, xr, visualization]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Interactive agent demos, digital twins, and browser ML viz need a real-time
  3D renderer that runs without a native engine. Three.js is lower-level and
  game engines are too heavy for the web. Babylon.js ships a batteries-included
  scene graph, physics, XR, and GPU particles so teams ship 3D experiences
  from TypeScript in the browser.

use_cases:
  - Render a browser-based 3D simulation of an agent or robotics environment
  - Build a digital-twin viewer for factory or warehouse telemetry
  - Prototype WebXR demos that visualize model outputs in AR or VR
  - Ship product configurators and interactive ML explainability scenes
