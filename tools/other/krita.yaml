name: Krita
description: Free digital painting studio for concept art, illustration, and texture work. Krita is used to paint training references, inpaint masks, and style sheets for vision and generative-AI pipelines without a paid illustration license.
tagline: Open-source digital painting for concept art and datasets

github_url: https://github.com/KDE/krita
website_url: https://krita.org/
docs_url: https://docs.krita.org/en/

category: Other
tags: [painting, illustration, desktop, vision, open-source, creative]
pricing: free
is_open_source: true
license: GPL-3.0
install_command: brew install --cask krita

problem_solved: |
  Vision and generative-AI teams need painted references, masks, and
  textures that Photoshop licenses lock behind a seat. Krita gives
  brushes, layers, and HDR painting on every major OS so datasets
  and concept art can be prepared on a free stack.

use_cases:
  - Paint concept art and style sheets used to prompt image models
  - Draw inpaint and outpaint masks for a diffusion or vision pipeline
  - Create texture and matte assets for 3D or generative training sets
  - Annotate illustration references for a character or product model
  - Export layered artwork as PNG or OpenEXR for dataset ingest
