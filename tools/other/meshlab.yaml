name: MeshLab
description: MeshLab is an open-source system for processing and inspecting 3D triangle meshes. Research teams clean, repair, and visualize reconstructed or generated meshes before they enter training pipelines or paper figures.
tagline: Open-source mesh processing and inspection for 3D data

github_url: https://github.com/cnr-isti-vclab/meshlab
website_url: https://www.meshlab.net
docs_url: https://www.meshlab.net

category: Other
tags: [3d, mesh, geometry, visualization, computer-vision, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Generated and reconstructed 3D meshes are often noisy, non-manifold, or
  too dense to train on. MeshLab filters, repairs, simplifies, and inspects
  triangle meshes so CV and graphics teams can clean assets before they
  enter a dataset, NeRF pipeline, or paper figure without a paid DCC.

use_cases:
  - Repair and simplify reconstructed meshes before they enter a training set
  - Inspect generated geometry from 3D foundation models for holes and artifacts
  - Convert and clean mesh formats used in computer-vision datasets
  - Produce mesh visualizations and screenshots for papers without a commercial DCC
