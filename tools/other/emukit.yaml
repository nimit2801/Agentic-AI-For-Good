name: Emukit
description: Python toolkit for decision making under uncertainty with Bayesian optimization, multi-fidelity emulation, experimental design, and Bayesian quadrature. ML and simulation teams wrap a surrogate model and run design loops when data is scarce.
tagline: Decision making under uncertainty in Python

github_url: https://github.com/EmuKit/emukit
website_url: https://emukit.github.io/emukit/
docs_url: https://emukit.readthedocs.io

install_command: pip install emukit

category: Other
tags: [python, bayesian-optimization, uncertainty, emulation, experimental-design, machine-learning, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Expensive simulators and physical experiments need a design loop that tracks uncertainty, not just a point estimate. Emukit is a model-agnostic Python toolkit so teams can run Bayesian optimization, multi-fidelity emulation, and experimental design around an existing surrogate.

use_cases:
  - Tune ML hyperparameters with Bayesian optimization
  - Build a multi-fidelity emulator when cheap and expensive simulators coexist
  - Choose the next experiment with active learning or experimental design
  - Estimate expensive integrals with Bayesian quadrature
