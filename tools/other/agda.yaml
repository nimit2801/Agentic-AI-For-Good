name: Agda
description: Dependently typed programming language and interactive theorem prover. Researchers write programs and proofs in the same language, checking correctness of algorithms, type theory, and verified software in an Emacs or VS Code hole-driven workflow.
tagline: Dependently typed language and interactive theorem prover

github_url: https://github.com/agda/agda
website_url: https://wiki.portal.chalmers.se/agda/pmwiki.php
docs_url: https://agda.readthedocs.io/en/latest/
install_command: brew install agda

category: Other
tags: [haskell, dependent-types, theorem-proving, formal-methods, type-theory, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Proving programs correct usually means a separate proof assistant and an informal implementation. Agda is a dependently typed language so researchers can write programs and proofs together, filling holes interactively until the type checker accepts the development.

use_cases:
  - Prove algorithms correct in a dependently typed language
  - Formalize type theory and mathematics with hole-driven interactive proofs
  - Teach dependent types with an Emacs or VS Code Agda workflow
  - Verify software properties that a conventional type system cannot express
