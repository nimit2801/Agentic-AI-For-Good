name: Spline
description: Browser-based tool for interactive 3D and 2D scenes you can embed on the web, iOS, and Android. An AI agent can model, animate, and publish production scenes without a local DCC install.
tagline: Real-time 3D design in the browser with an AI agent

website_url: https://spline.design
docs_url: https://docs.spline.design

category: Other
tags: [3d, design, web, animation, collaboration, ai]
pricing: freemium
is_open_source: false

problem_solved: |
  Shipping interactive 3D for a product site usually means a desktop DCC,
  a renderer, and an export pipeline. Spline models, animates, and publishes
  in the browser, with an AI agent and React embeds, so teams ship real-time
  scenes without Blender or Unity for marketing and product surfaces.

use_cases:
  - Embed an interactive 3D hero on a product or research site
  - Let an AI agent build and edit a Spline scene from a text prompt
  - Export a React scene for a web app with events and variables
  - Publish the same interactive scene to web, iOS, and Android
