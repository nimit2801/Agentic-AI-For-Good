name: BookStack
description: Self-hosted wiki platform organized as books, chapters, and pages. Teams use it for internal docs, runbooks, and research notes with permissions, search, and Markdown or WYSIWYG editing on their own servers.
tagline: Self-hosted wiki organized as books and chapters

github_url: https://github.com/BookStackApp/BookStack
website_url: https://www.bookstackapp.com
docs_url: https://www.bookstackapp.com/docs/

category: Other
tags: [wiki, documentation, self-hosted, knowledge-base, php, markdown]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Internal docs often live in Confluence or Notion with SaaS lock-in.
  BookStack is a self-hosted wiki shaped like books and chapters so
  teams can keep runbooks and research notes on their own servers
  with search and permissions.

use_cases:
  - Host internal engineering wikis and runbooks on your own servers
  - Organize research notes as books with chapters and page permissions
  - Export documentation to HTML or PDF for offline handoff
  - Replace Confluence for small teams that want a simpler self-hosted wiki
