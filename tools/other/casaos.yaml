name: CasaOS
description: Open-source personal cloud with a simple UI for Docker apps on a home server. Install it so a lab NAS can run local LLMs, vector DBs, and notebooks from an app store instead of hand-writing compose files.
tagline: Personal cloud UI for Docker home labs

github_url: https://github.com/IceWhaleTech/CasaOS
website_url: https://casaos.zimaspace.com
docs_url: https://wiki.casaos.io

category: Other
tags: [homelab, docker, self-hosted, personal-cloud, nas, golang]
pricing: free
is_open_source: true
license: Apache-2.0
install_command: curl -fsSL https://get.casaos.io | sudo bash

problem_solved: |
  Running local LLMs, vector DBs, and notebooks on a home server usually means
  hand-written compose files and a terminal. CasaOS is an open-source personal
  cloud with a UI and app store on top of Docker, so a lab NAS can install and
  manage those services without becoming a full-time ops box.

use_cases:
  - Install local LLM and notebook apps on a home NAS from an app store
  - Manage Docker services for a personal ML lab from a browser
  - Share files and model checkpoints on a self-hosted personal cloud
  - Run a one-box homelab without writing compose files by hand
