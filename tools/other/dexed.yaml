name: Dexed
description: Dexed is an open multi-platform DX7 FM synthesizer plugin. Musicians load Yamaha DX7 patches as VST, AU, or CLAP so classic FM tones stay editable without vintage hardware or a closed emulator.
tagline: Open DX7 FM synthesizer plugin

github_url: https://github.com/asb2m10/dexed
website_url: https://asb2m10.github.io/dexed/
docs_url: https://asb2m10.github.io/dexed/

install_command: brew install --cask dexed

category: Other
tags: [dexed, fm, dx7, synthesizer, vst, audio, yamaha]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Classic DX7 FM sound usually means scarce hardware or a closed
  emulator. Dexed is an open plugin that loads DX7 sysex so FM
  patches stay editable in a DAW without vintage gear.

use_cases:
  - Load Yamaha DX7 sysex banks as a VST or AU plugin
  - Design 6-operator FM patches without DX7 hardware
  - Render classic FM tones for a track or audio ML dataset
  - Cross-platform FM synthesis on macOS, Windows, and Linux
