name: Pinokio
description: A 1-click launcher for open-source AI projects. Pinokio is a user-friendly terminal that installs, isolates, and runs vetted scripts so you can launch Stable Diffusion, LLMs, and other OSS apps without fighting Python environments.
tagline: Launch any open-source AI project with one click

github_url: https://github.com/pinokiocomputer/pinokio
website_url: https://pinokio.co

category: Other
tags: [ai-browser, launcher, local, desktop, stable-diffusion, llm, scripts]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Running open-source AI apps usually means cloning repos, fighting Python
  versions, CUDA wheels, and venvs for every project. Pinokio is a scriptable
  terminal with a UI that installs and runs isolated, reviewed scripts from
  a Discover catalog, so builders can launch local models and generative apps
  without becoming package-manager experts.

use_cases:
  - One-click install and run of Stable Diffusion, LLM, and other OSS AI apps from a Discover catalog
  - Keep every project's binaries, venvs, and downloads isolated under ~/pinokio
  - Write or fork JSON scripts that download, install, and launch an AI repo with a UI
  - Share a verified Pinokio script so teammates can reproduce a local AI stack without a README
