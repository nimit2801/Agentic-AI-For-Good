name: FStar
description: Proof-oriented programming language for verified programs and cryptographic protocols. Teams write effectful programs with dependent types, extract them to OCaml, C, or WASM, and discharge proofs with an SMT backend.
tagline: Proof-oriented language for verified programs

github_url: https://github.com/FStarLang/FStar
website_url: https://fstar-lang.org
docs_url: https://fstar-lang.org/tutorial/

category: Other
tags: [fstar, verification, dependent-types, cryptography, smt, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Verifying cryptographic protocols and low-level programs usually splits coding from proofs. F* is a proof-oriented language so teams can write effectful programs with dependent types, prove them with SMT, and extract to OCaml, C, or WASM.

use_cases:
  - Verify cryptographic protocols and extract them to C or OCaml
  - Write proof-oriented programs with dependent types and effects
  - Teach SMT-backed program verification with F* tutorials
  - Extract verified F* developments to WASM for deployment
