name: PhysX
description: NVIDIA PhysX SDK is a real-time physics engine for rigid bodies, vehicles, articulations, and scene queries. Game engines and robotics stacks use it for collision, dynamics, and USD-backed simulation in Omniverse and Isaac Sim.
tagline: Real-time rigid-body physics SDK from NVIDIA

github_url: https://github.com/NVIDIA-Omniverse/PhysX
website_url: https://nvidia-omniverse.github.io/PhysX/
docs_url: https://nvidia-omniverse.github.io/PhysX/

category: Other
tags: [c++, physics, simulation, robotics, omniverse, isaac-sim, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Real-time collision and rigid-body dynamics are hard to scale across games, digital twins, and robot sim. PhysX is NVIDIA's BSD physics SDK so engines and Isaac Sim stacks can run vehicles, articulations, and scene queries without a custom solver.

use_cases:
  - Simulate rigid bodies, vehicles, and articulations in a game or robot scene
  - Run USD physics in Omniverse and Isaac Sim with PhysX as the backend
  - Query contacts, sweeps, and overlaps for character or robot control
  - Couple destruction and fluid extras from Blast and Flow with the core SDK
