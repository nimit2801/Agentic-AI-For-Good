name: Komga
description: Self-hosted media server for comics, manga, BDs, magazines, and eBooks with a responsive web reader, OPDS, Kobo Sync, and KOReader Sync. Index CBZ, CBR, EPUB, and PDF libraries with multi-user access on hardware you control.
tagline: Self-hosted comics, manga, and ebook media server

github_url: https://github.com/gotson/komga
website_url: https://komga.org
docs_url: https://komga.org/docs

category: Other
tags: [comics, manga, ebooks, self-hosted, opds, kobo, reading]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Comic and manga collections sit in folders or locked cloud readers with
  no library UX, metadata, or device sync. Komga indexes CBZ, CBR, EPUB,
  and PDF, serves a web reader plus OPDS, and syncs to Kobo and KOReader
  so a lab or household can share comics and research PDFs from a NAS.

use_cases:
  - Host a private manga and comic library with collections and read lists
  - Serve EPUB and PDF research collections over OPDS to e-readers
  - Sync a Kobo or KOReader device to a self-hosted library
  - Share libraries with per-user access, age, and label restrictions
  - Detect duplicate files and pages before they bloat a NAS archive
