name: Listmonk
description: High-performance, self-hosted newsletter and mailing list manager packed as a single binary. Run it so product digests, model-release emails, and community newsletters stay on your Postgres instead of a SaaS ESP.
tagline: Self-hosted newsletters as a single binary

github_url: https://github.com/knadh/listmonk
website_url: https://listmonk.app
docs_url: https://listmonk.app/docs/

category: Other
tags: [email, newsletter, self-hosted, mailing-list, golang, postgres]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  SaaS email platforms meter every send and lock subscriber lists in a vendor account.
  Listmonk is a high-performance, self-hosted newsletter manager: one Go binary plus
  Postgres, with a modern dashboard for lists, campaigns, and templates, so product
  digests and model-release emails stay on infrastructure you control.

use_cases:
  - Send a weekly product digest from your own Postgres-backed lists
  - Run model-release and changelog campaigns without a SaaS ESP
  - Host a community newsletter with templates and subscriber segments
  - Self-host transactional and bulk email for an open-source project
