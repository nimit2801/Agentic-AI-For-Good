name: raylib
description: A simple C library for videogame programming with batteries-included windowing, 2D and 3D graphics, audio, and input. raylib is a common choice for graphics demos, teaching, and lightweight ML visualization apps that need to draw without a full engine.
tagline: Simple C library for games, graphics demos, and visualization

github_url: https://github.com/raysan5/raylib
website_url: https://www.raylib.com
docs_url: https://www.raylib.com/cheatsheet/cheatsheet.html
install_command: brew install raylib

category: Other
tags: [graphics, gamedev, c, opengl, audio, visualization, cross-platform]
pricing: free
is_open_source: true
license: Zlib

problem_solved: |
  Building a small graphics or game-like demo in C usually means wiring
  windowing, OpenGL, audio, and input yourself or pulling in a heavy
  engine. That setup cost blocks teaching, prototypes, and ML viewers.
  raylib gives a small, no-boilerplate API for windows, drawing, audio,
  and input so a C program can render and interact in a few calls.

use_cases:
  - Prototype 2D or 3D visualization tools for ML demos without a game engine
  - Teach graphics and interactive programming with a small C API
  - Build lightweight desktop viewers for simulation or inference output
  - Ship cross-platform graphics demos with windowing, audio, and input included
