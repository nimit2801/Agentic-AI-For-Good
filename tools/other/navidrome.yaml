name: Navidrome
description: Self-hosted music server and streaming service compatible with Subsonic clients. Indexes a local music library and streams to web and mobile apps so teams and researchers can keep audio collections on their own hardware.
tagline: Personal streaming server for your music library

github_url: https://github.com/navidrome/navidrome
website_url: https://www.navidrome.org
docs_url: https://www.navidrome.org/docs/

category: Other
tags: [self-hosted, music, streaming, audio, subsonic, go]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Audio collections and speech datasets often live in Spotify or Google
  Play with no local catalog. Navidrome is a Subsonic-compatible music
  server that indexes your files and streams them to web and mobile
  clients from hardware you control.

use_cases:
  - Stream a private music and podcast library from a home or lab NAS
  - Host speech and audio research collections behind a Subsonic API
  - Replace commercial music lock-in with a self-hosted web player
  - Sync multi-user playback and playlists without uploading tracks to the cloud
