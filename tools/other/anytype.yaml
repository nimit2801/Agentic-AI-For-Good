name: Anytype
description: Local-first, peer-to-peer knowledge OS with end-to-end encryption for macOS, Windows, and Linux. Pages, databases, and custom types stay on device and sync over any-sync instead of a hosted wiki.
tagline: Local-first encrypted knowledge OS with P2P sync

github_url: https://github.com/anyproto/anytype-ts
website_url: https://anytype.io
docs_url: https://doc.anytype.io

install_command: brew install --cask anytype

category: Other
tags: [local-first, p2p, encryption, knowledge-base, notes, offline]
pricing: freemium
is_open_source: false
license: ASAL-1.0

problem_solved: |
  Team wikis and personal databases usually live on a vendor cloud with a
  weak offline story. Anytype keeps objects local, encrypts them, and syncs
  peer-to-peer so research notes, tasks, and typed databases remain available
  without a central host.

use_cases:
  - Build an offline-first personal wiki with custom object types
  - Sync encrypted research notes across desktop clients without a SaaS backend
  - Model tasks, journals, and databases as composable local objects
  - Keep a private knowledge graph that works with no internet connection
  - Replace Notion for notes that must stay on-device and end-to-end encrypted
