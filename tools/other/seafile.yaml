name: Seafile
description: Self-hosted file sync and share with libraries, versioning, and encrypted folders. Run it so model checkpoints, datasets, and lab docs sync across machines without Dropbox.
tagline: Self-hosted file sync for lab libraries

github_url: https://github.com/haiwen/seafile
website_url: https://www.seafile.com
docs_url: https://manual.seafile.com

category: Other
tags: [file-sync, self-hosted, storage, collaboration, c, dropbox-alternative]
pricing: freemium
is_open_source: true
license: GPL-2.0

problem_solved: |
  Dropbox and Drive put model checkpoints and datasets in a vendor account.
  Seafile is a self-hosted file sync platform with libraries, versioning, and
  encrypted folders, so a lab can sync large files across machines without
  handing the store to a cloud drive.

use_cases:
  - Sync model checkpoints across lab workstations
  - Share dataset libraries with version history
  - Keep encrypted folders for unpublished research
  - Replace Dropbox for a team that must stay on-prem
