name: Ollama UI
description: A simple HTML UI and Chrome extension for chatting with local Ollama models. Clone the repo, run make, and open localhost:8000 for a lightweight browser chat against your self-hosted Ollama server.
tagline: Minimal HTML chat UI for Ollama

github_url: https://github.com/ollama-ui/ollama-ui
website_url: https://ollama-ui.github.io/ollama-ui/

category: Other
tags: [ollama, chat, html, chrome-extension, local-llm, ui]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Ollama's default experience is a terminal REPL. Teams that want a browser
  chat against a local server often pull a heavy Next.js stack. Ollama UI is
  a tiny HTML frontend and Chrome extension that talks to the Ollama API with
  almost no dependencies, so you can demo or daily-drive local models from
  any browser.

use_cases:
  - Chat with a local Ollama server from the browser without installing a full web UI
  - Install the Chrome extension for a one-click Ollama chat overlay
  - Demo self-hosted Llama or Mistral models on a laptop with a two-command HTML UI
  - Embed a lightweight Ollama chat page in an internal tool or kiosk
