name: QuPath
description: Open-source bioimage analysis platform for whole-slide pathology. QuPath tiles gigapixel slides, trains pixel and object classifiers, and exports annotations so computational pathology pipelines have a GUI and a scriptable API.
tagline: Bioimage analysis for whole-slide pathology

github_url: https://github.com/qupath/qupath
website_url: https://qupath.github.io
docs_url: https://qupath.readthedocs.io

category: Other
tags: [java, pathology, bioimaging, whole-slide, annotation, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Digital pathology slides are too large for ImageJ windows and too
  messy for raw OpenCV. QuPath handles whole-slide images, cell
  detection, and interactive classifiers so ML teams can label tissue
  and export training tiles without a vendor viewer.

use_cases:
  - Annotate tumor regions on whole-slide images for deep learning
  - Detect and classify cells across a gigapixel pathology slide
  - Export tiles and GeoJSON annotations into a training dataset
  - Script batch QC of a clinical research slide cohort
