name: Focalboard
description: Self-hosted kanban and project board from Mattermost. Run it as a Trello or Notion alternative so lab tasks and roadmaps stay on your own server.
tagline: Self-hosted Trello and Notion alternative

github_url: https://github.com/mattermost-community/focalboard
website_url: https://github.com/mattermost-community/focalboard
docs_url: https://github.com/mattermost-community/focalboard#readme

category: Other
tags: [kanban, project-management, self-hosted, mattermost, typescript]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Trello and Notion hold the board. A lab that tracks model launches and
  evals should keep cards on its own host. Focalboard is Mattermost's
  self-hosted kanban and table view, so roadmaps and task boards stay off
  SaaS without giving up a familiar board UI.

use_cases:
  - Track model training and eval tasks on a self-hosted board
  - Run a personal kanban without a Trello account
  - Share a roadmap table with a small team on your VPS
  - Replace Notion databases for lab project tracking
