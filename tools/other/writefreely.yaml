name: WriteFreely
description: Minimalist Markdown publishing platform written in Go. Self-host a blog or writing community with ActivityPub so notes and essays federate without a SaaS CMS.
tagline: Distraction-free Markdown blogging on ActivityPub

github_url: https://github.com/writefreely/writefreely
website_url: https://writefreely.org
docs_url: https://writefreely.org/start

category: Other
tags: [blogging, markdown, activitypub, golang, self-hosted, publishing]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Medium and Substack own the URL and the audience. WriteFreely is a small
  Go binary that hosts a Markdown blog or writing community with ActivityPub,
  so essays and changelogs federate to Mastodon without a SaaS CMS or a
  heavyweight WordPress stack.

use_cases:
  - Self-host a lab changelog that federates to the fediverse
  - Run a multi-author writing community on a VPS
  - Publish Markdown essays without a WordPress theme stack
  - Keep a personal research blog on a Raspberry Pi
