name: ZynAddSubFX
description: ZynAddSubFX is an open software synthesizer with additive, subtractive, and pad synthesis. Musicians and ML audio teams generate rich timbres without a closed VSTi so sound design stays scriptable and royalty-free.
tagline: Open additive, subtractive, and pad software synthesizer

github_url: https://github.com/zynaddsubfx/zynaddsubfx
website_url: https://zynaddsubfx.sourceforge.io/
docs_url: https://zynaddsubfx.sourceforge.io/doc.html

category: Other
tags: [zynaddsubfx, synthesizer, audio, music, additive, subtractive, lv2]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Sound design for music and audio ML often depends on closed VSTs.
  ZynAddSubFX is an open synth with additive, subtractive, and PAD
  engines so patches, LV2 hosts, and datasets stay royalty-free.

use_cases:
  - Design additive or pad patches without a commercial VSTi
  - Host ZynAddSubFX as LV2 or standalone for live performance
  - Generate synthetic timbres for an audio ML training set
  - Script sound design from an open synth instead of a closed plugin
