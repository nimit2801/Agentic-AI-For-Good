name: Isaac Lab
description: GPU-accelerated robot learning framework built on NVIDIA Isaac Sim. Isaac Lab unifies reinforcement learning, imitation learning, and motion planning with RTX sensors and parallel physics so teams train manipulators, quadrupeds, and humanoids for sim-to-real transfer.
tagline: GPU robot learning framework on NVIDIA Isaac Sim

github_url: https://github.com/isaac-sim/IsaacLab
website_url: https://isaac-sim.github.io/IsaacLab
docs_url: https://isaac-sim.github.io/IsaacLab

category: Other
tags: [python, robotics, simulation, reinforcement-learning, nvidia, gpu, embodied-ai]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Robot learning stacks glue a simulator, sensors, and RL libraries by
  hand. Isaac Lab sits on Isaac Sim with parallel physics, RTX cameras,
  and ready environments so locomotion, manipulation, and humanoid
  policies train on GPU and transfer to hardware.

use_cases:
  - Train quadruped or humanoid locomotion with RSL-RL or SKRL
  - Collect imitation data from RTX cameras and contact sensors
  - Run multi-agent robot learning across cloud GPU workers
  - Prototype sim-to-real manipulation before deploying on hardware
