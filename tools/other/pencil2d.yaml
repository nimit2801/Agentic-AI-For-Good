name: Pencil2D
description: Cross-platform 2D hand-drawn animation editor for bitmap and vector frames. Pencil2D lets teams sketch storyboards, motion studies, and simple explainers for AI demos without a commercial animation suite.
tagline: Open 2D hand-drawn animation

github_url: https://github.com/pencil2d/pencil
website_url: http://pencil2d.org
docs_url: https://www.pencil2d.org/docs/

category: Other
tags: [animation, 2d, drawing, storyboard, open-source, desktop]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Short AI explainers and dataset storyboards often need frame-by-frame
  drawing. Commercial animation tools are heavy and licensed.
  Pencil2D is an open bitmap and vector 2D editor so those sketches
  and loops can be made on Linux, macOS, or Windows for free.

use_cases:
  - Storyboard a product demo for an agent or model launch video
  - Draw simple motion studies used as animation training references
  - Produce frame loops that illustrate a RAG or agent workflow
  - Sketch UI walkthroughs before recording a developer explainer
  - Export 2D sequences as image frames for a vision dataset
