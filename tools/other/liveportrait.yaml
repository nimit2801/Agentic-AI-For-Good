name: LivePortrait
description: Portrait animation model that drives a still image with a motion video. Stitching and retargeting keep expression and pose natural so talking-head and character clips can be generated from one photo.
tagline: Animate a still portrait from a driving video

github_url: https://github.com/KlingAIResearch/LivePortrait
website_url: https://liveportrait.github.io
docs_url: https://github.com/KlingAIResearch/LivePortrait

category: Other
tags: [python, portrait-animation, video, talking-head, diffusion]
pricing: free
is_open_source: true

problem_solved: |
  Turning a headshot into a talking or emoting video used to need 3D
  rigs or heavy per-identity training. LivePortrait animates a still
  portrait from a driving video so expression and pose transfer without
  that pipeline.

use_cases:
  - Animate a product or character portrait with a driving video
  - Generate talking-head clips from a single still photo
  - Retarget facial motion onto a different identity for creative video
  - Prototype portrait animation before a production VFX stack
