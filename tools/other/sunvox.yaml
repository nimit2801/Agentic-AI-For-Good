name: SunVox
description: SunVox is a modular synthesizer and tracker for desktop and mobile. Musicians wire generators, effects, and pattern-based sequences into a compact modular rack without a full DAW.
tagline: Compact modular synthesizer and tracker for desktop and mobile

website_url: https://www.warmplace.ru/soft/sunvox/
docs_url: https://www.warmplace.ru/soft/sunvox/

category: Other
tags: [sunvox, modular-synth, tracker, music, audio, mobile, synthesis]
pricing: free
is_open_source: false

problem_solved: |
  A full DAW is heavy when you want a portable modular rack that still
  sequences patterns. SunVox combines a modular synth with a tracker so
  musicians build generators, effects, and pattern sequences on desktop,
  tablet, or phone without a studio-sized plugin host.

use_cases:
  - Sketch a modular synth patch on a phone and keep editing it on desktop
  - Sequence patterns in a tracker while routing audio through modular modules
  - Build a compact live set that runs on Windows, macOS, Linux, Android, or iOS
  - Export a SunVox project as audio without opening a full DAW
