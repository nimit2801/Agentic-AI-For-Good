name: MMPose
description: MMPose is OpenMMLab's comprehensive pose estimation toolbox supporting 2D and 3D human pose, hand pose, face keypoints, and animal pose estimation with a unified training and inference framework.
tagline: OpenMMLab pose estimation toolbox and benchmark

github_url: https://github.com/open-mmlab/mmpose
website_url: https://mmpose.readthedocs.io/en/latest/
docs_url: https://mmpose.readthedocs.io/en/latest/installation.html
install_command: pip install mmpose

category: Other
tags: [pose-estimation, computer-vision, openmmlab, pytorch, human-pose, keypoints]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Building pose estimation pipelines requires stitching together datasets, model architectures, training loops, and evaluation metrics that vary widely across 2D body pose, 3D pose, hand keypoints, and face landmarks. MMPose unifies these under a single framework with modular configs, pretrained models, and standardized benchmarks, eliminating the need to reimplement pose pipelines from scratch for each new task or dataset.

use_cases:
  - Build fitness applications that track body movements and count repetitions
  - Create hand-tracking interfaces for gesture-controlled AR/VR experiences
  - Deploy human pose estimation for workplace safety and ergonomics analysis
  - Research new pose architectures with standardized datasets and evaluation metrics
