name: Discourse
description: Open-source community forum for long-form discussion, knowledge bases, and mailing-list replacement. Self-host it so product Q&A, model cards, and builder threads stay indexed instead of vanishing in Slack.
tagline: Modern forum software for builder communities

github_url: https://github.com/discourse/discourse
website_url: https://www.discourse.org
docs_url: https://meta.discourse.org

category: Other
tags: [forum, community, self-hosted, discussion, ruby, open-source]
pricing: freemium
is_open_source: true
license: GPL-2.0

problem_solved: |
  Slack and Discord bury answers. Builder communities need a searchable, long-lived forum
  for product Q&A, model cards, and how-to threads. Discourse is open-source forum software
  you can self-host so knowledge stays indexed, moderated, and owned by the community
  instead of a chat vendor.

use_cases:
  - Host a product forum for an open-source ML library
  - Replace a mailing list with searchable topic threads
  - Run a knowledge base for model cards and integration how-tos
  - Moderate a builder community with trust levels and badges
