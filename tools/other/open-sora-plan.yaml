name: Open-Sora-Plan
description: Open-source project from PKU-YuanGroup that reproduces Sora-style text-to-video generation with public training code, data plans, and video diffusion models for the community.
tagline: Open reproduction of Sora-style text-to-video models

github_url: https://github.com/PKU-YuanGroup/Open-Sora-Plan

category: Other
tags: [video-generation, text-to-video, diffusion, open-source, sora, generative-ai]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Closed video models hide architecture, data, and training details, so labs cannot
  study or extend Sora-class systems. Open-Sora-Plan publishes an open plan and
  codebase to reproduce text-to-video generation, including models and training
  recipes the community can run and improve.

use_cases:
  - Train or fine-tune an open Sora-style text-to-video model
  - Generate videos from text using Open-Sora-Plan checkpoints
  - Study open video-diffusion architecture and data recipes
  - Compare open Sora reproductions against HPC-AI Open-Sora
