name: seL4
description: Formally verified microkernel with a machine-checked proof of functional correctness. High-assurance systems isolate untrusted code on a small trusted computing base used in aerospace, automotive, and security appliances.
tagline: Formally verified microkernel for high-assurance systems

github_url: https://github.com/seL4/seL4
website_url: https://sel4.systems
docs_url: https://docs.sel4.systems

category: Other
tags: [c, microkernel, formal-verification, security, operating-systems, open-source]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  High-assurance systems need a tiny trusted computing base whose isolation properties are proven, not tested. seL4 is a formally verified microkernel so aerospace, automotive, and security teams can isolate untrusted components on a kernel with a machine-checked correctness proof.

use_cases:
  - Isolate untrusted workloads on a verified microkernel
  - Build high-assurance automotive or aerospace software stacks
  - Teach OS verification with a kernel that has a published proof
  - Run mixed-criticality systems with seL4 capability-based isolation
