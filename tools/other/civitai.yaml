name: Civitai
description: Community model hub for Stable Diffusion checkpoints, LoRAs, embeddings, and workflows. Browse, version, and download generative weights with metadata, previews, and creator pages used across local UIs like ComfyUI and Automatic1111.
tagline: Community hub for Stable Diffusion models, LoRAs, and workflows

github_url: https://github.com/civitai/civitai
website_url: https://civitai.com

category: Other
tags: [model-hub, stable-diffusion, lora, generative, community, image-generation]
pricing: freemium
is_open_source: true
license: Apache-2.0

problem_solved: |
  Image-generation weights are scattered across Drive folders and Discord
  drops with no versioning. Civitai is a public hub so creators can
  publish checkpoints and LoRAs with previews, and users can find a
  specific style without hunting unofficial mirrors.

use_cases:
  - Download a Stable Diffusion checkpoint or LoRA with preview images and version history
  - Publish a fine-tuned model with licensing and resource metadata
  - Search embeddings and workflows used in ComfyUI or Automatic1111
  - Self-host the Apache-2.0 Civitai stack with Docker Compose
  - Track model versions before promoting a weight into a production image pipeline
