name: Project Chrono
description: Project Chrono is a high-performance C++ library for multibody dynamics and multiphysics simulation. It models rigid and flexible bodies, contacts, vehicles, and robotics, with Python bindings and modules for vehicles, sensors, and co-simulation.
tagline: Multibody dynamics and multiphysics simulation for vehicles and robots

github_url: https://github.com/projectchrono/chrono
website_url: https://projectchrono.org
docs_url: https://api.projectchrono.org

category: Other
tags: [c++, python, robotics, simulation, multibody, physics, vehicles, dynamics]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Vehicle and robot teams need contact-rich multibody physics beyond
  game engines. Project Chrono simulates rigid and flexible bodies,
  terrain, and vehicles at research scale, with Python bindings so
  teams prototype dynamics, sensors, and co-simulation without writing
  a custom physics engine.

use_cases:
  - Simulate off-road vehicles with deformable terrain and tire models
  - Model robot arms and mobile platforms with contacts and constraints
  - Co-simulate Chrono dynamics with ROS or custom controllers
  - Prototype sensor and vehicle modules before hardware tests
