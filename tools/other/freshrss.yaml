name: FreshRSS
description: Self-hostable RSS and Atom aggregator with a web UI, APIs, and filters. Used to follow papers, product blogs, and community feeds in one place and export items into research or summarization pipelines.
tagline: Self-hosted RSS aggregator for following the open web

github_url: https://github.com/FreshRSS/FreshRSS
website_url: https://freshrss.org
docs_url: https://freshrss.org/index.html

category: Other
tags: [rss, feeds, self-hosted, news, aggregator, php]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Following AI papers, changelogs, and blogs across dozens of sites needs
  a reader you control. FreshRSS is a self-hosted aggregator with filters,
  tags, and APIs so researchers can keep subscriptions on their server
  and pipe items into downstream tools.

use_cases:
  - Follow arXiv, GitHub, and vendor blogs in one self-hosted reader
  - Filter and tag incoming feeds before sending items to an LLM summarizer
  - Share team subscriptions without a commercial RSS SaaS
  - Export unread items via API into a research monitoring pipeline
