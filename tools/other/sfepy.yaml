name: SfePy
description: Finite element package in Python for solving PDEs on unstructured meshes. Researchers assemble continuum mechanics, heat transfer, and acoustics problems with a declarative problem description.
tagline: Simple finite elements in Python for PDE problems

github_url: https://github.com/sfepy/sfepy
website_url: http://sfepy.org
docs_url: https://sfepy.org/doc-devel/index.html

install_command: pip install sfepy

category: Other
tags: [python, fem, pde, continuum-mechanics, scientific-computing, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  PDE work in Python often means wrapping a C++ FEM code or writing assemblers from scratch. SfePy is a finite element package so researchers can describe continuum mechanics and heat-transfer problems in Python and solve them on unstructured meshes.

use_cases:
  - Solve continuum mechanics and heat-transfer PDEs in Python
  - Assemble finite element problems on unstructured meshes
  - Prototype a new material model without wrapping a C++ FEM code
  - Teach finite elements with a declarative Python problem file
