name: Shuffle
description: Shuffle is an open-source security automation (SOAR) platform for building visual playbooks that connect detection tools, ticketing, and response actions. Teams automate alert triage, enrichment, and containment without writing glue code for every integration.
tagline: Open-source security automation and SOAR playbooks

github_url: https://github.com/Shuffle/Shuffle
website_url: https://shuffler.io
docs_url: https://shuffler.io/docs

category: Other
tags: [soar, security, automation, playbooks, soc, workflows, open-source]
pricing: freemium
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Security operations for AI platforms still depend on analysts copying alerts
  between SIEM, ticketing, and chat. That delay lets compromised GPU nodes or
  leaked keys sit unhandled. Shuffle gives a visual workflow engine and shared
  app library so SOC teams automate enrichment, notification, and response
  without a custom integration for every tool.

use_cases:
  - Automate SIEM alert enrichment and ticket creation for GPU cluster incidents
  - Build playbooks that isolate hosts and rotate keys when a secret leaks
  - Connect Wazuh, TheHive, and chat so SOC analysts get context without copy-paste
  - Share reusable security apps and workflows across MSSP or multi-team environments
