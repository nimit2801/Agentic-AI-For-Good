name: MOOSE
description: Idaho National Laboratory finite-element multiphysics framework with a fully coupled implicit solver. Scientists and engineers run dimension-independent physics on desktops through supercomputers with built-in mesh adaptivity.
tagline: INL finite-element framework for coupled multiphysics

github_url: https://github.com/idaholab/moose
website_url: https://mooseframework.inl.gov
docs_url: https://mooseframework.inl.gov

category: Other
tags: [c++, fem, multiphysics, hpc, simulation, petsc, open-source]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Coupled multiphysics on HPC often means stitching PETSc, meshes, and custom kernels by hand. MOOSE is an INL finite-element framework so scientists can write physics modules and run fully implicit solves from laptops to 100,000 cores.

use_cases:
  - Run fully coupled implicit multiphysics on HPC clusters
  - Write a custom physics module on the MOOSE application layer
  - Use built-in mesh adaptivity for nonlinear FEM solves
  - Scale the same input from a laptop to tens of thousands of cores
