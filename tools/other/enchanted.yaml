name: Enchanted
description: An open source Ollama-compatible macOS, iOS, and visionOS app for chatting with privately hosted models such as Llama 2, Mistral, and Vicuna. It delivers an unfiltered, secure, private, multimodal ChatGPT-style experience across Apple devices.
tagline: Private Ollama chat across Mac, iPhone, and Vision Pro

github_url: https://github.com/gluonfield/enchanted
website_url: https://apps.apple.com/gb/app/enchanted-llm/id6474268307

category: Other
tags: [ollama, macos, ios, visionos, swift, local-llm, chat, apple]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  ChatGPT-style apps lock conversations to vendor clouds, so Apple users who
  self-host Ollama have no native, multimodal client that works across Mac,
  iPhone, Watch, and Vision Pro. Enchanted is an elegant, unfiltered Apple
  client that talks to a private Ollama server, with prompt templates,
  completions, conversation history, and vision support without sending data
  to a third-party API.

use_cases:
  - Chat with a self-hosted Llama, Mistral, or Vicuna model from iPhone or Mac without a cloud LLM
  - Use custom prompt templates and completions from anywhere in the Apple ecosystem
  - Run multimodal Ollama vision chats on iPhone and Vision Pro against a local server
  - Keep conversation history on-device while connecting to a private Ollama endpoint
