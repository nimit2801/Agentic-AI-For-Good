name: Trilium
description: Hierarchical personal knowledge base with a note tree, WYSIWYG and code editors, encryption, and a self-hosted sync server. Researchers keep large note graphs, scripts, and diagrams on hardware they control instead of a consumer notebook SaaS.
tagline: Hierarchical personal knowledge base you self-host

github_url: https://github.com/TriliumNext/Trilium
website_url: https://triliumnotes.org
docs_url: https://docs.triliumnotes.org/

install_command: brew install --cask trilium-notes

category: Other
tags: [notes, knowledge-base, self-hosted, electron, encryption, pkm]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Consumer notebooks lock research into proprietary clouds and flatten
  structure. Trilium stores notes in an arbitrarily deep tree with cloning,
  attributes, encryption, and a REST API so a personal knowledge base can
  scale past 100,000 notes on your own server.

use_cases:
  - Keep a hierarchical research wiki with cloned notes and attributes
  - Run a self-hosted sync server so desktop and web clients share one tree
  - Script note workflows through the REST API for agent automation
  - Protect selected notes with per-note encryption on a private server
  - Import Evernote or Markdown dumps into a searchable note graph
