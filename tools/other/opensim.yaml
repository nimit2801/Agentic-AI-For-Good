name: OpenSim
description: Open-source musculoskeletal simulation software for human and animal movement. Biomechanics teams scale models, run inverse kinematics and dynamics, and solve optimal control with OpenSim Moco on Simbody physics.
tagline: Musculoskeletal simulation for movement science

github_url: https://github.com/opensim-org/opensim-core
website_url: https://opensim.stanford.edu
docs_url: https://opensimconfluence.atlassian.net/wiki/spaces/OpenSim/overview

category: Other
tags: [c++, python, biomechanics, simulation, robotics, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Estimating muscle forces and joint kinematics from motion capture is a research stack, not a one-off script. OpenSim is Apache musculoskeletal software so labs can scale models, run inverse dynamics, and solve optimal control without a closed biomechanics package.

use_cases:
  - Scale a musculoskeletal model to a subject from motion capture
  - Compute inverse kinematics and inverse dynamics from marker data
  - Solve optimal control with OpenSim Moco for gait or sport
  - Drive OpenSim from Python or Java in a research pipeline
