name: Phaser
description: Phaser is a fast 2D game framework for HTML5 using Canvas and WebGL. Teams use it for interactive ML demos, training-data games, and browser simulations that need sprites, physics, and input without a 3D engine.
tagline: Fast 2D HTML5 game framework for Canvas and WebGL

github_url: https://github.com/phaserjs/phaser
website_url: https://phaser.io
docs_url: https://docs.phaser.io
install_command: npm install phaser

category: Other
tags: [javascript, typescript, game-engine, html5, webgl, 2d, visualization]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Interactive 2D ML demos and browser simulations need sprites, physics,
  and input. Raw Canvas is too low-level and 3D engines are overkill.
  Phaser is a 2D HTML5 framework so teams ship those experiences in the
  browser.

use_cases:
  - Build a browser 2D simulation or RL visualization with sprites and physics
  - Prototype interactive training-data collection games
  - Ship educational ML demos that run in desktop and mobile browsers
  - Add Canvas or WebGL 2D scenes to a web dashboard without a 3D engine
