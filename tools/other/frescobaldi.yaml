name: Frescobaldi
description: Frescobaldi is a LilyPond music editor. Composers write, preview, and MIDI-play engraved scores in a desktop IDE instead of compiling LilyPond from the command line alone.
tagline: LilyPond editor with score preview and MIDI

github_url: https://github.com/frescobaldi/frescobaldi
website_url: https://www.frescobaldi.org/
docs_url: https://frescobaldi.org/docs.html

install_command: brew install --cask frescobaldi

category: Other
tags: [frescobaldi, lilypond, notation, editor, midi, music, engraving]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  LilyPond is a compiler, not an editor. Writing scores in a plain
  text file without preview is slow. Frescobaldi is a desktop IDE so
  composers edit LilyPond, see engraved output, and play MIDI without
  a commercial notation suite.

use_cases:
  - Edit LilyPond source with instant score preview
  - Play MIDI from an engraved score while drafting parts
  - Point-and-click from PDF preview back into LilyPond text
  - Manage a multi-movement score project in a dedicated editor
