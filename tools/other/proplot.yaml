name: Proplot
description: Succinct matplotlib wrapper for publication-quality graphics. Proplot adds grids, colorbars, and geographic projections so scientific ML figures stay consistent without a long matplotlib boilerplate file.
tagline: Matplotlib wrapper for publication figures

github_url: https://github.com/proplot-dev/proplot
website_url: https://proplot.readthedocs.io
docs_url: https://proplot.readthedocs.io
install_command: pip install proplot

category: Other
tags: [python, matplotlib, visualization, scientific, plotting, figures]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Paper figures need aligned colorbars, projections, and subplot
  grids, but matplotlib boilerplate sprawls. Proplot wraps pyplot
  with opinionated defaults so climate and ML papers produce
  consistent multi-panel figures without a custom style module.

use_cases:
  - Build a multi-panel climate map with shared colorbars
  - Plot geographic data on a cartopy projection with less boilerplate
  - Apply a publication style across a suite of matplotlib figures
  - Combine line plots and maps in one grid for a paper
