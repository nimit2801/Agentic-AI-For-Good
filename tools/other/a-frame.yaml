name: A-Frame
description: A-Frame is a web framework for building VR and AR experiences with HTML and Three.js. Teams use it to ship browser XR demos of agents, digital twins, and spatial ML without a native engine.
tagline: Web framework for VR and AR experiences in the browser

github_url: https://github.com/aframevr/aframe
website_url: https://aframe.io
docs_url: https://aframe.io/docs
install_command: npm install aframe

category: Other
tags: [javascript, webxr, vr, ar, threejs, html, visualization]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Browser XR demos of agents or digital twins usually mean hand-rolled
  Three.js and WebXR boilerplate. A-Frame wraps that stack in HTML
  entities so teams ship VR and AR scenes without a native engine.

use_cases:
  - Build a browser VR demo of an agent or robotics environment
  - Prototype WebXR product or digital-twin viewers with HTML entities
  - Teach spatial interfaces without a native game engine
  - Embed an AR overlay of model outputs in a web app
