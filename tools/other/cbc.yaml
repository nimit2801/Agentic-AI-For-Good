name: Cbc
description: COIN-OR Branch-and-Cut mixed-integer linear programming solver written in C++. Operations-research teams use it as a callable library or standalone MIP solver through AMPL, PuLP, and other modeling systems.
tagline: Open-source mixed-integer linear programming solver

github_url: https://github.com/coin-or/Cbc
website_url: https://github.com/coin-or/Cbc
docs_url: https://github.com/coin-or/Cbc/blob/master/README.md

category: Other
tags: [c++, milp, mip, optimization, coin-or, operations-research, open-source]
pricing: free
is_open_source: true
license: EPL-2.0

problem_solved: |
  Mixed-integer linear programs need a free MIP solver that can run as a library or a command-line tool. Cbc is the COIN-OR branch-and-cut solver so OR teams can optimize MILPs without a commercial MIP license.

use_cases:
  - Solve mixed-integer linear programs from a C++ library or CLI
  - Use Cbc as the MIP backend for PuLP, AMPL, or AIMMS
  - Run branch-and-cut with custom cuts and heuristics
  - Replace a commercial MIP solver on open-source OR pipelines
