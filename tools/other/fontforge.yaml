name: FontForge
description: Free outline and bitmap font editor for Windows, macOS, and Linux. FontForge designs and converts fonts so UI, OCR, and document-AI stacks can ship custom typefaces and inspect font files without a paid editor.
tagline: Free outline and bitmap font editor

github_url: https://github.com/fontforge/fontforge
website_url: https://fontforge.github.io/
docs_url: https://fontforge.org/docs/
install_command: brew install fontforge

category: Other
tags: [fonts, editor, desktop, ocr, typography, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  OCR, document-AI, and product UI work still needs custom fonts and
  font-file inspection. Paid editors lock that behind licenses.
  FontForge opens, edits, and converts outline and bitmap fonts so
  typefaces can be prepared on a free stack.

use_cases:
  - Design a custom UI typeface for an AI product interface
  - Convert fonts between TTF, OTF, and WOFF for web agent UIs
  - Inspect glyph coverage before building an OCR training set
  - Generate bitmap strikes used in document-layout experiments
  - Fix broken font files that break PDF or dataset rendering
