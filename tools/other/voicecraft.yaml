name: VoiceCraft
description: |
  VoiceCraft is a token infilling neural codec language model for zero-shot speech editing and text-to-speech. It achieves state-of-the-art performance on both speech editing and zero-shot TTS on in-the-wild data including audiobooks, internet videos, and podcasts. VoiceCraft can clone or edit an unseen voice with only a few seconds of reference audio.
problem_solved: |
  Editing speech recordings and synthesizing new speech in a specific voice traditionally requires extensive training data for each target speaker and complex voice cloning pipelines. VoiceCraft solves this with a token infilling approach that enables zero-shot speech editing and TTS — modifying spoken words in existing recordings or generating new speech in an unseen voice using just seconds of reference audio.
use_cases:
  - "Edit spoken words in existing audio recordings without rerecording"
  - "Generate natural speech in a target voice from just seconds of reference"
  - "Create personalized voice interfaces and audiobook narration with voice cloning"
category: Other
github_url: https://github.com/jasonppy/VoiceCraft
