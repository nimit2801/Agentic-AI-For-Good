name: Carla
description: CARLA is an open simulator for autonomous driving research. It provides urban maps, sensors, and traffic so teams train perception and planning models without instrumenting a real fleet.
tagline: Open-source simulator for autonomous driving research

github_url: https://github.com/carla-simulator/carla
website_url: https://carla.org
docs_url: https://carla.readthedocs.io

category: Other
tags: [python, cpp, simulation, autonomous-driving, robotics, computer-vision]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Training driving perception and planners on public roads is slow and
  unsafe. CARLA is an Unreal-based urban simulator with cameras, lidar,
  and traffic so teams collect labeled sensor data and evaluate policies
  before a real vehicle.

use_cases:
  - Train a perception model on simulated cameras and lidar in a city map
  - Evaluate a planning or RL driving policy against CARLA traffic
  - Generate labeled autonomous-driving datasets without a real fleet
  - Prototype sensor layouts before hardware installation
