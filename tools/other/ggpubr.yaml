name: ggpubr
description: ggplot2 wrapper for publication-ready statistical plots in R. ggpubr adds p-values, significance brackets, and journal themes so ML and bioinformatics teams can go from tidy data to paper figures without hand-tuning ggplot layers.
tagline: Publication-ready ggplot2 statistical plots

github_url: https://github.com/kassambara/ggpubr
website_url: https://rpkgs.datanovia.com/ggpubr/
docs_url: https://rpkgs.datanovia.com/ggpubr/
install_command: install.packages("ggpubr")

category: Other
tags: [r, ggplot2, visualization, statistics, publication, bioinformatics]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Building paper-quality statistical charts in ggplot2 means repeating
  p-value annotations, comparison brackets, and journal themes by hand.
  ggpubr wraps those patterns so model comparisons and experiment plots
  can be publication-ready without a custom ggplot theme stack.

use_cases:
  - Add Wilcoxon or t-test p-values and significance brackets to boxplots of model metrics
  - Apply journal-ready ggplot2 themes for papers and internal ML reports
  - Plot correlation matrices and density charts from experiment result tables
  - Combine multiple ggplot2 panels into a single multi-figure layout
