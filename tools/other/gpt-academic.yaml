name: GPT Academic
description: A modular LLM workbench optimized for papers, translation, and code. GPT Academic adds one-click arXiv and PDF translation, LaTeX polish, project analysis, and parallel queries across GPT, GLM, Qwen, DeepSeek, and local models.
tagline: LLM workbench for papers, translation, and academic code

github_url: https://github.com/binary-husky/gpt_academic
website_url: https://github.com/binary-husky/gpt_academic/wiki/online

category: Other
tags: [academic, translation, latex, pdf, chatgpt, glm, qwen, plugins]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Generic chat UIs are a poor fit for papers. Researchers paste PDFs into
  ChatGPT, lose LaTeX structure, and cannot run the same prompt across GPT,
  GLM, and Qwen. GPT Academic is a plugin workbench with arXiv and PDF
  translation, LaTeX polish, project analysis, and parallel model queries
  aimed at reading and writing research rather than casual chat.

use_cases:
  - One-click translate an arXiv or PDF paper while preserving LaTeX structure
  - Polish and grammar-check a LaTeX draft with side-by-side PDF output
  - Analyze a Python or C++ repo and generate comments or a self-explanation
  - Query GPT, GLM, Qwen, and DeepSeek in parallel on the same academic prompt
