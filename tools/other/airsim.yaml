name: AirSim
description: AirSim is Microsoft's open-source simulator for autonomous vehicles built on Unreal Engine and Unity. It provides physically and visually realistic environments for drones and cars, with APIs for computer vision, reinforcement learning, and hardware-in-the-loop testing.
tagline: Unreal and Unity simulator for autonomous drones and cars

github_url: https://github.com/microsoft/AirSim
website_url: https://microsoft.github.io/AirSim/
docs_url: https://microsoft.github.io/AirSim/
install_command: pip install airsim

category: Other
tags: [python, c++, robotics, simulation, drones, autonomous-vehicles, unreal, reinforcement-learning]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Training perception and control for drones and cars needs photoreal
  worlds without crashing hardware. AirSim sits on Unreal Engine and Unity
  with vehicle dynamics, cameras, and Python APIs so teams collect data,
  train policies, and test autonomy before flying or driving for real.

use_cases:
  - Collect photoreal camera and lidar data from simulated drones and cars
  - Train reinforcement learning policies in AirSim before hardware trials
  - Test computer vision pipelines against Unreal environments via the Python API
  - Run hardware-in-the-loop experiments with PX4 or ArduPilot connected to AirSim
