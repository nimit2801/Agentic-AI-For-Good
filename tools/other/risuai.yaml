name: RisuAI
description: A user-friendly TypeScript app for LLM roleplaying. It lets people build characters, stories, and local or API-backed chats without assembling a custom frontend around a raw model endpoint.
tagline: User-friendly software for LLM roleplaying

github_url: https://github.com/kwaroran/Risuai
website_url: https://risuai.net
docs_url: https://github.com/kwaroran/Risuai#readme

category: Other
tags: [typescript, llm, roleplay, chat, characters, local-llm, frontend]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Roleplay and character chats usually mean gluing SillyTavern
  plugins or writing a UI from scratch. RisuAI is a dedicated
  client for building characters and running LLM stories against
  local or hosted models. Writers get a maintained app instead of
  a pile of community extensions.

use_cases:
  - Run character-based LLM chats against local or API models without writing a frontend
  - Build and share story presets for interactive fiction or RPG sessions
  - Prototype persona and memory setups before embedding them in a custom product
  - Give non-engineers a GUI for long-form LLM roleplay sessions
