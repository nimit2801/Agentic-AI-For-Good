name: PaddleVideo
description: PaddleVideo is Baidu's video understanding toolkit on PaddlePaddle. It covers action recognition, video tagging, skeleton-based models, and sports action detection with annotation tools and pretrained configs for practical video pipelines.
tagline: Video understanding and action recognition toolkit on PaddlePaddle

github_url: https://github.com/PaddlePaddle/PaddleVideo
docs_url: https://github.com/PaddlePaddle/PaddleVideo
install_command: pip install paddlevideo

category: Other
tags: [python, computer-vision, video, action-recognition, paddlepaddle, skeleton, tagging]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Shipping video tagging and action recognition usually means mixing
  separate RGB, skeleton, and annotation stacks. PaddleVideo puts PP-TSM,
  skeleton models, sports detection, and labeling tools on PaddlePaddle
  so teams train and deploy one video understanding pipeline.

use_cases:
  - Train RGB action recognition models such as PP-TSM on custom video datasets
  - Tag long-form video with lightweight recognition and tagging configs
  - Detect sports actions from RGB or skeleton sequences
  - Annotate video datasets with PaddleVideo's labeling tools before training
