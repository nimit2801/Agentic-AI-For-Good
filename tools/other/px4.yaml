name: PX4
description: PX4 Autopilot is open-source flight control firmware for drones and unmanned vehicles. It runs on many flight controllers, supports multirotors, VTOLs, and fixed-wing aircraft, and integrates with ROS 2, MAVLink, and simulators for research and production UAVs.
tagline: Open-source autopilot firmware for drones, VTOLs, and unmanned vehicles

github_url: https://github.com/PX4/PX4-Autopilot
website_url: https://px4.io
docs_url: https://docs.px4.io

category: Other
tags: [c++, robotics, drones, autopilot, mavlink, ros, uav, firmware]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Building reliable UAV control from scratch is slow and unsafe. PX4 is a
  production-grade autopilot with estimators, controllers, and failsafe for
  multicopters, VTOLs, and fixed-wing, plus ROS 2 and MAVLink so research
  and commercial teams fly hardware without writing a flight stack.

use_cases:
  - Fly a research multicopter with PX4 on a Pixhawk-class flight controller
  - Integrate PX4 with ROS 2 for offboard planning and computer vision
  - Simulate PX4 in Gazebo or jMAVSim before testing on hardware
  - Deploy VTOL or fixed-wing missions with MAVLink ground stations
