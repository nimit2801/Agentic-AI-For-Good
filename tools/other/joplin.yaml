name: Joplin
description: Privacy-focused note app with Markdown, notebooks, and sync for desktop and mobile. Researchers use it to keep notes, paper clips, and checklists under their own encryption instead of a consumer cloud notebook.
tagline: Privacy-focused Markdown notes with end-to-end sync

github_url: https://github.com/laurent22/joplin
website_url: https://joplinapp.org
docs_url: https://joplinapp.org/help/

category: Other
tags: [notes, markdown, privacy, sync, electron, mobile]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Research notes in Evernote or Apple Notes are hard to export and easy
  to lock into a vendor. Joplin stores Markdown notebooks you can sync
  through Dropbox, Nextcloud, or Joplin Cloud with optional end-to-end
  encryption.

use_cases:
  - Keep research notes and paper summaries in Markdown across devices
  - Clip web articles into notebooks with the browser extension
  - Sync encrypted notes through Nextcloud instead of a proprietary cloud
  - Organize to-do lists and meeting notes with tags and notebooks
