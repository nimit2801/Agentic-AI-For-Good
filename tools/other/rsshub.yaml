name: RSSHub
description: Open-source RSS feed generator that turns websites, social platforms, and APIs into syndication feeds. Used to monitor product blogs, papers, and community sources in one reader or data pipeline.
tagline: Everything is RSSible — generate feeds from any site

github_url: https://github.com/DIYgod/RSSHub
website_url: https://docs.rsshub.app
docs_url: https://docs.rsshub.app

category: Other
tags: [rss, feeds, monitoring, scraping, self-hosted, nodejs]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Many sites that publish AI papers, changelogs, and community posts have no
  RSS. RSSHub generates feeds from those sources so researchers can watch
  them in a reader or ingest them into a pipeline instead of scraping by hand.

use_cases:
  - Subscribe to GitHub, social, and docs pages that do not ship native RSS
  - Feed product changelogs and paper lists into a research monitoring pipeline
  - Self-host a route library that turns websites into structured XML feeds
  - Aggregate multilingual news sources for downstream LLM summarization
