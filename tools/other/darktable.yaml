name: Darktable
description: Open-source photography workflow and RAW developer. Darktable non-destructively develops camera RAW files so vision teams can color-correct, crop, and export dataset photos without Adobe Lightroom.
tagline: Open-source RAW photography workflow

github_url: https://github.com/darktable-org/darktable
website_url: https://www.darktable.org
docs_url: https://www.darktable.org/resources/

category: Other
tags: [photography, raw, desktop, vision, dataset, open-source]
pricing: free
is_open_source: true
license: GPL-3.0
install_command: brew install --cask darktable

problem_solved: |
  Camera RAW files need consistent color, crop, and export before they
  enter a vision dataset. Paid catalogs lock that work in Lightroom.
  Darktable develops RAW non-destructively so labs can batch-correct
  photos and export training images on an open stack.

use_cases:
  - Develop camera RAW files into a consistent vision training set
  - Color-correct and crop field photos before labeling or embedding
  - Batch-export JPEG or TIFF assets for OCR and object-detection pipelines
  - Apply the same history stack across a shoot used as evaluation fixtures
  - Prepare high-bit-depth stills for a generative or photogrammetry workflow
