name: Audacity
description: Audacity is a multi-track audio editor and recorder. It records, cuts, and processes waveforms so teams prepare speech, music, and training audio without a commercial DAW.
tagline: Multi-track audio editor and recorder

github_url: https://github.com/audacity/audacity
website_url: https://www.audacityteam.org/
docs_url: https://manual.audacityteam.org/

install_command: brew install --cask audacity

category: Other
tags: [audacity, audio, editor, recorder, waveform, open-source, daw]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Preparing speech, music, and training audio usually means a paid
  DAW. Audacity is a free multi-track editor that records, cuts,
  and applies effects so researchers and creators clean and export
  waveforms without a commercial license.

use_cases:
  - Record and trim microphone takes for a speech dataset
  - Apply noise reduction and EQ before feeding audio to a model
  - Export WAV or FLAC clips from a multi-track session
  - Teach basic audio editing without a paid DAW license
