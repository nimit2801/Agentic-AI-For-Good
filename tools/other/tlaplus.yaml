name: TLA+
description: Formal specification language and TLC model checker for concurrent and distributed systems. Engineers write TLA+ or PlusCal specs of protocols, then check safety and liveness properties in the Toolbox IDE.
tagline: Model checker for concurrent and distributed protocols

github_url: https://github.com/tlaplus/tlaplus
website_url: https://www.tlapl.us
docs_url: https://learntla.com

category: Other
tags: [tla, model-checking, formal-methods, distributed-systems, java, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Concurrent and distributed protocols fail in ways unit tests miss. TLA+ and the TLC model checker let engineers specify algorithms in PlusCal or TLA+ and exhaustively check safety and liveness before implementation.

use_cases:
  - Model-check a distributed consensus protocol before writing production code
  - Specify concurrent algorithms in PlusCal and verify safety with TLC
  - Explore counterexamples to liveness properties in the TLA+ Toolbox
  - Teach specification and model checking of concurrent systems
