name: PhotoPrism
description: AI-powered self-hosted photo management app that indexes libraries with TensorFlow, finds faces and objects, and serves a private gallery. Useful for organizing visual datasets and personal media without uploading everything to a public cloud.
tagline: AI-powered self-hosted photos app for private libraries

github_url: https://github.com/photoprism/photoprism
website_url: https://www.photoprism.app
docs_url: https://docs.photoprism.app

category: Other
tags: [self-hosted, photos, tensorflow, face-recognition, privacy, gallery]
pricing: freemium
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Large photo libraries are hard to search without sending files to a cloud
  album. PhotoPrism indexes local and NAS libraries with TensorFlow, clusters
  faces, and labels objects so researchers and families can browse visual
  archives privately with AI search.

use_cases:
  - Index a NAS photo library with TensorFlow labels, faces, and quality scores
  - Browse and share private albums from a self-hosted web UI without Google Photos
  - Organize visual research datasets with metadata, maps, and similar-image search
  - Import RAW and video files into a searchable private archive
