name: OpenFOAM
description: Open-source C++ toolbox for computational fluid dynamics. Teams simulate incompressible, compressible, and multiphase flows and export field data used in physics-informed models, digital twins, and engineering design loops.
tagline: Open-source CFD toolbox for continuum mechanics

github_url: https://github.com/OpenFOAM/OpenFOAM-dev
website_url: https://openfoam.org
docs_url: https://www.openfoam.com/documentation

category: Other
tags: [c++, cfd, simulation, fluid-dynamics, scientific-computing, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  High-fidelity fluid simulation usually means a commercial CFD code or a one-off solver. OpenFOAM is a GPL C++ toolbox for continuum mechanics so teams can run incompressible, compressible, and multiphase cases, mesh, and post-process without a paid CFD license.

use_cases:
  - Simulate incompressible and compressible flow around vehicles or buildings
  - Generate CFD field datasets for physics-informed neural networks
  - Run multiphase and heat-transfer cases in process engineering
  - Couple mesh motion and turbulence models in a custom solver
