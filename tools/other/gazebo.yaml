name: Gazebo
description: Open source robotics simulator from Open Robotics. Gazebo Sim provides high-fidelity physics, sensors, and rendering with SDF worlds and plugins so robot teams develop, test, and benchmark autonomy stacks before hardware.
tagline: Open source robotics simulator with physics and sensors

github_url: https://github.com/gazebosim/gz-sim
website_url: https://gazebosim.org
docs_url: https://gazebosim.org/docs

category: Other
tags: [cpp, python, robotics, simulation, sensors, sdf, open-robotics]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Robot software needs physics, cameras, lidar, and IMU data before
  hardware exists. Gazebo Sim couples multiple physics engines,
  sensor models, and SDF worlds so autonomy stacks develop and
  benchmark in simulation instead of on a real robot.

use_cases:
  - Simulate lidar, cameras, IMU, and contact sensors on SDF robot models
  - Test ROS 2 navigation and manipulation stacks before hardware trials
  - Load Gazebo Fuel worlds and robots for autonomy benchmarking
  - Write C++ or Python plugins that control simulated robots
