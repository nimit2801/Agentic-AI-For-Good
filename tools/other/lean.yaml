name: Lean
description: Dependently typed programming language and interactive theorem prover from the Lean FRO. Researchers write machine-checked mathematics and verified software in Lean 4, backed by mathlib and a growing ecosystem of formal proofs.
tagline: Theorem prover and language for machine-checked math

github_url: https://github.com/leanprover/lean4
website_url: https://lean-lang.org
docs_url: https://lean-lang.org/doc/reference/

category: Other
tags: [lean4, theorem-prover, formal-methods, dependent-types, mathematics, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Formalizing mathematics and verifying software needs a language that is both a theorem prover and a programming language. Lean 4 is a dependently typed system so researchers can write machine-checked proofs and extract executable code from the same definitions.

use_cases:
  - Formalize theorems in mathlib with machine-checked Lean proofs
  - Verify algorithms by proving properties of Lean implementations
  - Teach interactive theorem proving with Lean 4 and the infoview
  - Build domain-specific formalizations that compile to executable code
