name: FreeCAD
description: FreeCAD is a free parametric 3D CAD modeler. Sketches, constraints, and workbenches cover mechanical parts, assemblies, and STEP export so teams design hardware without a commercial CAD seat.
tagline: Open-source parametric 3D CAD for mechanical design

github_url: https://github.com/FreeCAD/FreeCAD
website_url: https://www.freecad.org
docs_url: https://wiki.freecad.org
install_command: brew install --cask freecad

category: Other
tags: [freecad, cad, 3d, parametric, mechanical, hardware, step]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Mechanical CAD is dominated by paid seats and proprietary formats.
  FreeCAD is a parametric 3D modeler with sketches, constraints, and
  workbenches so teams design parts, assemblies, and exports without
  a commercial license.

use_cases:
  - Model a parametric mechanical part and export STEP or STL
  - Build an assembly of constrained sketches for a hardware prototype
  - Script geometry in Python inside a FreeCAD workbench
  - Share an open hardware design as a FreeCAD project
