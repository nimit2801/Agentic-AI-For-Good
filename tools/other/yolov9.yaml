name: YOLOv9
description: YOLOv9 is a real-time object detector that uses programmable gradient information and GELAN to improve learning what to learn. The official code trains and evaluates detectors that target both accuracy and efficiency.
tagline: YOLO detector with programmable gradient information

github_url: https://github.com/WongKinYiu/yolov9
docs_url: https://github.com/WongKinYiu/yolov9

category: Other
tags: [python, computer-vision, object-detection, yolo, realtime, pytorch]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Deep detectors lose useful gradient as information bottlenecks grow.
  YOLOv9 adds programmable gradient information and GELAN so teams
  train real-time YOLO models that keep accuracy without a heavier
  inference graph.

use_cases:
  - Train YOLOv9 detectors on custom COCO-style datasets
  - Benchmark GELAN variants against YOLOv7 and YOLOX
  - Run real-time object detection on GPU video
  - Fine-tune YOLOv9 for industrial inspection cameras
