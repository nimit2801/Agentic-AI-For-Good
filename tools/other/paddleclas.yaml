name: PaddleClas
description: PaddleClas is Baidu's visual classification and recognition toolkit on PaddlePaddle. It ships pretrained backbones, retrieval, distillation, and lightweight PULC models so teams train image classifiers and product recognition systems from one zoo.
tagline: Visual classification and recognition toolkit on PaddlePaddle

github_url: https://github.com/PaddlePaddle/PaddleClas
docs_url: https://github.com/PaddlePaddle/PaddleClas
install_command: pip install paddleclas

category: Other
tags: [python, computer-vision, classification, recognition, paddlepaddle, retrieval]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Image classification, retrieval, and product recognition often
  need separate training stacks. PaddleClas unifies backbones,
  distillation, and lightweight PULC models on PaddlePaddle so
  teams train and deploy visual recognition without extra repos.

use_cases:
  - Train ResNet, ViT, or Swin classifiers on custom image datasets
  - Build product recognition and image retrieval pipelines
  - Distill large backbones into lightweight PULC classifiers
  - Deploy attribute recognition models for people or vehicles
