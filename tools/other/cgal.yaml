name: CGAL
description: Computational Geometry Algorithms Library. CGAL is a header-only C++ collection of reliable geometric algorithms for meshes, triangulations, convex hulls, and arrangements used in CAD, GIS, robotics, and scientific computing.
tagline: Header-only C++ computational geometry algorithms

github_url: https://github.com/CGAL/cgal
website_url: https://www.cgal.org/
docs_url: https://doc.cgal.org/
install_command: pip install cgal

category: Other
tags: [cpp, python, geometry, mesh, cad, gis, robotics]
pricing: free
is_open_source: true
license: GPL-3.0 / LGPL-3.0

problem_solved: |
  Geometric kernels in CAD, GIS, and robotics need robust predicates
  and exact constructions, not ad-hoc mesh code. CGAL ships
  triangulations, convex hulls, arrangements, and mesh processing as
  a header-only C++ library with Python bindings.

use_cases:
  - Compute 2D and 3D triangulations, convex hulls, and Voronoi diagrams
  - Process surface meshes for CAD, 3D printing, or robotics collision
  - Build GIS arrangements and boolean operations on polygons
  - Prototype computational geometry algorithms with Python CGAL bindings
