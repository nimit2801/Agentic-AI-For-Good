name: SOFA
description: Real-time multi-physics simulation framework with an emphasis on medical simulation. Teams couple deformable solids, rigid bodies, and haptic devices for surgical training, biomechanics, and robotics research.
tagline: Real-time multi-physics simulation for medical and robotics

github_url: https://github.com/sofa-framework/sofa
website_url: https://www.sofa-framework.org
docs_url: https://www.sofa-framework.org/community/doc/

category: Other
tags: [c++, simulation, medical, biomechanics, robotics, multi-physics, open-source]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Soft-tissue and haptic simulation usually means a one-off FEM code. SOFA is an LGPL multi-physics engine so medical and robotics teams can couple deformable solids, rigid bodies, and devices in real time without a commercial surgical sim.

use_cases:
  - Simulate deformable organs for surgical training and planning
  - Couple rigid robots with soft-tissue contact in research scenes
  - Prototype haptic rendering with real-time FEM
  - Run multi-physics medical digital twins with plugins
