name: SegFormer
description: |-
  Simple and efficient semantic segmentation method with transformers. Official PyTorch implementation with pretrained models for ADE20K, Cityscapes and COCO-Stuff.
problem_solved: |-
  Developers need an efficient transformer-based approach for semantic segmentation that achieves strong results across multiple datasets.
use_cases:
  - "Autonomous driving scene segmentation"
  - "Medical image segmentation"
  - "Satellite imagery analysis"
  - "Real-time semantic segmentation"
github_url: https://github.com/NVlabs/SegFormer
website_url: https://github.com/NVlabs/SegFormer
docs_url: https://arxiv.org/abs/2105.15203
category: Other
is_open_source: true
pricing: free
