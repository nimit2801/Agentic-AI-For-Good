name: Sonic Pi
description: Sonic Pi is a live-coding music environment that turns Ruby-like code into synthesis, samples, and FX. Educators and musicians perform and teach algorithmic music from a built-in IDE with a synth engine.
tagline: Live-code music with a synth engine and teaching IDE

github_url: https://github.com/sonic-pi-net/sonic-pi
website_url: https://sonic-pi.net
docs_url: https://sonic-pi.net/tutorial.html

install_command: brew install --cask sonic-pi

category: Other
tags: [sonic-pi, live-coding, music, synthesis, education, ruby, audio]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Teaching and performing algorithmic music usually means a DAW plus a
  separate language runtime. Sonic Pi puts a Ruby-like live-coding IDE,
  synth engine, samples, and FX in one app so classrooms and performers
  can hear code changes immediately without a production audio stack.

use_cases:
  - Live-code a synth performance with loops, samples, and FX
  - Teach programming through music in a classroom IDE
  - Prototype algorithmic composition before moving to SuperCollider
  - Drive Sonic Pi from an external script for generative music demos
