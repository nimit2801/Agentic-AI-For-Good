name: Surge
description: Surge XT is an open-source hybrid synthesizer plugin. Producers play wavetable, FM, and analog-style patches as VST3, AU, CLAP, or standalone without a commercial synth license.
tagline: Open-source hybrid synthesizer plugin

github_url: https://github.com/surge-synthesizer/surge
website_url: https://surge-synthesizer.github.io/
docs_url: https://surge-synthesizer.github.io/manual-xt/

install_command: brew install --cask surge-xt

category: Other
tags: [surge, synthesizer, vst, clap, wavetable, fm, audio]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Hybrid synthesis usually means a paid plugin. Surge XT is an open
  wavetable, FM, and analog-style synth so producers and researchers
  play patches as VST3, AU, CLAP, or standalone without a commercial
  instrument license.

use_cases:
  - Play wavetable and FM patches in a DAW as VST3, AU, or CLAP
  - Design custom wavetables for a track or sound-design session
  - Run Surge XT standalone for sketching without a host
  - Study open synth DSP instead of a closed commercial instrument
