name: AFFiNE
description: Open-source knowledge base that combines docs, whiteboards, and databases. A privacy-first workspace for planning and writing that can be self-hosted instead of Notion or Miro.
tagline: Open-source docs, whiteboard, and database workspace

github_url: https://github.com/toeverything/AFFiNE
website_url: https://affine.pro
docs_url: https://docs.affine.pro

category: Other
tags: [notes, whiteboard, knowledge-base, self-hosted, collaboration, typescript]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  Teams split writing across Notion and whiteboards across Miro, both
  cloud-locked. AFFiNE puts docs, canvases, and databases in one
  open-source workspace you can self-host so planning and writing stay
  together.

use_cases:
  - Write specs on a canvas that mixes documents and whiteboard blocks
  - Self-host a team knowledge base as a Notion and Miro replacement
  - Plan research roadmaps with linked docs and visual boards
  - Keep local-first notes with optional cloud sync
