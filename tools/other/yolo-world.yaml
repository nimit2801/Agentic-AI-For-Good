name: YOLO World
description: YOLO-World is a real-time open-vocabulary object detector that recognizes any object category from text prompts without retraining, bridging the gap between fast YOLO inference and flexible zero-shot detection.
tagline: Real-time open-vocabulary object detection with text prompts

github_url: https://github.com/AILab-CVC/YOLO-World
website_url: https://www.yoloworld.cc
docs_url: https://github.com/AILab-CVC/YOLO-World#readme
install_command: pip install git+https://github.com/AILab-CVC/YOLO-World.git

category: Other
tags: [object-detection, computer-vision, yolo, open-vocabulary, zero-shot, real-time, pytorch]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Traditional object detectors like YOLO are limited to fixed category lists learned during training, requiring model retraining to detect new objects. YOLO-World combines YOLO's real-time speed with open-vocabulary recognition, allowing users to detect any object by describing it in natural language without collecting labeled data or fine-tuning the model.

use_cases:
  - Detect arbitrary objects in warehouse or retail environments using text prompts
  - Build surveillance systems that recognize custom categories without model retraining
  - Create robotics perception stacks that adapt to new objects on the fly
  - Power interactive image search tools that locate objects from natural language queries
