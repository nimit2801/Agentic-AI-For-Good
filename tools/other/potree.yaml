name: Potree
description: Potree is a WebGL point cloud viewer for massive datasets. It streams octree-organized LiDAR in the browser so mapping teams share billions of points without a desktop GIS install.
tagline: WebGL viewer for massive LiDAR and photogrammetry point clouds

github_url: https://github.com/potree/potree
website_url: http://potree.org
docs_url: https://github.com/potree/potree

category: Other
tags: [javascript, webgl, point-cloud, lidar, visualization, mapping, 3d, browser]
pricing: free
is_open_source: true
license: BSD-2-Clause

problem_solved: |
  Sharing billion-point LiDAR usually means a desktop GIS install.
  Potree is a WebGL octree viewer that streams massive clouds in the
  browser so mapping teams publish scans without shipping desktop software.

use_cases:
  - Publish a UAV or terrestrial LiDAR survey as a browser viewer
  - Stream octree point clouds for clients who cannot install GIS tools
  - Measure distances and profiles on a web-hosted scan
  - Embed Potree in a mapping portal next to 2D maps
