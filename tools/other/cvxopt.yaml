name: CVXOPT
description: Python package for convex optimization with custom solvers for LPs, QPs, SOCPs, and SDPs. Researchers assemble cone programs from dense or sparse matrices and solve them through a NumPy-friendly interface.
tagline: Python solvers for linear, quadratic, and cone programs

github_url: https://github.com/cvxopt/cvxopt
website_url: https://cvxopt.org
docs_url: https://cvxopt.org/userguide/

install_command: pip install cvxopt

category: Other
tags: [python, convex-optimization, lp, qp, sdp, numpy, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Convex programs in Python need a library that speaks LPs, QPs, SOCPs, and SDPs without a modeling DSL. CVXOPT is a GPL solver package so researchers can assemble cone programs from NumPy matrices and solve them directly.

use_cases:
  - Solve linear and quadratic programs from NumPy matrices in Python
  - Assemble second-order cone and semidefinite programs with CVXOPT
  - Use CVXOPT as a backend for a custom convex modeling layer
  - Teach cone programming with a small, matrix-oriented Python API
