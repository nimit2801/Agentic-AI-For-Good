name: MiniZinc
description: Constraint modeling language and compiler that translates MiniZinc models into solver-specific FlatZinc. Teams model combinatorial problems once and run them on Gecode, HiGHS, Gurobi, or other backends.
tagline: Solver-independent language for constraint optimization

github_url: https://github.com/MiniZinc/libminizinc
website_url: https://www.minizinc.org
docs_url: https://docs.minizinc.org

category: Other
tags: [cpp, constraint-programming, modeling, optimization, combinatorial, open-source]
pricing: free
is_open_source: true
license: MPL-2.0

problem_solved: |
  Combinatorial optimization models are usually locked to one solver API. MiniZinc is a high-level modeling language and compiler so teams can write a model once and run it on Gecode, HiGHS, or commercial solvers via FlatZinc.

use_cases:
  - Model a scheduling or packing problem once in MiniZinc
  - Compile MiniZinc to FlatZinc for Gecode, HiGHS, or Gurobi
  - Compare constraint solvers on the same MiniZinc model
  - Teach constraint programming without tying students to one solver
