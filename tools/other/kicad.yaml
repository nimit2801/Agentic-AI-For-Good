name: KiCad
description: KiCad is a free EDA suite for schematic capture and PCB layout. It covers symbols, footprints, 3D preview, and Gerber export so hardware teams design boards without a commercial CAD license.
tagline: Open-source schematic and PCB design suite

github_url: https://github.com/KiCad/kicad-source-mirror
website_url: https://www.kicad.org
docs_url: https://docs.kicad.org
install_command: brew install --cask kicad

category: Other
tags: [kicad, pcb, eda, electronics, schematic, hardware, cad]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Board design usually means expensive CAD seats and locked file
  formats. KiCad is a full schematic-to-PCB suite with libraries,
  3D view, and Gerber export so teams design and share electronics
  without a vendor lock-in.

use_cases:
  - Draw a schematic and lay out a multilayer PCB for a prototype
  - Export Gerbers and drill files for a fab house
  - Preview a board in 3D before ordering parts
  - Share an open hardware design as KiCad project files
