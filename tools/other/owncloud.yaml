name: ownCloud
description: Self-hosted file sync and WebDAV server. Keep datasets, papers, and checkpoints on your own disk with desktop and mobile clients instead of a public Drive.
tagline: Self-hosted file sync and WebDAV

github_url: https://github.com/owncloud/core
website_url: https://owncloud.com
docs_url: https://doc.owncloud.com

category: Other
tags: [file-sync, webdav, self-hosted, php, storage, collaboration]
pricing: freemium
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Google Drive and Dropbox hold the files. A lab that syncs datasets and
  papers across laptops should keep the store. ownCloud is a self-hosted
  file server with WebDAV and desktop clients, so checkpoints and docs stay
  on your disk instead of a public cloud.

use_cases:
  - Sync lab datasets across laptops with a desktop client
  - Expose checkpoints over WebDAV to training boxes
  - Share a folder with a partner without a SaaS Drive
  - Keep research papers on a self-hosted file server
