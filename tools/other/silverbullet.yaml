name: SilverBullet
description: Self-hosted Markdown knowledge base programmable with Lua. Keep notes as files on disk with live preview, queries, and wiki links instead of a locked SaaS vault.
tagline: Programmable Markdown knowledge base

github_url: https://github.com/silverbulletmd/silverbullet
website_url: https://silverbullet.md
docs_url: https://silverbullet.md/Install

category: Other
tags: [markdown, notes, lua, self-hosted, knowledge-base, typescript]
pricing: free
is_open_source: true
license: MIT

install_command: npm install -g @silverbulletmd/silverbullet

problem_solved: |
  Obsidian and Notion lock notes into an app or a cloud vault. SilverBullet
  stores Markdown files on disk and adds live preview, wiki links, queries,
  and Lua so a personal or team knowledge base stays programmable and
  self-hosted instead of trapped in a SaaS workspace.

use_cases:
  - Self-host a Markdown wiki for a research team
  - Query tagged pages to build a living feature list
  - Script custom commands with Space Lua
  - Keep agent runbooks as files with bidirectional links
