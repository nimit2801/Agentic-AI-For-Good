name: Kdenlive
description: Free video editor based on the MLT Framework and KDE. Kdenlive provides multi-track editing and effects so teams can assemble dataset clips, demo reels, and evaluation footage on an open desktop stack.
tagline: Open-source multi-track video editor

github_url: https://github.com/KDE/kdenlive
website_url: https://kdenlive.org/
docs_url: https://docs.kdenlive.org/en/
install_command: brew install --cask kdenlive

category: Other
tags: [video, editor, desktop, kde, mlt, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Multi-track video for datasets and product demos often depends on a
  paid NLE. Kdenlive edits with MLT effects on Linux, macOS, and Windows
  so labs can proxy, cut, and export footage without a Premiere license.

use_cases:
  - Multi-track edit of video used as training or eval fixtures
  - Assemble a demo reel of agent or generative-video output
  - Apply color and effects before labeling video frames
  - Proxy high-bitrate camera files for a vision dataset pipeline
  - Export timeline sequences for research talks and model cards
