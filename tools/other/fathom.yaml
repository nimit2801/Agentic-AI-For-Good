name: Fathom
description: Privacy-focused website analytics, available as Fathom Lite (open source) or a managed cloud, that tracks traffic without cookies or personal data.
tagline: Simple privacy-first website analytics

github_url: https://github.com/usefathom/fathom
website_url: https://usefathom.com
docs_url: https://usefathom.com/docs

category: Other
tags: [analytics, privacy, web-analytics, self-hosted, golang, cookie-free]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  Product sites for AI tools still need traffic numbers, but Google Analytics is heavy,
  cookie-laden, and a poor fit for privacy-conscious teams. Fathom records visits without
  personal data or cookie banners, as a small self-hosted binary or a managed cloud, so
  teams can see page views and referrals without a tracking stack.

use_cases:
  - Track visits to an AI product or docs site without cookie consent banners
  - Self-host lightweight analytics with the open-source Fathom Lite binary
  - Share simple traffic dashboards with stakeholders without exposing visitor PII
  - Replace Google Analytics on marketing sites that must stay privacy-first
