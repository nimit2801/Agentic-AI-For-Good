name: Simbody
description: High-performance C++ multibody dynamics library for articulated biomechanical and mechanical systems. Teams simulate robots, vehicles, and human skeletons with Featherstone-style O(n) generalized-coordinate physics.
tagline: Multibody dynamics library for robots and biomechanics

github_url: https://github.com/simbody/simbody
website_url: https://simtk.org/home/simbody
docs_url: https://simtk.org/home/simbody

category: Other
tags: [c++, physics, robotics, biomechanics, multibody, simulation, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Articulated robots and skeletons need O(n) generalized-coordinate dynamics, not a Cartesian rigid-body engine. Simbody is an Apache multibody library so OpenSim, Gazebo, and research codes can model joints, constraints, and forces without a custom Featherstone solver.

use_cases:
  - Simulate articulated robots with joints, constraints, and contact
  - Model human or animal skeletons for biomechanics in OpenSim
  - Prototype vehicle or machine dynamics with a C++ API
  - Embed Simbody as the physics backend in Gazebo or a custom app
