name: PlayCanvas
description: PlayCanvas is an open-source WebGL and WebGPU 3D engine for the browser. Teams ship interactive 3D demos, synthetic-data viewers, and WebXR scenes without a native game engine or plugin.
tagline: Open-source WebGL and WebGPU 3D engine for the browser

github_url: https://github.com/playcanvas/engine
website_url: https://playcanvas.com
docs_url: https://developer.playcanvas.com
install_command: npm install playcanvas

category: Other
tags: [3d, webgl, webgpu, javascript, webxr, browser, engine]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  Showing 3D models, NeRF exports, or simulation scenes in the browser
  usually means Unity WebGL or a one-off Three.js app. PlayCanvas is a
  full WebGL and WebGPU engine with glTF, materials, and an editor so
  teams ship interactive 3D viewers and WebXR demos as ordinary web apps.

use_cases:
  - Embed an interactive 3D model viewer for generated meshes in a web app
  - Prototype WebXR scenes for spatial AI demos without a native engine
  - Visualize simulation or robotics scenes in the browser with WebGPU
  - Ship a product demo of 3D assets without Unity or Unreal export pipelines
