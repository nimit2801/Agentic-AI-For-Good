name: Open X-Embodiment
description: Open X-Embodiment is a large-scale robot learning dataset and collaboration that unifies demonstrations from many robots and labs. It powers RT-X and cross-embodiment imitation research with open data spanning manipulation tasks and embodiments.
tagline: Unified robot demonstration dataset for cross-embodiment learning

github_url: https://github.com/google-deepmind/open_x_embodiment
website_url: https://robotics-transformer-x.github.io
docs_url: https://robotics-transformer-x.github.io

category: Other
tags: [python, robotics, dataset, imitation-learning, embodiment, deepmind, tensorflow]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Robot learning is stuck on small, lab-specific demos that do not
  transfer across arms and scenes. Open X-Embodiment unifies open
  demonstration datasets into one RLDS format so researchers train
  RT-X and other cross-embodiment policies on many robots at once.

use_cases:
  - Train a cross-embodiment imitation policy on the Open X-Embodiment mix
  - Visualize episodes from contributing lab datasets in the official Colab
  - Evaluate RT-1-X checkpoints on offline robot manipulation episodes
  - Convert heterogeneous robot demos into a shared RLDS training format
