name: Witsy
description: A BYOK desktop AI assistant and universal MCP client. Witsy chats with OpenAI, Anthropic, Gemini, xAI, Ollama, and LM Studio, runs MCP servers with virtually any LLM, and adds prompt-anywhere, RAG, image and video generation, and speech.
tagline: Desktop AI assistant and universal MCP client

github_url: https://github.com/Kochava-Studios/witsy
website_url: https://github.com/Kochava-Studios/witsy

category: Other
tags: [desktop, mcp, ollama, chat, byok, macos, rag, multi-provider]
pricing: free
is_open_source: true
license: AGPL-3.0

install_command: brew install --cask witsy

problem_solved: |
  Most desktop chat apps are locked to one vendor or cannot run MCP tools
  against arbitrary models. Witsy is a bring-your-own-keys assistant that
  talks to cloud and local providers, runs MCP servers with virtually any
  LLM, and injects prompts, RAG, speech, and image generation into any app
  instead of trapping work in a single chat window.

use_cases:
  - Run MCP servers against OpenAI, Anthropic, Gemini, xAI, Ollama, or LM Studio from one desktop client
  - Prompt anywhere and run AI commands on highlighted text in other applications
  - Chat with local files via RAG while keeping API keys on your machine
  - Generate images, video, and speech from the same BYOK desktop assistant
