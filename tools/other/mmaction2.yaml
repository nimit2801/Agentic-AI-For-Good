name: MMAction2
description: MMAction2 is OpenMMLab's next-generation video understanding toolbox for action recognition, temporal action detection, and spatio-temporal action detection with a unified training framework.
tagline: OpenMMLab video understanding toolbox and benchmark

github_url: https://github.com/open-mmlab/mmaction2
website_url: https://mmaction2.readthedocs.io
docs_url: https://mmaction2.readthedocs.io/en/latest/get_started/installation.html
install_command: pip install mmaction2

category: Other
tags: [video-understanding, action-recognition, computer-vision, openmmlab, pytorch, temporal-detection]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Video understanding research is fragmented across separate codebases for action recognition, temporal detection, and spatial-temporal detection, each with different data loaders, model implementations, and evaluation protocols. MMAction2 unifies these tasks under one framework with modular configs, pretrained backbones, and consistent APIs, enabling researchers to experiment across video understanding tasks without rebuilding pipelines.

use_cases:
  - Build smart surveillance systems that detect and classify human actions in video
  - Create sports analytics tools that identify plays, fouls, and player movements
  - Develop video content moderation pipelines for detecting prohibited activities
  - Research multi-modal video understanding combining vision and audio cues
