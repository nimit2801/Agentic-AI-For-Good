name: Audiobookshelf
description: Self-hosted audiobook and podcast server with progress sync across devices. Indexes local audio libraries and streams them to web and mobile clients so spoken-word collections stay on hardware you control.
tagline: Self-hosted audiobook and podcast streaming server

github_url: https://github.com/advplyr/audiobookshelf
website_url: https://www.audiobookshelf.org
docs_url: https://www.audiobookshelf.org/docs

category: Other
tags: [audiobooks, podcasts, self-hosted, streaming, audio, nodejs]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Audiobooks and podcast archives are locked into Audible or Apple with
  weak library control. Audiobookshelf indexes local files, tracks
  progress across devices, and streams to clients so spoken-word
  collections stay on your NAS.

use_cases:
  - Stream a private audiobook library from a home or lab NAS
  - Host podcast archives with per-user progress sync
  - Serve spoken research recordings to mobile clients without a vendor app
  - Organize metadata, covers, and chapters for large audio collections
