name: Calibre
description: Open-source ebook manager that converts formats, edits metadata, and runs a content server. Used to organize research PDFs and ebooks, convert them for readers, and serve a private library.
tagline: Ebook manager, converter, and private library server

github_url: https://github.com/kovidgoyal/calibre
website_url: https://calibre-ebook.com
docs_url: https://manual.calibre-ebook.com
install_command: brew install --cask calibre

category: Other
tags: [ebooks, pdf, conversion, library, metadata, python]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Research papers and ebooks arrive in mixed formats with messy metadata.
  Calibre converts EPUB, PDF, and MOBI, edits catalogs, and can serve a
  private library so collections stay searchable on your machine.

use_cases:
  - Convert research PDFs and EPUBs for e-readers and tablets
  - Catalog papers and books with metadata, tags, and covers
  - Run the Calibre content server as a private ebook library
  - Clean and batch-edit metadata before archiving a document collection
