name: INAV
description: INAV is navigation-enabled flight controller firmware for fixed-wing, VTOL, and multirotor aircraft. It adds GPS missions, return-to-home, and autonomous navigation on FPV-class boards so pilots fly beyond line-of-sight without writing a custom nav stack.
tagline: Navigation-enabled flight firmware for planes, VTOLs, and multirotors

github_url: https://github.com/iNavFlight/inav
website_url: https://inavflight.com
docs_url: https://github.com/iNavFlight/inav/wiki

category: Other
tags: [c, robotics, drones, firmware, gps, navigation, fpv, flight-controller]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  FPV firmware is built for racing, not GPS missions. INAV is navigation
  firmware for planes, VTOLs, and quads with waypoints, RTH, and failsafe
  so long-range and autonomous flights run on hobby flight controllers.

use_cases:
  - Fly GPS waypoint missions on a fixed-wing or VTOL with an F7 controller
  - Configure return-to-home and failsafe for long-range FPV
  - Tune navigation and position hold from the INAV Configurator
  - Log blackbox and GPS traces after an autonomous test flight
