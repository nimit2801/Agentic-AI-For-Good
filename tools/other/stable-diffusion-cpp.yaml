name: stable-diffusion.cpp
description: "stable-diffusion.cpp is a pure C/C++ inference engine for diffusion models including Stable Diffusion, Flux, WAN, and Qwen Image. It runs on CPU and GPU with no Python or PyTorch dependency, using the GGML tensor library to enable efficient image and video generation on consumer hardware, mobile devices, and edge environments."
tagline: "Diffusion model inference in pure C/C++ with GGML"
github_url: https://github.com/leejet/stable-diffusion.cpp
category: Other
tags:
  - image-generation
  - inference
  - cpp
  - ggml
  - stable-diffusion
  - diffusion-models
pricing: free
is_open_source: true
license: MIT
problem_solved: "Running diffusion models like Stable Diffusion and Flux requires heavy Python ML stacks with PyTorch, CUDA, and large runtimes that are impractical on consumer or edge hardware. stable-diffusion.cpp provides pure C/C++ inference with GGML quantization, enabling image and video generation on CPUs, mobile devices, and resource-constrained environments without Python dependencies."
use_cases:
  - "Generate images from text prompts on CPU-only laptops or edge devices without GPU"
  - "Run Flux and Stable Diffusion model variants in mobile or embedded applications"
  - "Integrate diffusion model inference into C++ applications without a Python runtime dependency"
