name: PyBullet
description: PyBullet is a Python module for physics simulation and robotics based on the Bullet Physics SDK. It enables real-time collision detection, multi-physics simulation, and reinforcement learning environments for robotics research.
tagline: Python physics simulation and robotics toolkit

github_url: https://github.com/bulletphysics/bullet3
website_url: https://pybullet.org
docs_url: https://docs.google.com/document/d/10sXEhzFRSnvFcl3XxNGhnD4N2SedqwdAvK3dsihxVUA

category: Other
tags: [python, robotics, physics, simulation, reinforcement-learning, collision-detection]
pricing: free
is_open_source: true
install_command: pip install pybullet

problem_solved: |
  Robotics researchers and ML engineers need a fast, open-source physics engine to simulate robots,
  objects, and environments for training reinforcement learning agents. PyBullet provides a Python
  API for real-time physics with GPU acceleration support and tight integration with RL frameworks.

use_cases:
  - Simulating robotic arms and legged robots for reinforcement learning training
  - Building physics-based game environments with realistic collision and dynamics
  - Generating synthetic training data for computer vision and robotics models
  - Prototyping robot control algorithms in simulation before hardware deployment
