name: Csound
description: Csound is a sound and music computing system. Composers and researchers write orchestras and scores that render synthesis, processing, and algorithmic music from a text-based DSP language.
tagline: Sound and music computing system with a DSP language

github_url: https://github.com/csound/csound
website_url: https://csound.com
docs_url: https://csound.com/docs/manual/index.html

install_command: brew install csound

category: Other
tags: [csound, synthesis, dsp, music, audio, orchestra, score]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Algorithmic composition and custom DSP often need a language that
  can render audio, not just sequence MIDI. Csound is a text-based
  orchestra and score system so composers and researchers define
  instruments, process live input, and render pieces without a
  closed DAW plugin stack.

use_cases:
  - Write a Csound orchestra and score to render a synthesized piece
  - Process live audio with Csound instruments in a concert patch
  - Teach DSP and computer music with a text-based synthesis language
  - Drive Csound from Python or OSC in a generative music experiment
