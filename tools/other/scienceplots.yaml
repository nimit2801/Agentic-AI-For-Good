name: SciencePlots
description: Matplotlib styles for scientific plotting. SciencePlots ships Nature, IEEE, and Science figure styles so ML and research papers match journal formatting without a hand-tuned rcParams file.
tagline: Matplotlib styles for scientific papers

github_url: https://github.com/garrettj403/SciencePlots
website_url: https://github.com/garrettj403/SciencePlots
docs_url: https://github.com/garrettj403/SciencePlots
install_command: pip install SciencePlots

category: Other
tags: [python, matplotlib, scientific, plotting, styles, publication]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Journal figures need consistent fonts, line widths, and color
  cycles, but matplotlib defaults look informal. SciencePlots
  loads Nature, IEEE, and Science styles so papers match publisher
  formatting without a custom rcParams module.

use_cases:
  - Apply a Nature style to a matplotlib figure before submission
  - Switch a training-curve plot to an IEEE two-column style
  - Standardize fonts and colors across a paper's figure set
  - Combine a science style with a colorblind-safe colormap
