name: Gadfly
description: Grammar-of-graphics plotting library for Julia. Gadfly.jl composes statistical graphics from data, aesthetics, and geoms so analysts can build layered figures in a ggplot2-like style without leaving Julia.
tagline: Grammar-of-graphics plots for Julia

github_url: https://github.com/GiovineItalia/Gadfly.jl
website_url: http://gadflyjl.org/stable/
docs_url: http://gadflyjl.org/stable/
install_command: julia -e 'using Pkg; Pkg.add("Gadfly")'

category: Other
tags: [julia, visualization, ggplot, statistics, plotting, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Julia analysts who want layered statistical graphics often export data to R or Python ggplot. Gadfly.jl brings a grammar-of-graphics API to Julia so publication plots can be composed from data, aesthetics, and geoms in the same language as the analysis.

use_cases:
  - Compose layered statistical graphics in Julia notebooks
  - Map data columns to aesthetics with a ggplot2-like grammar
  - Produce publication figures from Julia data analysis scripts
  - Explore distributions and relationships without leaving Julia
