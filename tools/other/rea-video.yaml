name: Rea Video
description: Open-source tool that reverse-engineers any video shot by shot, whether filmed, AI-generated, or coded, and writes a remake plan in the VIDEO.md format. Built so agents can break down a reference clip and explain how to recreate it.
tagline: Shot-by-shot video reverse engineering for remakes

github_url: https://github.com/JuneYaooo/rea-video
website_url: https://www.reavideo.ai/
docs_url: https://www.reavideo.ai/

category: Other
tags: [video, agents, reverse-engineering, generative-video, ffmpeg, creative]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Recreating a reference video means guessing which shots were filmed, generated,
  or coded. Rea Video analyzes a clip shot by shot, labels production method, and
  writes a VIDEO.md breakdown agents can follow to remake the piece instead of
  starting from a blank timeline.

use_cases:
  - Break down a product film into shots and production methods for a remake brief
  - Feed VIDEO.md to a coding agent that recreates motion-graphics shots
  - Audit an AI-generated clip to see which cuts were filmed versus synthesized
  - Standardize video reverse-engineering notes in the open VIDEO.md format
