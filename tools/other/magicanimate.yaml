name: MagicAnimate
description: Diffusion-based human image animation system that generates temporally consistent character videos from a reference image and a motion sequence, including densepose-driven animation.
tagline: Temporally consistent human image animation with diffusion

github_url: https://github.com/magic-research/magic-animate
website_url: https://showlab.github.io/magicanimate/

category: Other
tags: [video-generation, image-to-video, human-animation, diffusion, pose, generative-ai]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Animating a still photo of a person usually flickers, loses identity, or needs
  per-subject training. MagicAnimate uses a diffusion model with appearance
  encoding and temporal attention so a single reference image follows a pose or
  motion sequence while staying temporally consistent.

use_cases:
  - Animate a character photo using a DensePose or video motion sequence
  - Produce identity-preserving human videos from a single reference image
  - Prototype fashion, avatar, or digital-human clips without a 3D rig
  - Research temporally consistent image-to-video human animation
