name: yt-dlp
description: Feature-rich command-line audio and video downloader, a community-maintained fork of youtube-dl. yt-dlp pulls media from hundreds of sites with format selection, metadata, and post-processing via ffmpeg.
tagline: Feature-rich command-line audio and video downloader

github_url: https://github.com/yt-dlp/yt-dlp
website_url: https://github.com/yt-dlp/yt-dlp
docs_url: https://github.com/yt-dlp/yt-dlp#readme

install_command: brew install yt-dlp

category: Other
tags: [video, audio, downloader, cli, ffmpeg, media]
pricing: free
is_open_source: true
license: Unlicense

problem_solved: |
  Collecting public video or audio for datasets, transcripts, or offline review
  means fighting site-specific players. yt-dlp downloads from hundreds of
  platforms with format control and post-processing so you get files, not
  browser tabs, for media pipelines.

use_cases:
  - Download public talks and tutorials for transcription or offline study
  - Build audio and video datasets with chosen formats and metadata
  - Extract audio from web video for speech and music ML pipelines
  - Archive conference recordings with subtitles and thumbnails
