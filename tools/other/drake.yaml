name: Drake
description: Drake is MIT's toolbox for model-based design and verification of robots. It provides rigid-body dynamics, planning, and Python bindings so robotics and embodied-AI teams can simulate, control, and verify manipulators before hardware.
tagline: Model-based design and verification for robotics

github_url: https://github.com/RobotLocomotion/drake
website_url: https://drake.mit.edu
docs_url: https://drake.mit.edu/documentation_resources.html

category: Other
tags: [robotics, simulation, dynamics, planning, python, cpp, mit]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Embodied AI and robot learning need accurate dynamics, collision, and
  control before touching hardware. Drake is a model-based robotics toolbox
  with multibody simulation, trajectory optimization, and pydrake bindings
  so teams can design, verify, and train policies in a physically consistent
  plant instead of a game-engine approximation.

use_cases:
  - Simulate manipulator dynamics before deploying a learned grasping policy
  - Plan collision-free trajectories for robot arms in a verified plant model
  - Train and evaluate control policies against Drake's multibody simulator
  - Verify robot controllers with model-based tools instead of trial-and-error on hardware
