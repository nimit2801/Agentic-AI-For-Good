name: KerasNLP
description: "KerasNLP is a library of modular natural language processing models and components for Keras, providing pre-trained transformer backbones, tokenizers, and task-specific heads for text classification, sequence labeling, question answering, and text generation. It integrates with the Keras ecosystem for end-to-end training and deployment."
tagline: "Modular NLP models and components for the Keras ecosystem"
github_url: https://github.com/keras-team/keras-nlp
docs_url: https://keras.io/api/keras_nlp/
install_command: pip install keras-nlp
category: Other
tags:
  - nlp
  - keras
  - transformers
  - deep-learning
  - text-processing
  - pre-trained-models
pricing: free
is_open_source: true
license: Apache-2.0
problem_solved: "Building NLP applications requires loading pre-trained models, applying the correct tokenizer, and assembling task-specific heads — a process that involves fragile boilerplate code for each model architecture. KerasNLP provides a unified, modular API with pre-built backbones, tokenizers, and task heads that work together seamlessly across BERT, Gemma, Llama, and other architectures."
use_cases:
  - "Fine-tune pre-trained transformer models for text classification, NER, and question answering using Keras workflows"
  - "Build multilingual NLP pipelines with consistent tokenization and preprocessing across model families"
  - "Rapidly prototype NLP applications with plug-and-play backbones and task-specific output heads"
