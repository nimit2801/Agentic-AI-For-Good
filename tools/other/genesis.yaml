name: Genesis
description: Universal physics platform for robotics and embodied AI. Genesis couples rigid, soft, cloth, and fluid solvers with a Python API so teams train locomotion and manipulation policies in a generative, GPU-accelerated world.
tagline: Generative physics engine for robotics and embodied AI

github_url: https://github.com/Genesis-Embodied-AI/genesis-world
website_url: https://genesis-world.readthedocs.io
docs_url: https://genesis-world.readthedocs.io
install_command: pip install genesis-world

category: Other
tags: [python, physics, robotics, simulation, embodied-ai, gpu, reinforcement-learning]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Robot learning needs more than rigid-body MuJoCo. Genesis couples
  rigid, soft, cloth, and fluid solvers in one GPU-accelerated Python
  engine so embodied agents train against contact, deformation, and
  liquids without stitching several simulators together.

use_cases:
  - Train locomotion or manipulation policies in a multi-solver physics world
  - Simulate soft robots, cloth, or fluids alongside rigid bodies
  - Generate diverse scenes for embodied AI data collection
  - Prototype robot morphologies before hardware trials
