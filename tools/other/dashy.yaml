name: Dashy
description: Self-hostable personal dashboard with status checks, widgets, themes, and a UI editor. Build a homelab front door without writing YAML by hand.
tagline: Self-hosted dashboard with a visual editor

github_url: https://github.com/lissy93/dashy
website_url: https://dashy.to
docs_url: https://dashy.to/docs

category: Other
tags: [dashboard, self-hosted, vue, widgets, startpage, homelab]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Bookmark bars and static HTML startpages go stale as services come and go.
  Dashy is a self-hosted dashboard with live status checks, widgets, icon
  packs, and a UI editor, so a lab landing page stays current without a
  YAML-only workflow.

use_cases:
  - Host a visual startpage for a home lab
  - Watch service health next to app shortcuts
  - Theme a team dashboard without writing CSS
  - Edit sections in the browser instead of redeploying config
