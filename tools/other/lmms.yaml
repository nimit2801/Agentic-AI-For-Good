name: LMMS
description: LMMS is cross-platform music production software. It sequences beats, synths, and samples so producers make tracks without a commercial DAW license.
tagline: Cross-platform open-source music production software

github_url: https://github.com/LMMS/lmms
website_url: https://lmms.io/
docs_url: https://docs.lmms.io/

category: Other
tags: [lmms, daw, music, production, synth, sequencer, open-source]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Making electronic tracks usually means a paid DAW. LMMS is a free
  sequencer with synths, samples, and effects so producers compose
  beats and songs on Linux, macOS, and Windows without a commercial
  license.

use_cases:
  - Sequence beats and synths in an open-source DAW
  - Produce a demo track without a paid DAW license
  - Export stems or MIDI from an LMMS project
  - Teach music production on Linux with a free workstation
