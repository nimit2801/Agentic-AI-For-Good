name: Draco
description: Draco is Google's library for compressing and decompressing 3D meshes and point clouds. Apps shrink glTF and lidar assets so web and mobile viewers download geometry faster without a custom codec.
tagline: Compress 3D meshes and point clouds

github_url: https://github.com/google/draco
website_url: https://google.github.io/draco/
docs_url: https://google.github.io/draco/

install_command: brew install draco

category: Other
tags: [draco, 3d, mesh, compression, gltf, google, point-cloud]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  3D meshes and point clouds are large on the wire. Draco
  compresses geometry so glTF, maps, and scanners ship fewer
  bytes without a one-off encoder.

use_cases:
  - Compress glTF meshes for a web 3D viewer
  - Decode Draco point clouds from a lidar capture
  - Shrink mobile 3D assets in a game or AR pipeline
  - Link Draco as the geometry codec in a glTF exporter
