  - open-source
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  As AI systems are deployed in high-stakes domains like healthcare, finance, and criminal
  justice, regulators and users increasingly demand transparency into how models make decisions.
  Black-box models provide accurate predictions but no insight into their reasoning, creating
  trust and compliance challenges. AIX360 addresses this by providing a unified toolkit of
  state-of-the-art explainability algorithms that generate human-understandable explanations
  for diverse model types and data modalities, enabling teams to build trustworthy AI systems.

use_cases:
  - Generate local explanations for individual predictions in credit scoring and lending
  - Explain image classification decisions with saliency maps and concept-based attribution
  - Build interpretable rule-based models that are inherently explainable for regulated industries
  - Compare and benchmark multiple explainability methods on the same model and dataset
  - Create transparency reports for AI systems to meet regulatory and compliance requirements