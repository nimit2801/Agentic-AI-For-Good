name: AIX360
description: Interpretability and explainability of data and machine learning models from IBM Research. AIX360 provides a comprehensive suite of algorithms for explaining AI decisions across tabular, text, and image data.
tagline: AI explainability and interpretability toolkit

github_url: https://github.com/Trusted-AI/AIX360
website_url: https://aix360.res.ibm.com/
docs_url: https://aix360.res.ibm.com/

install_command: pip install aix360

category: Other
tags:
  - explainability
