name: Ardour
description: Ardour is a professional digital audio workstation for recording, editing, mixing, and mastering. Engineers run multi-track sessions on Linux, macOS, and Windows without a commercial DAW license.
tagline: Open-source professional digital audio workstation

github_url: https://github.com/Ardour/ardour
website_url: https://ardour.org
docs_url: https://manual.ardour.org/

category: Other
tags: [ardour, daw, audio, mixing, recording, mastering, open-source]
pricing: freemium
is_open_source: true
license: GPL-2.0

problem_solved: |
  Professional recording and mixing usually means a paid DAW. Ardour
  is an open workstation for multi-track capture, editing, mixing,
  and mastering so studios and researchers run sessions on Linux,
  macOS, and Windows without a commercial license.

use_cases:
  - Record multi-track sessions with professional I/O routing
  - Mix and master a project with plugins and automation
  - Run a Linux-based studio without a commercial DAW
  - Export stems from a session into an ML audio pipeline
