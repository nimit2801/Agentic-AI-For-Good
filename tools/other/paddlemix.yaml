name: PaddleMIX
description: PaddleMIX is Baidu's multimodal toolkit on PaddlePaddle. It covers vision-language pretraining, image and video generation, and multimodal understanding with models such as Qwen-VL, LLaVA, and Stable Diffusion.
tagline: Multimodal understanding and generation toolkit on PaddlePaddle

github_url: https://github.com/PaddlePaddle/PaddleMIX
docs_url: https://github.com/PaddlePaddle/PaddleMIX/blob/develop/README.md

category: Other
tags: [python, multimodal, paddlepaddle, diffusion, vision-language, llava, qwen-vl]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Multimodal training usually means separate stacks for VLMs, diffusion,
  and video generation. PaddleMIX puts Qwen-VL, LLaVA, Stable Diffusion,
  and related models on PaddlePaddle with shared data tools so teams
  pretrain, fine-tune, and generate from one multimodal suite.

use_cases:
  - Fine-tune Qwen-VL or LLaVA for image captioning and visual QA
  - Generate images or video with PPDiffusers and Stable Diffusion
  - Run document understanding with PP-DocBee on scanned pages
  - Prepare multimodal datasets with DataCopilot before training
