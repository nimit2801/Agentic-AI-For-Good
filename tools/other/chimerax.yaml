name: ChimeraX
description: UCSF ChimeraX is an interactive application for visualizing and analyzing molecular structures, sequences, and 3D imaging data. It succeeds UCSF Chimera and is used to inspect proteins, nucleic acids, EM maps, and medical volumes with a Python plugin API.
tagline: Interactive molecular visualization and analysis

github_url: https://github.com/RBVI/ChimeraX
website_url: https://www.rbvi.ucsf.edu/chimerax/
docs_url: https://www.rbvi.ucsf.edu/chimerax/docs/user/index.html

category: Other
tags: [python, molecular-visualization, structural-biology, cryo-em, proteins, imaging]
pricing: freemium
is_open_source: true
license: Custom (non-commercial)

problem_solved: |
  Structural biology and medical imaging produce dense 3D data that is hard
  to inspect in a generic 3D viewer. ChimeraX combines atomic models, density
  maps, sequences, and light or medical volumes in one interactive session,
  with a Python API and plugin toolshed so labs can analyze and present
  structures without stitching several viewers together.

use_cases:
  - Visualize protein, RNA, and DNA models alongside cryo-EM or X-ray maps
  - Analyze molecular interfaces, hydrogen bonds, and sequence-structure mapping
  - Build ChimeraX bundles that add commands, file formats, or GUI tools
  - Inspect 3D light microscopy or medical imaging volumes next to atomic models
