name: Jitsi
description: Jitsi Meet is an open-source video conferencing stack you can self-host or embed. Teams use it for standups, pair debugging, and live demos without a Zoom license, including iframe embeds in internal tools.
tagline: Self-hosted and embeddable open-source video conferencing

github_url: https://github.com/jitsi/jitsi-meet
website_url: https://jitsi.org/meet
docs_url: https://jitsi.github.io/handbook/

category: Other
tags: [video, conferencing, webrtc, self-hosted, collaboration, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  ML and product teams need video rooms for pairing, office hours, and live
  demos without paying per-host Zoom seats or leaking calls to a SaaS vendor.
  Jitsi Meet is a WebRTC conferencing stack you can self-host or embed via
  iframe so internal tools get meetings under your domain and policies.

use_cases:
  - Self-host team standups and pairing rooms for ML and platform engineering
  - Embed a Jitsi iframe in an internal dashboard for live support or demos
  - Run office hours and community calls without a commercial meeting vendor
  - Add browser-based video to an agent ops console for human-in-the-loop review
