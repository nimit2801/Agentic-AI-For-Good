name: Sonic Visualiser
description: Sonic Visualiser is a desktop app for inspecting music audio. Researchers load recordings, view spectrograms and annotations, and layer Vamp plugins so MIR analysis stays visual instead of a black-box CLI dump.
tagline: Visualise, analyse, and annotate music audio recordings

github_url: https://github.com/sonic-visualiser/sonic-visualiser
website_url: https://www.sonicvisualiser.org/
docs_url: https://www.sonicvisualiser.org/doc/

install_command: brew install --cask sonic-visualiser

category: Other
tags: [sonic-visualiser, audio, spectrogram, mir, annotation, music, vamp]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Music research needs to see spectrograms, pitch tracks, and labels on
  the same timeline as the waveform. Closed DAWs hide that analysis.
  Sonic Visualiser is an open desktop tool so teams inspect recordings
  and Vamp plugins without a proprietary editor.

use_cases:
  - Inspect spectrograms and pitch tracks on a music recording
  - Annotate onsets, chords, or lyrics for an MIR dataset
  - Run Vamp plugins and overlay their features on the waveform
  - Compare variant recordings of the same musical work visually
