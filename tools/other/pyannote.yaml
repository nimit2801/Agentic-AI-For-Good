name: PyAnnote
description: |
  PyAnnote Audio is an open-source toolkit written in Python for speaker diarization — identifying who speaks when in audio recordings. Built on PyTorch, it comes with state-of-the-art pretrained models and pipelines that can be further fine-tuned for custom data. Supports multi-GPU training with PyTorch Lightning and seamless integration with the Hugging Face model hub.
problem_solved: |
  Speaker diarization — determining which speaker said what in a multi-person conversation — traditionally requires complex audio processing pipelines and specialized machine learning expertise. PyAnnote solves this with a Python-first toolkit offering state-of-the-art pretrained pipelines that handle speaker segmentation, embedding extraction, and clustering in a few lines of code.
use_cases:
  - "Identify speakers in meeting recordings and conference calls for transcription"
  - "Analyze conversation dynamics in podcasts and interview recordings"
  - "Process multi-speaker audio data for speech recognition and voice analytics"
category: Other
github_url: https://github.com/pyannote/pyannote-audio
website_url: https://pyannote.ai
is_open_source: true
install_command: pip install pyannote-audio
