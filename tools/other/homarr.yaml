name: Homarr
description: Modern self-hosted dashboard with 40-plus integrations, built-in icons, and drag-and-drop setup. Auth is included so a lab startpage does not need a separate SSO layer.
tagline: Drag-and-drop homelab dashboard

github_url: https://github.com/homarr-labs/homarr
website_url: https://homarr.dev
docs_url: https://homarr.dev/docs/getting-started

category: Other
tags: [dashboard, self-hosted, typescript, integrations, homelab]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  YAML startpages punish anyone who just wants tiles. Homarr is a modern
  dashboard with drag-and-drop layout, 40-plus integrations, and auth out of
  the box, so a lab can pin Grafana, Immich, and notebooks without editing
  config files.

use_cases:
  - Build a drag-and-drop startpage for lab services
  - Integrate Grafana and Docker widgets without YAML
  - Put auth in front of an internal tool index
  - Share a branded dashboard with a small team
