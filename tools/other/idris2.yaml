name: Idris2
description: Purely functional language with first-class types. Researchers write programs and proofs in the same language, quantify over types at runtime, and compile to Chez Scheme, JavaScript, or other backends.
tagline: Dependently typed language with first-class types

github_url: https://github.com/idris-lang/Idris2
website_url: https://idris-lang.org/
docs_url: https://idris-lang.org/idris2docs/current/
install_command: brew install idris2

category: Other
tags: [idris, dependent-types, functional-programming, theorem-proving, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Dependent types in a research language often stay stuck in a type checker that cannot run type-level programs. Idris2 treats types as first-class values so researchers can write programs and proofs together and compile them to Chez Scheme or JavaScript.

use_cases:
  - Write dependently typed programs that run as ordinary executables
  - Teach first-class types and interactive theorem proving
  - Prototype verified algorithms and compile them to Chez Scheme
  - Quantify over types at runtime in a purely functional language
