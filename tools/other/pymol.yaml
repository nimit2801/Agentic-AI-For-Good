name: PyMOL
description: Python-enhanced molecular graphics program for viewing, measuring, and rendering 3D biomolecular structures. The open-source build is the standard desktop viewer for inspecting PDB files, docking poses, and ML-predicted folds.
tagline: Python-powered molecular visualization

github_url: https://github.com/schrodinger/pymol-open-source
website_url: https://pymol.org
docs_url: https://pymol.org/dokuwiki
install_command: pip install --pre pymol-open-source

category: Other
tags: [python, molecular-visualization, structural-biology, pdb, graphics, open-source]
pricing: free
is_open_source: true

problem_solved: |
  Structure models are useless if you cannot inspect them. PyMOL gives
  chemists and ML teams a scriptable 3D viewer so predicted folds, ligands,
  and electron density can be rendered, measured, and exported without a
  closed commercial graphics seat.

use_cases:
  - Inspect AlphaFold or Boltz predictions as cartoon and surface views
  - Script publication figures from PDB files in a Python session
  - Measure distances and interfaces on docking poses
  - Overlay experimental density with predicted coordinates
