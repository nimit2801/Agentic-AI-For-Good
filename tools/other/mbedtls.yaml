name: mbedtls
description: Portable TLS and crypto library from Trusted Firmware. Apps add TLS 1.3, X.509, and PSA crypto on embedded and IoT devices without OpenSSL, with a readable C codebase used in Mbed OS and many MCUs.
tagline: Portable TLS and PSA crypto library for embedded devices

github_url: https://github.com/Mbed-TLS/mbedtls
website_url: https://www.trustedfirmware.org/projects/mbed-tls/
docs_url: https://mbed-tls.readthedocs.io/

install_command: brew install mbedtls

category: Other
tags: [tls, crypto, embedded, iot, psa, c]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  OpenSSL is too large for MCUs and many IoT stacks. mbedtls is a
  readable, portable TLS and crypto library so firmware can speak TLS
  1.3, verify X.509, and use PSA crypto without a desktop-sized stack.

use_cases:
  - Terminate TLS 1.3 on an embedded or IoT device
  - Verify X.509 certificates in firmware
  - Call PSA crypto APIs from an MCU application
  - Link a small TLS stack into a C networking client
