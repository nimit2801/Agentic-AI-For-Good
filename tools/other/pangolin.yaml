name: Pangolin
description: Lightweight portable libraries for prototyping 3D, numeric, and video programs. Pangolin abstracts windowing, OpenGL views, and camera input so computer-vision and robotics researchers can visualize geometry without platform boilerplate.
tagline: Portable 3D and video visualization for computer vision

github_url: https://github.com/stevenlovegrove/Pangolin

category: Other
tags: [c++, computer-vision, opengl, robotics, visualization, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  CV and SLAM prototypes drown in windowing, camera, and OpenGL glue before any algorithm runs. Pangolin gives cross-platform views, 3D navigation, video IO, and a live Python console, so researchers can inspect poses and frames instead of writing display boilerplate.

use_cases:
  - Visualize SLAM poses and point clouds while debugging a tracker
  - Display live machine-vision camera streams across Linux, macOS, and Windows
  - Tweak algorithm parameters from a drop-down console during a run
  - Prototype 3D interaction handlers without writing OpenGL window code
