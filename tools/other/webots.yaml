name: Webots
description: Open-source robot simulator from Cyberbotics. Webots models, programs, and simulates robots, vehicles, and mechanical systems with a beginner-friendly GUI, controllers in Python, C, C++, Java, MATLAB, and ROS, plus a large robot library.
tagline: Beginner-friendly open-source robot simulator

github_url: https://github.com/cyberbotics/webots
website_url: https://cyberbotics.com
docs_url: https://cyberbotics.com/doc/guide/index

category: Other
tags: [cpp, python, robotics, simulation, ros, education]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  New robotics teams need a full sim with robots, sensors, and
  controllers without assembling Gazebo from packages. Webots ships
  a GUI, vehicle and robot library, and Python, C++, Java, MATLAB,
  and ROS controllers so you model and test before hardware.

use_cases:
  - Teach robot programming with Python or C++ controllers in a GUI sim
  - Simulate vehicles, drones, and mobile robots with onboard sensors
  - Prototype ROS robot software against Webots worlds
  - Share reproducible robot experiments on webots.cloud
