name: Chaospy
description: Python toolbox for uncertainty quantification with polynomial chaos expansions. Teams sample distributions, build orthogonal polynomials, and propagate uncertainty through models without writing quadrature code by hand.
tagline: Polynomial chaos toolbox for uncertainty quantification

github_url: https://github.com/jonathf/chaospy
website_url: https://chaospy.readthedocs.io/
docs_url: https://chaospy.readthedocs.io/en/master/

install_command: pip install chaospy

category: Other
tags: [python, uncertainty-quantification, polynomial-chaos, statistics, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Uncertainty quantification in Python often means assembling quadrature, orthogonal polynomials, and sampling by hand. Chaospy is a polynomial chaos toolbox so teams can propagate input uncertainty through models without writing that stack.

use_cases:
  - Build polynomial chaos expansions for a simulation model in Python
  - Sample joint distributions and estimate Sobol sensitivity indices
  - Propagate input uncertainty through a black-box numerical model
  - Teach uncertainty quantification with orthogonal polynomials
