name: YOLOv7
description: YOLOv7 is a real-time object detector that introduced a trainable bag-of-freebies for accuracy without extra inference cost. The official implementation trains and exports detectors for research and production computer vision.
tagline: Real-time YOLO detector with trainable bag-of-freebies

github_url: https://github.com/WongKinYiu/yolov7
docs_url: https://github.com/WongKinYiu/yolov7

category: Other
tags: [python, computer-vision, object-detection, yolo, realtime, pytorch]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Real-time detection often trades accuracy for speed at inference.
  YOLOv7 trains architectural freebies that raise COCO accuracy
  without extra latency so teams ship a single-stage detector that
  stays fast on GPU.

use_cases:
  - Train YOLOv7 detectors on custom object datasets
  - Run real-time detection on GPU cameras and video streams
  - Compare bag-of-freebies training against earlier YOLO versions
  - Export trained weights for production vision pipelines
