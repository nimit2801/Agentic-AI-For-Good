name: ChatHub
description: An all-in-one browser extension that chats with ChatGPT, Claude, Gemini, Grok, DeepSeek, and open models in one window. Compare answers side by side, keep history locally, and jump in from a keyboard shortcut anywhere in Chrome.
tagline: All-in-one chatbot extension for comparing LLMs in the browser

github_url: https://github.com/chathub-dev/chathub
website_url: https://chathub.gg

category: Other
tags: [chrome-extension, chatgpt, claude, gemini, multi-llm, comparison]
pricing: freemium
is_open_source: true
license: GPL-3.0

problem_solved: |
  Comparing ChatGPT, Claude, Gemini, and Grok means juggling tabs, logins,
  and histories. ChatHub is a Chrome extension that hosts those bots in one
  sidebar, sends a prompt to several at once, stores conversations locally,
  and opens from a shortcut on any page so you can compare answers without
  leaving the tab you were reading.

use_cases:
  - Chat with ChatGPT, Claude, Gemini, and Grok from one Chrome sidebar
  - Send the same prompt to multiple bots and compare answers side by side
  - Keep conversation history and a prompt library locally in the browser
  - Open the chatbot overlay with a shortcut from any webpage you are reading
