name: Speech-to-Speech
description: |-
  Low-latency fully modular voice-agent pipeline with VAD, STT, LLM, and TTS. Exposes OpenAI Realtime event set over WebSocket and WebRTC.
problem_solved: |-
  Developers need a fully modular, swappable voice-agent stack that can run locally or with hosted providers for building conversational AI.
use_cases:
  - "Real-time voice assistants"
  - "Customer service voice bots"
  - "Embedded robot conversation systems"
  - "Local-only voice agent deployments"
github_url: https://github.com/huggingface/speech-to-speech
website_url: https://github.com/huggingface/speech-to-speech
docs_url: https://github.com/huggingface/speech-to-speech
install_command: pip install speech-to-speech
category: Other
is_open_source: true
pricing: free
