name: MMYOLO
description: |-
  OpenMMLab YOLO series toolbox and benchmark supporting RTMDet, YOLOv5, YOLOv6, YOLOv7, YOLOv8 and YOLOv9.
problem_solved: |-
  Object detection practitioners need a unified benchmark for comparing and deploying YOLO-family models with consistent evaluation.
use_cases:
  - "Real-time object detection"
  - "Industrial inspection systems"
  - "Security and surveillance"
  - "Autonomous vehicle perception"
github_url: https://github.com/open-mmlab/mmyolo
website_url: https://mmyolo.readthedocs.io/
docs_url: https://mmyolo.readthedocs.io/en/latest/
install_command: pip install mmyolo
category: Other
is_open_source: true
pricing: free
