name: Panda3D
description: Panda3D is a mature open-source 3D engine for Python and C++, originally from Disney and CMU. Simulation and CV teams use it to render scenes, collect synthetic data, and prototype 3D agents without a commercial engine.
tagline: Python and C++ 3D engine for simulation and synthetic data

github_url: https://github.com/panda3d/panda3d
website_url: https://www.panda3d.org
docs_url: https://docs.panda3d.org
install_command: pip install panda3d

category: Other
tags: [3d, python, simulation, rendering, game-engine, synthetic-data]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Collecting 3D training data and prototyping embodied agents usually means a
  commercial engine or a research renderer with a steep API. Panda3D is a
  Python-first 3D engine with scene graphs, shaders, and physics so teams can
  render synthetic scenes and drive agents without Unity or Unreal licenses.

use_cases:
  - Render synthetic 3D scenes for computer-vision training data in Python
  - Prototype embodied agents that navigate a scene graph without a game studio engine
  - Visualize robotics or graphics experiments with a scriptable camera and lights
  - Teach 3D simulation workflows in Python instead of a closed commercial editor
