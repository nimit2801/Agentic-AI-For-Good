name: SiYuan
description: A privacy-first, self-hosted knowledge workspace for humans and AI agents. Block-based notes, bidirectional links, and local storage so research, prompts, and agent context stay on your machine.
tagline: Self-hosted knowledge workspace for humans and agents

github_url: https://github.com/siyuan-note/siyuan
website_url: https://b3log.org/siyuan
docs_url: https://docs.b3log.org/siyuan

category: Other
tags: [knowledge-base, notes, markdown, self-hosted, agents, privacy]
pricing: free
is_open_source: true
license: AGPL-3.0
install_command: docker pull b3log/siyuan

problem_solved: |
  Agent and research notes often live in SaaS wikis that leak prompts, sources, and unpublished work. SiYuan is a self-hosted, privacy-first workspace with block-level notes and bidirectional links so humans and agents can share a local knowledge graph without sending the corpus to a vendor.

use_cases:
  - Keep agent prompts, research notes, and sources in a self-hosted workspace
  - Link blocks across a local knowledge graph for RAG-style personal retrieval
  - Run a privacy-first notes server for a team that cannot use cloud wikis
