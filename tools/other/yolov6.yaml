name: YOLOv6
description: YOLOv6 is Meituan's single-stage object detector for industrial applications. It focuses on speed and accuracy trade-offs for production CV with quantized and mobile-friendly variants so teams deploy detection on edge and server hardware.
tagline: Industrial single-stage object detector from Meituan

github_url: https://github.com/meituan/YOLOv6
docs_url: https://github.com/meituan/YOLOv6

category: Other
tags: [python, computer-vision, object-detection, yolo, edge, meituan]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Industrial detection needs a YOLO variant tuned for latency,
  not just COCO accuracy. YOLOv6 ships Meituan's production
  detector with quantized and mobile-friendly configs so teams
  deploy real-time detection without a research-only YOLO fork.

use_cases:
  - Train YOLOv6 detectors on custom industrial object datasets
  - Deploy quantized models for edge or mobile inspection cameras
  - Benchmark speed and accuracy against YOLOX or Ultralytics YOLO
  - Serve real-time detection for warehouse or retail vision
