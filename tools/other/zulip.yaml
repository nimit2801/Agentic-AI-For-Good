name: Zulip
description: Open-source team chat organized by topic streams instead of a single timeline. Self-host it so ML ops, paper discussion, and model-release threads stay searchable on infrastructure you control.
tagline: Topic-threaded team chat you can self-host

github_url: https://github.com/zulip/zulip
website_url: https://zulip.com
docs_url: https://zulip.com/help/

category: Other
tags: [chat, collaboration, self-hosted, open-source, streams, apache]
pricing: freemium
is_open_source: true
license: Apache-2.0

problem_solved: |
  Slack-style timelines bury paper discussion, GPU on-call, and model-release notes in one feed.
  Zulip organizes every conversation as a topic inside a stream, so ML teams can self-host
  searchable, threaded chat without losing context when a training incident and a paper thread
  happen in the same channel.

use_cases:
  - Run topic-threaded team chat for ML ops and research groups
  - Keep model-release and paper-review discussion searchable by topic
  - Self-host incident channels so GPU on-call stays on your network
  - Integrate GitHub and CI notifications into dedicated streams
