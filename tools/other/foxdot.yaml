name: FoxDot
description: FoxDot is a Python live-coding environment that drives SuperCollider. Musicians write patterns in Python and hear synths, samples, and time-stretched loops from a built-in IDE without wiring a full audio graph.
tagline: Live-code SuperCollider from Python patterns

github_url: https://github.com/Qirky/FoxDot
website_url: http://foxdot.org
docs_url: http://foxdot.org

install_command: pip install FoxDot

category: Other
tags: [foxdot, live-coding, python, supercollider, music, synthesis, audio]
pricing: free
is_open_source: true
license: CC-BY-SA-4.0

problem_solved: |
  Live coding music in SuperCollider means writing SynthDefs and patterns
  in a language built for DSP, not for fast sketching. FoxDot sits on
  SuperCollider as a Python pattern language and IDE so performers can
  sequence synths, samples, and stretch loops in a few lines while the
  audio engine keeps running.

use_cases:
  - Live-code a SuperCollider set from Python patterns in the FoxDot IDE
  - Sequence samples, synths, and time-stretched loops without writing SynthDefs
  - Teach algorithmic music with Python instead of a DAW or raw sclang
  - Prototype generative rhythms that FoxDot sends to SuperCollider in real time
