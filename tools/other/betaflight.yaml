name: Betaflight
description: Betaflight is open-source flight controller firmware for racing and freestyle multirotors. It delivers high-rate PID control, OSD, blackbox logging, and a configurator so FPV pilots tune boards, ESCs, and receivers without writing a custom flight stack.
tagline: Open-source flight controller firmware for FPV racing and freestyle

github_url: https://github.com/betaflight/betaflight
website_url: https://betaflight.com
docs_url: https://betaflight.com/docs

category: Other
tags: [c, robotics, drones, firmware, fpv, flight-controller, pid, racing]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  FPV racing and freestyle need a fast, tunable flight stack on small
  FC boards. Betaflight is the standard firmware with PID loops, OSD,
  blackbox, and a GUI configurator so pilots flash, tune, and fly
  without writing control code.

use_cases:
  - Flash Betaflight onto an F7 or H7 flight controller for an FPV quad
  - Tune PID, rates, and filters from the Betaflight Configurator
  - Log blackbox traces to diagnose oscillations after a hardware change
  - Configure OSD, receivers, and ESCs for a racing or freestyle build
