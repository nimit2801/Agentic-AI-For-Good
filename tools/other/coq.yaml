name: Coq
description: Interactive theorem prover, now branded Rocq, for machine-checked mathematics and software. Researchers write definitions, algorithms, and theorems in a dependently typed language and develop proofs the kernel can verify.
tagline: Proof assistant for machine-checked math and software

github_url: https://github.com/rocq-prover/rocq
website_url: https://rocq-prover.org
docs_url: https://rocq-prover.org/docs

category: Other
tags: [coq, rocq, theorem-prover, proof-assistant, formal-methods, dependent-types, open-source]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Machine-checked proofs need an interactive assistant with a small trusted kernel. Coq, now the Rocq Prover, lets researchers write definitions and tactics so theorems about algorithms and mathematics can be verified rather than only tested.

use_cases:
  - Prove correctness of algorithms with Coq tactics and the Rocq kernel
  - Formalize mathematics as machine-checked definitions and theorems
  - Extract verified OCaml or Haskell from a completed Coq development
  - Teach dependent types and interactive theorem proving in a course
