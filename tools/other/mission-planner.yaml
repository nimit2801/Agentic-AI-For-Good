name: Mission Planner
description: Mission Planner is the ArduPilot ground control station for Windows. It configures vehicles, plans waypoint missions, and streams telemetry so Copter, Plane, and Rover operators fly and tune without writing a custom GCS.
tagline: ArduPilot ground control station for mission planning

github_url: https://github.com/ArduPilot/MissionPlanner
website_url: https://ardupilot.org/planner/
docs_url: https://ardupilot.org/planner/

category: Other
tags: [csharp, ardupilot, drones, gcs, mavlink, uav, windows, telemetry]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  ArduPilot vehicles need a GCS to load firmware, set parameters, and
  draw missions. Mission Planner is the Windows station that talks
  MAVLink so Copter, Plane, and Rover operators configure, fly, and
  replay logs without a custom ground app.

use_cases:
  - Plan waypoint, survey, and geofence missions on a map before flight
  - Flash ArduPilot firmware and tune vehicle parameters over USB or radio
  - Monitor live telemetry, HUD, and failsafe state during a flight
  - Replay dataflash logs to debug crashes and tune PID gains
