name: Mattermost
description: Open-source collaboration platform for secure team chat, playbooks, and DevOps workflows. Self-host it as a Slack alternative so incident channels, model-release notes, and GPU on-call stay on infrastructure you control.
tagline: Self-hosted Slack alternative for engineering teams

github_url: https://github.com/mattermost/mattermost
website_url: https://mattermost.com
docs_url: https://docs.mattermost.com

category: Other
tags: [chat, collaboration, self-hosted, slack-alternative, devops, golang]
pricing: freemium
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Slack locks incident chat and release notes in a vendor cloud. Mattermost
  is an open-source collaboration platform you can self-host so on-call,
  model-release, and GPU ops channels stay on your network with playbooks
  and integrations instead of a SaaS workspace.

use_cases:
  - Run a self-hosted team chat for ML ops and on-call
  - Use playbooks for incident response when a training job fails
  - Keep model-release discussion off a public Slack workspace
  - Integrate GitHub and CI notifications into private channels
