name: ImageJ
description: Open N-dimensional scientific image processing platform. ImageJ (ImageJ2) provides plugins, ops, and scripting so labs preprocess microscopy and medical images into training data without a closed-source imaging suite.
tagline: N-dimensional scientific image processing

github_url: https://github.com/imagej/imagej2
website_url: https://imagej.net
docs_url: https://imagej.net/software/imagej2/

category: Other
tags: [java, bioimaging, microscopy, image-analysis, imagej, open-source]
pricing: free
is_open_source: true
license: BSD-2-Clause

problem_solved: |
  Scientific images are N-dimensional, multi-format, and plugin-heavy.
  ImageJ2 is the modern ImageJ core with a typed ops framework and
  SciJava plugins, so microscopy and medical-image pipelines preprocess
  stacks into ML training data without a commercial imaging workstation.

use_cases:
  - Preprocess microscopy stacks into tiles for segmentation models
  - Run ImageJ ops and plugins from scripts for batch conversion
  - Measure intensity, morphology, and colocalization on labeled cells
  - Build Fiji-compatible plugins that share the ImageJ2 ops API
