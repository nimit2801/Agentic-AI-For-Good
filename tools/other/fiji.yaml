name: Fiji
description: Batteries-included ImageJ distribution for scientific image analysis. Fiji ships plugins, update sites, and scripting so bioimage and ML teams can preprocess microscopy without assembling a plugin zoo by hand.
tagline: Batteries-included ImageJ for scientific imaging

github_url: https://github.com/fiji/fiji
website_url: https://fiji.sc
docs_url: https://imagej.net/software/fiji/

category: Other
tags: [java, bioimaging, imagej, microscopy, image-analysis, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Stock ImageJ needs a pile of plugins before it is useful in a lab.
  Fiji bundles those plugins and an updater so microscopy pipelines can
  register, segment, and export images as ML training data from one
  download.

use_cases:
  - Preprocess fluorescence stacks before deep-learning segmentation
  - Run community plugins for registration, tracking, and deconvolution
  - Script batch image conversion into training tiles
  - Teach bioimage analysis without a commercial Imaris seat
