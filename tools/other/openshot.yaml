name: OpenShot
description: Award-winning free video editor for Linux, macOS, and Windows. OpenShot cuts, animates, and exports video so teams can assemble dataset clips, product demos, and evaluation footage without a paid NLE.
tagline: Free cross-platform video editor

github_url: https://github.com/OpenShot/openshot-qt
website_url: https://www.openshot.org
docs_url: https://www.openshot.org/user-guide/
install_command: brew install --cask openshot-video-editor

category: Other
tags: [video, editor, desktop, animation, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Teams still need a simple NLE to trim, title, and export video for
  datasets and demos. Paid editors lock that behind seats. OpenShot
  provides timeline editing and animation on every major OS so clips
  can be prepared on a free stack.

use_cases:
  - Cut and export clips used as video-model training or eval fixtures
  - Assemble a product demo of agent or generative-video output
  - Add titles and simple animation to research explainer videos
  - Convert camera footage into formats used by vision pipelines
  - Trim screen recordings of agent UIs into short samples
