name: Pure Data
description: Pure Data is a free real-time computer music system. Artists patch objects visually to synthesize, process, and route audio and MIDI without writing a conventional program.
tagline: Visual real-time computer music and multimedia system

github_url: https://github.com/pure-data/pure-data
website_url: https://puredata.info
docs_url: https://puredata.info/docs

install_command: brew install --cask pd

category: Other
tags: [pure-data, pd, visual-programming, audio, midi, synthesis, live]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Live electronic music and interactive sound often need a patchable
  environment, not a compiled plugin. Pure Data is a visual real-time
  system so artists and researchers wire objects for synthesis, MIDI,
  and multimedia without a commercial Max license.

use_cases:
  - Patch a live synth or sampler with visual objects
  - Process microphone input in a concert or installation
  - Prototype interactive sound without writing C++
  - Teach computer music with a free Max-like environment
