name: Boltz
description: Open-source biomolecular interaction models that predict complexes and binding poses. Boltz gives structure pipelines a MIT-licensed path to protein-protein and protein-ligand predictions that can run locally on GPU.
tagline: Biomolecular interaction structure prediction

github_url: https://github.com/jwohlwend/boltz
docs_url: https://github.com/jwohlwend/boltz
install_command: pip install boltz

category: Other
tags: [python, protein-structure, docking, deep-learning, gpu, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Many structure tools stop at monomers, while drug and binder work needs
  complexes. Boltz predicts biomolecular interactions so teams can model
  protein-ligand and protein-protein poses without a closed commercial
  docking stack.

use_cases:
  - Predict protein-ligand poses for virtual screening follow-up
  - Model protein-protein complexes before designing binders
  - Batch-score candidate sequences for interaction likelihood
  - Run local GPU inference when cloud structure APIs are off-limits
