name: deal.II
description: C++ finite element library for solving partial differential equations on adaptive meshes. Research codes for solid mechanics, fluid flow, and multiphysics assemble, solve, and refine meshes with a shared deal.II data model.
tagline: C++ finite element library for PDEs

github_url: https://github.com/dealii/dealii
website_url: https://dealii.org
docs_url: https://dealii.org/current/doxygen/deal.II/

category: Other
tags: [c++, finite-element, pde, scientific-computing, simulation, open-source]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Writing a production FEM code from scratch means mesh, assembly, solvers, and adaptivity. deal.II is an LGPL C++ library so research teams can discretize PDEs on adaptive meshes and couple solid, fluid, and multiphysics without a commercial FEA kernel.

use_cases:
  - Solve elasticity and heat-transfer PDEs on adaptive hexahedral meshes
  - Build a custom multiphysics research code on deal.II data structures
  - Couple finite elements with external linear solvers at HPC scale
  - Generate FEM residual data for scientific machine-learning models
