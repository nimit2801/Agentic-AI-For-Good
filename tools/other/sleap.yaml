name: SLEAP
description: Deep learning framework for multi-animal pose tracking. SLEAP labels, trains, and infers poses from video so ethology and neuroscience labs turn behavior recordings into trajectories without commercial tracking software.
tagline: Multi-animal pose tracking with deep learning

github_url: https://github.com/talmolab/sleap
website_url: https://sleap.ai
docs_url: https://docs.sleap.ai
install_command: pip install sleap

category: Other
tags: [python, pose-tracking, deep-learning, neuroscience, video, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause-Clear

problem_solved: |
  Multi-animal videos are hard to score by hand and commercial trackers
  lock labs into closed formats. SLEAP combines a labeling GUI with
  trainable pose models so groups of animals become identity-aware
  trajectories for behavior ML without a vendor pipeline.

use_cases:
  - Label and train multi-animal pose models from lab behavior videos
  - Track interacting mice or flies when identities swap in the frame
  - Export pose trajectories as features for ethology classifiers
  - Fine-tune a SLEAP model when a new arena or species appears
