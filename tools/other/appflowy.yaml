name: AppFlowy
description: Open-source AI collaborative workspace and Notion alternative. Teams keep wikis, projects, and documents on their own infrastructure with local-first data instead of a proprietary cloud.
tagline: Open-source AI workspace and Notion alternative

github_url: https://github.com/AppFlowy-IO/AppFlowy
website_url: https://appflowy.com
docs_url: https://docs.appflowy.io

category: Other
tags: [notes, wiki, collaboration, self-hosted, notion-alternative, rust]
pricing: freemium
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Wikis and project docs often live in Notion with vendor lock-in and
  limited export. AppFlowy is an open-source collaborative workspace you
  can self-host so notes, databases, and AI writing stay under your
  control.

use_cases:
  - Run a team wiki and project tracker without Notion
  - Self-host knowledge bases for research groups with local-first sync
  - Capture meeting notes and product specs in an offline-capable workspace
  - Use built-in AI writing on documents that never leave your servers
