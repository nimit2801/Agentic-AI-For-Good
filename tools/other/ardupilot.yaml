name: ArduPilot
description: ArduPilot is an open-source autopilot stack for planes, copters, rovers, and submarines. It runs on a wide range of hardware, offers mission planning, failsafe, and MAVLink ground-station integration, and is used on research and commercial unmanned vehicles.
tagline: Open-source autopilot for planes, copters, rovers, and submarines

github_url: https://github.com/ArduPilot/ardupilot
website_url: https://ardupilot.org
docs_url: https://ardupilot.org/ardupilot/

category: Other
tags: [c++, robotics, drones, autopilot, mavlink, uav, rover, firmware]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Unmanned vehicles need a battle-tested flight and mission stack across
  air, ground, and water. ArduPilot provides estimators, navigation, and
  failsafe for planes, copters, rovers, and subs on many boards, with
  MAVLink GCS tools so teams operate vehicles without writing firmware.

use_cases:
  - Autopilot a research copter or plane with mission planning and failsafe
  - Run ArduRover on a ground vehicle with GPS waypoint navigation
  - Control an ArduSub vehicle for underwater inspection missions
  - Connect Mission Planner or QGroundControl over MAVLink for operations
