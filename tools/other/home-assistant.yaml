name: Home Assistant
description: Open-source home automation platform that puts local control and privacy first. Integrates thousands of devices and services so labs and builders can run sensors, voice, and automations on their own hardware instead of a vendor cloud.
tagline: Local-first home automation for devices and sensors

github_url: https://github.com/home-assistant/core
website_url: https://www.home-assistant.io
docs_url: https://www.home-assistant.io/docs/

category: Other
tags: [home-automation, iot, self-hosted, privacy, sensors, python]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Device and sensor data for labs and homes often depends on vendor clouds
  that can change APIs or leak telemetry. Home Assistant runs locally with
  thousands of integrations so automations, voice, and dashboards stay on
  your hardware.

use_cases:
  - Automate lab sensors, lights, and power monitoring without a vendor cloud
  - Collect IoT telemetry into local dashboards for experiment environments
  - Run on-device voice and presence automations with privacy-first control
  - Integrate cameras, MQTT, and Zigbee devices into one local event bus
