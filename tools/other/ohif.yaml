name: OHIF
description: Zero-footprint DICOM viewer and oncology-specific Lesion Tracker for medical imaging. OHIF runs entirely in the browser, rendering diagnostic-quality images from any DICOM-compatible source without requiring client installation or plugins.
tagline: Zero-footprint web-based DICOM medical imaging viewer

github_url: https://github.com/OHIF/Viewers
