problem_solved: |
  Medical imaging workflows require specialized DICOM viewers that are traditionally tied to
  specific workstations, expensive PACS systems, or plugin-dependent browser applications.
  This limits remote access, collaboration between specialists, and integration with modern
  web-based clinical tools. OHIF provides a zero-footprint, browser-based DICOM viewer that
  renders diagnostic-quality images from any DICOMweb source, enabling universal access to
  medical imaging without software installation or vendor lock-in.

use_cases:
  - View and annotate diagnostic images directly in the browser from any DICOMweb PACS server
  - Track tumor measurements and lesion changes over time with the oncology Lesion Tracker
  - Embed medical imaging into web-based electronic health record and clinical trial platforms
  - Enable remote radiology consultations with zero client-side software deployment
  - Build AI-assisted diagnostic workflows by integrating imaging viewers with ML pipelines