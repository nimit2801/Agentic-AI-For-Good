name: HEBO
description: Heteroscedastic evolutionary Bayesian optimization library from Huawei Noah's Ark Lab. Tune expensive black-box functions with Gaussian processes, evolutionary search, and reinforcement learning on mixed continuous and categorical spaces.
tagline: Heteroscedastic evolutionary Bayesian optimization from Huawei

github_url: https://github.com/huawei-noah/HEBO
website_url: https://github.com/huawei-noah/HEBO
docs_url: https://github.com/huawei-noah/HEBO/tree/master/HEBO
install_command: pip install HEBO

category: Other
tags: [python, bayesian-optimization, hyperparameter-tuning, evolutionary, huawei, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Standard Bayesian optimization struggles with noisy, heteroscedastic, mixed-type search spaces that show up in AutoML and NAS. HEBO combines Gaussian processes, evolutionary search, and RL so teams can tune expensive black-box functions that vanilla GP-EI misses.

use_cases:
  - Tune ML hyperparameters on noisy or mixed-type search spaces
  - Run AutoML and NAS experiments with evolutionary Bayesian optimization
  - Compare HEBO against classic GP-EI on a black-box benchmark
  - Optimize simulation parameters when evaluations are expensive and noisy
