name: MilkyTracker
description: MilkyTracker is a Fasttracker II compatible music editor. Musicians compose XM modules with a classic tracker UI so chiptune and demoscene production stays open instead of depending on DOS-era Fasttracker.
tagline: Fasttracker II compatible music tracker

github_url: https://github.com/milkytracker/MilkyTracker
website_url: https://milkytracker.org
docs_url: https://milkytracker.org/docs/

category: Other
tags: [milkytracker, tracker, fasttracker, xm, chiptune, audio]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Fasttracker II is a DOS classic that does not run cleanly on
  modern OS. Closed DAWs are a poor substitute for pattern editing.
  MilkyTracker is an open FT2-compatible tracker so XM modules
  stay writable on current desktops.

use_cases:
  - Compose XM modules with a Fasttracker II style pattern editor
  - Load and edit classic FT2 songs on macOS, Linux, or Windows
  - Export module music for a demoscene or game soundtrack
  - Teach tracker workflow without DOS-era Fasttracker
