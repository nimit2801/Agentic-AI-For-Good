name: Box2D
description: Box2D is a 2D rigid-body physics engine for games. Apps simulate collisions, joints, and contacts so platformers and toys get stable physics without writing a custom solver.
tagline: 2D rigid-body physics engine for games

github_url: https://github.com/erincatto/box2d
website_url: https://box2d.org/
docs_url: https://box2d.org/documentation/

install_command: brew install box2d

category: Other
tags: [box2d, physics, 2d, games, collision, simulation]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  2D games need stable collisions, friction, and joints.
  Rolling a solver is a research project. Box2D is the
  standard rigid-body engine so platformers and puzzles
  simulate contacts without a custom physics core.

use_cases:
  - Simulate 2D collisions in a platformer or puzzle game
  - Model joints and motors in a 2D mechanism demo
  - Prototype rigid-body toys with a stable contact solver
  - Link Box2D as the physics backend in a 2D game engine
