name: OpenCASCADE
description: Open-source C++ CAD kernel for 3D modeling, B-rep topology, visualization, and STEP/IGES exchange. Robotics, BIM, and simulation teams build geometry, heal shapes, and convert CAD files without a commercial kernel.
tagline: Open-source CAD kernel for 3D modeling and exchange

github_url: https://github.com/Open-Cascade-SAS/OCCT
website_url: https://dev.opencascade.org
docs_url: https://dev.opencascade.org/documentation

install_command: brew install opencascade

category: Other
tags: [c++, cad, 3d, geometry, modeling, open-source]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Precise CAD geometry, B-rep solids, and STEP exchange usually require a commercial kernel. OpenCASCADE is an LGPL C++ platform for modeling, healing, visualization, and data exchange so robotics, BIM, and CAE tools can construct and convert engineering models without a paid CAD SDK.

use_cases:
  - Import and heal STEP or IGES assemblies for downstream simulation
  - Build B-rep solids and boolean operations in a custom CAD application
  - Convert precise CAD geometry to meshes for 3D learning pipelines
  - Visualize and inspect engineering models in a desktop or embedded viewer
