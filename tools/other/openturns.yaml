name: OpenTURNS
description: Uncertainty quantification library for probabilistic modelling, reliability, and sensitivity analysis. Teams build random vectors, run Monte Carlo or FORM/SORM studies, and estimate failure probabilities from Python or C++.
tagline: Probabilistic modelling library for uncertainty quantification

github_url: https://github.com/openturns/openturns
website_url: https://openturns.github.io/www/
docs_url: https://openturns.github.io/openturns/latest/index.html

install_command: pip install openturns

category: Other
tags: [python, c++, uncertainty-quantification, reliability, statistics, open-source]
pricing: free
is_open_source: true
license: LGPL-3.0

problem_solved: |
  Reliability and uncertainty studies need a library that covers distributions, Monte Carlo, and FORM/SORM in one stack. OpenTURNS is a probabilistic modelling library so teams can estimate failure probabilities without assembling SciPy primitives by hand.

use_cases:
  - Estimate failure probabilities with Monte Carlo or FORM/SORM
  - Build random vectors and copulas for an uncertainty study
  - Run Sobol or FAST sensitivity analysis on a simulation model
  - Call OpenTURNS from Python in a reliability engineering pipeline
