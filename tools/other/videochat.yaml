name: VideoChat
description: OpenGVLab chat-centric video understanding stack (Ask-Anything) that pairs VideoChat with VideoChatGPT-style dialogue over long clips. CVPR 2024 Highlight with a public demo, MIT code, and later Flash and R1 follow-ups for compression and RL fine-tuning.
tagline: Chat-centric video understanding from OpenGVLab

github_url: https://github.com/OpenGVLab/Ask-Anything
website_url: https://vchat.opengvlab.com/
docs_url: https://github.com/OpenGVLab/Ask-Anything#readme

category: Other
tags: [python, video, multimodal, llm, chat, opengvlab, cvpr]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Image chatbots cannot answer questions that require watching a video.
  VideoChat (Ask-Anything) turns video into a conversational interface
  so users can ask what happened, when, and why across long clips, with
  later Flash and R1 variants for long-context compression and
  reinforcement fine-tuning of spatio-temporal reasoning.

use_cases:
  - Chat over uploaded videos to get summaries, timestamps, and follow-up answers
  - Swap in MiniGPT-4, StableLM, or MOSS backends for video dialogue experiments
  - Benchmark long-video QA against VideoChat-Flash hierarchical compression
  - Fine-tune VideoChat-R1 for stronger spatio-temporal perception with RL
