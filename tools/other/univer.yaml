name: Univer
description: An open-source Office SDK for embedding spreadsheets, documents, formulas, collaboration, and agent-facing file tools into your own product.
tagline: Embeddable Office SDK for people and agents

github_url: https://github.com/dream-num/univer
website_url: https://univer.ai
docs_url: https://docs.univer.ai

install_command: npm install @univerjs/presets

category: Other
tags: [typescript, spreadsheet, documents, office, sdk, collaboration, agents]
pricing: freemium
is_open_source: true
license: Apache-2.0

problem_solved: |
  Products that need in-app sheets or docs usually embed a heavy third-party
  editor or rebuild formulas, rendering, and collaboration from scratch. Univer
  is an extensible Office SDK with content models, commands, formula engines, and
  Facade APIs so you can ship editable spreadsheets and documents, then connect
  the same models to agents.

use_cases:
  - Embed a spreadsheet editor with formulas into a SaaS dashboard
  - Build a collaborative docs surface using Univer plugins and the Server SDK
  - Let agents read and edit workbook models through Facade APIs and events
  - Import and export Office files while keeping calculation inside your product
