name: Homepage
description: Self-hosted startpage and service dashboard with Docker and API integrations. Pin lab apps, status widgets, and bookmarks on one page instead of a browser bookmark bar.
tagline: Docker-aware homelab startpage

github_url: https://github.com/gethomepage/homepage
website_url: https://gethomepage.dev
docs_url: https://gethomepage.dev/configs/

category: Other
tags: [dashboard, self-hosted, docker, startpage, javascript, homelab]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  A lab with a dozen self-hosted apps has no single front door. Homepage is a
  YAML-configured startpage that pulls Docker and service APIs so GPU boxes,
  Grafana, and notebooks show status on one page instead of living as a
  scattered bookmark folder.

use_cases:
  - Pin training dashboards, Jupyter, and Grafana on one startpage
  - Show Docker container status next to service bookmarks
  - Build a homelab homepage from a YAML config in git
  - Share a team landing page for internal ML tools
