name: Better ChatGPT
description: An open source ChatGPT UI for the browser and desktop on Windows, macOS, and Linux. It adds folders, custom prompts, local history, and a self-hosted option without locking you into OpenAI's official chat client.
tagline: Free, self-hosted ChatGPT UI for web and desktop

github_url: https://github.com/ztjhz/BetterChatGPT
website_url: https://bettergpt.chat

category: Other
tags: [chatgpt, ui, desktop, self-hosted, openai, chat]
pricing: free
is_open_source: true
license: CC0-1.0

problem_solved: |
  OpenAI's official ChatGPT client is a closed web app with limited
  organization, no local history export, and no self-host option. Better
  ChatGPT is a CC0 UI that talks to the OpenAI API from the browser or a
  desktop build, with folders, prompt libraries, and data you can export
  instead of leaving conversations trapped in chatgpt.com.

use_cases:
  - Run a self-hosted ChatGPT UI in the browser against your own OpenAI API key
  - Organize chats into folders and reuse a local prompt library across sessions
  - Export and import conversation history instead of leaving it on OpenAI's site
  - Use the same ChatGPT UI as a desktop app on Windows, macOS, and Linux
