name: Invidious
description: Alternative YouTube front-end that lets you watch and extract video without the official site or app. Self-host it to browse, subscribe, and pull transcripts or audio with less tracking for research and archival workflows.
tagline: Privacy-respecting alternative front-end for YouTube

github_url: https://github.com/iv-org/invidious
website_url: https://invidious.io
docs_url: https://docs.invidious.io

category: Other
tags: [youtube, privacy, self-hosted, video, front-end, crystal]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Collecting YouTube lectures and demos through the official site means
  ads, tracking, and brittle scrapers. Invidious is a self-hosted front-end
  with an API for watch, subscribe, and extract flows so research pipelines
  can pull video without the official client.

use_cases:
  - Watch and archive lecture videos without a Google account or ads
  - Pull video metadata and streams into a dataset pipeline via the API
  - Self-host a lighter YouTube UI for research groups on a local server
  - Subscribe to channels as RSS-style feeds for monitoring new uploads
