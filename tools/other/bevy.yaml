name: Bevy
description: A data-driven game engine built in Rust with an ECS architecture, a modern renderer, and first-class tooling. Bevy is used for interactive simulations, robotics visualizations, and real-time ML demos that want engine features without a heavyweight editor lock-in.
tagline: Data-driven Rust game engine with ECS and a modern renderer

github_url: https://github.com/bevyengine/bevy
website_url: https://bevy.org
docs_url: https://bevy.org/learn
install_command: cargo add bevy

category: Other
tags: [rust, game-engine, ecs, graphics, simulation, realtime, visualization]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Interactive ML demos, robotics viewers, and simulations need a real-time
  renderer, input, and an entity model. Full engines like Unreal are heavy
  and editor-centric; raw wgpu is too low-level. Bevy gives a Rust ECS
  engine with a modern renderer so teams can build interactive 3D apps as
  code, without locking the project to a proprietary editor.

use_cases:
  - Build a real-time 3D visualization of a robotics or simulation environment in Rust
  - Prototype interactive ML demos that need ECS, input, and a modern renderer
  - Ship cross-platform graphics tools without adopting a closed game engine
  - Teach data-driven architecture with a production-quality open-source engine
