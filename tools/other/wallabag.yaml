name: Wallabag
description: Self-hosted read-it-later app that saves web pages, strips clutter, and stores a readable copy. Useful for clipping papers, docs, and articles into a private archive instead of a third-party pocket service.
tagline: Self-hosted read-it-later archive for web articles

github_url: https://github.com/wallabag/wallabag
website_url: https://wallabag.org
docs_url: https://doc.wallabag.org

category: Other
tags: [read-it-later, self-hosted, archive, articles, php, privacy]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Saving articles in Pocket or Instapaper locks clips in a vendor cloud.
  Wallabag is a self-hosted read-it-later app that fetches pages, strips
  chrome, and stores a readable copy so research reading lists stay on
  your server.

use_cases:
  - Clip papers, docs, and blog posts into a private searchable archive
  - Save paywalled-session pages as readable text for later LLM summarization
  - Tag and classify saved articles across a research team
  - Replace Pocket or Instapaper with a self-hosted reading list
