name: Cesium
description: CesiumJS is an open-source JavaScript library for 3D globes and maps. It streams terrain, 3D Tiles, and satellite imagery in the browser so geospatial apps show the planet without a custom WebGL globe stack.
tagline: Open-source JavaScript library for 3D globes and maps

github_url: https://github.com/CesiumGS/cesium
website_url: https://cesium.com/cesiumjs/
docs_url: https://cesium.com/learn/

category: Other
tags: [javascript, 3d, geospatial, webgl, maps, globe, tiles, visualization]
pricing: free
is_open_source: true
license: Apache-2.0

install_command: npm install cesium

problem_solved: |
  Browser maps are usually 2D tiles. CesiumJS streams terrain, 3D Tiles,
  and imagery onto a WebGL globe so geospatial apps show cities, drones,
  and satellites in 3D without a custom renderer.

use_cases:
  - Render a 3D globe with terrain and satellite imagery in the browser
  - Stream 3D Tiles of buildings or photogrammetry into a web app
  - Visualize UAV or satellite tracks on a time-dynamic Cesium scene
  - Build a digital-twin map without a closed WebGL globe engine
