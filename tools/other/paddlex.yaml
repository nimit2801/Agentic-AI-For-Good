name: PaddleX
description: PaddleX is Baidu's low-code toolkit on PaddlePaddle for OCR, detection, classification, segmentation, and time-series pipelines. It wraps pretrained model lines with inference, serving, and hardware backends so teams ship CV workflows without assembling each kit.
tagline: Low-code PaddlePaddle toolkit for OCR and CV pipelines

github_url: https://github.com/PaddlePaddle/PaddleX
website_url: https://paddlepaddle.github.io/PaddleX/
docs_url: https://paddlepaddle.github.io/PaddleX/latest/index.html
install_command: pip install paddlex

category: Other
tags: [python, computer-vision, ocr, paddlepaddle, low-code, pipelines]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Shipping OCR, detection, and time-series models means wiring
  PaddleSeg, PaddleDetection, and PaddleOCR by hand. PaddleX
  exposes those pipelines as one low-code toolkit with serving
  and hardware backends so teams deploy without assembling kits.

use_cases:
  - Run general OCR, table recognition, or layout parsing pipelines
  - Train and serve object detection or semantic segmentation lines
  - Deploy time-series forecasting and anomaly detection models
  - Export PaddleX pipelines to GPU, XPU, NPU, or edge devices
