name: Nerfstudio
description: Nerfstudio is a modular Python framework for training and visualizing Neural Radiance Fields. It unifies NeRF methods, viewers, and exporters so teams turn captured scenes into 3D assets without assembling research code.
tagline: Modular framework for training and visualizing Neural Radiance Fields

github_url: https://github.com/nerfstudio-project/nerfstudio
website_url: https://docs.nerf.studio
docs_url: https://docs.nerf.studio
install_command: pip install nerfstudio

category: Other
tags: [python, nerf, 3d, computer-vision, reconstruction, visualization]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Neural scene reconstruction research is scattered across papers with
  incompatible trainers and viewers. Nerfstudio gives one modular stack
  so teams train NeRFs, inspect them in a real-time viewer, and export
  meshes without stitching research repos.

use_cases:
  - Train a NeRF from a phone or COLMAP capture of a real scene
  - Visualize a radiance field in the Nerfstudio real-time viewer
  - Export a mesh or point cloud from a trained NeRF for downstream 3D tools
  - Compare NeRF methods under one training and evaluation pipeline
