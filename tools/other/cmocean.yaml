name: cmocean
description: Oceanography colormaps for standardizing commonly plotted variables. cmocean maps salinity, temperature, chlorophyll, and similar fields so marine science figures stay consistent and perceptually uniform.
tagline: Oceanographic colormaps for matplotlib

github_url: https://github.com/matplotlib/cmocean
website_url: https://github.com/matplotlib/cmocean
docs_url: https://github.com/matplotlib/cmocean#readme
install_command: pip install cmocean

category: Other
tags: [python, colormaps, oceanography, matplotlib, visualization, scientific]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Ocean plots mix temperature, salinity, and chlorophyll with
  unrelated color scales, so figures are hard to compare. cmocean
  standardizes perceptually uniform maps for those variables so
  papers and dashboards stay consistent.

use_cases:
  - Color a sea-surface temperature map with the thermal colormap
  - Plot chlorophyll concentration with a dedicated ocean colormap
  - Standardize salinity figures across a cruise report
  - Register cmocean maps with matplotlib for a marine dashboard
