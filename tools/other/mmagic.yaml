name: MMagic
description: OpenMMLab multimodal generative AI toolbox for text-to-image, image and video restoration, super-resolution, inpainting, and AIGC pipelines. It ships easy APIs, a large model zoo, and diffusion-model support for research and production generation work.
tagline: OpenMMLab toolbox for generative and restoration models

github_url: https://github.com/open-mmlab/mmagic
website_url: https://mmagic.readthedocs.io/en/latest/
docs_url: https://mmagic.readthedocs.io/en/latest/
install_command: pip install mmagic

category: Other
tags: [computer-vision, generative, diffusion, super-resolution, inpainting, openmmlab, aigc]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Generative and restoration models live in fragmented research repos with
  incompatible APIs. MMagic unifies diffusion, GAN, and restoration methods
  behind one OpenMMLab-style config and model zoo so teams can train, swap,
  and deploy AIGC and enhancement models without rewriting each paper's code.

use_cases:
  - Run text-to-image and image-to-image generation with a shared OpenMMLab config and model zoo
  - Restore, super-resolve, or inpaint photos and video with pretrained enhancement models
  - Benchmark diffusion and GAN methods on restoration and generation tasks without stitching paper repos
  - Fine-tune generative models on custom visual domains using MMagic's training recipes
