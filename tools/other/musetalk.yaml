name: MuseTalk
description: Real-time lip-sync model that inpaints the mouth region in latent space. Takes a talking-head video and an audio track and rewrites lip motion so dubbed or generated speech matches the face.
tagline: Real-time latent-space lip sync for talking heads

github_url: https://github.com/TMElyralab/MuseTalk
website_url: https://github.com/TMElyralab/MuseTalk
docs_url: https://github.com/TMElyralab/MuseTalk

category: Other
tags: [python, lip-sync, talking-head, video, audio, inpainting]
pricing: free
is_open_source: true

problem_solved: |
  Dubbing or TTS on a talking-head video leaves the original mouth
  motion, which looks wrong. MuseTalk inpaints lips in latent space
  from audio so speech and face stay in sync in near real time.

use_cases:
  - Lip-sync a dubbed or TTS audio track onto an existing talking-head video
  - Generate real-time mouth motion for a digital avatar
  - Localize a presenter video into another language without reshooting
  - Combine MuseTalk with a portrait animator for audio-driven faces
