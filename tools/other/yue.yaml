name: YuE
description: Open-source foundation model for generating full-length songs with lyrics, vocals, and accompaniment. YuE2 adds symbolic planning, zero-shot covers, and agentic music editing from text or audio.
tagline: Open-source music generation with lyrics, vocals, and agentic editing

github_url: https://github.com/multimodal-art-projection/YuE
website_url: https://map-yue2.github.io/

category: Other
tags: [music-generation, audio, lyrics, vocals, generative-ai, python, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Most music generators produce short instrumentals or miss lyrics, structure, and vocal identity. YuE generates full songs with coherent lyrics, vocals, and accompaniment, and YuE2 adds symbolic planning, zero-shot covers, and agentic editing so teams can iterate on arrangement and style without a closed studio stack.

use_cases:
  - Generate full-length songs with lyrics and vocals from a text prompt for demos and prototyping
  - Create zero-shot cover versions that preserve melody while changing style or vocal character
  - Use agentic music editing to revise sections, instrumentation, or arrangement without regenerating the whole track
  - Prototype soundtrack ideas for games, video, and product launches before booking a studio
  - Research long-form music generation with open weights, planning, and reproducible inference
