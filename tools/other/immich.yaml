name: Immich
description: High-performance self-hosted photo and video library with mobile backup, machine-learning tagging, face recognition, and a web gallery. Teams use it to keep visual datasets and media archives on their own hardware instead of consumer cloud albums.
tagline: Self-hosted photo and video library with on-device ML

github_url: https://github.com/immich-app/immich
website_url: https://immich.app
docs_url: https://docs.immich.app

category: Other
tags: [self-hosted, photos, video, machine-learning, face-recognition, privacy]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Visual datasets and personal media often live in Google Photos or iCloud with
  no control over models, retention, or export. Immich is a fast self-hosted
  library with mobile backup and on-box ML for faces, objects, and search, so
  archives stay on your hardware.

use_cases:
  - Back up phone photos and videos to a home or lab server with duplicate detection
  - Search large visual archives by people, objects, and CLIP-style embeddings
  - Host a private gallery for dataset review without uploading to consumer clouds
  - Run face clustering and smart albums on local GPUs for media collections
