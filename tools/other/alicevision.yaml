name: AliceVision
description: AliceVision is a photogrammetric computer vision framework for camera tracking, Structure-from-Motion, and dense 3D reconstruction. It powers Meshroom and lets VFX and mapping teams run a full 3D pipeline without a closed suite.
tagline: Photogrammetry framework for SfM, tracking, and dense 3D reconstruction

github_url: https://github.com/alicevision/AliceVision
website_url: https://alicevision.org
docs_url: https://alicevision.org/#photogrammetry

category: Other
tags: [c++, computer-vision, photogrammetry, sfm, 3d, reconstruction, meshroom, vfx]
pricing: free
is_open_source: true
license: MPL-2.0

problem_solved: |
  Photogrammetry stacks are often closed and hard to embed. AliceVision
  is an open framework for tracking, SfM, and dense reconstruction so
  VFX and mapping teams run a full 3D pipeline, including Meshroom,
  without a proprietary suite.

use_cases:
  - Reconstruct a dense 3D mesh from a multi-view photo set
  - Run camera tracking and SfM as a library inside a VFX pipeline
  - Power Meshroom with AliceVision nodes for photogrammetry
  - Export calibrated cameras and geometry for rendering or mapping
