name: HedgeDoc
description: Real-time collaborative markdown editor you self-host. Use it so a lab can co-edit notes, RFCs, and meeting docs in the browser without a SaaS pad vendor.
tagline: Self-hosted collaborative markdown pads

github_url: https://github.com/hedgedoc/hedgedoc
website_url: https://hedgedoc.org
docs_url: https://docs.hedgedoc.org

category: Other
tags: [markdown, collaboration, self-hosted, notes, realtime, nodejs]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  HackMD and Notion own the pad. A lab that co-edits RFCs and meeting notes
  should keep the text. HedgeDoc is a self-hosted realtime markdown editor, so
  collaborative docs stay on your Postgres instead of a SaaS workspace.

use_cases:
  - Co-edit lab RFCs and design notes in the browser
  - Host meeting pads that stay on your own server
  - Share markdown slides without a SaaS pad vendor
  - Keep research notes in Git-friendly markdown
