name: Godot
description: A multi-platform 2D and 3D game engine with a built-in editor, GDScript, C#, and C++ bindings. Godot is a common choice for interactive simulations, digital twins, and ML demonstration apps that need scenes, physics, and a renderer without Unreal or Unity licensing.
tagline: Open-source 2D and 3D engine for games and interactive sims

github_url: https://github.com/godotengine/godot
website_url: https://godotengine.org
docs_url: https://docs.godotengine.org
install_command: brew install --cask godot

category: Other
tags: [game-engine, 3d, 2d, simulation, gdscript, open-source, visualization]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Interactive 3D demos, training simulators, and visualization apps need
  scenes, physics, animation, and an editor. Unity and Unreal add license
  and workflow lock-in that many research and indie teams cannot take.
  Godot is a MIT-licensed engine with a first-party editor and scripting,
  so teams can ship 2D and 3D experiences without a proprietary runtime.

use_cases:
  - Prototype an interactive ML or robotics demo with scenes, physics, and a renderer
  - Build a digital-twin or simulation viewer that runs on desktop and export targets
  - Teach 2D and 3D interactive programming without a commercial engine license
  - Ship a cross-platform visualization app using GDScript, C#, or C++ bindings
