name: Shotcut
description: Cross-platform open-source video editor built on MLT and Qt. Shotcut cuts, filters, and exports video so teams can assemble dataset clips, demo reels, and evaluation footage without a paid NLE.
tagline: Open-source video editor for dataset clips and demos

github_url: https://github.com/mltframework/shotcut
website_url: https://www.shotcut.org
docs_url: https://shotcut.org/notes/

category: Other
tags: [video, editor, desktop, mlt, qt, open-source]
pricing: free
is_open_source: true
license: GPL-3.0
install_command: brew install --cask shotcut

problem_solved: |
  AI product and research teams still need to trim, filter, and export
  video for datasets and demos. Paid NLEs lock that work behind seats.
  Shotcut edits on every major OS with MLT filters so clips can be
  prepared on a free stack.

use_cases:
  - Trim and export clips used as video-model training or eval fixtures
  - Assemble a product demo reel of agent or generative-video output
  - Apply filters and color correction before labeling video frames
  - Convert camera footage into formats used by vision pipelines
  - Cut screen recordings of agent UIs into short evaluation samples
