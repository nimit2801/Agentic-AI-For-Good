name: AI Infra Guard
description: A full-stack AI red-teaming platform by Tencent that scans AI infrastructure for vulnerabilities across model APIs, agent behaviors, MCP endpoints, and skill-level attacks in a unified security dashboard.
tagline: Full-stack AI red-teaming and security scanning platform
github_url: https://github.com/Tencent/AI-Infra-Guard
website_url: https://aig.tencent.com
docs_url: https://github.com/Tencent/AI-Infra-Guard#readme

category: Other
tags: [security, red-teaming, llm, vulnerability-scanning, mcp, agent-security]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  AI infrastructure introduces multiple new attack surfaces — model APIs, agent
  orchestration loops, tool-calling endpoints, and Model Context Protocol (MCP)
  servers — each requiring different scanning techniques. Traditional security
  tools lack AI-specific coverage. AI Infra Guard provides a unified platform
  that scans cloud-deployed model endpoints, tests agent logic for safety
  violations, probes MCP server implementations, and inventories AI skill
  dependencies. It gives security teams a single pane of glass for AI
  infrastructure risk across the full stack.

use_cases:
  - Scan cloud-deployed LLM endpoints for prompt injection and data leakage vulnerabilities
  - Audit agent orchestration logic for safety boundary violations and tool misuse
  - Probe MCP server implementations for authentication and authorization weaknesses
  - Generate consolidated AI security reports for compliance and risk management
