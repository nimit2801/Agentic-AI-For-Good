name: OpenToonz
description: Open-source 2D animation studio descended from Toonz, used in production animation. OpenToonz is used to draw, composite, and export frame sequences for animation datasets and generative-video references without a commercial 2D suite.
tagline: Open-source 2D animation studio

github_url: https://github.com/opentoonz/opentoonz
website_url: https://opentoonz.github.io/
docs_url: https://opentoonz.readthedocs.io/en/latest/

category: Other
tags: [animation, 2d, desktop, video, dataset, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause
install_command: brew install --cask opentoonz

problem_solved: |
  Animation and generative-video teams need a 2D production tool to
  draw, ink, and composite frames. Commercial suites lock that work
  behind licenses. OpenToonz provides scanning, xsheet, and effects
  so frame sequences can be prepared on an open stack.

use_cases:
  - Draw and composite 2D animation used as generative-video references
  - Export frame sequences for an animation or video-model dataset
  - Ink and paint scanned drawings before labeling motion clips
  - Build xsheet timing for evaluation of video-generation models
  - Composite effects over agent or product explainer animation
