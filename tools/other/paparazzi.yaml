name: Paparazzi
description: Paparazzi is a free open-source hardware and software project for unmanned air vehicles. It includes autopilot firmware, a ground station, and simulation so research teams fly custom airframes without a closed commercial stack.
tagline: Open-source UAV autopilot, GCS, and simulation stack

github_url: https://github.com/paparazzi/paparazzi
website_url: https://paparazziuav.org
docs_url: https://wiki.paparazziuav.org

category: Other
tags: [c, drones, uav, autopilot, gcs, firmware, robotics, simulation]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Research UAVs often need custom airframes and payloads that closed
  autopilots will not expose. Paparazzi is a full open stack of
  firmware, GCS, and simulation so labs fly and modify vehicles
  without a vendor lock-in.

use_cases:
  - Fly a custom fixed-wing or rotorcraft airframe on Paparazzi firmware
  - Use the Paparazzi GCS to plan missions and monitor telemetry
  - Simulate a UAV in the Paparazzi simulator before a flight test
  - Integrate research sensors on an open autopilot without a closed SDK
