name: Mixxx
description: Mixxx is free DJ software for live mixing. DJs beatmatch, cue, and effect tracks with four decks, HID controllers, and vinyl control without a commercial DJ suite.
tagline: Open-source DJ software for live mixing

github_url: https://github.com/mixxxdj/mixxx
website_url: https://www.mixxx.org/
docs_url: https://manual.mixxx.org/

install_command: brew install --cask mixxx

category: Other
tags: [mixxx, dj, audio, mixing, vinyl, midi, live]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Live DJ sets usually lock performers into paid software and closed
  controller mappings. Mixxx is a free four-deck mixer so DJs beatmatch,
  cue, and effect tracks with HID, MIDI, and vinyl control without a
  commercial DJ suite.

use_cases:
  - Beatmatch and mix a live set with four software decks
  - Map a MIDI or HID controller for club or bedroom DJing
  - Perform with vinyl control using timecode records
  - Record a mix session without a commercial DJ license
