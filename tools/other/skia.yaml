name: Skia
description: Skia is Google's 2D graphics library for text, geometries, and images. Chrome, Android, and Flutter draw with Skia so apps get a consistent CPU and GPU canvas instead of a platform-only 2D API.
tagline: 2D graphics library for text, shapes, and images

github_url: https://github.com/google/skia
website_url: https://skia.org
docs_url: https://skia.org/docs/

category: Other
tags: [skia, 2d, graphics, canvas, google, flutter, rendering]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  2D drawing APIs differ across Windows, macOS, and Android.
  Skia is a complete 2D engine for text, paths, and images so
  browsers and UI toolkits share one canvas on CPU and GPU.

use_cases:
  - Draw UI text and paths in a cross-platform toolkit
  - Render 2D canvases on GPU backends from a custom engine
  - Composite images and geometries in a document or map view
  - Share a Skia canvas between Flutter, Chrome, or Android code
