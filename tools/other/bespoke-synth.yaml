name: Bespoke Synth
description: Bespoke Synth is an open modular software synthesizer. Musicians wire effects, MIDI, and custom modules on a zoomable canvas so live patches stay visual and scriptable without a closed Eurorack host.
tagline: Open software modular synthesizer

github_url: https://github.com/BespokeSynth/BespokeSynth
website_url: https://www.bespokesynth.com/
docs_url: https://www.bespokesynth.com/docs/

install_command: brew install --cask bespoke

category: Other
tags: [bespoke, synthesizer, modular, midi, audio, music, live]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Modular sound design on a laptop often means a closed DAW or VST
  rack. Bespoke Synth is an open canvas of modules so live patches,
  MIDI routing, and custom DSP stay royalty-free.

use_cases:
  - Patch a live modular set on a zoomable software canvas
  - Route MIDI and audio modules without a commercial Eurorack host
  - Prototype custom DSP as a Bespoke module for a performance
  - Generate synthetic audio for music or ML datasets from open modules
