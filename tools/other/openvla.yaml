name: OpenVLA
description: OpenVLA is an open vision-language-action model for robotic manipulation. It maps camera frames and language instructions to robot actions so teams fine-tune generalist policies instead of training from scratch.
tagline: Open vision-language-action model for robotic manipulation

github_url: https://github.com/openvla/openvla
website_url: https://openvla.github.io
docs_url: https://github.com/openvla/openvla

category: Other
tags: [python, robotics, vla, vision-language, manipulation, imitation-learning]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Robot policies usually overfit one setup and ignore language. OpenVLA
  is a pretrained vision-language-action model that maps images and
  instructions to actions, so teams fine-tune a generalist manipulator
  instead of training from scratch.

use_cases:
  - Fine-tune a vision-language-action policy on a new robot arm
  - Map camera frames and natural-language goals to manipulation actions
  - Benchmark generalist robot policies against OpenVLA checkpoints
  - Combine OpenVLA with LeRobot datasets for imitation learning
