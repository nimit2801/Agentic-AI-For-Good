name: Yoshimi
description: Yoshimi is a software synthesizer forked from ZynAddSubFX. It offers additive, subtractive, and pad synthesis with microtonal tuning for Linux live performance and studio work.
tagline: Linux soft-synth forked from ZynAddSubFX with microtonal tuning

github_url: https://github.com/Yoshimi/yoshimi
website_url: http://yoshimi.github.io/
docs_url: http://yoshimi.github.io/

category: Other
tags: [yoshimi, synthesizer, linux, audio, music, microtonal, jack]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Many Linux musicians need a self-contained soft-synth with additive,
  subtractive, and pad engines plus microtonal scales, without depending
  on a commercial plugin suite. Yoshimi continues the ZynAddSubFX lineage
  as a JACK and ALSA instrument that stays in development for live and
  studio use.

use_cases:
  - Play additive, subtractive, and pad patches over JACK or ALSA on Linux
  - Load microtonal scales for non-12-TET performance and composition
  - Use Yoshimi as a live instrument instead of a commercial plugin suite
  - Design pads and leads in a ZynAddSubFX-compatible soft-synth
