name: Needle
description: Needle is Cactus Compute's automation foundation model for tiny devices. The 2-bit, 8-29 MB model runs tool calls, structured extraction, and embeddings on phones, wearables, robots, cars, and microcontrollers without a cloud LLM.
tagline: Tiny on-device foundation model for tools and extraction

github_url: https://github.com/cactus-compute/needle
website_url: https://cactuscompute.com
docs_url: https://github.com/cactus-compute/needle

category: LLM
tags: [edge-ai, on-device, llm, microcontrollers, embeddings, cactus, mobile]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Cloud LLMs cannot run on phones, wearables, or microcontrollers that need offline tool use and extraction. Needle is a tiny 2-bit foundation model that fits in 8-29 MB and still does structured extraction, embeddings, and tool calls on-device.

use_cases:
  - Run offline tool calling on a phone or wearable without sending data to a cloud LLM
  - Extract structured fields from on-device sensor or camera text with a 2-bit model
  - Embed local documents on a microcontroller or robot for retrieval
  - Prototype smart-home or automotive agents that must stay on-device
