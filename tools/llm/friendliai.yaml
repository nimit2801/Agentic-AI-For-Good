name: FriendliAI
description: GPU-optimized LLM serving platform with an OpenAI-compatible API. Teams use FriendliAI to serve open and custom models at production throughput without building their own batching and inference stack.
tagline: GPU-optimized serving for production LLM APIs

website_url: https://friendli.ai
docs_url: https://docs.friendli.ai
install_command: pip install friendli-client

category: LLM
tags: [llm, inference, serving, api, gpu, cloud]
pricing: freemium
is_open_source: false

problem_solved: |
  Production LLM serving needs continuous batching, GPU utilization, and a
  stable API. FriendliAI runs that stack as a managed service so teams can
  serve open or custom models without operating inference engines themselves.

use_cases:
  - Serve an open-weight chat model behind an OpenAI-compatible API
  - Benchmark token throughput for a production assistant
  - Call FriendliAI from Python with the official client
  - Swap a self-hosted vLLM endpoint for a managed GPU backend
