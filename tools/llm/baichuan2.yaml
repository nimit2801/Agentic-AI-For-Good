name: Baichuan2
description: Open 7B and 13B Chinese-English language models from Baichuan Intelligent Technology, trained on 2.6 trillion tokens, with Base, Chat, and 4-bit Chat weights on Hugging Face for research and licensed commercial use.
tagline: Open 7B and 13B Chinese-English language models

github_url: https://github.com/baichuan-inc/Baichuan2
website_url: https://huggingface.co/baichuan-inc
docs_url: https://github.com/baichuan-inc/Baichuan2/blob/main/README_EN.md

category: LLM
tags: [llm, chinese, open-weights, huggingface, chat, bilingual]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Teams building Chinese and bilingual products need open weights that score well
  on C-Eval, CMMLU, and MMLU without training from scratch. Baichuan2 ships 7B and
  13B Base and Chat checkpoints, including 4-bit Chat, so you can fine-tune or
  serve a bilingual model from Hugging Face under Apache-2.0 with a commercial
  license path.

use_cases:
  - Serve Baichuan2-7B-Chat or 13B-Chat for Chinese customer support
  - Fine-tune Baichuan2 Base on domain Chinese corpora for RAG and agents
  - Run 4-bit Chat weights on a single GPU for local bilingual inference
  - Benchmark Chinese and English reasoning on C-Eval, CMMLU, and MMLU
