name: Featherless AI
description: Serverless inference platform that serves thousands of open-weight Hugging Face models behind one OpenAI-compatible API. Featherless uses flat monthly pricing with unlimited tokens instead of per-token bills, so teams can try many models without managing GPUs.
tagline: Serverless access to thousands of open-weight models

website_url: https://featherless.ai
docs_url: https://featherless.ai

category: LLM
tags: [llm, inference, serverless, huggingface, openai-compatible]
pricing: paid
is_open_source: false

problem_solved: |
  Trying many open-weight models usually means a GPU box or a
  per-token bill that spikes on exploration. Featherless serves
  thousands of Hugging Face models behind one OpenAI-compatible API
  with flat monthly pricing so teams can switch models without ops.

use_cases:
  - Call thousands of Hugging Face models through one OpenAI-compatible API
  - Swap models in an agent or chat app without deploying a GPU cluster
  - Prototype classifiers from open models with a hosted endpoint
  - Keep inference spend predictable with a flat monthly plan
