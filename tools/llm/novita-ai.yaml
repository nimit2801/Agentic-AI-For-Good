name: Novita AI
description: GPU cloud and model API platform for running open-weight LLMs, image models, and sandboxes. Teams use Novita AI to rent GPUs or call serverless model APIs without managing their own cluster.
tagline: GPU cloud and serverless APIs for open models

website_url: https://novita.ai
docs_url: https://docs.novita.ai/guides/introduction

category: LLM
tags: [llm, gpu, cloud, inference, api, serverless]
pricing: freemium
is_open_source: false

problem_solved: |
  Running open models still means finding GPUs, drivers, and an inference
  server. Novita AI rents GPUs and exposes serverless model APIs so teams
  can train or serve without standing up their own cluster.

use_cases:
  - Call serverless LLM APIs for a RAG or agent backend
  - Rent GPUs to fine-tune an open-weight model
  - Run image and video models without a local GPU
  - Point an OpenAI-compatible client at Novita model endpoints
