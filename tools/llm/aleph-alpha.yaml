name: Aleph Alpha
description: European LLM provider focused on sovereign, domain-specific language models for regulated industries. Offers the Luminous family plus a Python client for completion, evaluation, and embeddings with data residency in Europe.
tagline: Sovereign European LLMs for regulated workloads

github_url: https://github.com/Aleph-Alpha/aleph-alpha-client
website_url: https://aleph-alpha.com/en/
docs_url: https://aleph-alpha-client.readthedocs.io/
install_command: pip install aleph-alpha-client

category: LLM
tags: [python, llm, europe, sovereign-ai, embeddings, saas]
pricing: paid
is_open_source: false

problem_solved: |
  Many European public-sector and enterprise teams cannot send prompts to US
  hosted models because of residency and audit rules. Aleph Alpha serves
  domain-tuned LLMs from European infrastructure with a Python client for
  completion, evaluation, and embeddings.

use_cases:
  - Call Luminous models from Python for completion, evaluation, and embeddings
  - Run document Q&A in a European data-residency environment
  - Prototype a sovereign LLM workflow before moving to a private deployment
  - Embed internal corpora with Aleph Alpha embedding endpoints
