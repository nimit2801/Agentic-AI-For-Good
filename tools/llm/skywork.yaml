name: Skywork
description: Open bilingual LLM series from Kunlun Group, pretrained on 3.2T tokens of Chinese, English, and code, with 13B base, chat, math, and multimodal checkpoints plus later vision-reasoning models.
tagline: Bilingual 13B models trained on 3.2T multilingual tokens

github_url: https://github.com/SkyworkAI/Skywork
website_url: https://huggingface.co/Skywork
docs_url: https://github.com/SkyworkAI/Skywork

category: LLM
tags: [llm, bilingual, chinese, english, open-weights, math, multimodal, huggingface]
pricing: free
is_open_source: true

problem_solved: |
  Teams that need a capable Chinese-English 13B model often lack a cleaned pretraining corpus
  and evaluation set. Skywork open-sourced models trained on 3.2 trillion multilingual and code
  tokens, plus math and multimodal variants and public eval data, so researchers can run and
  compare bilingual models without assembling that stack themselves.

use_cases:
  - Run Skywork-13B-Base for bilingual Chinese and English generation on consumer GPUs
  - Use Skywork-13B-Math for GSM8K-style reasoning and Chinese math benchmarks
  - Fine-tune Skywork chat checkpoints for creative writing and instruction following
  - Load Skywork multimodal or R1V weights for vision-language reasoning tasks
