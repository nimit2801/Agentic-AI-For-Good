name: Hyperbolic
description: On-demand AI cloud for GPU rental and OpenAI-compatible LLM inference. Hyperbolic lets teams spin up GPUs and call hosted open models without a long-term cluster, aimed at builders who want cheaper burst capacity than the major clouds.
tagline: On-demand GPUs and hosted LLM inference

website_url: https://www.hyperbolic.ai
docs_url: https://www.hyperbolic.ai

category: LLM
tags: [llm, gpu, inference, cloud, serverless]
pricing: paid
is_open_source: false

problem_solved: |
  Training and inference bursts need GPUs, but reserved cloud capacity
  is expensive and slow to provision. Hyperbolic is an on-demand AI
  cloud with GPU rental and OpenAI-compatible endpoints so teams can
  run open models without standing up their own cluster.

use_cases:
  - Rent on-demand GPUs for a short training or fine-tuning job
  - Call hosted open models through an OpenAI-compatible chat API
  - Burst inference capacity without a reserved hyperscaler contract
  - Prototype an agent stack against Hyperbolic-hosted model endpoints
