name: Rsyslog
description: |-
  Rsyslog is a high-performance system logging daemon for Linux and Unix systems that provides reliable log collection, filtering, transformation, and forwarding. It serves as the foundation for AI infrastructure logging pipelines — collecting GPU driver logs, kernel messages, container logs, and system events with sub-millisecond performance and forwarding them to centralized log management platforms.
tagline: High-performance system logging daemon for Linux

github_url: https://github.com/rsyslog/rsyslog
website_url: https://www.rsyslog.com
docs_url: https://www.rsyslog.com/doc/master/index.html

category: Monitoring
tags: [monitoring, logging, syslog, system-administration, linux, infrastructure]
pricing: free
is_open_source: true
license: LGPL-3.0

problem_solved: |
  AI infrastructure runs on Linux systems where GPU driver logs, kernel events, container runtime messages, and application syslog outputs are generated by different subsystems with no unified collection mechanism. Manually tailing multiple log files across dozens of GPU servers is not feasible for production operations. Rsyslog solves this with a high-performance syslog daemon that collects logs from local system sources (imuxsock, imjournal, imfile), applies rule-based filtering and message modification via its powerful configuration syntax, and forwards structured logs to remote destinations (Elasticsearch, Graylog, Kafka, or TCP/UDP endpoints) using reliable TLS connections with on-disk queue buffering — ensuring no log data is lost during network interruptions while maintaining minimal CPU overhead.

use_cases:
  - Collect NVIDIA GPU driver logs and kernel-level events from training nodes as the system-level foundation for AI infrastructure monitoring pipelines
  - Forward Docker and containerd logs from model serving hosts to centralized logging platforms with reliable TLS delivery and on-disk queue protection against network failures
  - Aggregate syslog messages from multiple inference servers into a single Elasticsearch index for unified operational debugging
  - Apply rsyslog rule-based filters to separate GPU hardware error messages from routine system events, forwarding only critical alerts to the incident management pipeline
  - Configure reliable log forwarding from bare-metal GPU clusters to centralized log storage with automatic failover and message buffering during upstream outages
