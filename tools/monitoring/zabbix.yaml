name: Zabbix
description: An enterprise-class open-source monitoring platform for networks, servers, cloud, containers, and applications. Zabbix collects metrics from thousands of AI infrastructure components — GPU clusters, model servers, vector databases, and data pipelines — with auto-discovery, flexible alerting, and integrated visualization.
tagline: Enterprise-level open-source monitoring for any IT infrastructure

github_url: https://github.com/zabbix/zabbix
website_url: https://www.zabbix.com
docs_url: https://www.zabbix.com/documentation

category: Monitoring
tags: [monitoring, metrics, alerting, infrastructure, observability, network-monitoring, server-monitoring]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  AI infrastructure spans diverse components — GPU servers, model serving endpoints, vector databases, message queues, and data pipelines — each with its own metrics and health indicators. Managing separate monitoring tools for each component creates silos and increases operational burden. Zabbix solves this with a unified monitoring platform that auto-discovers network devices and services, collects metrics via agent-based and agentless methods, provides customizable thresholds with multi-step escalation alerts, and renders real-time graphs and dashboards — all from a single web-based management interface.

use_cases:
  - Monitor GPU cluster health, utilization, and temperature across hundreds of training nodes from a single dashboard
  - Auto-discover and track model serving endpoints, vector database instances, and data pipeline workers as they scale up and down
  - Set proactive alerts on ML infrastructure metrics with multi-step escalation paths to on-call engineering teams
  - Track historical trends in model inference latency, memory usage, and throughput for capacity planning
  - Monitor network and storage infrastructure underpinning distributed AI training jobs with integrated topology maps
