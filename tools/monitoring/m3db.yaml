name: M3DB
description: |-
  Distributed time-series database, metrics aggregator, and query engine built by Uber. Prometheus-compatible with a sidecar, Graphite-compatible, and designed as a scalable metrics platform for high-cardinality observability data.
problem_solved: |-
  Storing and querying massive-scale metrics with distributed TSDB architecture, native Prometheus and Graphite compatibility, and horizontal scalability for high-cardinality observability workloads.
use_cases:
  - "Distributed metrics storage and querying at Uber-scale"
  - "Prometheus remote storage backend with sidecar integration"
  - "Graphite-compatible metrics aggregation and visualization"
  - "High-cardinality time-series analytics for cloud-native infrastructure"
github_url: https://github.com/m3db/m3
website_url: https://m3db.io/
docs_url: https://m3db.io/docs/
category: Monitoring
tags:
  - time-series
  - metrics
  - prometheus
  - graphite
  - distributed
  - go
pricing: free
is_open_source: true
license: Apache-2.0
