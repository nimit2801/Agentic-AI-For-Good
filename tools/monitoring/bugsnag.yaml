name: Bugsnag
description: Cross-platform error monitoring and crash reporting for web, mobile, and backend applications with real-time alerting.
tagline: Real-time error monitoring and crash reporting for applications

github_url: https://github.com/bugsnag/bugsnag-js
website_url: https://www.bugsnag.com
docs_url: https://docs.bugsnag.com

category: Monitoring
tags: [error-tracking, monitoring, javascript, python, ruby, mobile]
pricing: freemium
is_open_source: true
license: MIT
install_command: npm install @bugsnag/js

problem_solved: |
  Applications in production fail silently, leaving users frustrated and developers unaware of bugs
  until they are reported manually. Bugsnag captures unhandled exceptions and crashes across web,
  mobile, and backend environments in real time, grouping related errors and surfacing stack traces
  with contextual metadata so teams can prioritize and fix issues before they impact more users.

use_cases:
  - Capture and group JavaScript exceptions in React and Vue apps with automatic source map unminification
  - Monitor mobile app crashes on iOS and Android with detailed stack traces and device context
  - Track backend errors in Python, Ruby, and Java services with request parameters and user metadata
  - Set up intelligent alerting rules that notify the right team only when error rates spike
