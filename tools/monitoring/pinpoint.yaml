name: Pinpoint
description: |-
  APM tool for large-scale distributed systems that traces transactions across applications with code-level visibility and minimal overhead.
problem_solved: |-
  Engineering teams need to understand distributed system topology and identify performance bottlenecks across microservices without code changes.
use_cases:
  - "Distributed application tracing"
  - "Real-time performance monitoring"
  - "Microservice topology visualization"
  - "Code-level transaction analysis"
