name: ClawBench
description: An open-source benchmark from TIGER Lab for browser AI agents on everyday tasks. It scores agents on realistic daily web work rather than synthetic MiniWoB puzzles, with a public leaderboard at claw-bench.com.
tagline: Daily-task benchmark for browser AI agents

github_url: https://github.com/TIGER-AI-Lab/ClawBench
website_url: https://claw-bench.com
docs_url: https://github.com/TIGER-AI-Lab/ClawBench#readme

category: Monitoring
tags: [python, benchmark, evaluation, browser-agents, web-agents, llm]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Browser-agent papers often report MiniWoB or a handful of demo sites,
  which does not show whether an agent can handle ordinary daily tasks.
  ClawBench evaluates agents on realistic everyday web work and publishes
  scores on a public leaderboard so labs can compare computer-use agents
  on the kind of tasks people actually ask for.

use_cases:
  - Score a browser agent on daily web tasks before claiming it is production-ready
  - Compare computer-use models on a shared leaderboard instead of private demos
  - Diagnose which everyday workflows break a GUI agent after it leaves a toy benchmark
  - Track progress of new browser agents against prior ClawBench submissions
