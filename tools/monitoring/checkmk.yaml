name: Checkmk
description: An open-source monitoring platform that combines comprehensive infrastructure monitoring with a powerful agent-based architecture and intuitive dashboards. Checkmk discovers and monitors AI infrastructure components automatically — from GPU servers and vector databases to inference endpoints and Kubernetes clusters.
tagline: Comprehensive monitoring with auto-discovery and intuitive dashboards

github_url: https://github.com/Checkmk/checkmk
website_url: https://checkmk.com
docs_url: https://docs.checkmk.com

category: Monitoring
tags: [monitoring, observability, infrastructure, devops, auto-discovery, dashboards, alerting]
pricing: freemium
is_open_source: true
license: GPL-2.0

problem_solved: |
  AI infrastructure teams deploy and scale their systems rapidly — new GPU nodes, microservices, and data pipelines spin up and down constantly. Manually configuring monitoring for each new component becomes unsustainable as the system grows. Checkmk solves this with automatic service discovery that detects new hosts and services as they join the network, a powerful rule-based configuration engine that applies monitoring policies consistently, and an integrated monitoring stack with built-in graphing, alerting, and reporting — reducing setup time from hours to minutes for each new infrastructure component.

use_cases:
  - Automatically discover and monitor new GPU training nodes as they join the AI cluster without manual configuration
  - Set up comprehensive monitoring for model serving infrastructure with consistent check rules applied across all endpoints
  - Monitor Kubernetes-based ML platform health with Checkmk's native K8s integration for pods, nodes, and namespaces
  - Create custom dashboards tracking ML infrastructure KPIs — GPU utilization, inference latency P99, model throughput
  - Generate bi-weekly capacity planning reports showing infrastructure utilization trends and growth projections
