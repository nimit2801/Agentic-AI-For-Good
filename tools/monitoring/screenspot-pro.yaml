name: ScreenSpot-Pro
description: GUI grounding benchmark for professional high-resolution computer use, with CAD, IDE, and office screenshots plus a public Hugging Face dataset and leaderboard. Used to score models such as UI-TARS, Qwen2.5-VL, and OmniParser v2.
tagline: High-resolution GUI grounding benchmark for computer-use agents

github_url: https://github.com/likaixin2000/ScreenSpot-Pro-GUI-Grounding
website_url: https://gui-agent.github.io/grounding-leaderboard
docs_url: https://github.com/likaixin2000/ScreenSpot-Pro-GUI-Grounding#readme

category: Monitoring
tags: [python, benchmark, evaluation, gui, computer-use, grounding, huggingface]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  GUI grounding benches often use sparse mobile or web screens, so
  high-res CAD, IDE, and office UIs look easy. ScreenSpot-Pro scores
  click targeting on professional desktop software so computer-use
  models can be compared where pixel precision actually fails.

use_cases:
  - Evaluate a GUI grounding model on high-resolution professional software screenshots
  - Compare computer-use agents on the public ScreenSpot-Pro leaderboard
  - Train or diagnose click targeting with the Hugging Face ScreenSpot-Pro dataset
  - Run the official evaluation scripts against OpenAI-compatible GUI models
