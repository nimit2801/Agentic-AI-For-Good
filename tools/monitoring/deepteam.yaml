name: DeepTeam
description: Open-source red-teaming framework for LLMs and AI agents from the DeepEval team. Runs adversarial attacks, safety probes, and vulnerability scans so you can measure jailbreaks, bias, and policy failures before production.
tagline: Red-team LLMs and agents before they ship

github_url: https://github.com/confident-ai/deepteam
website_url: https://trydeepteam.com
docs_url: https://github.com/confident-ai/deepteam
install_command: pip install deepteam

category: Monitoring
tags: [python, red-teaming, llm-safety, evaluation, agents, adversarial]
pricing: freemium
is_open_source: true
license: Apache-2.0

problem_solved: |
  Shipping an LLM or agent without adversarial tests leaves jailbreaks, bias,
  and policy leaks until users find them. DeepTeam runs structured red-team
  attacks against models and agents so safety failures show up in CI instead
  of production.

use_cases:
  - Red-team a chatbot for jailbreaks, PII leakage, and prompt injection
  - Scan an AI agent for tool-misuse and policy violations before launch
  - Add adversarial safety tests to an LLM evaluation pipeline alongside DeepEval
  - Compare model versions on the same vulnerability suite after a fine-tune
