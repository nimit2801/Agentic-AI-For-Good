name: Amplitude
description: "Product analytics and behavioral analytics platform for event tracking, funnels, retention, and experimentation. Used to measure how users move through web, mobile, and AI-powered products, with SDKs for browser, iOS, Android, and server runtimes."
tagline: "Behavioral analytics for product and growth teams"

website_url: https://amplitude.com
docs_url: https://amplitude.com/docs
install_command: npm install @amplitude/analytics-browser

category: Monitoring
tags: [analytics, product-analytics, events, funnels, retention, experimentation]
pricing: freemium
is_open_source: false

problem_solved: |
  Shipping an AI feature is easy; knowing whether it changes user behavior is not.
  Amplitude instruments events across clients and servers, then charts paths, retention,
  and experiments so teams can see if an agent, copilot, or recommendation actually
  improves activation instead of guessing from logs.

use_cases:
  - Measure activation and retention after launching an AI copilot or chat feature
  - Run funnels from signup through first successful AI action to paid conversion
  - Compare experiment variants of prompts or UX with behavioral analytics
  - Instrument browser and server events so LLM usage shows up in product dashboards
