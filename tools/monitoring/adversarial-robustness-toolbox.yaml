name: Adversarial Robustness Toolbox
description: |-
  Python library for machine learning security enabling developers and researchers to defend and evaluate ML models against adversarial threats including evasion, poisoning, extraction, and inference attacks. Supports TensorFlow, PyTorch, scikit-learn, and XGBoost.
problem_solved: |-
  Defending and evaluating machine learning models and applications against adversarial threats across all data types (images, tables, audio, video) and tasks (classification, object detection, speech recognition, generation).
use_cases:
  - "Red and blue team adversarial attack simulation on ML models"
  - "Evasion and poisoning defense for computer vision and NLP models"
  - "Model extraction and inference attack detection and mitigation"
  - "Cross-framework security evaluation for TensorFlow and PyTorch pipelines"
github_url: https://github.com/Trusted-AI/adversarial-robustness-toolbox
website_url: https://adversarial-robustness-toolbox.readthedocs.io/en/latest/
docs_url: https://adversarial-robustness-toolbox.readthedocs.io/en/latest/
category: Monitoring
tags:
  - ml-security
  - adversarial-attacks
  - red-team
  - blue-team
  - robustness
pricing: free
is_open_source: true
license: MIT
install_command: pip install adversarial-robustness-toolbox
