name: SwanLab
description: SwanLab is an open-source training tracker with a modern UI for cloud or self-hosted runs. It logs metrics, configs, and media from PyTorch, Transformers, LLaMA Factory, and other stacks so teams compare experiments without a closed MLOps suite.
tagline: Open-source experiment tracking for AI training runs

github_url: https://github.com/SwanHubX/SwanLab
website_url: https://swanlab.cn
docs_url: https://docs.swanlab.cn/en/

category: Monitoring
tags: [python, experiment-tracking, training, pytorch, visualization, mlops, metrics]
pricing: freemium
is_open_source: true
license: Apache-2.0

install_command: pip install swanlab

problem_solved: |
  Training runs scatter metrics across notebooks and logs. SwanLab
  records losses, configs, and media from PyTorch and Transformers
  so teams compare experiments in a cloud or self-hosted UI instead
  of a closed tracker.

use_cases:
  - Log loss, LR, and GPU stats from a PyTorch training loop
  - Compare LoRA runs from LLaMA Factory or ms-swift in one dashboard
  - Self-host experiment tracking for a lab that cannot use SaaS
  - Attach images, audio, and checkpoints to a training run
