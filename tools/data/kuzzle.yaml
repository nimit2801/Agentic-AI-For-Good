name: Kuzzle
description: Kuzzle is an open-source backend that provides real-time data storage, advanced search, and pub-sub capabilities for web, mobile, IoT, and AI applications. It is self-hostable and ready to use out of the box.
tagline: Open-source backend with real-time data and search

github_url: https://github.com/kuzzleio/kuzzle
website_url: https://kuzzle.io
docs_url: https://docs.kuzzle.io

category: Data
tags: [backend, real-time, search, iot, self-hosted, pub-sub]
pricing: freemium
is_open_source: true
license: Apache-2.0

problem_solved: |
  Building real-time backends requires integrating databases, search engines, pub-sub systems,
  and authentication from scratch. Kuzzle provides a self-hosted, batteries-included backend
  with real-time data synchronization, advanced search, and multi-protocol access.

use_cases:
  - Powering real-time IoT dashboards with pub-sub data synchronization
  - Building mobile and web backends with full-text search and geolocation queries
  - Deploying self-hosted backend infrastructure without cloud vendor lock-in
  - Creating AI agent memory systems with persistent real-time data storage
