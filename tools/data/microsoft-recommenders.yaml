name: Microsoft Recommenders
description: Open-source toolkit of best practices for building recommendation systems. Microsoft Recommenders ships notebooks, utilities, and algorithms for classical and deep recs so teams can benchmark SVD, SAR, NCF, and sequential models on standard datasets.
tagline: Best-practice toolkit for recommendation systems

github_url: https://github.com/recommenders-team/recommenders
website_url: https://recommenders-team.github.io/recommenders/intro.html
docs_url: https://recommenders-team.github.io/recommenders/intro.html
install_command: pip install recommenders

category: Data
tags: [python, recommender-systems, machine-learning, notebooks, microsoft, deep-learning]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Recommendation research is scattered across papers and one-off notebooks.
  Microsoft Recommenders collects evaluated algorithms, data loaders, and
  metrics in one Python toolkit so you can compare classical and deep recs
  without rebuilding evaluation from scratch.

use_cases:
  - Benchmark SAR, SVD, and neural collaborative filtering on a shared dataset
  - Follow Jupyter examples to train sequential recommenders for next-item prediction
  - Evaluate ranking metrics (NDCG, MAP, recall) with the toolkit's utilities
  - Prototype a recs service using the library's data splits and model wrappers
