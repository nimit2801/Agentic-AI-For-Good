name: DagsHub
description: Collaboration platform for ML data, models, experiments, and Git repos. Teams version datasets with DVC, track experiments, and host multimodal projects without standing up their own MLflow and DVC servers.
tagline: GitHub-style hub for data, models, and ML experiments

website_url: https://dagshub.com/
docs_url: https://dagshub.com/docs/
install_command: pip install dagshub

category: Data
tags: [mlops, dvc, experiment-tracking, datasets, collaboration, git]
pricing: freemium
is_open_source: false
license: Proprietary

problem_solved: |
  Data science teams need a shared home for Git, DVC data, and experiment
  logs. DagsHub hosts repos, datasets, and MLflow-compatible tracking so
  models and data stay versioned without a private MLOps stack.

use_cases:
  - Version training data with DVC while keeping code in Git on one hub
  - Log experiments to a hosted MLflow-compatible tracking server
  - Share multimodal datasets and model artifacts with a team
  - Connect local Python jobs to DagsHub with the official client
