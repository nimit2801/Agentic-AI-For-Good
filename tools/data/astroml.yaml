name: astroML
description: Python library for machine learning and data mining in astronomy. It ships example datasets, density estimation, and classification recipes so astrophysics teams apply scikit-learn-style methods to survey catalogs without rewriting boilerplate.
tagline: Machine learning and data mining for astronomy

github_url: https://github.com/astroML/astroML
website_url: https://www.astroml.org
docs_url: https://www.astroml.org

install_command: pip install astroML

category: Data
tags: [python, astronomy, machine-learning, statistics, scikit-learn, open-source]
pricing: free
is_open_source: true
license: BSD-2-Clause

problem_solved: |
  Astronomical catalogs need density estimation, dimensionality reduction, and
  classification, but general ML tutorials ignore survey selection and
  photometric errors. astroML packages astronomy-focused examples and
  algorithms on NumPy and scikit-learn so teams start from domain data.

use_cases:
  - Run density estimation on stellar catalogs with astronomy examples
  - Classify sources in survey data using packaged astroML datasets
  - Teach astronomical ML with notebooks that match real FITS catalogs
  - Compare clustering methods on simulated astrophysical point clouds
