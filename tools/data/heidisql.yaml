name: HeidiSQL
description: Lightweight Windows SQL client for MariaDB, MySQL, PostgreSQL, SQL Server, SQLite, Interbase, and Firebird. Browse schemas, edit rows, and run queries without a JVM or a web stack.
tagline: Lightweight multi-engine SQL client for Windows

github_url: https://github.com/heidisql/heidisql
website_url: https://www.heidisql.com/
docs_url: https://www.heidisql.com/help.php

category: Data
tags: [sql-client, mysql, postgresql, sqlite, windows, database, gui]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Windows data engineers often juggle phpMyAdmin, SSMS, and a JVM IDE just
  to look at MySQL and Postgres. HeidiSQL is a small native client that
  talks to MariaDB, MySQL, PostgreSQL, SQL Server, and SQLite from one
  window, so you can inspect feature-store tables without installing Java.

use_cases:
  - Browse a MySQL feature store and edit rows during local debugging
  - Run PostgreSQL queries against a RAG metadata database on Windows
  - Compare table data across SQL Server and MariaDB in one client
  - Export query results from SQLite experiment logs without a web UI
