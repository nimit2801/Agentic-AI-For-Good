name: InstantDB
description: "Local-first backend for AI-coded apps with auth, permissions, storage, presence, and realtime queries. You write relational queries in the shape of the data you want; Instant handles fetching, optimistic writes, offline cache, and multiplayer by default."
tagline: "Local-first backend with realtime queries and multiplayer"

github_url: https://github.com/instantdb/instant
website_url: https://instantdb.com
docs_url: https://instantdb.com/docs
install_command: npm install @instantdb/react

category: Data
tags: [local-first, realtime, database, react, multiplayer, offline, auth]
pricing: freemium
is_open_source: true
license: Apache-2.0

problem_solved: |
  Shipping a modern app still means standing up a database, auth, APIs, caches, and
  multiplayer plumbing before any UI ships. InstantDB collapses that stack into
  client-side relational queries with optimistic updates, offline cache, and presence,
  so AI-coded and human-coded apps can go from schema to realtime UI without a custom backend.

use_cases:
  - Build a realtime chat or collaborative app with Instant queries and optimistic writes
  - Add auth, permissions, and file storage without standing up a custom API
  - Keep an AI-generated React app online and offline with a local-first data layer
  - Sync presence and ephemeral cursors across users without a stateful socket server
