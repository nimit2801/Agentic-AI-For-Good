name: Zeebe
description: Cloud-native process engine at the core of Camunda 8. Orchestrates BPMN workflows across people, services, and devices with horizontal scale, Kafka-style messaging, and no required relational database for the engine itself.
tagline: Cloud-native BPMN process engine for Camunda 8

github_url: https://github.com/camunda/camunda
website_url: https://camunda.com/platform/
docs_url: https://docs.camunda.io/docs/components/zeebe/zeebe-overview/

category: Data
tags: [bpmn, workflow, orchestration, kafka, kubernetes, camunda]
pricing: freemium
is_open_source: true

problem_solved: |
  Multi-step ML and data pipelines that mix humans, APIs, and message queues
  outgrow cron and ad-hoc workers. Zeebe runs BPMN processes as a cloud-native
  engine you can deploy with Docker or Kubernetes, react to Kafka messages,
  and scale horizontally without a relational database for the core runtime.

use_cases:
  - Orchestrate human-plus-service approval flows as BPMN on Kubernetes
  - Drive data and ML pipelines that react to Kafka messages
  - Export process events for monitoring training or inference workflows
  - Run Camunda 8 Tasklist and Operate on top of Zeebe for ops and human tasks
