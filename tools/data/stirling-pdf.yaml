name: Stirling-PDF
description: Self-hosted web app for merging, splitting, OCR, and converting PDFs in the browser. Useful for document pipelines that need local PDF transforms without uploading files to a commercial editor.
tagline: Self-hosted PDF editor for merge, split, OCR, and convert

github_url: https://github.com/Stirling-Tools/Stirling-PDF
website_url: https://stirling.com
docs_url: https://docs.stirlingpdf.com

category: Data
tags: [pdf, ocr, self-hosted, documents, conversion, java]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  PDF merge, OCR, and conversion often means uploading files to a SaaS
  editor. Stirling-PDF is a self-hosted web app that runs those operations
  on your server so document pipelines keep sensitive PDFs local.

use_cases:
  - Merge, split, and OCR research PDFs on a private server
  - Convert scanned documents to searchable text before a RAG ingest
  - Rotate, watermark, and compress PDFs in a local document workflow
  - Replace commercial PDF editors for internal document processing
