name: mothur
description: mothur is an open-source microbial ecology package for 16S rRNA analysis. It covers OTU clustering, taxonomy, diversity, and community comparisons so labs can run amplicon studies from quality-filtered reads through statistical summaries.
tagline: End-to-end 16S analysis for microbial ecology

github_url: https://github.com/mothur/mothur
website_url: https://mothur.org
docs_url: https://mothur.org/wiki/main_page

category: Data
tags: [bioinformatics, microbiome, 16S, OTU, microbial-ecology, genomics]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  16S studies used to stitch many command-line tools with no shared
  formats. mothur puts quality filtering, OTU clustering, taxonomy,
  and diversity tests in one package so microbial ecology labs can
  run a documented SOP from raw reads to community stats.

use_cases:
  - Cluster 16S amplicons into OTUs with mothur SOP commands
  - Assign taxonomy and compute alpha and beta diversity
  - Compare communities across treatments with mothur stats
  - Follow the Schloss SOP for reproducible amplicon analysis
