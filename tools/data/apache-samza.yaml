name: Apache Samza
description: |-
  Distributed stream processing framework using Apache Kafka for messaging and Hadoop YARN for fault tolerance and resource management.
problem_solved: |-
  Data engineers need a scalable stream processing framework with managed state, fault tolerance, and processor isolation for real-time pipelines.
use_cases:
  - "Real-time stream processing"
  - "Kafka message transformation"
  - "Stateful event-driven computations"
  - "Large-scale data pipeline processing"
github_url: https://github.com/apache/samza
website_url: https://samza.apache.org/
docs_url: https://samza.apache.org/learn/documentation/latest/
category: Data
is_open_source: true
pricing: free
