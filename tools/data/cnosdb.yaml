name: CnosDB
description: CnosDB is a cloud-native open source distributed time series database with high performance, high compression ratio, and high availability. It is designed for IoT, DevOps, and observability workloads, providing SQL-native querying and horizontal scalability.
tagline: Cloud-native distributed time-series database

github_url: https://github.com/cnosdb/cnosdb
website_url: https://www.cnosdb.com
docs_url: https://docs.cnosdb.com/

category: Data
tags:
  - time-series
  - database
  - distributed
  - cloud-native
  - iot
  - observability
  - sql
  - rust
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Traditional time-series databases struggle with cloud-native scalability, efficient
  compression, and high availability for modern IoT and observability workloads.
  CnosDB addresses these challenges by providing a distributed architecture built
  in Rust with native SQL support, enabling teams to handle massive time-series
  ingestion while maintaining query performance and reducing storage costs through
  advanced compression algorithms.

use_cases:
  - "Store and query high-frequency IoT sensor data with SQL-native time-series operations"
  - "Build observability platforms for metrics and logs with horizontal scalability"
  - "Replace legacy TSDBs with a cloud-native distributed alternative for DevOps monitoring"
  - "Analyze industrial time-series data with standard SQL and built-in aggregation functions"