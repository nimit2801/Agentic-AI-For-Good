name: Reducto
description: Agentic document platform that parses, splits, extracts, classifies, and edits PDFs, scans, spreadsheets, and slides into citation-ready JSON. Mixes custom models with frontier LLMs so RAG and ops pipelines get layout-aware structure, not raw OCR text.
tagline: Parse messy documents into cited JSON for agents

website_url: https://reducto.ai
docs_url: https://docs.reducto.ai
install_command: pip install reductoai

category: Data
tags: [saas, documents, pdf, ocr, extraction, rag, python]
pricing: paid
is_open_source: false

problem_solved: |
  RAG and back-office automation break on tables, handwriting, and scanned
  forms because generic OCR dumps unstructured text. Reducto returns typed
  JSON with bounding boxes and citations across 30-plus file types so agents
  can extract, split, and edit documents without a custom parsing stack.

use_cases:
  - Parse scanned PDFs and spreadsheets into structured JSON with citations
  - Split multi-document packets into sections before chunking for RAG
  - Extract typed fields with bounding boxes for invoice or form automation
  - Classify inbound files with a plain-language taxonomy and route them
