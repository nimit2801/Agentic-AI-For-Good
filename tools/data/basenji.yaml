name: Basenji
description: Basenji predicts regulatory activity along DNA with deep convolutional networks. It models sequential genomic sequence to score promoters, enhancers, and chromatin signals so genomics teams can map how sequence drives transcription without one-off motif pipelines.
tagline: Convolutional models for genomic regulatory activity

github_url: https://github.com/calico/basenji

category: Data
tags: [python, genomics, deep-learning, convolutional-networks, chromatin, transcription]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Mapping how DNA sequence controls transcription usually means stitching
  motif scanners and one-off chromatin models. Basenji trains deep
  convolutional networks on sequential genomic sequence to predict
  regulatory activity, so labs can score promoters, enhancers, and
  variant effects from one sequence-to-activity model.

use_cases:
  - Predict chromatin and CAGE signal tracks from DNA sequence windows
  - Score noncoding variants for effects on regulatory activity
  - Train Basenji models on custom ENCODE or FANTOM training sets
  - Compare sequence-based regulatory maps across cell types
