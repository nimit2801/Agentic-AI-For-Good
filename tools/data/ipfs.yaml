name: IPFS
description: IPFS is a peer-to-peer hypermedia protocol for storing and sharing content-addressed data. The Kubo implementation provides a daemon, CLI, HTTP gateway, and RPC API for building decentralized applications.
tagline: Peer-to-peer content-addressed distributed file system

github_url: https://github.com/ipfs/kubo
website_url: https://ipfs.io
docs_url: https://docs.ipfs.tech

category: Data
tags: [p2p, distributed-storage, content-addressed, decentralized, ipfs, data]
pricing: free
is_open_source: true

problem_solved: |
  Centralized storage creates single points of failure, censorship risk, and bandwidth bottlenecks.
  IPFS replaces location-based addressing with content-based addressing, enabling distributed
  storage, deduplication, and resilient data retrieval across a peer-to-peer network.

use_cases:
  - Storing and serving static assets for decentralized web applications
  - Distributing large datasets and model artifacts across peer-to-peer networks
  - Building censorship-resistant content distribution and publishing platforms
  - Versioning and pinning data with immutable content-addressed identifiers
