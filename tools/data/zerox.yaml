name: Zerox
slug: zerox
category: Data
tagline: OCR and document extraction powered by vision models
description: |-
  Zerox is an OCR and document extraction tool powered by vision models. It converts PDFs, images, and scanned documents into structured markdown or text using multi-modal AI, with support for both Node.js and Python environments.
problem_solved: Extracting text and structure from PDFs and scanned documents traditionally requires complex OCR pipelines that struggle with layouts, tables, and formatting. Zerox uses vision models to understand document structure and produce clean, structured output automatically.
use_cases:
  - "Converting PDFs and scanned documents to structured markdown"
  - "Extracting tables and formatted text from image-based documents"
  - "Building automated document processing pipelines"
  - "Integrating OCR into Node.js or Python applications"
github_url: https://github.com/getomni-ai/zerox
website_url: https://getomni.ai/zerox
docs_url: https://github.com/getomni-ai/zerox
install_command: npm install zerox
license: MIT
pricing: free
is_open_source: true
tags:
  - ocr
  - document-extraction
  - vision-models
  - pdf