name: V7 Darwin
description: A training-data platform for images, video, and medical volumes with auto-annotate, workflow management, and a Python SDK. Darwin is V7's dataset and annotation product for computer vision teams that need labeling, QA, and dataset versioning in one place.
tagline: Computer vision labeling and dataset platform

website_url: https://www.v7labs.com
docs_url: https://docs.v7labs.com
github_url: https://github.com/v7labs/darwin-py

install_command: pip install darwin-py

category: Data
tags: [data-labeling, computer-vision, annotation, python, saas, medical-imaging]
pricing: paid
is_open_source: false

problem_solved: |
  Vision teams need auto-annotate, multi-stage review, and dataset versioning
  for images, video, and DICOM, not just a drawing canvas. V7 Darwin is a
  labeling and dataset platform with a Python SDK so you can upload data,
  run workflows, and export Darwin JSON or COCO into training jobs.

use_cases:
  - Label images and video with polygons, masks, bounding boxes, and attributes
  - Annotate medical volumes and DICOM with review workflows
  - Auto-annotate samples and send uncertain items to human review
  - Manage remote datasets and imports through the darwin-py SDK and CLI
