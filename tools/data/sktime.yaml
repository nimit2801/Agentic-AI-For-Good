name: sktime
description: "sktime is a unified Python framework for machine learning with time series. It offers scikit-learn-compatible estimators for forecasting, classification, regression, clustering, and transformation, with composable pipelines and a large registry of classical and neural models."
tagline: "Unified machine learning framework for time series"
github_url: https://github.com/sktime/sktime
website_url: https://www.sktime.net
docs_url: https://www.sktime.net/en/stable/index.html
install_command: "pip install sktime"
category: Data
tags:
  - python
  - time-series
  - forecasting
  - scikit-learn
  - classification
  - pipelines
pricing: free
is_open_source: true
license: BSD-3-Clause
problem_solved: "Time series ML is fragmented across forecasting libraries, feature extractors, and classifiers with incompatible APIs. sktime unifies forecasting, classification, regression, and clustering behind scikit-learn-style estimators so you can compose pipelines, swap models, and benchmark without rewriting glue code."
use_cases:
  - "Build forecasting pipelines that compose transformers and forecasters with a sklearn-like API"
  - "Classify or cluster time series using a shared estimator interface and model registry"
  - "Benchmark classical, statistical, and neural time series models on the same datasets"
  - "Deploy reduction forecasters that wrap tabular ML models for univariate prediction"
