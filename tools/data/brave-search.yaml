name: Brave Search
description: Independent web search API from Brave. Returns web, news, images, videos, and local results from Brave's own index so apps and agents can retrieve the open web without depending on Google or Bing APIs.
tagline: Independent search API from Brave's own index

website_url: https://api-dashboard.search.brave.com/documentation/services/web-search
docs_url: https://api-dashboard.search.brave.com/documentation/services/web-search

category: Data
tags: [web-search, api, rag, agents, privacy]
pricing: freemium
is_open_source: false

problem_solved: |
  Most search APIs resell Google or Bing, so you inherit their ranking,
  rate limits, and ToS. Brave Search exposes Brave's independent index as
  an API for web, news, images, and local results that agents can query
  without scraping.

use_cases:
  - Add independent web search to an agent or RAG pipeline
  - Query news, images, videos, or local POIs from Brave's index
  - Ground answers in live web results without a Google Custom Search key
  - Prototype privacy-oriented retrieval that does not depend on Big Tech SERPs
