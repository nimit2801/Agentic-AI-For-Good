name: folium
description: Python library that builds Leaflet.js maps from pandas and GeoJSON data. folium lets notebooks and dashboards render interactive street maps, choropleths, and markers without writing JavaScript.
tagline: Python Data. Leaflet.js maps.

github_url: https://github.com/python-visualization/folium
website_url: https://python-visualization.github.io/folium/
docs_url: https://python-visualization.github.io/folium/
install_command: pip install folium

category: Data
tags: [python, maps, geospatial, leaflet, visualization, pandas, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Geospatial analysis in Python needs interactive maps, not static plots.
  Writing Leaflet by hand is a web app. folium wraps Leaflet so notebooks
  can drop markers, choropleths, and GeoJSON layers from pandas without
  leaving the Python stack.

use_cases:
  - Plot lat-long points from a pandas DataFrame on an interactive map
  - Render a choropleth of regional metrics from GeoJSON boundaries
  - Embed a Leaflet map in a Jupyter notebook or Streamlit app
  - Overlay multiple GeoJSON layers for exploratory spatial analysis
