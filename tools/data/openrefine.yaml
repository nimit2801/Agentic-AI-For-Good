name: OpenRefine
description: Free open-source power tool for working with messy data. OpenRefine lets you explore, clean, transform, and reconcile tabular datasets with undo history, clustering, and reconciliation APIs before they feed ML or analytics pipelines.
tagline: Clean and transform messy tabular data in a spreadsheet-like UI

github_url: https://github.com/OpenRefine/OpenRefine
website_url: https://openrefine.org
docs_url: https://openrefine.org/docs

category: Data
tags: [data-cleaning, etl, csv, reconciliation, java, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Spreadsheets and one-off Python scripts do not scale for messy CSVs with
  inconsistent names, encodings, and duplicates. OpenRefine gives a faceted
  browser, clustering, and undoable transforms so data teams can clean and
  reconcile tables before training or warehouse loads without losing provenance.

use_cases:
  - Cluster messy vendor names in a CSV and merge them to a canonical form
  - Reconcile entity columns against Wikidata before building a knowledge graph
  - Explore facets of a large TSV to find encoding and null problems
  - Export cleaned tables to CSV or a database for downstream ML feature jobs
