name: CloudBeaver
description: Web-based database manager from the DBeaver team. CloudBeaver lets teams query Postgres, MySQL, and other engines from a browser so feature stores and agent databases can be inspected without installing a desktop SQL client.
tagline: Browser-based database manager from DBeaver

github_url: https://github.com/dbeaver/cloudbeaver
website_url: https://dbeaver.com/products/cloudbeaver/
docs_url: https://dbeaver.com/docs/cloudbeaver/

category: Data
tags: [sql, postgres, mysql, web, dbeaver, database]
pricing: freemium
is_open_source: true
license: Apache-2.0

problem_solved: |
  Desktop SQL clients do not scale to a team that needs shared access
  from any laptop. CloudBeaver is a browser UI over many databases so
  engineers can inspect schemas and run SQL against feature stores
  without installing DBeaver locally.

use_cases:
  - Query Postgres and MySQL from a browser during incident response
  - Give a team shared SQL access to a feature store without desktop installs
  - Inspect schemas across engines from one CloudBeaver workspace
  - Run ad-hoc SQL on agent databases from a locked-down laptop
