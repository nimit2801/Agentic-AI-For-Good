name: Clustal Omega
description: Clustal Omega is a scalable multiple sequence aligner for proteins and nucleic acids. It uses HMM-guided progressive alignment so labs can align tens of thousands of sequences for phylogeny, domain mapping, and protein-family analysis without ClustalW-scale runtimes.
tagline: HMM-guided multiple sequence alignment at scale

github_url: https://github.com/GSLBiotech/clustal-omega
website_url: http://www.clustal.org/omega/
docs_url: http://www.clustal.org/omega/

category: Data
tags: [bioinformatics, alignment, MSA, phylogenetics, proteins, genomics]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  ClustalW does not scale to modern protein families. Clustal Omega
  uses HMM-guided progressive alignment so labs can align tens of
  thousands of sequences for phylogeny and domain mapping without
  the older Clustal runtime wall.

use_cases:
  - Align a large protein family before phylogenetic tree building
  - Produce a nucleotide MSA for viral or amplicon gene analysis
  - Map conserved domains across a protein superfamily
  - Compare Clustal Omega alignments with MAFFT on a shared gene set
