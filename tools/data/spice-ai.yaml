name: Spice AI
slug: spice-ai
category: Data
tagline: Portable SQL query, search, and LLM-inference engine in Rust
description: |-
  Spice is a portable, accelerated SQL query, search, and LLM-inference engine in Rust. It federates data across sources for data-grounded AI apps and agents without building complex data pipelines.
problem_solved: Building data-grounded AI applications requires stitching together databases, vector stores, and LLM APIs with complex ETL pipelines. Spice provides a unified runtime that queries, searches, and runs inference across federated data sources directly from a lightweight local engine.
use_cases:
  - "Querying federated data sources with SQL for AI applications"
  - "Adding real-time analytics and search to operational databases"
  - "Running LLM inference grounded in local and remote datasets"
  - "Building multi-tenant AI agent deployments without per-tenant pipelines"
github_url: https://github.com/spiceai/spiceai
website_url: https://spice.ai
docs_url: https://docs.spiceai.org
install_command: curl https://install.spiceai.org | /bin/bash
license: Apache-2.0
pricing: free
is_open_source: true
tags:
  - sql
  - data-federation
  - llm-inference
  - rust