name: ThingsBoard
description: |-
  Open-source IoT platform for device management, data collection, processing and visualization. Supports SCADA dashboards, real-time telemetry, alarms, and notifications across edge and cloud deployments.
problem_solved: |-
  End-to-end IoT device lifecycle management with secure provisioning, real-time data visualization, rule-based automation, and scalable telemetry storage for industrial and consumer IoT deployments.
