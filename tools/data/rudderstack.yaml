name: Rudderstack
description: Open-source customer data platform that collects event streams and routes them to warehouses, lakes, and downstream tools for analytics and AI feature pipelines.
tagline: Open-source customer data platform for event pipelines

github_url: https://github.com/rudderlabs/rudder-server
website_url: https://www.rudderstack.com
docs_url: https://www.rudderstack.com/docs/

category: Data
tags: [customer-data-platform, event-streaming, etl, analytics, warehouse, privacy]
pricing: freemium
is_open_source: true
license: Elastic License 2.0

problem_solved: |
  Product and AI teams need first-party event data in warehouses and feature stores
  without sending everything through a closed SaaS collector. Rudderstack ingests
  events from apps and routes them to warehouses, lakes, and destinations so feature
  pipelines, personalization models, and analytics share one privacy-aware event stream.

use_cases:
  - Collect product events and land them in Snowflake, BigQuery, or a data lake
  - Feed first-party behavioral data into feature stores for personalization models
  - Replace a closed CDP with a self-hosted pipeline that you control
  - Fan out the same event stream to analytics, reverse ETL, and AI destinations
