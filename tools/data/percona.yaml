name: Percona
description: Drop-in MySQL and MongoDB compatible database servers with extra diagnostics, backup, and performance features used as the operational data layer for AI and analytics platforms.
tagline: Enhanced open-source MySQL and MongoDB compatible servers

github_url: https://github.com/percona/percona-server
website_url: https://www.percona.com
docs_url: https://docs.percona.com

category: Data
tags: [mysql, mongodb, database, oltp, open-source, backup, performance]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Teams that want MySQL or MongoDB compatibility often need deeper observability, faster
  backups, and production hardening than community servers provide. Percona Server adds
  extra diagnostics, backup tooling, and performance features while staying drop-in
  compatible, so AI platforms can keep transactional feature stores, experiment metadata,
  and application state on a battle-tested open-source engine without moving to a
  proprietary fork.

use_cases:
  - Run a MySQL-compatible operational store for AI application state and feature tables
  - Capture backups and diagnostics for production databases that feed ML pipelines
  - Replace community MySQL with extra observability without changing application SQL
  - Host high-throughput OLTP workloads that supply training and inference data
