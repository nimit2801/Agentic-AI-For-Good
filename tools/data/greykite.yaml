name: Greykite
description: "Greykite is LinkedIn's flexible forecasting library. Silverkite, its flagship algorithm, combines linear, seasonality, changepoint, and holiday effects with optional ML residuals, tuned for fast, interpretable forecasts on business time series."
tagline: "LinkedIn's flexible, interpretable forecasting library"
github_url: https://github.com/linkedin/greykite
website_url: https://github.com/linkedin/greykite
docs_url: https://linkedin.github.io/greykite/
install_command: "pip install greykite"
category: Data
tags:
  - python
  - time-series
  - forecasting
  - linkedin
  - seasonality
  - interpretable
pricing: free
is_open_source: true
license: BSD-2-Clause
problem_solved: "Business forecasts need holidays, changepoints, and seasonality that pure neural models hide and pure ARIMA models struggle to encode. Greykite's Silverkite algorithm is built for those calendar-aware series, giving fast, tunable, interpretable forecasts that LinkedIn-style growth and ops teams can explain."
use_cases:
  - "Forecast product metrics with holidays, seasonality, and automatic changepoint detection"
  - "Tune Silverkite models for short-horizon business planning and capacity forecasts"
  - "Explain forecast components (trend, seasonality, events) to non-ML stakeholders"
  - "Benchmark interpretable forecasts against Prophet-style additive models in Python"
