name: Clarifai
description: AI platform for computer vision, NLP, and multimodal models with a hosted model library, workflow builder, and Python SDK. Teams run classification, detection, and custom training without assembling a full MLOps stack.
tagline: Hosted computer vision and multimodal model platform

website_url: https://www.clarifai.com
docs_url: https://docs.clarifai.com

install_command: pip install clarifai

category: Data
tags: [computer-vision, multimodal, model-platform, python, saas, classification, detection]
pricing: freemium
is_open_source: false

problem_solved: |
  Vision teams often stitch labeling, training, and inference across
  several vendors. Clarifai is a hosted platform with a model library and
  SDK so you can classify, detect, and chain models in a workflow without
  standing up GPU serving yourself.

use_cases:
  - Classify or detect objects in images through the Clarifai API and Python SDK
  - Chain pretrained vision models into a hosted workflow for moderation
  - Train a custom visual classifier on a private dataset without managing GPUs
  - Run multimodal search over image and text embeddings in one platform
  - Prototype a computer vision feature before committing to self-hosted inference
