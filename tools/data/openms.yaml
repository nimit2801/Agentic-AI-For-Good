name: OpenMS
description: Open-source C++ library and toolset for LC-MS data management and analysis in proteomics and metabolomics. Includes 150+ TOPP tools, visualization, and pyOpenMS Python bindings for mzML pipelines.
tagline: LC-MS analysis library for proteomics and metabolomics

github_url: https://github.com/OpenMS/OpenMS
website_url: https://www.openms.de
docs_url: https://openms.readthedocs.io
install_command: pip install pyopenms

category: Data
tags: [mass-spectrometry, proteomics, metabolomics, python, c++, lc-ms]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  LC-MS proteomics and metabolomics pipelines need shared file formats,
  identification, and quantitation without rewriting peak-picking from scratch.
  OpenMS provides a C++ library, 150-plus TOPP tools, and pyOpenMS bindings so
  teams can process mzML data with label-free, SILAC, TMT, and DIA workflows.

use_cases:
  - Process mzML proteomics runs with TOPP tools for identification and quantitation
  - Bind OpenMS algorithms from Python with pyOpenMS for custom LC-MS pipelines
  - Run label-free, SILAC, iTRAQ, TMT, SRM, and SWATH quantitation protocols
  - Visualize 1D, 2D, and 3D mass spectrometry data in TOPPView
