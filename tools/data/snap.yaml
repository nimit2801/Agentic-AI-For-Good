name: SNAP
description: Stanford Network Analysis Platform, a C++ library for large-scale graph mining. SNAP handles graphs with hundreds of millions of nodes and edges, with structure analysis, community detection, and the Stanford large network dataset collection.
tagline: C++ library for large-scale network analysis

github_url: https://github.com/snap-stanford/snap
website_url: https://snap.stanford.edu
docs_url: https://snap.stanford.edu/snap/doc.html

category: Data
tags: [c++, graphs, network-analysis, graph-mining, datasets, community-detection]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Mining social and web graphs at Stanford scale needs a C++ library that
  stores huge sparse graphs without exploding memory. SNAP provides graph
  types, community and structure algorithms, and the SNAP dataset collection
  so you can analyze networks with hundreds of millions of edges in one
  platform.

use_cases:
  - Load and analyze web or social graphs with hundreds of millions of edges
  - Run community detection and motif counts on SNAP dataset graphs
  - Prototype graph mining algorithms against the SNAP C++ core
  - Download Stanford large network datasets for reproducible benchmarks
