name: Apache Lucene
description: >-
  A high-performance, full-featured text search engine library written in Java. Provides indexed full-text search with ranked retrieval, faceted search, highlighting, spell-checking, and near-real-time indexing. Powers the search capabilities of Elasticsearch, Solr, OpenSearch, and countless enterprise and AI applications that require fast text and vector retrieval over large document collections.
tagline: Industry-standard search library for full-text and vector retrieval
github_url: https://github.com/apache/lucene
website_url: https://lucene.apache.org
docs_url: https://lucene.apache.org/core/documentation.html

category: Data
tags: [search, full-text-search, indexing, information-retrieval, java, apache, text-search]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: >-
  AI applications that need to search, retrieve, or rank documents — from knowledge bases
  and RAG pipelines to semantic search and content discovery — require a fast, scalable
  indexing and retrieval engine. Building search from scratch is complex, error-prone, and
  hard to optimize. Apache Lucene solves this with a battle-tested Java library that
  provides inverted-index-based full-text search with ranked retrieval using TF-IDF and
  BM25 scoring, plus support for faceted search, highlighting, spell-checking, and
  near-real-time indexing. It has powered search over billions of documents for two decades
  and serves as the foundation for Elasticsearch, Solr, and OpenSearch.

use_cases:
  - Index and retrieve knowledge base documents for RAG pipelines with ranked relevance scoring
  - Power full-text search over large document collections in AI-powered content discovery and research platforms
  - Build custom semantic search systems that combine Lucene's BM25 ranking with external embedding similarity
  - Provide faceted search and filtering over metadata-rich document collections in data catalog and governance tools
  - Enable near-real-time indexing for applications that need search results reflecting recently ingested data within seconds
