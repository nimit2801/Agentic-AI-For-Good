name: PyMC
description: "PyMC is a Python library for Bayesian statistical modeling and probabilistic machine learning. It lets you specify models with a NumPy-like API and infer posteriors with NUTS, HMC, and variational methods built on PyTensor."
tagline: "Bayesian modeling and probabilistic programming in Python"
github_url: https://github.com/pymc-devs/pymc
website_url: https://www.pymc.io
docs_url: https://www.pymc.io/projects/docs/en/stable/learn.html
install_command: "pip install pymc"
category: Data
tags:
  - python
  - bayesian
  - probabilistic-programming
  - mcmc
  - statistics
  - pytensor
pricing: free
is_open_source: true
license: Apache-2.0
problem_solved: "Custom Bayesian models usually require hand-rolled MCMC or a steep Stan learning curve. PyMC lets data scientists write hierarchical models in Python, then sample posteriors with NUTS/HMC so uncertainty is first-class in experiment analysis, forecasting, and A/B decisioning."
use_cases:
  - "Fit hierarchical Bayesian models for experiment analysis and conversion rates"
  - "Propagate uncertainty through forecasting and causal-inference models in Python"
  - "Run NUTS or variational inference on custom probabilistic models without leaving NumPy-style code"
  - "Build Bayesian A/B tests and multi-level regressions for product metrics"
