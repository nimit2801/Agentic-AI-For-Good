name: NeuralForecast
description: "NeuralForecast is Nixtla's Python suite of scalable neural time series models. It wraps N-BEATS, N-HiTS, TFT, RNN, Transformer, and related architectures behind a scikit-learn-style API with automatic hyperparameter tuning, probabilistic outputs, and exogenous-variable support."
tagline: "User-friendly neural forecasting models in Python"
github_url: https://github.com/Nixtla/neuralforecast
website_url: https://nixtlaverse.nixtla.io/neuralforecast
docs_url: https://nixtlaverse.nixtla.io/neuralforecast
install_command: "pip install neuralforecast"
category: Data
tags:
  - python
  - time-series
  - forecasting
  - deep-learning
  - nixtla
  - pytorch
pricing: free
is_open_source: true
license: Apache-2.0
problem_solved: "Neural forecasting papers ship as one-off research code that is hard to productionize. Teams need a shared API for N-BEATS, N-HiTS, TFT, and recurrent models with probabilistic heads and exogenous features. NeuralForecast packages those architectures with a familiar fit/predict interface, distributed training options, and automatic model selection."
use_cases:
  - "Train N-BEATS, N-HiTS, or TFT models on panel time series with a scikit-learn-style API"
  - "Produce probabilistic forecasts with prediction intervals for demand and capacity planning"
  - "Include exogenous covariates and static features in neural forecasting pipelines"
  - "Auto-tune neural forecasting models across many series without writing custom training loops"
