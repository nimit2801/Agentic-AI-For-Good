name: MMOCR
description: OpenMMLab toolbox for text detection, recognition, and understanding in images and documents. MMOCR provides pretrained models, training pipelines, and evaluation tools for OCR tasks including scene text, document text, and key information extraction.
tagline: Open-source OCR toolbox for text detection and recognition

github_url: https://github.com/open-mmlab/mmocr
website_url: https://mmocr.readthedocs.io/en/dev-1.x/
docs_url: https://mmocr.readthedocs.io/en/dev-1.x/

install_command: pip install mmocr

category: Data
tags:
  - ocr
  - text-detection
  - text-recognition
  - computer-vision
  - document-understanding
  - open-source
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Extracting text from images, scanned documents, and natural scenes requires specialized models
  that can handle diverse fonts, layouts, languages, and image quality. Building OCR pipelines
  from scratch involves complex model architectures for text detection and recognition, dataset
  preparation, and evaluation benchmarks. MMOCR provides a unified framework with pretrained
  models, standardized training pipelines, and modular components so developers can deploy
  production-ready OCR without deep computer vision expertise.

use_cases:
  - Detect and recognize text in natural scene images for autonomous driving and robotics
  - Extract structured information from invoices, receipts, and forms for automated data entry
  - Build document digitization pipelines that convert scanned archives into searchable text
  - Develop multilingual OCR systems for global content processing and translation workflows
  - Fine-tune text detection models on custom datasets for specialized domain applications