name: Plotly
description: Interactive graphing library for Python, R, and JavaScript. Plotly builds charts that zoom, hover, and export as HTML so notebooks and ML dashboards can share exploratory visualizations without a separate BI tool.
tagline: Interactive graphing for Python and the web

github_url: https://github.com/plotly/plotly.py
website_url: https://plotly.com/python/
docs_url: https://plotly.com/python/
install_command: pip install plotly

category: Data
tags: [python, visualization, charts, jupyter, data-science, javascript]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Static matplotlib figures do not zoom or hover, and BI tools sit outside
  the notebook. Plotly produces interactive charts from Python (and JS/R)
  that export as HTML, so experiment tracking, evaluation plots, and data
  exploration stay in the same workflow as the model code.

use_cases:
  - Plot training curves and evaluation metrics with hover tooltips in Jupyter
  - Export interactive HTML charts for sharing experiment results with non-Python stakeholders
  - Build scatter, heatmap, and 3D plots for embedding and clustering analysis
  - Embed Plotly figures in Dash or Streamlit apps for model-monitoring dashboards
