name: MakeSense
description: A free browser-based image labeling tool for computer vision datasets. Draw bounding boxes, polygons, lines, and points on photos, then export Pascal VOC XML or COCO JSON without installing software — open the site and start labeling.
tagline: Free in-browser photo labeling for computer vision datasets

github_url: https://github.com/SkalskiP/make-sense
website_url: https://makesense.ai

category: Data
tags: [data-labeling, annotation, computer-vision, image-annotation, coco, pascal-voc, browser, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Small computer vision projects need labeled images, but desktop annotation
  suites and enterprise labeling platforms are heavy to install or pay for.
  MakeSense runs entirely in the browser so you can label photos locally,
  export VOC or COCO, and skip server setup for early dataset work.

use_cases:
  - Label a small object-detection dataset with bounding boxes and export Pascal VOC XML
  - Draw polygons or lines on photos and download COCO JSON for training
  - Run a self-hosted copy in Docker when images cannot leave your machine
  - Use on-device SSD or PoseNet suggestions to speed up bbox and pose labeling
  - Prepare a first-pass CV dataset without creating accounts or installing an IDE
