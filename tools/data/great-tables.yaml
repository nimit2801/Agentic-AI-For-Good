name: Great Tables
description: Python library for publication-quality tables from DataFrames. Great Tables composes headers, spanners, footnotes, and formatted columns so ML reports and experiment summaries render as HTML or other display tables without hand-written markup.
tagline: Publication-quality tables from Python DataFrames

github_url: https://github.com/posit-dev/great-tables
website_url: https://posit-dev.github.io/great-tables/
docs_url: https://posit-dev.github.io/great-tables/
install_command: pip install great-tables

category: Data
tags: [python, tables, dataframe, reporting, visualization, html]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Experiment metrics and data dictionaries usually dump as plain DataFrame
  prints or ad-hoc HTML. Great Tables lets Python pipelines compose
  headers, grouped spanners, footnotes, and formatted columns into
  publication-quality display tables for reports and docs.

use_cases:
  - Render a model comparison table with grouped metric spanners
  - Publish a data dictionary with footnotes and unit columns
  - Format evaluation results as HTML for a weekly experiment report
  - Style a pandas summary table for a paper or internal dashboard
