name: Diffgram
description: An open-source AI datastore for schemas, blobs, and predictions with built-in human supervision, data workflows, and a UI catalog. Teams use it to version training data, review model outputs, and keep labeling in the same system as files and metadata.
tagline: Open-source AI datastore with human supervision

github_url: https://github.com/diffgram/diffgram
website_url: https://diffgram.com
docs_url: https://diffgram.readme.io

install_command: pip install diffgram

category: Data
tags: [data-labeling, annotation, training-data, computer-vision, open-source, python]
pricing: freemium
is_open_source: true

problem_solved: |
  ML teams store files in object storage, labels in spreadsheets, and predictions
  in yet another tool, so human review never sits next to the data. Diffgram is
  an AI datastore plus UI for schemas, blobs, and predictions so labeling, QA,
  and dataset versioning happen in one system.

use_cases:
  - Store and version training images, video, and metadata for computer vision
  - Run human review workflows on model predictions next to the source files
  - Catalog datasets and export labeled data into training pipelines
  - Use the Python SDK to upload files, create tasks, and pull annotations
