name: Encord
description: Data platform for labeling, curating, and evaluating multimodal training data, with a Python SDK to manage annotation workflows, quality metrics, and active learning for computer vision and multimodal models.
tagline: Label, curate, and evaluate multimodal training data

website_url: https://encord.com
docs_url: https://docs.encord.com

install_command: pip install encord

category: Data
tags: [data-labeling, computer-vision, annotation, python, multimodal, saas]
pricing: freemium
is_open_source: false

problem_solved: |
  Vision and multimodal models fail when labels are inconsistent and you cannot
  find the bad slices. Encord is a data platform plus Python SDK for annotation,
  curation, and eval so teams can manage training data quality without a
  spreadsheet of bounding boxes.

use_cases:
  - Run annotation workflows for images, video, and DICOM in one platform
  - Pull labeled datasets into training jobs through the Python SDK
  - Score label quality and find slices that hurt model metrics
  - Close the loop from model errors back to relabeling tasks
