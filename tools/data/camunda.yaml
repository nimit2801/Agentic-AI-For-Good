name: Camunda
description: Process orchestration platform for BPMN and DMN workflows. Runs Zeebe-based automation so human tasks, microservices, and AI steps can be modeled, executed, and observed as durable business processes.
tagline: BPMN process orchestration for services and people

github_url: https://github.com/camunda/camunda
website_url: https://camunda.com/platform/
docs_url: https://docs.camunda.io/

category: Data
tags: [bpmn, workflow, orchestration, zeebe, java, process-automation]
pricing: freemium
is_open_source: true

problem_solved: |
  Multi-step business processes that mix APIs, humans, and AI usually live
  in ad hoc code with no diagram or retry story. Camunda models those flows
  in BPMN and runs them on Zeebe so you get durable orchestration, task
  lists, and observability.

use_cases:
  - Orchestrate a loan or claims process that mixes APIs and human review
  - Model microservice sagas as BPMN instead of scattered retry code
  - Add an LLM or agent step inside a durable Camunda process
  - Operate long-running workflows with Operate dashboards and Tasklist
