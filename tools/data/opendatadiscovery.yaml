name: OpenDataDiscovery
description: OpenDataDiscovery is the first open-source data discovery and observability platform. It provides unified data cataloging, lineage tracking, and quality monitoring across data lakes, warehouses, and pipelines, enabling data practitioners to find, trust, and understand their data assets.
tagline: Open-source data discovery and observability platform

github_url: https://github.com/opendatadiscovery/odd-platform
website_url: https://opendatadiscovery.org
docs_url: https://docs.opendatadiscovery.org/

category: Data
tags:
  - data-catalog
  - data-discovery
  - data-lineage
  - data-observability
  - data-governance
  - metadata
pricing: free
is_open_source: true
license: Apache 2.0

problem_solved: |
  Data teams struggle to find, understand, and trust data assets across sprawling
  data ecosystems. Spreadsheets and documentation quickly become stale, while
  commercial data catalogs are expensive and lock teams into proprietary platforms.
  OpenDataDiscovery solves this by providing an open-source unified data discovery
  and observability platform with automated metadata collection, interactive lineage
  visualization, data quality alerts, and a searchable catalog interface.

use_cases:
  - "Build a unified data catalog with automated metadata ingestion from Snowflake, BigQuery, and Postgres"
  - "Visualize end-to-end data lineage across ETL pipelines to understand downstream impacts"
  - "Monitor data quality and set up alerts for schema drift and anomalous data patterns"
  - "Enable self-service data discovery so analysts can find and understand relevant datasets"