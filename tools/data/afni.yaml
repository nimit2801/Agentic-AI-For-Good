name: AFNI
description: AFNI (Analysis of Functional NeuroImages) is a suite of programs for looking at and analyzing MRI brain images across planning, preprocessing, quality control, and statistics. It covers fMRI, structural MRI, and diffusion imaging with scriptable slice and surface viewers.
tagline: MRI analysis suite for fMRI, structural, and diffusion data

github_url: https://github.com/afni/afni
website_url: https://afni.nimh.nih.gov/
docs_url: https://afni.nimh.nih.gov/pub/dist/doc/htmldoc/

category: Data
tags: [neuroimaging, mri, fmri, python, c, medical-imaging]
pricing: free
is_open_source: true
license: Public Domain

problem_solved: |
  Functional MRI analysis needs preprocessing, quality control, statistics,
  and visualization that stay consistent across studies. AFNI provides a
  public-domain suite of C, Python, and R tools plus scriptable viewers so
  labs can process task, rest, and multi-echo fMRI, inspect results, and
  generate figures without a closed commercial neuroimaging stack.

use_cases:
  - Preprocess and statistically analyze task-based or resting-state fMRI
  - Quality-check MRI acquisitions with AFNI system checks and QC tools
  - View slice and surface data with scripted figure generation
  - Process diffusion MRI or adapt AFNI tools to EEG, MEG, and ECoG
