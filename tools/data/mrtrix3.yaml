name: MRtrix3
description: MRtrix3 is a toolkit for advanced diffusion MRI analysis, including constrained spherical deconvolution, probabilistic tractography, and apparent fibre density. It gives neuroimaging labs command-line tools for white-matter imaging beyond the tensor model.
tagline: Advanced diffusion MRI analysis and tractography

github_url: https://github.com/MRtrix3/mrtrix3
website_url: https://www.mrtrix.org
docs_url: https://mrtrix.readthedocs.io/

category: Data
tags: [neuroimaging, dwi, tractography, mri, white-matter, medical-imaging]
pricing: free
is_open_source: true
license: MPL-2.0

problem_solved: |
  Diffusion tensor tools miss crossing fibres and quantitative fibre density
  that modern DWI protocols can support. MRtrix3 implements CSD, probabilistic
  tractography, and AFD so labs can map white-matter pathways and produce
  analysis-ready tract images for research or ML datasets.

use_cases:
  - Run constrained spherical deconvolution on multi-shell DWI
  - Generate probabilistic tractography of white-matter pathways
  - Compute apparent fibre density and track-density images
  - Build diffusion MRI preprocessing and analysis pipelines for group studies
