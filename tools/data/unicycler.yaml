name: Unicycler
description: Unicycler is a hybrid assembler for bacterial genomes that combines Illumina short reads with long reads. It produces complete circular chromosomes and plasmids so microbiology labs can finish assemblies that short-read SPAdes graphs leave fragmented.
tagline: Hybrid assembler for complete bacterial genomes

github_url: https://github.com/rrwick/Unicycler
website_url: https://github.com/rrwick/Unicycler
docs_url: https://github.com/rrwick/Unicycler

category: Data
tags: [bioinformatics, genome-assembly, bacteria, long-read, illumina, genomics]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Short-read bacterial assemblies stop at fragmented graphs. Unicycler
  bridges Illumina accuracy with long-read spans so labs can close
  chromosomes and plasmids instead of publishing dozens of contigs
  per isolate.

use_cases:
  - Finish a bacterial chromosome from Illumina plus Nanopore reads
  - Recover circular plasmids from a hybrid isolate assembly
  - Compare Unicycler complete genomes against SPAdes short-read drafts
  - Assemble outbreak isolates for core-genome phylogeny
