name: openGemini
description: |-
  CNCF sandbox project, cloud-native distributed time-series database with high concurrency, high performance, and high scalability. Compatible with InfluxDB v1.x Line Protocol, InfluxQL and read/write APIs.
problem_solved: |-
  Storing and querying massive telemetry and time-series data with high cardinality support, compression ratios up to 15:1, and flexible deployment across VMs, containers, and clouds.
use_cases:
  - "Time-series telemetry storage for IoT and cloud-native apps"
  - "Prometheus remote read/write backend with PromQL support"
  - "openTelemetry metrics backend storage"
  - "High-cardinality observability data ingestion and analysis"
github_url: https://github.com/openGemini/openGemini
website_url: https://www.opengemini.org
docs_url: https://docs.opengemini.org/guide
category: Data
tags:
  - time-series
  - database
  - observability
  - cncf
  - go
pricing: free
is_open_source: true
license: Apache-2.0
