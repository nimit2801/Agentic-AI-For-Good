name: lenstronomy
description: Multi-purpose strong-lens modelling package for imaging, time delays, and kinematics. lenstronomy fits lens mass and light so gravitational-lensing pipelines model systems without a custom ray-tracing stack.
tagline: Strong gravitational lens modelling in Python

github_url: https://github.com/lenstronomy/lenstronomy
website_url: https://lenstronomy.readthedocs.io
docs_url: https://lenstronomy.readthedocs.io
install_command: pip install lenstronomy

category: Data
tags: [python, astronomy, gravitational-lensing, modelling, astropy, scientific]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Strong-lens papers need mass, light, and time-delay
  models, but groups rewrite ray tracers per system.
  lenstronomy fits imaging and kinematics so lensing
  pipelines model lenses without a custom stack.

use_cases:
  - Fit a galaxy-galaxy strong lens from HST imaging
  - Model time delays jointly with lens kinematics
  - Simulate a lensed quasar for a survey forecast
  - Build a lens-modelling notebook on public SLACS data
