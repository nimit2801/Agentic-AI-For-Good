name: Easy Dataset
description: |-
  A powerful tool for creating fine-tuning datasets for Large Language Models with document parsing, intelligent segmentation, and data cleaning.
problem_solved: |-
  Developers need an intuitive way to convert domain-specific documents into high-quality structured datasets for LLM fine-tuning and RAG.
use_cases:
  - "LLM fine-tuning dataset creation"
  - "RAG evaluation datasets"
  - "Multi-turn dialogue generation"
  - "Model performance benchmarking"
github_url: https://github.com/ConardLi/easy-dataset
website_url: https://docs.easy-dataset.com/ed/en
docs_url: https://docs.easy-dataset.com/ed/en
category: Data
is_open_source: true
pricing: free
