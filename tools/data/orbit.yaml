name: Orbit
description: "Orbit is Uber's Python package for Bayesian time series forecasting. It wraps probabilistic models such as DLT, LGT, and KTR with an object-oriented API, posterior sampling, and diagnostics so teams can produce interpretable forecasts with uncertainty."
tagline: "Bayesian time series forecasting from Uber"
github_url: https://github.com/uber/orbit
website_url: https://orbit-ml.readthedocs.io/en/stable/
docs_url: https://orbit-ml.readthedocs.io/en/stable/
install_command: "pip install orbit-ml"
category: Data
tags:
  - python
  - time-series
  - forecasting
  - bayesian
  - uber
  - probabilistic
pricing: free
is_open_source: true
license: Apache-2.0
problem_solved: "Bayesian structural time series models are powerful but painful to productionize from research code. Orbit packages DLT, LGT, and kernel trend regression behind a fit/predict API with posterior samples, so product and ops teams can ship interpretable forecasts with credible intervals."
use_cases:
  - "Fit Bayesian DLT or LGT models for demand and marketplace metric forecasting"
  - "Produce posterior predictive intervals instead of point forecasts for planning"
  - "Include regressors and seasonality in interpretable structural time series models"
  - "Diagnose forecast fit with Orbit plotting and residual utilities"
