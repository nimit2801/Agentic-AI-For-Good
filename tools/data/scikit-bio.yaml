name: scikit-bio
description: Community-driven Python library for bioinformatics data structures, algorithms, and teaching. Teams work with sequences, alignments, phylogenies, and diversity metrics in a NumPy-friendly API used across microbiome and genomics workflows.
tagline: Python bioinformatics library for sequences and phylogenies

github_url: https://github.com/scikit-bio/scikit-bio
website_url: https://scikit.bio
docs_url: https://scikit.bio
install_command: pip install scikit-bio

category: Data
tags: [python, bioinformatics, genomics, sequences, phylogeny, numpy, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Bioinformatics pipelines need shared sequence, alignment, and phylogeny types instead of one-off NumPy arrays. scikit-bio is a community Python library so microbiome and genomics teams can analyze biological data with documented algorithms and teaching resources.

use_cases:
  - Represent DNA, RNA, and protein sequences in Python analysis pipelines
  - Compute phylogenetic trees and diversity metrics on microbiome tables
  - Teach bioinformatics algorithms with scikit-bio notebooks
  - Align sequences and feed results into downstream ML feature pipelines
