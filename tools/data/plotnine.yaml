name: plotnine
description: A Python grammar-of-graphics library modeled on ggplot2. Build plots from data, aesthetics, geoms, facets, and themes so exploratory charts and publication figures stay consistent and composable.
tagline: ggplot2-style grammar of graphics for Python

github_url: https://github.com/has2k1/plotnine
website_url: https://plotnine.org
docs_url: https://plotnine.org

category: Data
tags: [python, visualization, ggplot, grammar-of-graphics, plotting, data-science]
pricing: free
is_open_source: true
license: MIT
install_command: pip install plotnine

problem_solved: |
  Python data work often jumps between Matplotlib low-level APIs and ad-hoc styling, so charts become hard to reuse and easy to get wrong. Plotnine gives a ggplot2-style grammar: map columns to aesthetics, add layers, facet panels, and theme the result. That makes exploratory analysis and publication figures declarative, consistent, and easier to iterate without rewriting plot code.

use_cases:
  - Compose layered scatter, line, and smooth plots from pandas dataframes for exploratory analysis
  - Facet model metrics by dataset or experiment so training diagnostics stay comparable
  - Produce publication figures with shared themes, scales, and labels across a research notebook
