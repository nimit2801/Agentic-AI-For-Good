name: PhysicsNeMo
description: PhysicsNeMo is an open-source deep-learning framework for building, training, and fine-tuning deep learning models using state-of-the-art Physics-ML methods. It enables researchers and engineers to create physics-informed neural networks and surrogate models for scientific simulations across domains like fluid dynamics, weather, and materials science.
tagline: Physics-informed deep learning framework for scientific simulations

github_url: https://github.com/NVIDIA/physicsnemo
website_url: https://developer.nvidia.com/physicsnemo
docs_url: https://docs.nvidia.com/deeplearning/physicsnemo/

install_command: pip install physicsnemo

category: Data
tags:
  - deep-learning
  - physics-informed
  - scientific-computing
  - nvidia
  - pytorch
  - simulation
  - fluid-dynamics
pricing: free
is_open_source: true
license: Apache 2.0

problem_solved: |
  Traditional numerical simulators for physics problems are computationally expensive
  and slow, making real-time inference and large parameter sweeps impractical.
  PhysicsNeMo addresses this by providing a modular framework for training
  physics-informed neural networks and neural operators that learn to approximate
  physical systems orders of magnitude faster than conventional solvers, while
  maintaining accuracy through physics-based constraints.

use_cases:
  - "Train surrogate models for computational fluid dynamics simulations with neural operators"
  - "Build physics-informed neural networks that incorporate conservation laws and boundary conditions"
  - "Accelerate weather and climate model inference by replacing expensive numerical solvers"
  - "Create digital twins for industrial systems combining sensor data with physics-based deep learning"