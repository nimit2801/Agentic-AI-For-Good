name: Raster Vision
description: Raster Vision is an open source library and framework for deep learning on satellite and aerial imagery. It provides a unified pipeline for training computer vision models on geospatial raster data, supporting semantic segmentation, object detection, and chip classification workflows with built-in data augmentation and model evaluation.
tagline: Deep learning framework for satellite and aerial imagery

github_url: https://github.com/azavea/raster-vision
website_url: https://docs.rastervision.io
docs_url: https://docs.rastervision.io/

install_command: pip install rastervision

category: Data
tags:
  - computer-vision
  - geospatial
  - deep-learning
  - satellite-imagery
  - semantic-segmentation
  - object-detection
  - remote-sensing
pricing: free
is_open_source: true
license: Apache 2.0

problem_solved: |
  Training deep learning models on geospatial raster data requires specialized pipelines
  for tiling large images, handling multi-band imagery, and managing coordinate reference
  systems. Raster Vision eliminates this complexity by providing a unified framework
  specifically designed for satellite and aerial imagery, with built-in support for
  common geospatial data formats, automatic dataset splitting, and model training
  workflows optimized for remote sensing tasks.

use_cases:
  - "Perform land cover classification and semantic segmentation on satellite imagery"
  - "Detect objects like buildings, vehicles, and infrastructure in aerial photography"
  - "Monitor deforestation and environmental changes using time-series remote sensing data"
  - "Train chip classification models for rapid disaster assessment from drone imagery"