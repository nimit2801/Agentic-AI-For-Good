name: Querydsl
description: A unified query framework for Java that provides a fluent, type-safe API for querying databases, JPA, MongoDB, and more.
tagline: Type-safe queries across SQL, JPA, and NoSQL for Java

github_url: https://github.com/querydsl/querydsl
website_url: https://querydsl.com
docs_url: https://querydsl.com/static/querydsl/latest/reference/html/index.html

category: Data
tags: [java, sql, jpa, mongodb, query, type-safe, orm]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Writing raw SQL or JPQL queries in Java is error-prone and lacks compile-time safety. Querydsl
  replaces string-based queries with a fluent, type-safe API that auto-completes in your IDE,
  catches errors at compile time, and works across SQL, JPA, MongoDB, and Lucene backends.

use_cases:
  - Build type-safe SQL queries with IDE auto-completion instead of error-prone string concatenation
  - Query JPA entities using a fluent API that catches column name mismatches at compile time
  - Write MongoDB queries with the same unified syntax across different database backends
  - Generate query metadata automatically from domain models to eliminate manual mapping maintenance
