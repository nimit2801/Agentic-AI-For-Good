name: Galaxy
description: Web platform for accessible, reproducible data-intensive science. Researchers run tools and workflows in the browser with history tracking so bioinformatics and ML preprocessing stay shareable without each user managing a cluster login.
tagline: Data-intensive science for everyone

github_url: https://github.com/galaxyproject/galaxy
website_url: https://galaxyproject.org
docs_url: https://docs.galaxyproject.org

category: Data
tags: [workflow, bioinformatics, reproducible-research, web, scientific, open-source]
pricing: free
is_open_source: true
license: AFL-3.0

problem_solved: |
  Scientific compute is locked behind CLI and cluster accounts that many
  collaborators cannot use. Galaxy is a web workbench with tool wrappers,
  histories, and shared workflows, so teams run data-prep and analysis
  pipelines reproducibly from the browser.

use_cases:
  - Share a browser workflow that prepares datasets for an ML model
  - Track analysis history so a paper figure can be regenerated
  - Wrap a command-line scientific tool for non-CLI collaborators
  - Run community Galaxy servers for teaching data-intensive science
