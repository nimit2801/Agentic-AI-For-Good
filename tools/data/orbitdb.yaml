name: OrbitDB
description: |-
  Serverless, distributed, peer-to-peer database using IPFS for storage and Libp2p for sync. Built on Merkle-CRDTs for conflict-free writes.
problem_solved: |-
  Developers need a decentralized database for local-first and peer-to-peer applications that works without central servers.
use_cases:
  - "Decentralized app data storage"
  - "Local-first web applications"
  - "Blockchain application databases"
  - "P2P message queues"
github_url: https://github.com/orbitdb/orbitdb
website_url: https://orbitdb.org
docs_url: https://github.com/orbitdb/orbitdb/blob/master/API.md
install_command: npm install @orbitdb/core helia
category: Data
is_open_source: true
pricing: free
