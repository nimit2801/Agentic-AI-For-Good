name: Segments.ai
description: A multi-sensor data labeling platform for robotics and computer vision, covering 2D images and 3D point clouds. It offers ML-assisted segmentation, cuboids, and sequence tracking plus a Python SDK so teams can label camera and lidar data, review quality, and export training sets.
tagline: Multi-sensor labeling for images and 3D point clouds

website_url: https://segments.ai
docs_url: https://docs.segments.ai
github_url: https://github.com/segments-ai/segments-ai

install_command: pip install segments-ai

category: Data
tags: [data-labeling, annotation, computer-vision, point-cloud, robotics, python, saas]
pricing: freemium
is_open_source: false

problem_solved: |
  Robotics and autonomous driving datasets mix cameras and lidar, so labeling
  in separate 2D and 3D tools produces inconsistent tracks and slow QA. Segments.ai
  is a multi-sensor annotation platform with ML-assisted segmentation, cuboids,
  and sequence tracking, plus a Python SDK to upload samples, manage releases,
  and export labels into training pipelines.

use_cases:
  - Label 2D images with segmentation, bounding boxes, polygons, polylines, and keypoints
  - Annotate 3D point clouds with cuboids, vectors, and segmentation for lidar datasets
  - Track objects across image and point-cloud sequences with keyframe interpolation
  - Run model-assisted labeling with Superpixel, Autosegment, and SAM-style tools
  - Export dataset releases and drive annotation from the Python SDK
