name: anvi'o
description: anvi'o is an analysis and visualization platform for microbial genomes and metagenomes. It integrates assembly, binning, phylogenomics, and interactive views so teams can explore multi-omics datasets in one environment.
tagline: Integrated analysis and visualization for microbial omics

github_url: https://github.com/merenlab/anvio
website_url: https://anvio.org
docs_url: https://anvio.org/help
install_command: pip install anvio

category: Data
tags: [python, bioinformatics, metagenomics, visualization, binning, phylogenomics]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Microbial genome and metagenome analysis usually splits across assemblers,
  binners, and ad hoc plots. anvi'o keeps contigs, profiles, and phylogenomic
  data in one interactive platform so teams can inspect bins and pangenomes
  without stitching several tools by hand.

use_cases:
  - Profile metagenomic BAM files and refine genome bins interactively
  - Build a microbial pangenome with anvi'o collections and displays
  - Combine phylogenomics and functional annotations in one project
  - Share an interactive anvi'o view of a MAG or isolate collection
