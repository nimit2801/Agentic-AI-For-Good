name: Kats
description: "Kats is Meta's kit to analyze time series. It covers forecasting, anomaly detection, change-point detection, and feature extraction in one Python toolkit, with models ranging from classical statistical methods to neural networks and a consistent analysis API."
tagline: "Meta's toolkit for time series analysis and forecasting"
github_url: https://github.com/facebookresearch/Kats
website_url: https://github.com/facebookresearch/Kats
docs_url: https://facebookresearch.github.io/Kats/
install_command: "pip install kats"
category: Data
tags:
  - python
  - time-series
  - forecasting
  - anomaly-detection
  - change-point
  - meta
pricing: free
is_open_source: true
license: MIT
problem_solved: "Teams often juggle separate libraries for forecasting, anomaly detection, and change-point analysis. Kats packages those tasks in one toolkit so you can characterize a series, detect breaks, forecast, and extract features without switching stacks for each step of time series analysis."
use_cases:
  - "Detect anomalies and change points in production metrics and product time series"
  - "Forecast future trends with statistical and neural models from a single Python API"
  - "Extract time series features for downstream classification or clustering models"
  - "Run multivariate and ensemble forecasting experiments without assembling ad hoc scripts"
