name: Kili
description: Enterprise data annotation and AI evaluation platform for image, video, text, documents, geospatial, and audio. Teams run labeling, review, and post-training data work with quality checks, SaaS, hybrid, or on-prem deploy.
tagline: Annotation and AI evaluation platform for expert labeling

website_url: https://kili-technology.com/
docs_url: https://docs.kili-technology.com/docs/getting-started-with-kili
install_command: pip install kili

category: Data
tags: [annotation, labeling, evaluation, computer-vision, nlp, saas]
pricing: paid
is_open_source: false
license: Proprietary

problem_solved: |
  High-stakes models need expert labels and review evidence, not ad hoc
  spreadsheets. Kili gives labeling, consensus, and evaluation workflows
  for images, video, text, and documents, with SaaS or on-prem deploy.

use_cases:
  - Label images, video, and documents for detection and extraction models
  - Run consensus and honeypot checks so annotation quality is measurable
  - Collect expert review for LLM evaluation and post-training datasets
  - Drive labeling from Python with the Kili SDK instead of only the UI
