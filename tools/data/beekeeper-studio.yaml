name: Beekeeper Studio
description: Modern open-source SQL client for Postgres, MySQL, SQLite, SQL Server, and more. Beekeeper Studio gives data and ML engineers a fast desktop editor for querying feature stores, inspecting agent databases, and exploring schemas without a heavy IDE.
tagline: Modern SQL editor for Postgres, MySQL, and SQLite

github_url: https://github.com/beekeeper-studio/beekeeper-studio
website_url: https://www.beekeeperstudio.io
docs_url: https://docs.beekeeperstudio.io
install_command: brew install --cask beekeeper-studio

category: Data
tags: [sql, postgres, mysql, sqlite, desktop, database]
pricing: freemium
is_open_source: true
license: GPL-3.0

problem_solved: |
  Querying Postgres, MySQL, and SQLite from one place usually means a dated
  GUI or a paid suite. Beekeeper Studio is a cross-platform SQL editor with
  a GPLv3 community edition so ML and data teams can inspect feature stores,
  agent databases, and local SQLite files without switching tools.

use_cases:
  - Query a Postgres feature store and a local SQLite agent DB in one window
  - Inspect schemas and run ad-hoc SQL while debugging RAG pipelines
  - Connect to MySQL, Postgres, and SQL Server from Linux, macOS, or Windows
  - Save and rerun notebooks of SQL against training and inference databases
