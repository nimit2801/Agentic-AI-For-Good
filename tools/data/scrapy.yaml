name: Scrapy
description: "High-performance web scraping and crawling framework for Python, providing an asynchronous engine, selectors, pipelines, and middleware for extracting structured data from websites at scale. Scrapy handles request scheduling, concurrency, retries, and data export out of the box."
tagline: "High-performance web scraping framework for Python"
github_url: https://github.com/scrapy/scrapy
website_url: https://scrapy.org
docs_url: https://docs.scrapy.org
install_command: pip install scrapy
category: Data
tags:
  - web-scraping
  - crawling
  - python
  - data-extraction
  - automation
pricing: free
is_open_source: true
license: BSD-3-Clause
problem_solved: "AI and ML teams need large volumes of structured data from websites to build training datasets, but manual data collection is slow and error-prone. Custom scraping scripts lack error handling, concurrency, and scalability, breaking on site structure changes and failing to extract data reliably at scale. Scrapy provides a battle-tested asynchronous engine with built-in request scheduling, auto-throttling, retry logic, item pipelines for data cleaning, and middleware for rotating user agents and proxies — enabling teams to extract millions of structured records from hundreds of sites with reliable, maintainable code."
use_cases:
  - "Collect training data for ML models by scraping product listings, reviews, and pricing from e-commerce sites at scale"
  - "Build monitoring crawlers that periodically check websites for content changes, new publications, or regulatory updates"
  - "Extract structured datasets from government, academic, and news portals for research and analysis workloads"
  - "Power data aggregation pipelines that merge information from multiple web sources into unified training corpora"
  - "Create search-engine-like crawls for domain-specific knowledge base construction and entity extraction"
