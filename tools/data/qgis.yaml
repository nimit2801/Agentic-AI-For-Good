name: QGIS
description: QGIS is a free open-source GIS for viewing, editing, and analyzing geospatial data. It handles shapefiles, rasters, and PostGIS so mapping and ML data teams build layers and exports without a paid desktop GIS.
tagline: Free open-source desktop GIS for maps and spatial analysis

github_url: https://github.com/qgis/QGIS
website_url: https://qgis.org
docs_url: https://docs.qgis.org

category: Data
tags: [cpp, python, gis, geospatial, mapping, postgis, raster, open-source]
pricing: free
is_open_source: true
license: GPL-2.0

install_command: brew install --cask qgis

problem_solved: |
  Spatial data work often requires a paid desktop GIS. QGIS is a
  free desktop for shapefiles, rasters, and PostGIS so mapping and
  ML data teams inspect, edit, and export layers without a
  commercial license.

use_cases:
  - Inspect and edit shapefiles, GeoJSON, and PostGIS layers on a desktop
  - Build map layouts and exports for a field or research report
  - Run raster and vector analysis before feeding features to an ML model
  - Connect QGIS to GDAL, PDAL, or a spatial database in one project
