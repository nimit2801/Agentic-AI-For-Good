name: OpenCloud
description: Open-source file management, sharing, and collaboration platform. Self-host file sync with a modern stack so teams keep datasets, checkpoints, and docs under their own control instead of a public cloud drive.
tagline: Sovereign file sharing and collaboration platform

github_url: https://github.com/opencloud-eu/opencloud
website_url: https://opencloud.eu
docs_url: https://docs.opencloud.eu

category: Data
tags: [file-sharing, collaboration, self-hosted, sync, go, storage]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Training data, papers, and model artifacts often land in Dropbox or Drive
  with little control over residency. OpenCloud is a self-hosted share and
  sync platform so labs can keep files in their own infrastructure while
  still offering familiar web and desktop collaboration.

use_cases:
  - Self-host dataset and paper sharing for a research group with EU data residency
  - Sync experiment folders across desktops without a public cloud drive
  - Give collaborators link-based access to checkpoints stored on your servers
  - Replace a SaaS file share with an Apache-2.0 collaboration stack
