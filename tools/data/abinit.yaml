name: ABINIT
description: ABINIT is an open-source density-functional theory package for computing electronic, optical, and vibrational properties of materials. It implements plane-wave DFT, GW, and related methods so research groups can run first-principles calculations from a documented, community-maintained code.
tagline: Plane-wave DFT for materials electronic structure

github_url: https://github.com/abinit/abinit
website_url: https://www.abinit.org
docs_url: https://docs.abinit.org

category: Data
tags: [fortran, dft, materials-science, electronic-structure, gw, first-principles]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  First-principles materials properties need a full DFT stack, not a single
  energy evaluation. ABINIT provides plane-wave DFT plus GW, phonons, and
  response functions under a GPL license so groups can compute bands,
  optics, and vibrational spectra without locking the workflow to a
  commercial electronic-structure code.

use_cases:
  - Compute ground-state DFT total energies, forces, and electronic bands
  - Run GW and related many-body calculations for quasiparticle spectra
  - Obtain phonons and dielectric response for materials datasets
  - Script high-throughput ABINIT jobs for crystal screening campaigns
