name: Apache Atlas
description: Open source metadata management and governance platform for the Hadoop ecosystem and beyond, with data lineage and classification.
tagline: Metadata management and data governance for modern data platforms

github_url: https://github.com/apache/atlas
website_url: https://atlas.apache.org
docs_url: https://atlas.apache.org/2.3.0/index.html

category: Data
tags: [metadata, governance, data-lineage, classification, hadoop, apache]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Modern data platforms accumulate thousands of datasets, tables, and pipelines with no central
  registry of what they contain, who owns them, or how they relate to each other. Apache Atlas
  provides open metadata management and governance, enabling organizations to catalog data assets,
  classify sensitive information, track lineage across pipelines, and enforce policies for
  compliance and data quality.

use_cases:
  - Build a unified data catalog where analysts can discover tables, columns, and pipelines with full metadata
  - Classify sensitive data like PII and financial records to enforce access policies and compliance
  - Track data lineage from raw ingestion through transformation to downstream dashboards and reports
  - Integrate with Hive, Kafka, and Spark to automatically capture metadata from existing data pipelines
