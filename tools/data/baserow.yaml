name: Baserow
description: Open-source no-code platform for databases, automations, apps, and AI agents. Spreadsheet UI over PostgreSQL with REST APIs, self-host or cloud, as an Airtable alternative you can own.
tagline: Open-source Airtable alternative for databases and apps

github_url: https://github.com/baserow/baserow
website_url: https://baserow.io
docs_url: https://baserow.io/docs/index

category: Data
tags: [no-code, database, spreadsheet, postgresql, self-hosted, airtable]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  Spreadsheet databases like Airtable lock operational data in a proprietary
  cloud. Baserow gives a spreadsheet UI, automations, and app builder on
  PostgreSQL you can self-host, with APIs so AI agents and internal tools
  can read and write the same tables.

use_cases:
  - Self-host an Airtable-style database on PostgreSQL for internal ops
  - Expose REST APIs from spreadsheet tables for agent and app backends
  - Build no-code internal tools and portals on top of structured data
  - Automate row-change workflows without a proprietary automation cloud
  - Let non-technical teams edit production-adjacent tables without SQL
