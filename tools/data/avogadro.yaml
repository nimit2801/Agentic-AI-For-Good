name: Avogadro
description: Open-source 3D molecular editor for building, visualizing, and preparing chemical structures. Avogadro handles organic molecules, crystals, and biomolecules so computational chemistry and ML teams sketch inputs, inspect orbitals, and export files for simulation engines.
tagline: Cross-platform 3D molecular editor and visualizer

github_url: https://github.com/OpenChemistry/avogadrolibs
website_url: https://avogadro.cc
docs_url: https://two.avogadro.cc
install_command: pip install avogadro

category: Data
tags: [molecular-editor, computational-chemistry, visualization, python, cpp, open-source]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Simulation and ML chemistry pipelines still start with a 3D structure
  someone has to draw or clean. Avogadro is a scriptable editor that
  builds molecules, crystals, and surfaces, then exports formats that
  quantum codes, MD engines, and featurizers can actually read.

use_cases:
  - Draw or clean small-molecule structures before quantum or ML property jobs
  - Build crystal slabs and adsorbates for materials simulation inputs
  - Visualize orbitals and vibrations from computational chemistry output
  - Export PDB, XYZ, or CIF files into RDKit, ASE, or MD workflows
