name: TPOT
description: |-
  Python Automated Machine Learning tool that optimizes machine learning pipelines using genetic programming.
problem_solved: |-
  Data scientists need an automated assistant that explores thousands of pipeline combinations to find the best preprocessing, model, and hyperparameter configuration.
use_cases:
  - "Automated ML pipeline optimization"
  - "Genetic programming for feature selection"
  - "Multi-objective model tuning"
  - "Reproducible AutoML experiments"
github_url: https://github.com/EpistasisLab/tpot
website_url: https://epistasislab.github.io/tpot/
docs_url: https://epistasislab.github.io/tpot/using/
install_command: pip install tpot
category: Fine-tuning
is_open_source: true
pricing: free
