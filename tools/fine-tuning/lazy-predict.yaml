name: Lazy Predict
slug: lazy-predict
category: Fine-tuning
tagline: Build and compare 40+ ML models with zero manual tuning
description: |-
  Lazy Predict helps build and compare dozens of ML models with minimal code. It runs classification, regression, and time-series benchmarks across 40+ algorithms to find the best baseline without manual tuning.
problem_solved: Manually testing dozens of ML models to find a baseline is tedious and time-consuming. Data scientists need a fast way to compare algorithm performance before investing effort in hyperparameter tuning.
use_cases:
  - "Rapid baseline model comparison for classification tasks"
  - "Benchmark regression algorithms on tabular datasets"
  - "Time-series forecasting with statistical and deep learning models"
  - "GPU-accelerated training with XGBoost, LightGBM, and cuML"
github_url: https://github.com/shankarpandala/lazypredict
website_url: https://shankarpandala.github.io/lazypredict/
docs_url: https://shankarpandala.github.io/lazypredict/
install_command: pip install lazypredict
license: MIT
pricing: free
is_open_source: true
tags:
  - python
  - automl
  - scikit-learn
  - benchmarking