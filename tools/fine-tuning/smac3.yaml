name: SMAC3
description: "SMAC3 is a Bayesian optimization package for hyperparameter and algorithm configuration. It combines random forests or Gaussian processes with intensification to tune expensive ML pipelines, AutoML systems, and algorithm portfolios."
tagline: "Bayesian optimization for hyperparameter and algorithm configuration"
github_url: https://github.com/automl/SMAC3
website_url: https://automl.github.io/SMAC3/latest/
docs_url: https://automl.github.io/SMAC3/latest/
install_command: "pip install smac"
category: Fine-tuning
tags:
  - python
  - hyperparameter-tuning
  - bayesian-optimization
  - automl
  - configuration
  - smac
pricing: free
is_open_source: true
license: BSD-3-Clause
problem_solved: "Hyperparameter search over ML pipelines and algorithms is combinatorial and expensive. SMAC3 (Sequential Model-based Algorithm Configuration) models the configuration space and intensifies promising setups so AutoML and training jobs spend budget on configs that actually improve metrics."
use_cases:
  - "Tune neural network and pipeline hyperparameters with sequential model-based optimization"
  - "Configure AutoML systems and algorithm portfolios under a trial budget"
  - "Optimize mixed categorical and continuous search spaces for training jobs"
  - "Run intensification-based HPO that re-evaluates incumbents on more data"
