name: SuperGradients
description: Deci's open-source computer vision training library and the home of YOLO-NAS. Train or fine-tune detection, classification, and segmentation models with recipes, quantization-aware training, and production-oriented export for edge and server deployment.
tagline: Train SOTA vision models including YOLO-NAS

github_url: https://github.com/Deci-AI/super-gradients
website_url: https://www.supergradients.com
docs_url: https://github.com/Deci-AI/super-gradients#readme
install_command: pip install super-gradients

category: Fine-tuning
tags: [computer-vision, fine-tuning, object-detection, yolo-nas, quantization, pytorch, training]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Production computer vision needs more than a paper checkpoint. SuperGradients
  packages training recipes, quantization-aware training, and export for YOLO-NAS
  and other SOTA models so teams can fine-tune and ship detectors without
  assembling a custom training stack.

use_cases:
  - Fine-tune YOLO-NAS or other SuperGradients models on a custom detection dataset
  - Train classification and segmentation models with built-in recipes and logging
  - Apply quantization-aware training and export models for edge or server inference
  - Benchmark multiple SOTA vision architectures from one training library
