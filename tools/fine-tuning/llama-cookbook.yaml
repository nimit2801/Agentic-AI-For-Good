name: Llama Cookbook
description: Official Meta recipes for building with Llama models, covering inference, fine-tuning, RAG, and end-to-end application patterns across local runtimes and cloud providers.
tagline: Official recipes for inference, fine-tuning, and RAG with Llama

github_url: https://github.com/meta-llama/llama-cookbook
website_url: https://www.llama.com
docs_url: https://github.com/meta-llama/llama-cookbook

install_command: pip install llama-cookbook

category: Fine-tuning
tags: [python, llama, fine-tuning, inference, rag, recipes, meta, huggingface]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Teams adopting Llama often start from scattered notebooks, provider snippets, and
  outdated examples instead of a maintained path from inference to fine-tuning and RAG.
  Llama Cookbook collects official recipes and service integrations so developers can
  ship Llama apps without reverse-engineering docs for every runtime.

use_cases:
  - Fine-tune a Llama model on internal support data using the cookbook training recipes
  - Run local or cloud inference examples before wiring Llama into a production service
  - Build a RAG prototype with Llama using the cookbook retrieval and prompting patterns
  - Compare provider integrations so the same Llama workflow can move from laptop to cloud
  - Teach a team Llama inference and fine-tuning with maintained notebooks instead of one-off scripts
