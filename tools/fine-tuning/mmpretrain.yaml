name: MMPretrain
description: |-
  OpenMMLab pre-training toolbox and benchmark for image classification, self-supervised learning and multimodal understanding.
problem_solved: |-
  Researchers need a unified benchmark and toolkit for pre-training vision and multimodal models with reproducible results.
use_cases:
  - "Image classification pre-training"
  - "Self-supervised learning experiments"
  - "Multimodal model training"
  - "Vision model benchmarking"
github_url: https://github.com/open-mmlab/mmpretrain
website_url: https://mmpretrain.readthedocs.io/
docs_url: https://mmpretrain.readthedocs.io/en/latest/
install_command: pip install mmpretrain
category: Fine-tuning
is_open_source: true
pricing: free
