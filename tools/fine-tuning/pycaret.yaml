name: PyCaret
description: |-
  Open-source low-code AutoML platform for Python with sklearn-native engine, control plane, and web UI for self-hosted deployment.
problem_solved: |-
  Data science teams need a unified platform that combines AutoML training, experiment tracking, model registry, and deployment in one self-hosted solution.
use_cases:
  - "Low-code AutoML model training"
  - "Experiment tracking and comparison"
  - "Model registry and deployment"
  - "Self-hosted ML platform"
github_url: https://github.com/pycaret/pycaret
website_url: https://pycaret.org/
docs_url: https://pycaret.readthedocs.io/
install_command: pip install pycaret
category: Fine-tuning
is_open_source: true
pricing: free
