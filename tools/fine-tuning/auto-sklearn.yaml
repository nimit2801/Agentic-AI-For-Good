name: Auto-sklearn
slug: auto-sklearn
category: Fine-tuning
tagline: Automated ML toolkit and drop-in scikit-learn replacement
description: |-
  Auto-sklearn is an automated machine learning toolkit and drop-in replacement for scikit-learn estimators. It searches optimal pipelines including preprocessing, model selection, and hyperparameter tuning automatically.
problem_solved: Building optimal ML pipelines requires expertise in preprocessing, model selection, and hyperparameter tuning. Auto-sklearn automates this search using Bayesian optimization and meta-learning to find high-performing configurations.
use_cases:
  - "Automated classification pipeline search with minimal configuration"
  - "Drop-in replacement for scikit-learn estimators in existing code"
  - "Meta-learning warm-start from previously solved datasets"
  - "Ensemble construction from top-performing models automatically"
github_url: https://github.com/automl/auto-sklearn
website_url: https://automl.github.io/auto-sklearn/
docs_url: https://automl.github.io/auto-sklearn/master/manual.html
install_command: pip install auto-sklearn
