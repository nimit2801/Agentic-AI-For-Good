name: AutoKeras
description: |-
  AutoML library for deep learning based on Keras that makes machine learning accessible with minimal code.
problem_solved: |-
  Developers without deep ML expertise need an automated way to build and train deep learning models for image, text, and structured data.
use_cases:
  - "Automated image classification"
  - "Text classification with AutoML"
  - "Structured data prediction"
  - "Neural architecture search"
github_url: https://github.com/keras-team/autokeras
website_url: https://autokeras.com/
docs_url: https://autokeras.com/tutorial/overview/
install_command: pip install autokeras
category: Fine-tuning
is_open_source: true
pricing: free
