name: Pyro
description: "Pyro is Uber AI's deep probabilistic programming language built on PyTorch. It combines neural networks with Bayesian inference (SVI, NUTS, HMC) so you can write universal generative models and scale posterior inference on GPU."
tagline: "Deep universal probabilistic programming on PyTorch"
github_url: https://github.com/pyro-ppl/pyro
website_url: https://pyro.ai
docs_url: https://docs.pyro.ai
install_command: "pip install pyro-ppl"
category: Fine-tuning
tags:
  - python
  - pytorch
  - probabilistic-programming
  - bayesian
  - variational-inference
  - uber
pricing: free
is_open_source: true
license: Apache-2.0
problem_solved: "Deep models rarely expose calibrated uncertainty, and Bayesian tools rarely scale to neural nets. Pyro lets you write stochastic functions in PyTorch, then infer posteriors with SVI or MCMC, so generative models, Bayesian neural nets, and simulation-based inference share one stack."
use_cases:
  - "Train Bayesian neural nets and deep generative models with stochastic variational inference"
  - "Write custom generative models in Python and infer posteriors with NUTS or SVI"
  - "Add uncertainty estimates to PyTorch training pipelines without leaving GPU code"
  - "Prototype simulation-based inference and hierarchical deep models for research"
