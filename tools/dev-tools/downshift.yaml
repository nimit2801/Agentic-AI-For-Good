name: Downshift
description: "Primitive React hooks for building WAI-ARIA compliant autocomplete, combobox, and select dropdowns. You own markup and styles; Downshift handles keyboard navigation, accessibility, and selection state."
tagline: "Accessible React autocomplete primitives"
github_url: https://github.com/downshift-js/downshift
website_url: https://www.downshift-js.com
docs_url: https://www.downshift-js.com
install_command: npm install downshift
category: Dev Tools
tags:
  - react
  - javascript
  - accessibility
  - autocomplete
  - combobox
  - ui
pricing: free
is_open_source: true
license: MIT
problem_solved: "Building a production autocomplete or select in React usually means either a heavy UI kit or a fragile homemade widget that fails keyboard and screen-reader checks. Downshift is a headless primitive: it manages open/close, highlighted index, selection, and WAI-ARIA roles while you render any markup. AI chat UIs, tool pickers, and model-selector dropdowns get accessible combobox behavior without locking into a design system."
use_cases:
  - "Build an accessible model or tool picker combobox in an AI chat UI with custom markup"
  - "Implement typeahead search over a catalog of agents, datasets, or embeddings"
  - "Replace a native select with a keyboard-navigable dropdown that matches product design"
