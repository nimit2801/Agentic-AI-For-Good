name: DataGrip
description: JetBrains database IDE for querying, exploring, and refactoring schemas across PostgreSQL, MySQL, SQL Server, and more. Useful for feature stores, training tables, and vector-extension databases without a vendor-specific GUI.
tagline: Multi-engine SQL IDE for schemas and query work

website_url: https://www.jetbrains.com/datagrip/
docs_url: https://www.jetbrains.com/help/datagrip/getting-started-with-datagrip.html

category: Dev Tools
tags: [database, sql, ide, jetbrains, postgresql, mysql]
pricing: paid
is_open_source: false
license: Proprietary

problem_solved: |
  ML pipelines live in many SQL engines, and switching vendor GUIs slows
  schema work. DataGrip is a multi-engine IDE so engineers can query
  training tables, inspect indexes, and edit SQL in one tool.

use_cases:
  - Query PostgreSQL feature tables and pgvector indexes from one IDE
  - Compare schemas across staging and production data warehouses
  - Write and explain SQL used to build training and evaluation sets
  - Browse MySQL or SQL Server sources that feed ETL into model jobs
