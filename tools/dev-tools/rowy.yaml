name: Rowy
description: Low-code backend on Firebase and Google Cloud that edits Firestore like a spreadsheet and runs cloud functions in the browser for internal tools and AI workflows.
tagline: Spreadsheet UI and cloud functions on Firebase

github_url: https://github.com/buildship-ai/rowy
website_url: https://www.rowy.io
docs_url: https://docs.rowy.io

category: Dev Tools
tags: [low-code, firebase, firestore, cloud-functions, internal-tools, nocode]
pricing: freemium
is_open_source: true

problem_solved: |
  Internal AI ops tools often need a UI on Firestore plus small cloud functions,
  but building that CRUD admin from scratch is slow. Rowy gives a spreadsheet on
  Firebase with browser-edited TypeScript functions so teams can label data,
  trigger workflows, and manage records without a custom admin app.

use_cases:
  - Edit Firestore collections used by AI apps in a spreadsheet UI
  - Write cloud functions in the browser to enrich or validate records
  - Build internal tools for labeling, moderation, or prompt logs
  - Prototype Firebase backends for AI demos without a custom admin console
