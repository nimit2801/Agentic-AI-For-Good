name: PhpStorm
description: JetBrains IDE for PHP with deep code analysis, debugging, refactoring, and framework support. Used to build and maintain Laravel, Symfony, and WordPress backends that serve ML APIs, dashboards, and data apps.
tagline: JetBrains IDE for PHP applications and APIs

website_url: https://www.jetbrains.com/phpstorm/
docs_url: https://www.jetbrains.com/help/phpstorm/meet-phpstorm.html

category: Dev Tools
tags: [ide, php, jetbrains, debugging, refactoring, backend]
pricing: paid
is_open_source: false
license: Proprietary

problem_solved: |
  PHP backends that wrap model APIs still need a real IDE for analysis,
  debugging, and framework-aware refactoring. PhpStorm gives Laravel and
  Symfony teams inspections and a debugger without a generic editor.

use_cases:
  - Debug PHP services that call inference APIs and vector databases
  - Refactor Laravel or Symfony code that serves ML dashboards
  - Inspect types and frameworks while shipping data-product backends
  - Run tests and coverage for PHP APIs used by agentic applications
