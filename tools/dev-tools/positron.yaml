name: Positron
description: Next-generation data science IDE from Posit, built on Code OSS. Polyglot environment for writing R and Python, exploring data, and publishing reproducible work without switching between RStudio and VS Code.
tagline: Data science IDE from Posit for R, Python, and notebooks

github_url: https://github.com/posit-dev/positron
website_url: https://positron.posit.co/
docs_url: https://positron.posit.co/
install_command: brew install --cask positron

category: Dev Tools
tags: [ide, data-science, r, python, posit, notebooks, vscode]
pricing: free
is_open_source: true
license: Elastic License 2.0

problem_solved: |
  Data science work splits across RStudio for R and VS Code for Python, with
  notebooks, consoles, and plots in different windows. Positron is a single
  Code OSS IDE from Posit for polyglot exploration, reproducible authoring,
  and publishing so R and Python analysis share one environment.

use_cases:
  - Explore tabular datasets in R and Python with consoles, plots, and data viewers
  - Author Quarto and Jupyter notebooks next to package code in one IDE
  - Debug data pipelines that mix R stats code with Python ML libraries
  - Publish reproducible analyses from a Posit-native desktop environment
