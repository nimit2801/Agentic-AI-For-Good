name: huggingface.js
description: Official JavaScript and TypeScript client libraries for Hugging Face. huggingface.js talks to Hub, Inference Providers, and Endpoints from Node or the browser so JS ML apps can run models without wrapping the Python SDK.
tagline: Official Hugging Face clients for JavaScript

github_url: https://github.com/huggingface/huggingface.js
website_url: https://hf.co/docs/huggingface.js
docs_url: https://hf.co/docs/huggingface.js
install_command: npm install @huggingface/inference

category: Dev Tools
tags: [javascript, typescript, huggingface, inference, hub, sdk, node]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Hugging Face Hub and Inference are first-class in Python, but JS apps
  often shell out or reimplement REST calls. huggingface.js is the
  official TypeScript client so Node and browser pipelines can search
  models and run inference without wrapping the Python SDK.

use_cases:
  - Call Hugging Face Inference Providers from a Node API
  - Search and download Hub models in a TypeScript training dashboard
  - Run chat or embedding endpoints from a browser app
  - Script Hub file uploads without leaving the JavaScript toolchain
