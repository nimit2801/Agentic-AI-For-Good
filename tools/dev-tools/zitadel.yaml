name: Zitadel
description: ZITADEL is open-source identity infrastructure for SSO, OIDC, SAML, and multi-tenant IAM. Teams self-host or use ZITADEL Cloud to protect dashboards, agent UIs, and ML consoles without a commercial IdP.
tagline: Identity infrastructure for apps, APIs, and internal tools

github_url: https://github.com/zitadel/zitadel
website_url: https://zitadel.com
docs_url: https://zitadel.com/docs

category: Dev Tools
tags: [identity, sso, oidc, saml, iam, authentication, self-hosted, go]
pricing: freemium
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Internal ML dashboards, agent UIs, and APIs often sit behind ad-hoc auth or a
  paid IdP. ZITADEL is a self-hostable IAM platform with OIDC, SAML, MFA, and
  multi-tenancy so those tools get SSO and token issuance without Okta or custom
  OAuth code.

use_cases:
  - Put OIDC SSO and MFA in front of model registries and agent consoles
  - Issue access tokens for microservices that serve LLM inference APIs
  - Run multi-tenant identity for a SaaS product without a commercial IdP
  - Self-host authentication for internal ML infrastructure instead of Okta
