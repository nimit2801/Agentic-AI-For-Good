name: Lucide
description: Open-source icon library with a consistent stroke style and official React, Vue, Svelte, and icon-font packages. Drop clear icons into AI consoles, docs, and marketing without a paid icon set.
tagline: Beautiful, consistent open-source icons

github_url: https://github.com/lucide-icons/lucide
website_url: https://lucide.dev
docs_url: https://lucide.dev/guide/
install_command: npm install lucide-react

category: Dev Tools
tags: [icons, react, svg, frontend, typescript, ui]
pricing: free
is_open_source: true
license: ISC

problem_solved: |
  Icon sets drift in size, stroke, and license across a product.
  Lucide gives a large MIT/ISC icon set with first-party React
  components so agent dashboards and docs stay visually consistent.

use_cases:
  - Icon tool, model, and trace actions in a React agent console
  - Use the same icon set in docs, marketing, and the product UI
  - Tree-shake Lucide icons into a lightweight AI dashboard bundle
  - Swap icon names as components without custom SVG files
