name: Fumadocs
description: React docs framework built on Next.js with MDX, full-text search, and flexible layouts. Generate beautiful documentation sites for SDKs and agent products without starting from a custom Nextra or Docusaurus theme.
tagline: Beautiful, flexible React docs framework

github_url: https://github.com/fuma-nama/fumadocs
website_url: https://fumadocs.dev
docs_url: https://fumadocs.dev/docs
install_command: npm create fumadocs-app

category: Dev Tools
tags: [docs, nextjs, mdx, react, search, documentation]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  SDK and agent docs often start as a Docusaurus or Nextra fork that is
  hard to restyle. Fumadocs is a Next.js and MDX framework with search
  and layouts so a TypeScript product ships docs that match the app
  instead of a generic theme.

use_cases:
  - Scaffold a Next.js docs site for an SDK or MCP server
  - Author MDX pages with full-text search out of the box
  - Match docs chrome to an existing React or Tailwind app
  - Host API and guide content together without a separate CMS
