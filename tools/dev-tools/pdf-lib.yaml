name: pdf-lib
description: "Create and modify PDF documents in any JavaScript environment, including the browser, Node, and Deno. Draw text and images, merge pages, fill forms, and write the result without a native PDF binary."
tagline: "Create and modify PDFs in JavaScript"
github_url: https://github.com/Hopding/pdf-lib
website_url: https://pdf-lib.js.org
docs_url: https://pdf-lib.js.org
install_command: npm install pdf-lib
category: Dev Tools
tags:
  - javascript
  - pdf
  - documents
  - browser
  - nodejs
pricing: free
is_open_source: true
license: MIT
problem_solved: "Agent products often need to stamp citations, merge generated reports, or fill PDF forms after a document pipeline runs. Server-side native PDF tools add ops cost; pdf-lib does create, copy, embed, and form-fill in pure JavaScript. Teams can assemble or annotate PDFs in the browser or in a Node worker next to the rest of the TypeScript stack."
use_cases:
  - "Stamp page numbers, watermarks, or citation boxes onto RAG source PDFs"
  - "Merge generated report pages with uploaded attachments in a Node worker"
  - "Fill PDF form fields from structured LLM output without a native PDF binary"
