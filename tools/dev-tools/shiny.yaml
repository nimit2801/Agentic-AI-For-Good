name: Shiny
description: An R framework for interactive web apps with no HTML or JavaScript required. Shiny turns existing R analysis into reactive dashboards with plots, tables, and inputs, so data science and ML teams can share live models without standing up a frontend stack.
tagline: Interactive web apps in R without writing HTML or JavaScript

github_url: https://github.com/rstudio/shiny
website_url: https://shiny.posit.co/
docs_url: https://shiny.posit.co/

category: Dev Tools
tags: [r, dashboard, reactive, web-apps, data-science, visualization]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  R users who want to share a model or analysis usually dump a static
  plot or hand the work to a web team. Shiny is a reactive framework
  that turns R scripts into live web apps with sliders, tables, and
  plots, so statisticians and ML practitioners can publish interactive
  dashboards without writing HTML, CSS, or JavaScript.

use_cases:
  - Turn an R model into a live dashboard with sliders that recompute predictions
  - Embed interactive plots and tables in an R Markdown report
  - Share a data-cleaning or EDA app with teammates who do not write R
  - Prototype an ML demo UI in R before committing to a Python or JS frontend
