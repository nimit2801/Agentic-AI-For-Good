name: Jenkins X
description: Jenkins X provides automated CI+CD for Kubernetes with Preview Environments on Pull Requests using Cloud Native pipelines from Tekton. It simplifies building, testing, and deploying cloud-native applications on Kubernetes.
tagline: Automated CI+CD for Kubernetes with preview environments

github_url: https://github.com/jenkins-x/jx
website_url: https://jenkins-x.io
docs_url: https://jenkins-x.io/docs

category: Dev Tools
tags: [kubernetes, ci-cd, devops, tekton, cloud-native, automation]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Teams deploying to Kubernetes need automated CI/CD pipelines that integrate with Git workflows,
  provide preview environments for pull requests, and use cloud-native pipeline engines. Jenkins X
  automates the entire lifecycle from commit to production on Kubernetes with GitOps-driven deployments.

use_cases:
  - Automating CI/CD pipelines for microservices deployed on Kubernetes clusters
  - Creating preview environments for every pull request to validate changes before merge
  - Implementing GitOps-driven progressive delivery with automated canary and blue-green deployments
  - Standardizing cloud-native build and release workflows across engineering teams
