name: VTR
description: VTR is an open-source FPGA CAD flow. It maps Verilog through packing, placement, and routing so researchers explore FPGA architectures and CAD algorithms without a closed vendor toolchain.
tagline: Open-source Verilog-to-routing CAD flow for FPGA research

github_url: https://github.com/verilog-to-routing/vtr-verilog-to-routing
website_url: https://verilogtorouting.org
docs_url: https://docs.verilogtorouting.org

category: Dev Tools
tags: [vtr, fpga, cad, placement, routing, verilog, architecture, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  FPGA architecture research needed a closed vendor CAD flow. VTR packs,
  places, and routes Verilog on custom fabrics so labs measure area, delay,
  and CAD algorithms without a proprietary toolchain.

use_cases:
  - Place and route Verilog on a custom FPGA architecture described in VTR
  - Benchmark packing, placement, and routing algorithms on VTR circuits
  - Measure area and delay of a new FPGA fabric before silicon
  - Teach FPGA CAD by running the full Verilog-to-routing flow
