name: Serper
description: Google Search API built for AI apps. It returns organic results, knowledge graph, and news as JSON so RAG and agents can ground answers on live SERP data without scraping Google HTML.
tagline: Google Search API for RAG and AI agents

website_url: https://serper.dev
docs_url: https://serper.dev

category: Dev Tools
tags: [search, api, rag, google, agents, grounding]
pricing: freemium
is_open_source: false

problem_solved: |
  Agents that need live Google results usually scrape HTML or pay for a
  general search API that is not SERP-shaped. Serper returns organic
  listings, snippets, and knowledge graph as JSON, so RAG pipelines and
  coding agents ground answers on current search results.

use_cases:
  - Ground a RAG chatbot with live Google organic results and snippets
  - Let an agent fetch news and knowledge-graph facts via a JSON search API
  - Replace brittle Google HTML scraping in a research agent
  - Prototype web-grounded answers without running a crawler
