name: Lite XL
description: A lightweight, cross-platform text editor written in Lua. It continues the Lite editor with a small binary, a plugin system, and a Lua API so developers can customize editing without the memory cost of Electron IDEs.
tagline: Lightweight Lua-powered text editor

github_url: https://github.com/lite-xl/lite-xl
website_url: https://lite-xl.com
docs_url: https://lite-xl.com/en/documentation

install_command: brew install lite-xl

category: Dev Tools
tags: [editor, lua, lightweight, plugins, cross-platform, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Many graphical editors ship as large Electron apps, while classic editors are
  harder to script. Lite XL is a small native editor with a Lua plugin API so
  you can keep a fast, customizable GUI editor without IDE-scale memory use.

use_cases:
  - Edit code and markup in a small cross-platform GUI editor
  - Extend the editor with Lua plugins and a documented plugin API
  - Keep a lightweight alternative to Electron IDEs on laptops and older machines
  - Customize themes, keybindings, and language support without rebuilding the editor
