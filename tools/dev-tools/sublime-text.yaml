name: Sublime Text
description: Cross-platform editor for code, markup, and prose with multiple selections, Goto Anything, a Python plugin API, and GPU-rendered UI. Teams use it as a fast alternative to a full IDE for configs, scripts, and large files.
tagline: Fast cross-platform editor for code, markup, and prose

website_url: https://www.sublimetext.com/
docs_url: https://www.sublimetext.com/docs/

install_command: brew install --cask sublime-text

category: Dev Tools
tags: [editor, ide, sublime, python, plugins, macos, windows, linux]
pricing: paid
is_open_source: false

problem_solved: |
  Full IDEs are heavy for day-to-day file editing, while bare terminals lack
  multi-caret workflows and project-wide jump-to-symbol. Sublime Text is a
  fast, licensed editor with multiple selections, Goto Anything, and a plugin
  ecosystem so developers can edit code and configs without waiting on an IDE.

use_cases:
  - Edit Python, JavaScript, and config files with multiple selections and a command palette
  - Jump to files, symbols, and lines across a project with Goto Anything
  - Open multi-gigabyte logs and data dumps that choke slower editors
  - Extend the editor with Python packages from Package Control
  - Split panes and compare files while reviewing model or pipeline code
