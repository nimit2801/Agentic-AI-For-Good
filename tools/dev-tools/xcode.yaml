name: Xcode
description: Apple's IDE for iOS, macOS, and Apple silicon apps, with Swift, simulators, and Metal tools. Used to ship on-device models, Core ML, and LLM apps on iPhone and Mac.
tagline: Apple IDE for iOS, macOS, and on-device ML

website_url: https://developer.apple.com/xcode/
docs_url: https://developer.apple.com/documentation/xcode

category: Dev Tools
tags: [ios, macos, ide, swift, core-ml, apple, metal]
pricing: free
is_open_source: false

problem_solved: |
  iOS and Mac ML apps need simulators, signing, and Core ML tooling that
  cross-platform editors do not provide. Xcode is the supported way to build,
  sign, and profile apps that run models on Apple silicon.

use_cases:
  - Build iOS apps that run Core ML or on-device LLM inference
  - Profile Metal and Neural Engine usage for mobile models
  - Sign and ship Mac tools that wrap local model runtimes
  - Debug SwiftUI apps that call Apple Intelligence or custom models
