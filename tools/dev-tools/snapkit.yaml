name: SnapKit
description: Swift Auto Layout DSL for iOS and macOS. SnapKit lets you write constraints in code so Swift UIs for agent chats, model dashboards, and dataset reviewers can layout without Interface Builder or verbose NSLayoutConstraint calls.
tagline: Swift Auto Layout DSL for iOS and macOS

github_url: https://github.com/SnapKit/SnapKit
website_url: https://snapkit.github.io/SnapKit/
docs_url: https://snapkit.github.io/SnapKit/

category: Dev Tools
tags: [swift, ios, macos, autolayout, ui, dsl]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Swift AI product UIs still need Auto Layout for chat threads, image
  galleries, and settings screens. Storyboards and raw
  NSLayoutConstraint are verbose. SnapKit provides a chainable DSL
  so agent and model apps can constrain views in code that reviews
  cleanly.

use_cases:
  - Layout an iOS agent chat thread with message bubbles and input bar
  - Pin a generated-image gallery and metadata panel in a Swift UI
  - Build a dataset review screen without Interface Builder
  - Constrain overlays for on-device vision camera previews
  - Share layout code across iOS and macOS companion apps
