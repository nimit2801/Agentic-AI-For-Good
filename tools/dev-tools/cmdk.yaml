name: cmdk
description: Fast, unstyled command menu React component used to build palettes like Spotlight or Linear. Wire keyboard-first search over models, tools, and agent actions without shipping a heavy UI kit.
tagline: Fast unstyled command menu for React

github_url: https://github.com/dip/cmdk
website_url: https://github.com/dip/cmdk
install_command: npm install cmdk

category: Dev Tools
tags: [react, command-palette, ui, keyboard, frontend, typescript]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  AI products need a keyboard-first way to jump to models, tools, and
  commands. Building a filterable command menu with correct keyboard
  behavior and composition is slow. cmdk is an unstyled, composable
  React primitive so teams style a palette without rebuilding the
  interaction from scratch.

use_cases:
  - Build a command palette to switch models, tools, and workspaces
  - Add keyboard-first search over agent actions in a React console
  - Compose cmdk with Radix or shadcn to match an existing design system
  - Filter long lists of prompts, datasets, or traces from the keyboard
