name: Jekyll
description: Blog-aware static site generator in Ruby that turns Markdown, Liquid templates, and YAML front matter into HTML. Still the default engine behind GitHub Pages for project docs, changelogs, and research blogs that do not need a JavaScript runtime.
tagline: Ruby static site generator behind GitHub Pages

github_url: https://github.com/jekyll/jekyll
website_url: https://jekyllrb.com
docs_url: https://jekyllrb.com/docs
install_command: gem install jekyll

category: Dev Tools
tags: [static-site, ruby, markdown, github-pages, docs, blog]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Project docs and research blogs need HTML without a Node build or CMS.
  Jekyll compiles Markdown, Liquid, and YAML front matter into a static
  site and is the GitHub Pages default, so a catalog or paper site ships
  from a git push without a JavaScript bundler.

use_cases:
  - Publish GitHub Pages docs for an ML library from Markdown
  - Run a research or changelog blog with Liquid layouts
  - Generate a static catalog or RFC site without a Node toolchain
  - Preview locally with jekyll serve before pushing to Pages
