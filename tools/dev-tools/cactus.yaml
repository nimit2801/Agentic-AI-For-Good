name: Cactus
slug: cactus
category: Dev Tools
tagline: Quantization and inference engine for mobile and edge AI
description: |-
  Cactus is a quantization, kernel, and inference engine for mobile, wearable, smart home, and robot devices. It enables on-device AI by optimizing models for edge hardware with minimal power and memory footprint.
problem_solved: Running AI models on edge devices like phones, wearables, and robots requires extreme optimization for memory, power, and latency. Cactus provides specialized quantization kernels and a lightweight runtime that make on-device inference practical for resource-constrained hardware.
use_cases:
  - "Deploying quantized neural networks on mobile and IoT devices"
  - "Running inference on wearables with minimal battery impact"
  - "Enabling AI capabilities on smart home and robot hardware"
  - "Optimizing model size and latency for edge deployments"
