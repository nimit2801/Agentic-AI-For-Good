name: bookdown
description: R Markdown package for authoring books and long-form technical documents. bookdown extends knitr and rmarkdown with numbered chapters, cross-references, and multi-format output so ML papers, course notes, and internal playbooks stay one source for HTML, PDF, and EPUB.
tagline: Author books and long-form docs with R Markdown

github_url: https://github.com/rstudio/bookdown
website_url: https://pkgs.rstudio.com/bookdown/
docs_url: https://pkgs.rstudio.com/bookdown/
install_command: install.packages("bookdown")

category: Dev Tools
tags: [r, rmarkdown, books, documentation, knitr, publishing]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Long R Markdown reports lack numbering, cross-refs, and multi-chapter
  structure. bookdown adds book-style chapters, citations, and HTML/PDF/EPUB
  output so experiment writeups and course notes stay one reproducible source.

use_cases:
  - Publish an ML methods book from R Markdown with numbered chapters
  - Cross-reference figures and equations across a multi-chapter report
  - Render the same source to GitBook HTML and PDF for a course
  - Maintain internal playbooks that mix R analysis with narrative
