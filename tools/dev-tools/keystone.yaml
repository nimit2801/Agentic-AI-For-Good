name: Keystone
slug: keystone
category: Dev Tools
tagline: Superpowered headless CMS for Node.js with GraphQL and React
description: |-
  Keystone is a headless CMS and app framework for Node.js that generates a powerful GraphQL API and beautiful Management UI from your schema. It eliminates boilerplate while maintaining the flexibility of a bespoke back-end.
problem_solved: Building a custom back-end with GraphQL APIs, admin UIs, and database management requires significant boilerplate. Developers need a schema-driven approach that auto-generates APIs and management interfaces without sacrificing flexibility.
use_cases:
  - "Building content-driven websites and blogs with a GraphQL API"
  - "Creating admin panels and management UIs for database records"
  - "Prototyping full-stack Node.js applications with minimal setup"
  - "Managing structured content with role-based access control"
github_url: https://github.com/keystonejs/keystone
website_url: https://keystonejs.com
docs_url: https://keystonejs.com/docs
install_command: npm install @keystone-6/core
license: MIT
pricing: free
is_open_source: true
tags:
  - nodejs
  - cms
  - graphql
  - react