name: Augment Code
description: AI software development platform with a codebase-aware agent, IDE extensions, and a terminal CLI. A proprietary context engine indexes large repos so agents can plan, implement, and open PRs from VS Code, JetBrains, or the Auggie CLI.
tagline: Codebase-aware AI agents for real software

github_url: https://github.com/augmentcode/auggie
website_url: https://www.augmentcode.com
docs_url: https://docs.augmentcode.com
install_command: npm install -g @augmentcode/auggie

category: Dev Tools
tags: [ai-coding, ide, vscode, jetbrains, cli, agents, context-engine, mcp]
pricing: freemium
is_open_source: false

problem_solved: |
  Generic coding assistants lose the plot in large monorepos because they lack
  a live index of your architecture, docs, and dependencies. Augment Code's
  context engine retrieves relevant code at every keystroke so agents can ship
  multi-file changes, review PRs, and match existing style instead of guessing
  from a truncated window.

use_cases:
  - Ask an IDE agent to implement a feature across a 100k-file monorepo
  - Run Auggie in the terminal to plan, code, and open a pull request
  - Auto-review PRs with codebase-aware comments before human review
  - Connect GitHub, Jira, and MCP tools so the agent works in your stack
