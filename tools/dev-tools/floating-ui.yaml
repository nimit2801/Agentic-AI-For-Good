name: Floating UI
description: Positioning engine for tooltips, popovers, dropdowns, and menus. Computes collision-aware coordinates so AI consoles can pin traces, citations, and model pickers next to anchors on any screen size.
tagline: Positioning engine for floating UI elements

github_url: https://github.com/floating-ui/floating-ui
website_url: https://floating-ui.com
docs_url: https://floating-ui.com/docs/getting-started
install_command: npm install @floating-ui/dom

category: Dev Tools
tags: [javascript, typescript, tooltip, popover, frontend, ui]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Tooltips and menus clip or flip badly near viewport edges.
  Floating UI computes placement, overflow, and shift so citation
  popovers and model pickers stay visible in dense AI UIs.

use_cases:
  - Position citation popovers next to RAG answer spans
  - Anchor a model picker dropdown that flips when space is tight
  - Keep tool-trace tooltips inside the viewport on small screens
  - Build accessible menus on top of a custom agent console
