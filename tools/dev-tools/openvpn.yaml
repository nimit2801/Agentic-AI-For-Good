name: OpenVPN
description: OpenVPN is an open source VPN daemon that creates secure point-to-point or site-to-site connections using SSL/TLS encryption. It is the industry standard for deploying secure remote access and private network tunnels across untrusted networks.
tagline: Industry-standard open source VPN for secure remote access

github_url: https://github.com/openvpn/openvpn
website_url: https://openvpn.net
docs_url: https://openvpn.net/community-resources

category: Dev Tools
tags: [vpn, security, networking, encryption, remote-access, ssl]
pricing: free
is_open_source: true

problem_solved: |
  Teams need secure remote access to internal infrastructure without relying on proprietary VPN
  solutions. OpenVPN provides a fully open-source, battle-tested VPN daemon that supports both
  client-server and peer-to-peer topologies with strong encryption, certificate authentication,
  and cross-platform clients.

use_cases:
  - Secure remote employee access to corporate networks and internal services
  - Site-to-site VPN tunnels between cloud regions and on-premise data centers
  - Protecting traffic on untrusted public Wi-Fi with encrypted tunnels
  - Building zero-trust network architectures with certificate-based authentication
