name: iTerm2
description: macOS terminal emulator with split panes, tmux integration, search, and GPU rendering. Replaces Apple Terminal for engineers who need sessions, profiles, and shell integration while developing locally.
tagline: Powerful macOS terminal emulator with tmux and splits

github_url: https://github.com/gnachman/iTerm2
website_url: https://iterm2.com/
docs_url: https://iterm2.com/documentation.html
install_command: brew install --cask iterm2

category: Dev Tools
tags: [terminal, macos, tmux, shell, gpu, emulator]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Apple Terminal is limited for power users who need split panes, tmux control,
  and rich search. iTerm2 adds GPU rendering, profiles, and shell integration so
  macOS developers can keep many sessions productive.

use_cases:
  - Run training jobs, Git, and SSH in split panes on a Mac workstation
  - Attach tmux sessions from iTerm2 while keeping local and remote shells visible
  - Search command output and logs without leaving the terminal
  - Define profiles for Python, CUDA, and cloud-CLI environments
