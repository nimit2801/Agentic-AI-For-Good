name: Lexical
description: Extensible text editor framework from Meta focused on reliability, accessibility, and performance. Build collaborative prompt editors and knowledge UIs with a smaller runtime than full ProseMirror stacks.
tagline: Extensible text editor framework from Meta

github_url: https://github.com/facebook/lexical
website_url: https://lexical.dev
docs_url: https://lexical.dev/docs/intro
install_command: npm install lexical

category: Dev Tools
tags: [editor, react, accessibility, typescript, wysiwyg, meta]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Prompt composers and knowledge UIs need a reliable, accessible editor
  that stays fast at document scale. Full ProseMirror stacks are powerful
  but heavy to own. Lexical is Meta's framework with a smaller runtime and
  plugin model so teams ship custom editors without editor-engine debt.

use_cases:
  - Build a prompt composer with mentions and AI insert in React
  - Edit knowledge-base articles with accessible keyboard navigation
  - Embed a collaborative notes surface in an agent workspace
  - Add structured blocks for tool-call transcripts in a chat UI
