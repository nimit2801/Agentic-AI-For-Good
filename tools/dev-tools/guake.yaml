name: Guake
description: Drop-down terminal for GNOME that slides in with F12. Keep a Python REPL, nvidia-smi watch, or SSH session one keystroke away without another window covering the IDE.
tagline: Quake-style drop-down terminal for GNOME

github_url: https://github.com/Guake/guake
website_url: https://guake.github.io
docs_url: https://guake.readthedocs.io/

install_command: pip install guake

category: Dev Tools
tags: [terminal, linux, gnome, dropdown, python, quake]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Opening a full terminal window to run a quick command interrupts IDE
  and notebook work. Guake drops a tabbed GNOME terminal from the top
  of the screen so GPU checks and REPLs stay a hotkey away.

use_cases:
  - Press F12 to run nvidia-smi or tail a training log over a notebook
  - Keep a persistent Python REPL in a drop-down tab while editing code
  - SSH to a GPU box from Guake without leaving the current desktop
  - Pin named tabs for conda, Docker, and git on a GNOME workstation
