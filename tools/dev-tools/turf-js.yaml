name: Turf.js
description: Turf.js is a modular geospatial engine in JavaScript and TypeScript. It buffers, intersects, and measures GeoJSON in the browser or Node so mapping apps run spatial analysis without a GIS server.
tagline: Modular JavaScript engine for GeoJSON spatial analysis

github_url: https://github.com/Turfjs/turf
website_url: https://turfjs.org
docs_url: https://turfjs.org

category: Dev Tools
tags: [javascript, typescript, geospatial, geojson, gis, maps, analysis, open-source]
pricing: free
is_open_source: true
license: MIT

install_command: npm install @turf/turf

problem_solved: |
  Browser maps often need buffers, distances, and intersections
  without posting GeoJSON to a GIS server. Turf.js is a modular
  JS engine so web apps run those spatial ops in Node or the
  browser.

use_cases:
  - Buffer a GeoJSON polygon around a point of interest in the browser
  - Compute distance, area, and centroid for map features in Node
  - Intersect or union polygons before drawing them on Leaflet
  - Run client-side spatial analysis without a PostGIS round trip
