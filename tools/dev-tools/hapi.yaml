name: Hapi
description: Hapi is a simple, secure framework for building web applications and services in Node.js. It emphasizes configuration over code, provides built-in input validation, caching, and authentication, and powers enterprise APIs at scale.
tagline: Secure, configuration-centric framework for Node.js

github_url: https://github.com/hapijs/hapi
website_url: https://hapi.dev
docs_url: https://hapi.dev/tutorials

category: Dev Tools
tags: [nodejs, security, api, web-framework, enterprise, validation]
pricing: free
is_open_source: true

problem_solved: |
  Building secure, production-grade APIs in Node.js requires manually integrating validation,
  authentication, caching, and error handling. Hapi provides a configuration-centric framework
  with these features built in, trusted by enterprises for mission-critical applications.

use_cases:
  - Building secure enterprise APIs with built-in input validation and authentication
  - Developing microservices with structured plugin architecture and comprehensive logging
  - Creating high-throughput web services with built-in caching and response compression
  - Standardizing API security patterns across teams with configurable security headers
