name: Datalore
description: JetBrains Datalore is a collaborative cloud notebook for Python, SQL, and data reports. Teams attach databases, run cells on CPUs or GPUs, share workspaces, and publish interactive reports without hosting Jupyter themselves.
tagline: Collaborative JetBrains notebooks for Python and SQL

website_url: https://www.jetbrains.com/datalore/
docs_url: https://www.jetbrains.com/help/datalore/

category: Dev Tools
tags: [notebooks, python, sql, jetbrains, collaboration, data-science, gpu]
pricing: freemium
is_open_source: false

problem_solved: |
  Local Jupyter setups break when teammates need the same kernels, data
  connections, and GPU runtimes. Datalore runs notebooks in the browser
  with JetBrains coding assistance, shared workspaces, SQL cells, and
  report publishing so data and ML work can be reviewed without shipping
  notebooks and environment files around.

use_cases:
  - Collaborate on Python notebooks in a shared JetBrains workspace with comments
  - Query attached databases from SQL cells next to pandas analysis
  - Run training or feature notebooks on cloud CPUs or GPUs without a local Jupyter server
  - Publish a notebook as an interactive report for stakeholders who do not write code
  - Schedule notebook runs so dashboards refresh from the same documented analysis
