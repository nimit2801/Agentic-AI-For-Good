name: Embla Carousel
description: Lightweight carousel library with fluid motion and precise swipe. Build tool galleries, model showcases, and onboarding flows in agent UIs without a heavy slider dependency.
tagline: Lightweight carousel with fluid motion

github_url: https://github.com/davidjerleke/embla-carousel
website_url: https://www.embla-carousel.com
docs_url: https://www.embla-carousel.com/get-started
install_command: npm install embla-carousel

category: Dev Tools
tags: [carousel, javascript, react, frontend, ui, typescript]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Marketing and product UIs for AI tools need carousels that feel native
  on touch, but many sliders are heavy and fight layout. Embla is a small
  carousel with precise swipe so teams ship galleries without a bulky
  slider stack.

use_cases:
  - Showcase model cards or tool screenshots in an onboarding carousel
  - Build a swipeable example-prompt gallery in a chat UI
  - Display eval charts in a mobile-friendly slider
  - Add a React carousel to a catalog landing page without a heavy kit
