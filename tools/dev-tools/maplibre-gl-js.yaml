name: MapLibre GL JS
description: MapLibre GL JS is an open-source library for interactive vector tile maps in the browser. It is a community fork of Mapbox GL JS so web apps render MapLibre or Mapbox-style maps without a proprietary GL runtime.
tagline: Open-source vector tile maps in the browser

github_url: https://github.com/maplibre/maplibre-gl-js
website_url: https://maplibre.org
docs_url: https://maplibre.org/maplibre-gl-js/docs/

category: Dev Tools
tags: [javascript, typescript, maps, vector-tiles, webgl, mapbox, open-source, gis]
pricing: free
is_open_source: true
license: BSD-3-Clause

install_command: npm install maplibre-gl

problem_solved: |
  Vector maps in the browser often depend on a proprietary GL SDK.
  MapLibre GL JS is the community fork of Mapbox GL JS so apps render
  interactive vector tiles without a closed runtime or vendor lock-in.

use_cases:
  - Render MapLibre or Mapbox-style vector tiles in a web app
  - Replace Mapbox GL JS with an open-source GL map runtime
  - Style interactive maps with a JSON stylesheet and custom glyphs
  - Combine MapLibre basemaps with deck.gl or GIS overlays
