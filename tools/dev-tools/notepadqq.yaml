name: Notepadqq
description: Notepad++-style editor for Linux and macOS with multiple tabs, syntax highlighting, and a Qt UI. Gives Unix developers a familiar lightweight editor without running Windows-only Notepad++.
tagline: Notepad++-style editor for Linux and macOS

github_url: https://github.com/notepadqq/notepadqq
website_url: https://notepadqq.com
docs_url: https://github.com/notepadqq/notepadqq/wiki

category: Dev Tools
tags: [editor, linux, macos, qt, syntax-highlighting, text-editor]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Notepad++ is Windows-only, so Linux and macOS users lack the same tabbed,
  lightweight editor. Notepadqq brings that workflow to Unix desktops with Qt,
  syntax highlighting, and multiple documents.

use_cases:
  - Edit configs and scripts on Linux with a tabbed editor similar to Notepad++
  - Keep many YAML and log files open while debugging a training job
  - Search and replace across documents without launching a full IDE
  - Use a Qt editor on macOS when you want a simple multi-tab code notepad
