name: CudaText
description: Cross-platform code editor written in Free Pascal with Python plugins, many lexers, and a lightweight UI. Used as a fast alternative to Electron editors for configs, scripts, and large files on Linux, macOS, and Windows.
tagline: Native cross-platform editor with Python plugins

github_url: https://github.com/Alexey-T/CudaText
website_url: https://uvviewsoft.com/cudatext/
docs_url: https://wiki.freepascal.org/CudaText

category: Dev Tools
tags: [editor, python-plugins, lexers, cross-platform, text-editor]
pricing: free
is_open_source: true
license: MPL-2.0

problem_solved: |
  Desktop editors that ship as Electron apps consume RAM and start slowly on older
  machines. CudaText is a native Free Pascal editor with Python plugins and many
  lexers, so engineers can edit configs, logs, and source without waiting on a
  Chromium runtime.

use_cases:
  - Edit YAML, JSON, and training scripts on Linux, macOS, or Windows without an IDE
  - Open large log files from model jobs with a lightweight native editor
  - Extend the editor with Python plugins for custom lint and format commands
  - Use lexer-based highlighting for configs across a mixed ML toolchain
