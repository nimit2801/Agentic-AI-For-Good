name: Anvil
slug: anvil
category: Dev Tools
tagline: Build full-stack web apps with nothing but Python
description: |-
  Anvil is a framework for building full-stack web apps with nothing but Python. It includes a drag-and-drop GUI builder, built-in database, and server-side Python runtime with open-source self-hosting options.
problem_solved: Building web apps traditionally requires learning JavaScript, HTML, CSS, and multiple frameworks. Anvil lets Python developers create full-stack applications using only Python for frontend, backend, and database logic.
use_cases:
  - "Rapid prototyping of internal tools and dashboards in pure Python"
  - "Self-hosted web applications with built-in Postgres database"
  - "Connecting Jupyter notebooks to web apps via Python Uplink"
  - "Deploying Python tools with HTTPS and Let's Encrypt automatically"
github_url: https://github.com/anvil-works/anvil-runtime
website_url: https://anvil.works
docs_url: https://anvil.works/docs
install_command: pip install anvil-app-server
license: NOASSERTION
pricing: freemium
is_open_source: true
tags:
  - python
  - web-framework
  - low-code
  - full-stack