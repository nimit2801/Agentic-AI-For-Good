name: react-select
description: Flexible select component for React with search, multi-select, async options, and custom rendering. Use it when agent consoles need model, dataset, or tool pickers that work better than a native select.
tagline: The Select component for React.js

github_url: https://github.com/JedWatson/react-select
website_url: https://react-select.com/
docs_url: https://react-select.com/
install_command: npm install react-select

category: Dev Tools
tags: [react, select, forms, ui, frontend, typescript]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Native HTML select elements cannot search, load async options, or
  render custom labels. Agent dashboards need pickers for models,
  datasets, and tools that scale past a few dozen items. react-select
  gives a composable React select with search, multi-select, and async
  loading so those pickers work without a custom widget.

use_cases:
  - Pick a model or embedding endpoint from a searchable dropdown
  - Multi-select tools, tags, or datasets in an agent configuration form
  - Load options asynchronously from an API as the user types
  - Custom-render option labels with model size, latency, or cost
