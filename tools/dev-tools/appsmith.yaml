name: Appsmith
slug: appsmith
category: Dev Tools
tagline: Open-source low-code platform for internal tools and dashboards
description: |-
  Appsmith is an open-source low-code platform for building admin panels, internal tools, and dashboards. It connects to 25+ databases and APIs with a visual drag-and-drop interface for rapid application development.
problem_solved: Engineering teams spend significant time building and maintaining internal tools like admin panels and dashboards. Appsmith accelerates this with a visual builder that connects directly to databases and APIs without writing frontend code.
use_cases:
  - "Building admin panels connected to PostgreSQL, MySQL, or MongoDB"
  - "Creating customer support dashboards with multi-source data"
  - "Rapid prototyping of internal CRUD applications"
  - "Deploying self-hosted tools via Docker or Kubernetes"
github_url: https://github.com/appsmithorg/appsmith
website_url: https://www.appsmith.com
docs_url: https://docs.appsmith.com
license: Apache-2.0
pricing: freemium
is_open_source: true
tags:
