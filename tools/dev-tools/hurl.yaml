name: Hurl
description: CLI that runs and tests HTTP requests from plain text. Write curl-like files, chain requests, assert status codes, headers, and JSONPath, then execute them as scripts or CI jobs without a GUI API client.
tagline: Run and test HTTP requests with plain text

github_url: https://github.com/Orange-OpenSource/hurl
website_url: https://hurl.dev
docs_url: https://hurl.dev/docs/installation.html
install_command: brew install hurl

category: Dev Tools
tags: [http, testing, cli, curl, api-testing, rust, ci]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  API tests often live in Postman collections or brittle curl scripts that
  do not version well. Hurl stores requests and assertions in plain text
  next to the code, so teams can chain calls, check JSON and headers, and
  run the same files locally and in CI without a proprietary client.

use_cases:
  - Regression-test REST endpoints with chained requests and JSONPath asserts
  - Smoke-test model-serving and RAG HTTP APIs in GitHub Actions
  - Replay authenticated HTTP flows as a readable, git-friendly script
  - Replace ad-hoc curl one-liners with reusable assertion files
