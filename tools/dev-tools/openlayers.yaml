name: OpenLayers
description: OpenLayers is a high-performance JavaScript library for maps in the browser. It draws vector, raster, and WMTS layers so web GIS apps pan, zoom, and edit features without locking to a single map vendor.
tagline: High-performance JavaScript library for browser maps

github_url: https://github.com/openlayers/openlayers
website_url: https://openlayers.org
docs_url: https://openlayers.org/doc/

category: Dev Tools
tags: [javascript, maps, gis, web, vector, wmts, geospatial, open-source]
pricing: free
is_open_source: true
license: BSD-2-Clause

install_command: npm install ol

problem_solved: |
  Web GIS apps need pan, zoom, and mixed layers without a vendor SDK.
  OpenLayers draws vector, raster, and WMTS maps in the browser so
  teams ship interactive GIS without locking to one tile provider.

use_cases:
  - Display GeoJSON, WMS, and WMTS layers in a single web map
  - Edit vector features in the browser for a GIS data-entry app
  - Mix raster basemaps with custom projections and overlays
  - Build a web GIS that is not tied to a single commercial map SDK
