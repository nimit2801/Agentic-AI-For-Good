name: NetBeans
description: Apache NetBeans is a Java IDE with editors for Java, PHP, JavaScript, and C++, plus Maven/Gradle support. Still used for JVM services, annotation tools, and desktop apps around ML backends.
tagline: Apache IDE for Java and polyglot JVM projects

github_url: https://github.com/apache/netbeans
website_url: https://netbeans.apache.org
docs_url: https://netbeans.apache.org/tutorial/main/kb/

category: Dev Tools
tags: [java, ide, apache, maven, jvm, editor]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  JVM ML services and annotation UIs still live in Maven and Gradle trees.
  NetBeans is an Apache IDE that understands those projects, so Java-heavy
  teams can navigate, build, and debug without a JetBrains license.

use_cases:
  - Open Maven or Gradle Java services that wrap model APIs
  - Debug JVM backends that sit behind a Python training client
  - Edit PHP or JavaScript frontends next to a Java module
  - Use a free Apache IDE when IntelliJ is not an option
