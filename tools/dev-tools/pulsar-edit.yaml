name: Pulsar Edit
description: A community-led, hackable text editor forked from Atom after GitHub archived the original. It keeps the package ecosystem so developers can keep using Atom-style plugins, themes, and a tree view on a maintained editor.
tagline: Community-maintained Atom fork for hackable editing

github_url: https://github.com/pulsar-edit/pulsar
website_url: https://pulsar-edit.dev
docs_url: https://pulsar-edit.dev/docs/

install_command: brew install --cask pulsar

category: Dev Tools
tags: [editor, atom, electron, plugins, javascript, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Atom was archived, leaving teams with a large plugin and theme investment and
  no upstream editor. Pulsar Edit is the community fork that continues the
  hackable Atom architecture so packages, keymaps, and workflows keep working
  on a maintained codebase.

use_cases:
  - Keep using Atom packages and themes after the original editor was archived
  - Hack on the editor with JavaScript packages and a tree-view workflow
  - Edit code in a community-maintained successor to GitHub Atom
  - Migrate existing Atom config and packages onto a still-updated editor
