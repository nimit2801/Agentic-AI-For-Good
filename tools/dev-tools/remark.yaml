name: remark
description: "A Markdown processor powered by plugins in the unified collective. Parse Markdown to a syntax tree, transform it, and serialize it back, for linting, MDX, and docs pipelines."
tagline: "Plugin-based Markdown processor"
github_url: https://github.com/remarkjs/remark
website_url: https://remark.js.org
docs_url: https://github.com/remarkjs/remark
install_command: npm install remark
category: Dev Tools
tags:
  - javascript
  - markdown
  - ast
  - docs
  - plugins
pricing: free
is_open_source: true
license: MIT
problem_solved: "Docs sites, knowledge bases, and LLM Markdown pipelines need more than string replace: heading IDs, frontmatter, lint, and MDX. remark parses Markdown into an AST you transform with plugins, then serializes it. Teams build Git-backed catalogs and eval report docs without a one-off Markdown regex layer."
use_cases:
  - "Transform Git-backed tool docs through remark plugins before a static site build"
  - "Lint generated Markdown from an LLM writer for heading and link issues"
  - "Parse Markdown to an AST, inject citation nodes, and serialize it back"
