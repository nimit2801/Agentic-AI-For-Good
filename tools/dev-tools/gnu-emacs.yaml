name: GNU Emacs
description: Extensible text editor and Lisp runtime used by researchers and engineers for code, notes, and literate programming. Org mode, TRAMP, and a large package ecosystem make it a long-lived environment for writing and running ML workflows in one place.
tagline: Extensible editor and Lisp environment for code and notes

github_url: https://github.com/emacs-mirror/emacs
website_url: https://www.gnu.org/software/emacs/
docs_url: https://www.gnu.org/software/emacs/manual/
install_command: brew install emacs

category: Dev Tools
tags: [editor, lisp, org-mode, ide, literate-programming, terminal]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  ML work mixes code, papers, shells, and notes across many apps. GNU Emacs
  is a programmable editor with Org mode, Magit, TRAMP, and language modes so
  researchers can edit, document, and run workflows from one extensible Lisp
  environment that stays useful for decades.

use_cases:
  - Write literate ML notebooks and papers in Org mode that tangle to Python
  - Edit remote training scripts over TRAMP without leaving the editor
  - Manage git, terminals, and REPLs from one keyboard-driven workspace
  - Extend the editor with Emacs Lisp packages for project-specific AI tooling
