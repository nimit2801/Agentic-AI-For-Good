name: Redoc
description: Open-source OpenAPI, AsyncAPI, and GraphQL reference docs with a three-panel layout, search, and React or static HTML deploy. Teams publish LLM, agent, and inference API specs without maintaining a separate docs site.
tagline: Three-panel API reference docs from OpenAPI and GraphQL

github_url: https://github.com/Redocly/redoc
website_url: https://redocly.github.io/redoc/
docs_url: https://redocly.com/docs/redoc

install_command: npm install redoc

category: Dev Tools
tags: [openapi, swagger, api-docs, documentation, javascript, react]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Agent and model APIs ship OpenAPI specs, but hand-written docs drift
  and hide request examples. Redoc renders the spec into searchable
  three-panel docs with code samples so consumers can call inference
  and tool endpoints from an accurate reference.

use_cases:
  - Publish OpenAPI docs for an LLM or embedding HTTP API
  - Embed a React Redoc component in an internal developer portal
  - Generate a static HTML reference from CI for an agent webhook API
  - Document MCP-related OpenAPI extensions next to request examples
