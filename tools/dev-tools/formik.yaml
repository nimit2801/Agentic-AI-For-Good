name: Formik
description: Form state, validation, and submission helper for React. Formik tracks values, errors, and touched fields so AI product settings, onboarding flows, and dataset upload forms stay consistent.
tagline: Build forms in React without the tears

github_url: https://github.com/jaredpalmer/formik
website_url: https://formik.org
docs_url: https://formik.org/docs/overview
install_command: npm install formik

category: Dev Tools
tags: [react, forms, typescript, validation, frontend, javascript]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Wiring values, errors, and submit handlers by hand duplicates
  boilerplate on every settings page. Formik centralizes form state
  so React AI consoles can validate configs and uploads with one
  pattern.

use_cases:
  - Ship an onboarding form for API keys and default models
  - Validate dataset upload metadata before an eval run
  - Manage multi-step agent configuration wizards in React
  - Display field-level errors on prompt and tool setting screens
