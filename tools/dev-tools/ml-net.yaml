name: ML.NET
description: ML.NET is an open source and cross-platform machine learning framework for .NET. It enables developers to build custom ML models for classification, regression, forecasting, recommendation, anomaly detection, and computer vision — all within the .NET ecosystem without requiring Python expertise.
tagline: Cross-platform machine learning framework for .NET

github_url: https://github.com/dotnet/machinelearning
website_url: https://dot.net/ml
docs_url: https://learn.microsoft.com/en-us/dotnet/machine-learning/

install_command: dotnet add package Microsoft.ML

category: Dev Tools
tags:
  - dotnet
  - machine-learning
  - c-sharp
  - microsoft
  - classification
  - regression
  - forecasting
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  ML workflows typically require Python expertise and separate environments, creating
  friction for .NET developers. ML.NET brings native machine learning to the .NET
  ecosystem, allowing C# and F# developers to train, evaluate, and deploy custom
  models directly in their existing applications without switching languages or runtimes.

use_cases:
  - "Build sentiment analysis and text classification models in ASP.NET web applications"
  - "Create real-time recommendation engines for e-commerce platforms using .NET"
  - "Deploy anomaly detection pipelines for IoT sensor data in Azure Functions"
  - "Train image classification models for computer vision tasks with ML.NET Model Builder"