name: AutoHotkey
description: AutoHotkey is a Windows scripting language for hotkeys, macros, and desktop automation. Developers and agents use it to click UI, fill forms, and remap keys when there is no API and the work has to happen in a real Windows GUI.
tagline: Windows hotkeys, macros, and GUI automation scripts
github_url: https://github.com/AutoHotkey/AutoHotkey
website_url: https://autohotkey.com/
docs_url: https://www.autohotkey.com/docs/v2/
category: Dev Tools
tags: [windows, automation, macros, hotkeys, scripting, desktop, gui]
pricing: free
is_open_source: true
license: GPL-2.0
problem_solved: |
  Many Windows apps have no API, so agents and operators cannot click, type, or
  remap keys without a GUI automation layer. AutoHotkey is a small scripting
  language for hotkeys and macros that can drive the real desktop, which is
  still the practical path for legacy software and keyboard-driven workflows.
use_cases:
  - Bind hotkeys that paste snippets, launch apps, or run multi-step macros
  - Automate clicks and keystrokes in Windows programs that expose no API
  - Remap keys and mouse buttons for faster operator workflows
  - Script GUI setup steps that coding agents cannot reach through a CLI
  - Build unattended Windows helpers that fill forms and move files
