name: nf-core
description: "Community of curated Nextflow pipelines plus a Python CLI for creating, linting, and syncing them. nf-core gives research teams production-ready RNA-seq, variant calling, and other workflows with shared modules, CI, and documentation instead of one-off Nextflow scripts."
tagline: "Community Nextflow pipelines and developer CLI"
github_url: https://github.com/nf-core/tools
website_url: https://nf-co.re
docs_url: https://nf-co.re/docs
install_command: pip install nf-core
category: Dev Tools
tags:
  - nextflow
  - pipelines
  - bioinformatics
  - workflow
  - python
  - community
pricing: free
is_open_source: true
license: MIT
problem_solved: "Bioinformatics groups rewrite the same RNA-seq or variant-calling Nextflow pipeline with inconsistent modules, tests, and docs. Sharing a pipeline that others can run on HPC or cloud is hard without a standard. nf-core publishes peer-reviewed pipelines and a tools CLI that scaffolds, lints, and syncs pipelines so labs reuse community workflows instead of maintaining forks."
use_cases:
  - "Run a curated nf-core RNA-seq or Sarek variant-calling pipeline on HPC or cloud"
  - "Scaffold a new Nextflow pipeline with nf-core templates, modules, and lint checks"
  - "Sync an existing pipeline to the latest nf-core template and shared nf-core modules"
  - "Lint pipeline configs and documentation before publishing a workflow to the community"
