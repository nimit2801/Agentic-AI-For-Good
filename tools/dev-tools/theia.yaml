name: Theia
description: Eclipse Theia is a TypeScript framework for building cloud and desktop IDEs with VS Code extension compatibility. Ship a browser IDE for notebooks, agents, or internal tools instead of forking VS Code or locking users into GitHub Codespaces.
tagline: Extensible cloud and desktop IDE framework

github_url: https://github.com/eclipse-theia/theia
website_url: https://theia-ide.org
docs_url: https://theia-ide.org/docs

category: Dev Tools
tags: [ide, typescript, cloud-ide, vscode, eclipse, desktop]
pricing: free
is_open_source: true
license: EPL-2.0

problem_solved: |
  Custom IDEs usually mean forking VS Code or buying Codespaces. Theia is
  an Eclipse framework that builds cloud and desktop IDEs in TypeScript
  with VS Code extension compatibility, so a lab can ship a browser editor
  for notebooks and agents without a Microsoft-hosted workspace.

use_cases:
  - Build a browser IDE for an internal ML platform with VS Code extensions
  - Ship a desktop tool workbench that reuses Theia plugins
  - Host a cloud workspace for agents that edit code in the browser
  - Customize the IDE chrome without maintaining a VS Code fork
