name: dnd-kit
description: Modern React toolkit for accessible drag-and-drop. Build sortable agent tool palettes, kanban eval queues, and dashboard widgets without fighting mouse, touch, and keyboard edge cases.
tagline: Accessible drag and drop for React

github_url: https://github.com/clauderic/dnd-kit
website_url: https://dndkit.com
docs_url: https://docs.dndkit.com
install_command: npm install @dnd-kit/core @dnd-kit/sortable

category: Dev Tools
tags: [react, drag-and-drop, accessibility, ui, frontend, typescript]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Agent dashboards need sortable tool lists and kanban queues, but native
  HTML5 drag-and-drop is inconsistent on touch and keyboard. dnd-kit is a
  modular React toolkit with sensors and collision detection so teams ship
  accessible drag-and-drop without a custom pointer stack.

use_cases:
  - Sort agent tools and skills in a palette with keyboard support
  - Drag eval jobs across kanban columns in an ML ops board
  - Reorder dashboard widgets in a customizable agent console
  - Build a visual prompt-chain builder with droppable nodes
