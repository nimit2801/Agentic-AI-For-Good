name: Asciidoctor
description: A fast Ruby processor that converts AsciiDoc to HTML 5, DocBook 5, man pages, PDF, and EPUB. It is the reference toolchain for AsciiDoc and is used for technical docs on GitHub, GitLab, and many OSS projects.
tagline: AsciiDoc processor for HTML, DocBook, PDF, and more

github_url: https://github.com/asciidoctor/asciidoctor
website_url: https://asciidoctor.org
docs_url: https://docs.asciidoctor.org

category: Dev Tools
tags: [asciidoc, documentation, ruby, publishing, html, pdf]
pricing: free
is_open_source: true
license: MIT
install_command: gem install asciidoctor

problem_solved: |
  ML libraries and internal platform docs often start as AsciiDoc, but teams still compile them with slow or unmaintained Python AsciiDoc tools. Asciidoctor is the reference Ruby processor that turns AsciiDoc into HTML, DocBook, man pages, PDF, and EPUB so API and runbook docs stay one source and render the same on GitHub and in published manuals.

use_cases:
  - Convert AsciiDoc API docs to HTML 5 for an ML library website
  - Publish runbooks and architecture notes as PDF or DocBook from AsciiDoc
  - Render man pages and EPUB from the same AsciiDoc source as the HTML site
