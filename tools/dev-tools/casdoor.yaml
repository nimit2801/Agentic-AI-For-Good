name: Casdoor
description: Casdoor is an open-source IAM and auth server with a web UI for OAuth, OIDC, SAML, and MFA. Teams use it as an agent-first identity gateway so ML apps and MCP tools get SSO without a commercial IdP.
tagline: Open-source IAM and SSO server with a web UI

github_url: https://github.com/casdoor/casdoor
website_url: https://casdoor.ai
docs_url: https://casdoor.org/docs/overview

category: Dev Tools
tags: [identity, sso, oauth, oidc, saml, iam, authentication, go]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Product and ML teams need SSO, MFA, and user management without paying
  Auth0 or writing OAuth by hand. Casdoor is a self-hosted IAM server
  with a web UI for OIDC, SAML, LDAP, and MFA so dashboards, agent
  gateways, and APIs share one identity stack.

use_cases:
  - Add OIDC SSO to internal ML dashboards and agent UIs
  - Run a self-hosted IdP with MFA instead of a commercial auth vendor
  - Broker social login and LDAP for a SaaS product that serves AI features
  - Put a single auth gateway in front of MCP tools and model consoles
