name: Mojo
description: Mojo is Modular's programming language for AI systems. It combines Python-like syntax with systems performance so teams write kernels and serving code that run near C++ speed without leaving a Python-shaped workflow.
tagline: Python-like language for high-performance AI systems

github_url: https://github.com/modular/modular
website_url: https://www.modular.com/mojo
docs_url: https://docs.modular.com/

category: Dev Tools
tags: [mojo, python, compilers, ai, gpu, systems, modular, performance]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  AI kernels need C++ or CUDA speed, but research code lives in
  Python. Mojo is Modular's language with Python-like syntax and
  systems performance so teams write serving and kernel code
  without a full rewrite.

use_cases:
  - Write a high-performance numeric kernel in a Python-like syntax
  - Prototype AI serving logic that compiles closer to C++ speed
  - Share Modular MAX and Mojo code in one systems workflow
  - Port a hot Python loop to Mojo without dropping to CUDA first
