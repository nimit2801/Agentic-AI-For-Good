name: Spacemacs
description: Community-driven Emacs distribution that combines Emacs and Vim, with mnemonic keybindings, layers for languages and tools, and a consistent UI so you get a full IDE without a custom init.el.
tagline: Emacs distribution that is both Emacs and Vim

github_url: https://github.com/syl20bnr/spacemacs
website_url: https://www.spacemacs.org
docs_url: https://develop.spacemacs.org/doc/DOCUMENTATION.html

install_command: git clone https://github.com/syl20bnr/spacemacs ~/.emacs.d

category: Dev Tools
tags: [emacs, vim, editor, ide, lisp, spacemacs]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Emacs is endlessly configurable and easy to leave half-broken. Spacemacs is a
  community distribution with Vim keys, mnemonic leader bindings, and layers so
  you can enable Python, Git, and Org without assembling a personal config from
  scratch.

use_cases:
  - Run Emacs with Vim keys and a mnemonic leader map
  - Enable language layers for Python, Lisp, and markup in one config
  - Keep Magit, Org, and project search consistent across machines
  - Onboard Vim users to Emacs without a 2,000-line init file
