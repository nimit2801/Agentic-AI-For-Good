name: Cmder
description: Portable Windows console package built on ConEmu and Windows Terminal with Clink, Git, and a Monokai theme. Carry aliases, binaries, and a usable shell on a USB stick or cloud folder with no install.
tagline: Portable Windows console pack with Clink, Git, and aliases

github_url: https://github.com/cmderdev/cmder
website_url: https://cmder.app
docs_url: https://github.com/cmderdev/cmder/blob/master/README.md

category: Dev Tools
tags: [terminal, windows, portable, clink, git, console]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Windows shells are painful to set up on a new machine or USB stick.
  Cmder ships ConEmu or Windows Terminal, Clink completions, Git, and a
  prompt in one folder so ML engineers get a Unix-like console without
  admin rights or a long bootstrap.

use_cases:
  - Carry a self-contained console with Git and curl on a USB stick
  - Open "Cmder Here" from Explorer in a training repo on Windows
  - Keep portable aliases and bin tools across lab machines
  - Use Clink history search and completions in CMD for Python and CUDA CLIs
