name: Quill
description: "A modern WYSIWYG rich text editor for the web, built for compatibility and extensibility. Embed it in any page, customize toolbars and formats, and persist content as Delta JSON or HTML."
tagline: "Powerful, extensible rich text editor"
github_url: https://github.com/slab/quill
website_url: https://quilljs.com
docs_url: https://quilljs.com/docs
install_command: npm install quill
category: Dev Tools
tags:
  - javascript
  - editor
  - wysiwyg
  - rich-text
  - frontend
pricing: free
is_open_source: true
license: BSD-3-Clause
problem_solved: "AI products that let users edit prompts, knowledge-base articles, or generated drafts need a reliable rich text surface, not a textarea. Quill is a battle-tested WYSIWYG editor with a documented Delta format, custom blots, and a modular toolbar. Teams can capture structured rich content, round-trip HTML, and extend formats without rebuilding an editor from contenteditable."
use_cases:
  - "Add a rich prompt or knowledge-base editor to an agent dashboard with a custom toolbar"
  - "Persist generated articles as Quill Delta JSON so formatting survives round trips"
  - "Extend the editor with custom blots for citations, tool calls, or inline model mentions"
