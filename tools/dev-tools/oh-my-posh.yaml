name: oh-my-posh
description: Cross-platform prompt theme engine for any shell. Renders a low-latency, highly customizable prompt in PowerShell, zsh, bash, fish, and Nushell so GPU boxes and local terminals share one config.
tagline: Cross-platform prompt theme engine for any shell

github_url: https://github.com/JanDeDobbeleer/oh-my-posh
website_url: https://ohmyposh.dev
docs_url: https://ohmyposh.dev/docs
install_command: brew install oh-my-posh

category: Dev Tools
tags: [prompt, shell, powershell, zsh, bash, terminal, cli]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  ML engineers hop between PowerShell, zsh, and bash on laptops and GPU boxes,
  each with a different prompt setup. oh-my-posh is a single prompt renderer
  with shared themes so git status, Python venv, and cloud context look the
  same in every shell.

use_cases:
  - Render a consistent git-aware prompt in PowerShell, zsh, bash, and fish
  - Show Python venv, kubectl context, and battery in a low-latency prompt
  - Share one oh-my-posh theme JSON across macOS, Linux, and Windows
  - Customize segments for ML project roots without writing shell functions
