name: deck.gl
description: deck.gl is a WebGL2 visualization framework for large geospatial and tabular datasets. It layers GPU-accelerated scatter, arc, hexagon, and trip views on maps so dashboards render millions of points without a custom shader stack.
tagline: WebGL2 framework for large-scale geospatial visualization

github_url: https://github.com/visgl/deck.gl
website_url: https://deck.gl
docs_url: https://deck.gl

category: Dev Tools
tags: [javascript, typescript, webgl, maps, visualization, geospatial, gpu, visgl]
pricing: free
is_open_source: true
license: MIT

install_command: npm install deck.gl

problem_solved: |
  Browser maps choke on millions of points. deck.gl is a WebGL2 layer
  framework for scatter, hexagon, and trip views so dashboards render
  large geospatial datasets without a custom GPU pipeline.

use_cases:
  - Plot millions of GPS points as a GPU scatter or hexagon layer
  - Animate vehicle trips on a MapLibre or Google basemap
  - Overlay arcs and heatmaps on a React or vis.gl dashboard
  - Prototype a city-scale viz without writing WebGL shaders
