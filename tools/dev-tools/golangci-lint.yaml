name: golangci-lint
description: Fast linters runner for Go that aggregates dozens of analyzers (govet, staticcheck, errcheck, gosec, and more) into one binary with caching, parallel execution, and CI-friendly output.
tagline: Run dozens of Go linters in one fast pass

github_url: https://github.com/golangci/golangci-lint
website_url: https://golangci-lint.run
docs_url: https://golangci-lint.run/welcome/quick-start/
install_command: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

category: Dev Tools
tags: [go, linter, static-analysis, ci, code-quality]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Go services for model serving, agents, and data pipelines usually need
  several linters (govet, staticcheck, errcheck, gosec) each with their own
  flags, versions, and CI steps. golangci-lint runs them in one cached,
  parallel binary so teams catch bugs and style issues without a slow
  multi-tool pre-commit stack.

use_cases:
  - Lint Go inference APIs and agent workers in CI with a single golangci-lint run
  - Enable gosec and errcheck alongside govet without wiring each tool separately
  - Cache lint results locally and in CI so unchanged packages skip re-analysis
  - Enforce a shared .golangci.yml across microservices that call LLM and vector APIs
