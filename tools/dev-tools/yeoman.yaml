name: Yeoman
description: Scaffolding system that generates apps from community generators. Teams bootstrap Node services, dashboards, and internal tools with yo so a new AI console starts from a known project layout instead of an empty folder.
tagline: Generator ecosystem for scaffolding web apps

github_url: https://github.com/yeoman/yeoman
website_url: https://yeoman.io
docs_url: https://yeoman.io/authoring/

install_command: npm install -g yo

category: Dev Tools
tags: [javascript, scaffolding, generators, node, yo]
pricing: free
is_open_source: true
license: BSD-2-Clause

problem_solved: |
  Greenfield Node apps for agent UIs start as empty folders and
  diverge immediately. Yeoman runs generators that drop a standard
  layout, tooling, and scripts so teams share one starting point.

use_cases:
  - Scaffold a Node dashboard for an internal agent console
  - Run a generator to add lint, test, and build scripts
  - Bootstrap a new microservice with a known folder layout
  - Author a custom generator for repeating AI tool templates
