name: Capacitor
description: Cross-platform runtime that wraps web apps as native iOS, Android, and PWA clients. Ship agent consoles and LLM chat apps to mobile with native plugins instead of rewriting in Swift or Kotlin.
tagline: Native iOS, Android, and web apps from one codebase

github_url: https://github.com/ionic-team/capacitor
website_url: https://capacitorjs.com
docs_url: https://capacitorjs.com/docs
install_command: npm install @capacitor/core @capacitor/cli

category: Dev Tools
tags: [mobile, pwa, ios, android, javascript, cross-platform]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Teams with a web agent console often need iOS and Android apps without
  rewriting in Swift or Kotlin. Capacitor wraps the existing web app in a
  native shell with plugins for camera, filesystem, and push so one
  codebase ships as a PWA and store apps.

use_cases:
  - Wrap a Next.js LLM chat UI as an iOS and Android app
  - Access camera and filesystem plugins from a mobile agent companion
  - Ship an offline-capable PWA for field data collection into RAG pipelines
  - Reuse a React dashboard as a native shell for on-call ML ops
