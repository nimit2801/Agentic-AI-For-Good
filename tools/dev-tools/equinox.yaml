name: Equinox
description: A JAX library for building neural networks and scientific machine learning models with a clean, PyTorch-like API — featuring elegant parameter handling, composable modules, and first-class support for JIT compilation and automatic differentiation.
tagline: Elegant neural networks and scientific computing in JAX

github_url: https://github.com/patrick-kidger/equinox
website_url: https://docs.kidger.site/equinox/
docs_url: https://docs.kidger.site/equinox/

install_command: pip install equinox

category: Dev Tools
tags: [python, jax, deep-learning, neural-networks, scientific-computing, ml, gpu]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  JAX is powerful for high-performance numerical computing but its functional programming model makes building neural networks complex — requiring manual parameter management, custom training loops, and deep understanding of JAX transforms. Equinox provides a PyTorch-like API on top of JAX with clean parameter handling, composable modules, and seamless support for JIT compilation, vmap, and grad — making JAX accessible for both deep learning research and scientific machine learning without sacrificing performance or flexibility.

use_cases:
  - Build and train custom neural network architectures in JAX with clean, maintainable module code
  - Implement scientific machine learning models combining neural networks with differential equations
  - Accelerate ML research with composable modules that leverage JAX's JIT, autodiff, and hardware acceleration
  - Create reproducible experiments with Equinox's serialization and parameter management system
  - Develop production ML pipelines that require the performance of JAX with the ergonomics of PyTorch-style APIs
