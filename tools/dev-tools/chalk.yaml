name: Chalk
description: Terminal string styling library for Node.js. Colorize agent CLI output, eval logs, and pipeline status so operators can scan success, warn, and error lines without a custom formatter.
tagline: Terminal string styling done right

github_url: https://github.com/chalk/chalk
website_url: https://github.com/chalk/chalk
docs_url: https://github.com/chalk/chalk#readme
install_command: npm install chalk

category: Dev Tools
tags: [cli, nodejs, terminal, javascript, developer-tools]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Agent CLIs dump logs that are hard to scan when everything is plain
  text. Chalk applies color and styles with a small API so success, warn,
  and error lines stand out without a custom ANSI helper.

use_cases:
  - Colorize agent CLI status for run, eval, and deploy commands
  - Highlight errors in embedding and fine-tune pipeline logs
  - Style help and version output in a Node.js catalog tool
  - Format table-like CLI summaries for batch job results
