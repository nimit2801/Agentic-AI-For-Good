name: Inquirer
description: "A collection of interactive command-line prompts for Node.js: input, select, confirm, checkbox, and more. Build setup wizards and agent CLIs that ask questions instead of requiring a long flag list."
tagline: "Interactive command-line prompts for Node.js"
github_url: https://github.com/SBoudrias/Inquirer.js
website_url: https://github.com/SBoudrias/Inquirer.js
docs_url: https://github.com/SBoudrias/Inquirer.js
install_command: npm install inquirer
category: Dev Tools
tags:
  - nodejs
  - javascript
  - cli
  - prompts
  - developer-tools
pricing: free
is_open_source: true
license: MIT
problem_solved: "Scaffolding an agent project or configuring an MCP server from the terminal is painful when every choice is a flag. Inquirer provides typed interactive prompts so setup wizards can ask for model, provider, and output path. Teams ship onboarding CLIs that collect structured answers without a custom TTY layer."
use_cases:
  - "Prompt for model, API key, and output path when scaffolding an agent project"
  - "Confirm destructive eval resets in a CLI before deleting run history"
  - "Let users pick tools from a checkbox list when generating an MCP config"
