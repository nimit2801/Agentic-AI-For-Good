name: nbdev
description: Literate programming system that turns Jupyter notebooks into Python packages, tests, and documentation. nbdev lets you write library code in notebooks, export modules, run tests, and publish docs from the same source.
tagline: Write Python packages, tests, and docs from Jupyter notebooks

github_url: https://github.com/AnswerDotAI/nbdev
website_url: https://nbdev.fast.ai/
docs_url: https://nbdev.fast.ai/
install_command: pip install nbdev

category: Dev Tools
tags: [jupyter, literate-programming, python, documentation, packaging, fastai]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Library authors split work across notebooks, .py files, tests, and docs that drift apart. nbdev keeps a notebook as the source of truth, exports clean modules, generates documentation, and runs tests so a package stays consistent from exploratory code to a published library.

use_cases:
  - Author a Python library in notebooks and export installable modules
  - Generate API documentation automatically from notebook prose and examples
  - Run notebook-based tests in CI for research and ML packages
  - Publish a docs site that stays in sync with the code you just wrote
  - Teach software design by showing narrative, tests, and implementation together
