name: Better Auth
description: Framework-agnostic TypeScript authentication and authorization library with email, OAuth, 2FA, organizations, and a plugin ecosystem. Drop it into Next.js, Nuxt, or SvelteKit instead of wiring Auth.js plus a pile of custom tables.
tagline: TypeScript auth framework with batteries included

github_url: https://github.com/better-auth/better-auth
website_url: https://www.better-auth.com
docs_url: https://www.better-auth.com/docs
install_command: npm install better-auth

category: Dev Tools
tags: [auth, typescript, oauth, nextjs, 2fa, plugins, security]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  TypeScript auth is half-solved. Auth.js covers the basics, then 2FA,
  orgs, and multi-tenant need custom tables. Better Auth is a framework
  with those features as plugins so agent dashboards and SaaS apps get
  sessions, OAuth, and 2FA without reinventing authorization.

use_cases:
  - Add email and OAuth login to a Next.js agent control plane
  - Enable 2FA and organization tenancy with official plugins
  - Share auth across Nuxt, SvelteKit, or other TypeScript apps
  - Replace a pile of custom session tables with a typed auth API
