name: Emotion
description: CSS-in-JS library designed for high performance style composition in React and vanilla JavaScript. Colocate styles with components so AI dashboards, chat UIs, and admin tools stay themable without a separate CSS pipeline.
tagline: High-performance CSS-in-JS for React

github_url: https://github.com/emotion-js/emotion
website_url: https://emotion.sh
docs_url: https://emotion.sh/docs/introduction
install_command: npm install @emotion/react

category: Dev Tools
tags: [javascript, typescript, react, css-in-js, styling, frontend]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Global CSS and ad-hoc class names collide as AI consoles grow
  themes, density modes, and embedded widgets. Emotion composes
  styles next to React components with good runtime performance
  so dashboards stay consistent without a heavy design system.

use_cases:
  - Theme a React agent console with colocated component styles
  - Style streaming chat bubbles and tool-trace cards in TypeScript
  - Share CSS-in-JS tokens across an AI product and its docs site
  - Build a themable eval dashboard without a separate CSS build
