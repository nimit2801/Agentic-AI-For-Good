name: Toga
description: Python native GUI toolkit from the BeeWare project. Toga uses each OS widget set so a single Python app can ship desktop and mobile UIs for local model tools without embedding a browser or learning Swift and Kotlin.
tagline: Native Python GUI toolkit from BeeWare

github_url: https://github.com/beeware/toga
website_url: https://beeware.org/project/toga/
docs_url: https://toga.readthedocs.io
install_command: pip install toga

category: Dev Tools
tags: [python, gui, desktop, beeware, cross-platform]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Local ML utilities often wrap a web UI or force users onto Electron.
  Toga builds native widgets from Python on macOS, Windows, Linux, and
  mobile so a model demo or data tool feels like a real desktop app.

use_cases:
  - Ship a native desktop app for a local LLM or image-model demo in Python
  - Build a cross-platform data-labeling utility without Electron
  - Prototype a BeeWare mobile UI that calls an on-device model
  - Wrap a Python inference script in native menus, forms, and file dialogs
