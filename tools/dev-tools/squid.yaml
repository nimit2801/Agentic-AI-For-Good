name: Squid
description: A caching proxy server for the Web supporting HTTP, HTTPS, FTP, and more, widely used for traffic optimization and access control.
tagline: Web caching proxy server for traffic optimization and access control

github_url: https://github.com/squid-cache/squid
website_url: http://www.squid-cache.org
docs_url: http://www.squid-cache.org/Doc/

category: Dev Tools
tags: [proxy, caching, http, web, server, access-control, infrastructure]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Organizations need to control outbound web access, cache frequently requested content, and
  optimize bandwidth usage across distributed teams. Squid provides a full-featured caching proxy
  that supports access control lists, content filtering, bandwidth shaping, and hierarchical caching,
  making it the standard proxy solution for enterprise networks, ISPs, and content delivery.

use_cases:
  - Cache static web content and software package downloads to reduce bandwidth consumption
  - Enforce web access policies with fine-grained ACLs based on URLs, domains, and user groups
  - Deploy a transparent proxy for seamless content filtering without reconfiguring client devices
  - Build hierarchical caching architectures for ISPs and large enterprise networks
