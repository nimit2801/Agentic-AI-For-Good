name: GraphQL.js
description: Reference implementation of GraphQL for JavaScript and TypeScript. Execute queries, mutations, and subscriptions against a typed schema so AI apps can fetch exactly the tool, run, and model fields they need.
tagline: GraphQL reference implementation for JavaScript

github_url: https://github.com/graphql/graphql-js
website_url: https://graphql.org/graphql-js/
docs_url: https://graphql.org/graphql-js/
install_command: npm install graphql

category: Dev Tools
tags: [javascript, typescript, graphql, api, schema, nodejs]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  REST endpoints over-fetch or under-fetch when UIs need nested run,
  tool, and model data. GraphQL.js is the JS reference runtime that
  executes a typed schema so clients ask for the exact fields an AI
  console or agent backend needs.

use_cases:
  - Execute GraphQL queries against a typed catalog of tools and runs
  - Expose mutations that start agent jobs from a TypeScript server
  - Subscribe to live eval and trace fields from a Node GraphQL schema
  - Validate incoming GraphQL documents before they hit resolvers
