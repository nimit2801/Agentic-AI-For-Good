name: mdBook
description: "Rust tool that builds books from Markdown, in the style of GitBook. mdBook is the documentation engine behind The Rust Book and is used for versioned technical docs, tutorials, and internal engineering handbooks with search and theming."
tagline: "Build books from Markdown, like GitBook in Rust"
github_url: https://github.com/rust-lang/mdBook
website_url: https://rust-lang.github.io/mdBook/
docs_url: https://rust-lang.github.io/mdBook/
install_command: cargo install mdbook
category: Dev Tools
tags:
  - markdown
  - documentation
  - rust
  - static-site
  - books
  - docs
pricing: free
is_open_source: true
license: MPL-2.0
problem_solved: "Long-form technical docs in a pile of Markdown files need navigation, search, and a stable theme without a heavy CMS. mdBook compiles a SUMMARY.md into a searchable HTML book so language, ML, and infrastructure teams can publish tutorials that version with the repo."
use_cases:
  - "Publish an internal ML platform handbook as a searchable Markdown book in CI"
  - "Build versioned product docs that live next to code in the same Git repository"
  - "Write a tutorial book with nested chapters, code highlighting, and client-side search"
  - "Theme and deploy static HTML docs to GitHub Pages without a Node.js static-site stack"
