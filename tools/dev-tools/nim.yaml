name: Nim
description: Nim is a statically typed compiled systems language. It mixes Python-like syntax with C-level speed and compile-time metaprogramming so teams write efficient native code without a heavy C++ workflow.
tagline: Statically typed systems language with Python-like syntax

github_url: https://github.com/nim-lang/Nim
website_url: https://nim-lang.org
docs_url: https://nim-lang.org/documentation.html

category: Dev Tools
tags: [nim, compilers, systems, python, native, metaprogramming, performance]
pricing: free
is_open_source: true
license: MIT

install_command: brew install nim

problem_solved: |
  Systems code often means C++ ceremony or Python speed limits.
  Nim is a compiled language with Python-like syntax and C-level
  performance so teams ship native tools without that tradeoff.

use_cases:
  - Write a fast CLI or systems tool with Python-like syntax
  - Compile Nim to C or JS for native and web targets
  - Use compile-time macros to generate boilerplate-free APIs
  - Port a hot Python prototype to a statically typed native binary
