name: Starlight
description: Documentation theme for Astro that ships with sidebar navigation, search, i18n, and Markdown pages. Teams document SDKs and AI platforms as a fast static site without standing up a separate docs CMS.
tagline: Astro documentation theme with search and i18n

github_url: https://github.com/withastro/starlight
website_url: https://starlight.astro.build
docs_url: https://starlight.astro.build/getting-started/
install_command: npm install @astrojs/starlight

category: Dev Tools
tags: [documentation, astro, markdown, static-site, docs, i18n]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Product docs for AI SDKs need versioning, search, and translations, but
  a full CMS is heavy. Starlight sits on Astro so Markdown in the repo
  becomes a fast docs site with sensible defaults instead of a custom
  Gatsby or VuePress stack.

use_cases:
  - Launch API docs for an MCP server or inference SDK on Astro
  - Add local search and i18n to an AI platform handbook
  - Keep Markdown docs next to examples in the same Astro project
  - Customize Starlight components for branded model-catalog documentation
