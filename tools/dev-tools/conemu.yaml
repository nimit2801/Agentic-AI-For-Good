name: ConEmu
description: Windows console emulator with tabs, splits, quake-style dropdown, and hotkeys. Hosts CMD, PowerShell, Git Bash, and Far Manager in one GUI so Windows ML and DevOps work stays in a customizable terminal.
tagline: Customizable Windows console with tabs, splits, and quake mode

github_url: https://github.com/ConEmu/ConEmu
website_url: https://conemu.github.io/
docs_url: https://conemu.github.io/en/TableOfContents.html

category: Dev Tools
tags: [terminal, windows, console, tabs, powershell, git-bash]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Classic Windows consoles lack tabs, splits, and usable fonts, so teams
  juggle many conhost windows for Git, CUDA CLI, and SSH. ConEmu wraps
  those programs in one GUI with panes, hotkeys, and quake-style access.

use_cases:
  - Keep PowerShell, CMD, and Git Bash in tabs while training models on Windows
  - Split a window between nvidia-smi and a training log without extra consoles
  - Drop down a quake-style terminal over a Jupyter or IDE session
  - Host Far Manager, PuTTY, and DOSBox apps in one configurable GUI
