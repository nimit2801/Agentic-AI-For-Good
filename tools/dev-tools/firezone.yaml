name: Firezone
description: Firezone is a blazing-fast remote access platform that replaces traditional VPNs with a modern, self-hosted zero-trust access solution built on WireGuard. It provides secure connectivity for teams without the complexity of legacy VPN infrastructure.
tagline: Self-hosted zero-trust remote access built on WireGuard

github_url: https://github.com/firezone/firezone
website_url: https://www.firezone.dev
docs_url: https://www.firezone.dev/kb

category: Dev Tools
tags: [vpn, wireguard, zero-trust, security, networking, self-hosted]
pricing: freemium
is_open_source: true

problem_solved: |
  Legacy VPNs are slow, complex to manage, and grant excessive network access. Firezone replaces
  them with a self-hosted, WireGuard-based zero-trust platform that is fast to deploy, easy to
  manage, and provides granular access controls without cloud vendor lock-in.

use_cases:
  - Replacing slow legacy VPNs with high-performance WireGuard tunnels for remote teams
  - Deploying self-hosted zero-trust network access without cloud vendor lock-in
  - Granting granular resource-level access instead of full network segmentation
  - Securing developer and DevOps access to staging and production environments
