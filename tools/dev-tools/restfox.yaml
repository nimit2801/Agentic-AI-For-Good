name: Restfox
description: Offline-first HTTP and WebSocket client for the browser and desktop. Collections stay local, so you can inspect APIs, sockets, and GraphQL without an account or a cloud-synced workspace.
tagline: Offline-first HTTP and socket testing client

github_url: https://github.com/flawiddsouza/Restfox
website_url: https://restfox.dev
docs_url: https://restfox.dev/docs
install_command: brew install --cask restfox

category: Dev Tools
tags: [http-client, api-testing, websocket, graphql, pwa, desktop]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Most API clients push collections to the cloud and require an account.
  Restfox keeps requests, environments, and WebSocket sessions on disk or
  in the browser, so teams can debug model APIs and sockets offline without
  putting tokens or payloads on a vendor server.

use_cases:
  - Call local and staging LLM HTTP APIs without creating a Postman account
  - Inspect WebSocket streams from an agent runtime in a desktop client
  - Keep GraphQL and REST collections git-friendly and fully offline
  - Share a lightweight PWA API client with a team that cannot use cloud workspaces
