name: LazyVim
description: Neovim starter config powered by lazy.nvim that ships LSP, treesitter, completions, and a plugin suite with sane defaults. Clone the starter to get an IDE-like editor you can still extend in Lua instead of assembling a plugin stack from scratch.
tagline: Neovim starter config that feels like an IDE

github_url: https://github.com/LazyVim/LazyVim
website_url: https://lazyvim.github.io
docs_url: https://lazyvim.github.io
install_command: git clone https://github.com/LazyVim/starter ~/.config/nvim

category: Dev Tools
tags: [neovim, lua, lsp, editor, ide, lazy-nvim, terminal]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Neovim is a blank editor until you wire LSP, treesitter, and plugins.
  LazyVim is a starter config on lazy.nvim with sane defaults and a
  pre-configured plugin suite, so ML engineers get an IDE-like terminal
  editor they can still extend in Lua without weeks of config.

use_cases:
  - Bootstrap a Neovim IDE with LSP, treesitter, and completions in one clone
  - Edit Python training scripts over SSH with language-aware diagnostics
  - Add extras for languages or tools without rewriting a plugin manager
  - Keep a fast, keyboard-driven editor that still feels like VS Code
