name: xplr
description: Hackable, minimal, fast TUI file explorer. xplr is configured in Lua, pipes well with other CLI tools, and lets you browse, preview, and act on files without leaving the terminal.
tagline: Hackable minimal TUI file explorer

github_url: https://github.com/sayanarijit/xplr
website_url: https://xplr.dev
docs_url: https://xplr.dev

install_command: brew install xplr

category: Dev Tools
tags: [file-explorer, tui, lua, cli, terminal, developer-tools]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Terminal file managers are often rigid or slow to customize. xplr is a fast
  TUI explorer you configure in Lua and compose with other commands, so
  browsing datasets, logs, and project trees stays in the same Unix pipeline
  as the rest of your workflow.

use_cases:
  - Browse and preview files in a project or dataset directory from the TUI
  - Pipe selected paths into ffmpeg, git, or an LLM tool
  - Customize layouts and keybindings in Lua for a team file workflow
  - Navigate large artifact directories without a GUI file manager
