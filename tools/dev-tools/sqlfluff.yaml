name: SQLFluff
description: "A dialect-flexible SQL linter and formatter that enforces consistent style across SQL codebases and code-generated queries, with templating support for Jinja and dbt projects and auto-fix capabilities."
tagline: "SQL linter and formatter"
github_url: https://github.com/sqlfluff/sqlfluff
website_url: https://sqlfluff.com
docs_url: https://docs.sqlfluff.com
install_command: "pip install sqlfluff"
category: Dev Tools
tags:
  - sql
  - linter
  - formatter
  - dbt
  - code-quality
pricing: free
is_open_source: true
license: MIT
problem_solved: "SQL written by hand or generated by LLMs is often inconsistent, unreadable, and error-prone — subtle style differences and syntax mistakes slip through code review into production data pipelines. SQLFluff lints SQL against configurable style rules across many dialects, auto-formats messy queries, and supports Jinja and dbt templating, so teams can enforce consistent, correct SQL in CI just like they lint application code."
use_cases:
  - "Lint and auto-fix SQL in CI so every committed query follows consistent style rules across dialects"
  - "Format dbt model files with Jinja templating support, catching syntax issues before materialization"
  - "Clean up LLM-generated SQL in text-to-SQL pipelines by normalizing formatting and flagging rule violations"
