name: GTKWave
description: GTKWave is a GTK-based waveform viewer for Unix, Windows, and macOS. It reads VCD, FST, LXT, GHW, and related dumps so HDL teams inspect Verilog and VHDL simulations without a closed vendor viewer.
tagline: Open-source waveform viewer for Verilog and VHDL dumps

github_url: https://github.com/gtkwave/gtkwave
website_url: https://gtkwave.github.io/gtkwave/
docs_url: https://gtkwave.github.io/gtkwave/

category: Dev Tools
tags: [gtkwave, waveform, vcd, fst, verilog, vhdl, simulation, debug]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Simulation dumps are huge and vendor viewers lock teams into a license.
  GTKWave reads VCD, FST, LXT, and GHW so engineers inspect analog and
  digital signals, search nets, and annotate RTL from an open viewer.

use_cases:
  - Open a Verilog VCD or FST dump and inspect digital waveforms
  - View GHDL GHW dumps from VHDL simulations
  - Save a signal set from a large SoC dump for later debug
  - Annotate Verilog RTL with values at a chosen timestep
