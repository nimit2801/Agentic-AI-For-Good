name: CLI-Anything
description: CLI-Anything is an HKUDS project that makes GUI software agent-native by generating CLI harnesses for existing apps. A CLI-Hub registry lets agents browse, install, and run community CLIs so coding agents can drive Photoshop, browsers, and other desktop tools through the terminal.
tagline: Make any software agent-native with generated CLI harnesses

github_url: https://github.com/HKUDS/CLI-Anything
website_url: https://clianything.cc
docs_url: https://clianything.cc
install_command: pip install cli-anything-hub

category: Dev Tools
tags: [python, agents, cli, harness, desktop, automation, registry]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Coding agents speak CLI, but most desktop software only has a GUI, so agents
  cannot click Photoshop, GIS, or office apps reliably. CLI-Anything generates
  agent-native harnesses and ships them through CLI-Hub so agents can install
  and drive existing software from the terminal instead of brittle UI clicks.

use_cases:
  - Install a community CLI harness from CLI-Hub and let an agent drive a GUI app
  - Generate a new agent-native CLI for a desktop tool your team already uses
  - Browse the CLI-Hub registry from a coding agent to discover harnesses for creative apps
  - Standardize how agents launch Photoshop, GIS, or note-taking software via one package manager
