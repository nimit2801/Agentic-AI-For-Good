name: React Router
description: "Declarative routing for React apps, including data routers, nested layouts, and loaders. Map URLs to pages and loaders so AI dashboards, playgrounds, and docs sites stay shareable and nested."
tagline: "Declarative routing for React"
github_url: https://github.com/remix-run/react-router
website_url: https://reactrouter.com
docs_url: https://reactrouter.com/home
install_command: npm install react-router
category: Dev Tools
tags:
  - react
  - javascript
  - routing
  - frontend
  - spa
pricing: free
is_open_source: true
license: MIT
problem_solved: "AI product UIs need deep links to a chat session, eval run, or tool detail without a full page reload. Hand-rolled history and hash routing breaks nested layouts and data loading. React Router maps URLs to components and loaders so catalogs, playgrounds, and admin screens stay bookmarkable while sharing a layout shell."
use_cases:
  - "Route an agent dashboard with nested layouts for chats, traces, and settings"
  - "Load tool-detail data in a loader before rendering a catalog page"
  - "Keep playground URLs in sync with the selected model and session id"
