name: TextMate
description: Graphical text editor for macOS with bundles, snippets, scoped grammars, and a project drawer. Open-sourced under GPL-3.0, it remains a native Mac editor for code and markup with a large bundle ecosystem.
tagline: Native macOS editor with bundles and scoped grammars

github_url: https://github.com/textmate/textmate
website_url: https://macromates.com/
docs_url: https://macromates.com/manual/en/

install_command: brew install --cask textmate

category: Dev Tools
tags: [editor, macos, bundles, snippets, gpl, native]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Many Mac developers want a native Cocoa editor with language bundles and
  snippets without adopting Electron or a full IDE. TextMate provides scoped
  grammars, project search, and a bundle system so code and markup editing
  stays fast and scriptable on macOS.

use_cases:
  - Edit source and markup on macOS with language-specific bundles and snippets
  - Run commands from selected text through TextMate's bundle system
  - Scope syntax highlighting and folding with TextMate grammars used by other editors
  - Keep a lightweight native editor next to terminals and Git tools
