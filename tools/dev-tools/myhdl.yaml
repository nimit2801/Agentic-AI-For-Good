name: MyHDL
description: MyHDL is a Python package for hardware description and verification. It models digital logic in Python and converts it to VHDL or Verilog so teams simulate and synthesize without leaving the Python toolchain.
tagline: Python as a hardware description and verification language

github_url: https://github.com/myhdl/myhdl
website_url: https://www.myhdl.org
docs_url: https://docs.myhdl.org
install_command: pip install myhdl

category: Dev Tools
tags: [myhdl, python, hdl, verilog, vhdl, fpga, verification]
pricing: free
is_open_source: true
license: LGPL-2.1

problem_solved: |
  Hardware teams bounce between Python testbenches and separate
  VHDL or Verilog models. MyHDL describes and verifies digital
  logic in Python, then converts to VHDL or Verilog so simulation
  and synthesis stay in one language.

use_cases:
  - Model a digital circuit in Python and convert it to Verilog or VHDL
  - Write Python testbenches that co-simulate with converted RTL
  - Teach hardware design with Python instead of starting in Verilog
  - Prototype FPGA logic without leaving the Python toolchain
