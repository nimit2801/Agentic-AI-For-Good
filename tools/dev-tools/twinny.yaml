name: Twinny
description: |-
  AI coding assistant for Visual Studio Code with code completion, inline edits, chat, and code review. Runs on local or API-hosted models.
problem_solved: |-
  Developers need a privacy-focused, open-source alternative to GitHub Copilot that works with local or self-hosted models.
use_cases:
  - "Local AI code completion"
  - "Inline code editing with diff review"
  - "Workspace-aware chat with context"
  - "Automated code review"
github_url: https://github.com/twinnydotdev/twinny
website_url: https://marketplace.visualstudio.com/items?itemName=rjmacarthy.twinny
docs_url: https://twinnydotdev.github.io/twinny-docs/
category: Dev Tools
is_open_source: true
pricing: free
