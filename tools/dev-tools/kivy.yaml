name: Kivy
description: An open-source Python UI framework for building cross-platform applications on Windows, Linux, macOS, Android, and iOS. Kivy uses a custom graphics pipeline and KV language so Python teams can ship touch-friendly tools, dashboards, and on-device ML demos from a single codebase.
tagline: Cross-platform Python UI framework for desktop and mobile

github_url: https://github.com/kivy/kivy
website_url: https://kivy.org
docs_url: https://kivy.org/doc/stable/
install_command: pip install kivy

category: Dev Tools
tags: [python, gui, mobile, cross-platform, ui, desktop, android]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Python is the default language for ML prototypes, but shipping a real UI
  on desktop and mobile usually means rewriting in another stack. Native
  toolkits do not share one API across Windows, Linux, macOS, Android, and
  iOS. Kivy gives Python teams a GPU-accelerated UI layer and KV language so
  the same app can run as a desktop tool or a mobile demo without a separate
  frontend rewrite.

use_cases:
  - Ship a Python desktop dashboard for labeling, inference, or experiment control
  - Build a touch-friendly Android or iOS demo around an on-device ML model
  - Prototype internal operator tools that must run on Linux workstations and tablets
  - Wrap a research script in a portable GUI without leaving the Python ecosystem
