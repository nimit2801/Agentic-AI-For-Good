name: Leaflet
description: Leaflet is a lightweight JavaScript library for mobile-friendly interactive maps. It pans, zooms, and overlays markers on tile layers so web apps ship maps without a heavy WebGL engine or commercial SDK.
tagline: Lightweight JavaScript library for mobile-friendly maps

github_url: https://github.com/Leaflet/Leaflet
website_url: https://leafletjs.com
docs_url: https://leafletjs.com/reference.html

category: Dev Tools
tags: [javascript, maps, mobile, tiles, gis, open-source, web, markers]
pricing: free
is_open_source: true
license: BSD-2-Clause

install_command: npm install leaflet

problem_solved: |
  Simple web maps should not need a WebGL globe or a paid SDK.
  Leaflet is a small JS library for tiles, markers, and popups so
  sites ship interactive maps that work on phones without a heavy
  engine.

use_cases:
  - Drop a slippy map with markers and popups onto a marketing or ops site
  - Overlay GeoJSON and custom tile layers on OpenStreetMap basemaps
  - Build a mobile-friendly store locator without a commercial map SDK
  - Prototype a field-data map that pans and zooms on a phone browser
