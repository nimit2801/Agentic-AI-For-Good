name: highlight.js
description: "JavaScript syntax highlighter with automatic language detection and zero dependencies. Highlight code blocks in the browser or Node for docs, chat UIs, and generated snippets."
tagline: "Zero-dependency syntax highlighter"
github_url: https://github.com/highlightjs/highlight.js
website_url: https://highlightjs.org
docs_url: https://highlightjs.org/usage
install_command: npm install highlight.js
category: Dev Tools
tags:
  - javascript
  - syntax-highlighting
  - code
  - frontend
  - docs
pricing: free
is_open_source: true
license: BSD-3-Clause
problem_solved: "Agent chat UIs and generated docs dump fenced code that is unreadable as plain pre text. highlight.js auto-detects languages and colors tokens in the browser with no runtime deps. Teams highlight Python, TypeScript, and YAML snippets in LLM output without bundling a heavier editor."
use_cases:
  - "Syntax-highlight fenced code in streaming LLM chat messages"
  - "Color YAML tool configs and Python snippets on a docs or catalog site"
  - "Auto-detect language for generated code blocks when the model omits a tag"
