name: AstroNvim
description: Aesthetic, feature-rich Neovim distribution with LSP, treesitter, a file explorer, and community plugin packs, designed to be cloned as a template and extended in Lua.
tagline: Beautiful Neovim config that is still easy to extend

github_url: https://github.com/AstroNvim/AstroNvim
website_url: https://astronvim.com
docs_url: https://docs.astronvim.com

install_command: git clone --depth 1 https://github.com/AstroNvim/template ~/.config/nvim

category: Dev Tools
tags: [neovim, lua, editor, lsp, ide, terminal]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  A stock Neovim install has no LSP, file tree, or theme, and assembling that stack
  takes days. AstroNvim ships a polished template with sensible plugins and
  AstroCommunity packs so you get an IDE-like editor you can still customize in Lua.

use_cases:
  - Bootstrap Neovim with LSP, treesitter, and a file explorer from a template clone
  - Add language extras from AstroCommunity without rewriting plugin specs
  - Edit code over SSH with a keyboard-driven, preconfigured Neovim
  - Keep a consistent terminal IDE across laptops and remote GPU boxes
