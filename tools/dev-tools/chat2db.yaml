name: Chat2DB
description: Free local-first database client with an AI SQL workspace. Connect to 40+ engines, generate and explain queries with your own model, and run from desktop, web, Docker, or CLI with optional MCP support.
tagline: Local AI database client for SQL generation and 40+ engines

github_url: https://github.com/OtterMind/Chat2DB
website_url: https://chat2db.ai
docs_url: https://chat2db.ai

category: Dev Tools
tags: [sql, database, text-to-sql, llm, mcp, postgresql, mysql, desktop, docker]
pricing: freemium
is_open_source: true

problem_solved: |
  Analysts and engineers bounce between vendor GUIs and still write SQL by
  hand. Chat2DB keeps connections, an editor, and a local AI assistant in
  one client so you can generate, explain, and optimize queries without
  sending data to a hosted copilot.

use_cases:
  - Generate PostgreSQL or MySQL queries from a natural-language question against a live schema
  - Explain a slow ClickHouse or Snowflake query and rewrite it in the SQL workspace
  - Browse MongoDB or Redis alongside relational engines in one desktop client
  - Run Chat2DB in Docker or CLI and expose the workspace through MCP
  - Connect your own LLM endpoint so SQL generation stays on infrastructure you control
