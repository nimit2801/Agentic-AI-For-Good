name: MicroPython
description: MicroPython is a lean Python implementation for microcontrollers and constrained systems. It runs a Python 3 subset on MCUs with REPL, hardware APIs, and tiny RAM so IoT firmware is written without C on every board.
tagline: Lean Python for microcontrollers and constrained devices

github_url: https://github.com/micropython/micropython
website_url: https://micropython.org
docs_url: https://docs.micropython.org/en/latest/

category: Dev Tools
tags: [python, embedded, iot, microcontroller, firmware, rtos, c, hardware]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Tiny boards cannot run CPython but teams still want Python.
  MicroPython is a lean Python 3 for MCUs with a REPL and hardware
  APIs so IoT firmware is written without C on every device.

use_cases:
  - Script GPIO, I2C, and Wi-Fi on an MCU from a serial REPL
  - Prototype IoT firmware in Python before a C port
  - Teach embedded programming on boards that run MicroPython
  - Ship constrained-device logic without a full CPython runtime
