name: OSVVM
description: OSVVM is an open-source VHDL verification methodology and utility library. It provides alerts, coverage, randomization, and scoreboards so FPGA teams write structured VHDL testbenches without a closed UVM stack.
tagline: Open-source VHDL verification methodology and utility library

github_url: https://github.com/OSVVM/OSVVM
website_url: https://osvvm.org
docs_url: https://osvvm.org

category: Dev Tools
tags: [osvvm, vhdl, verification, fpga, testbench, coverage, eda]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  VHDL testbenches often lack shared coverage, logging, and randomization
  helpers. OSVVM ships those utilities so FPGA teams write structured
  verification without a closed SystemVerilog UVM license.

use_cases:
  - Add functional coverage and randomized stimulus to a VHDL testbench
  - Log alerts and transcripts with a shared OSVVM utility package
  - Score expected versus actual transactions on a VHDL interface
  - Teach FPGA verification with an open VHDL methodology
