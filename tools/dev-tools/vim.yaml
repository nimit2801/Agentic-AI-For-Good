name: Vim
description: The classic modal text editor used on Unix systems for decades. Vim adds visual mode, windows, tabs, a rich plugin ecosystem, and extensive help on top of vi, remaining a default editor on servers and developer workstations.
tagline: Modal text editor descended from vi

github_url: https://github.com/vim/vim
website_url: https://www.vim.org
docs_url: https://vimhelp.org

install_command: brew install vim

category: Dev Tools
tags: [editor, terminal, modal, vi, unix, open-source]
pricing: free
is_open_source: true
license: Vim

problem_solved: |
  Editing files on remote servers and in terminals still depends on a modal
  editor that is installed almost everywhere. Vim is the maintained vi
  successor with windows, tabs, macros, and plugins so developers can edit
  quickly without a GUI or a heavyweight IDE.

use_cases:
  - Edit source and config files in a terminal or over SSH
  - Use modal editing, macros, and visual selections for fast text changes
  - Extend the editor with Vimscript or Lua plugins and a large plugin ecosystem
  - Keep a consistent editor on servers where only vi-compatible tools exist
