name: React Three Fiber
description: React renderer for Three.js that expresses a 3D scene as components. Build interactive model viewers, embedding visualizations, and spatial agent demos in React without dropping down to raw WebGL.
tagline: React renderer for Three.js

github_url: https://github.com/pmndrs/react-three-fiber
website_url: https://docs.pmnd.rs/react-three-fiber
docs_url: https://docs.pmnd.rs/react-three-fiber
install_command: npm install @react-three/fiber

category: Dev Tools
tags: [react, threejs, 3d, webgl, typescript, visualization]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Raw Three.js scene graphs fight React's render cycle. React Three
  Fiber mounts meshes as components so AI product UIs can show 3D
  models, cameras, and overlays with the same state tools as the
  rest of the app.

use_cases:
  - Render a 3D model viewer next to an LLM design assistant
  - Visualize embeddings or scenes as interactive Three.js canvases
  - Prototype spatial agent demos inside a React dashboard
  - Drive camera and lighting from React state during a product walkthrough
