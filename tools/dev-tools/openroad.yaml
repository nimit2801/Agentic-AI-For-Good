name: OpenROAD
description: OpenROAD is an open RTL-to-GDSII digital design flow. It unifies floorplanning, placement, clock tree, routing, and timing so chip teams take Verilog to layout without a closed EDA stack.
tagline: Open-source RTL-to-GDSII digital implementation flow

github_url: https://github.com/The-OpenROAD-Project/OpenROAD
website_url: https://theopenroadproject.org
docs_url: https://openroad.readthedocs.io

category: Dev Tools
tags: [openroad, asic, rtl, gdsii, eda, placement, routing, timing]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Taking RTL to a manufacturable GDSII layout usually needs a stack of
  licensed EDA tools. OpenROAD runs floorplan, place, clock tree, route,
  and timing in one open application so research and startup chip teams
  can implement designs without that lock-in.

use_cases:
  - Run an RTL-to-GDSII flow from Verilog through place and route
  - Tune floorplan, density, and timing constraints in an open ASIC flow
  - Teach physical design with a free implementation tool instead of vendor GUI seats
  - Script chip implementation experiments without a closed EDA license
