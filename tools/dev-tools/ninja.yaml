name: Ninja
description: A small build system with a focus on speed, designed as a lower-level alternative to Make. Ninja builds are defined by human-readable Ninja files (.ninja) that can be generated by higher-level build systems like CMake and Meson.
tagline: A fast, minimal build system for C/C++ projects

github_url: https://github.com/ninja-build/ninja
website_url: https://ninja-build.org

category: Dev Tools
tags: [build-system, cpp, cmake, meson, compilation, developer-tools, automation]
pricing: free
is_open_source: true
license: Apache-2.0

install_command: pip install ninja

problem_solved: |
  Traditional build systems like Make become slow and fragile on large C/C++
  codebases — incremental builds crawl, dependency tracking is error-prone, and
  parallel builds require manual targets. Ninja optimizes for incremental build
  speed by doing the absolute minimum work: it reads Ninja files (generated by
  CMake, Meson, or GN), resolves a DAG of build edges, and runs only the
  commands whose inputs changed. The result is sub-second incremental builds on
  projects with thousands of source files.

use_cases:
  - Replace Make as the backend build system for large C/C++ projects where every-second incremental rebuilds matter
  - Power CMake-generated builds that use Ninja as the native build tool for faster compilation on CI and developer machines
  - Build Chromium and other massive codebases that rely on Ninja's DAG scheduling for maximum parallelism
  - Serve as the build backend for Meson projects, enabling cross-platform builds with minimal overhead
  - Drive GPU kernel compilation in AI/ML frameworks like PyTorch and TensorFlow during custom op builds
