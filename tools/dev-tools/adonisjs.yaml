name: AdonisJS
description: AdonisJS is a TypeScript-first web framework for building web apps and API servers. It comes with support for testing, modern tooling, an ecosystem of official packages, and a structured MVC architecture.
tagline: TypeScript-first web framework for Node.js

github_url: https://github.com/adonisjs/core
website_url: https://adonisjs.com
docs_url: https://docs.adonisjs.com

category: Dev Tools
tags: [nodejs, typescript, web-framework, mvc, api, testing]
pricing: free
is_open_source: true
license: MIT
install_command: npm install @adonisjs/core

problem_solved: |
  Node.js developers need a structured, opinionated framework that brings TypeScript safety,
  testing support, and enterprise patterns without sacrificing productivity. AdonisJS provides a
  batteries-included MVC framework with ORM, authentication, validation, and testing built in.

use_cases:
  - Building type-safe REST and GraphQL APIs with built-in validation and authentication
  - Developing full-stack web applications with server-side rendering and asset pipeline
  - Creating test-driven Node.js applications with first-class testing and mocking support
  - Standardizing backend architecture across teams with an opinionated MVC framework
