name: JupyterLite
description: |-
  Wasm-powered Jupyter distribution that runs entirely in the browser without a server, built from the ground-up using JupyterLab components.
problem_solved: |-
  Users need a zero-installation, zero-server Jupyter environment that works offline and can be embedded in any web page.
use_cases:
  - "Browser-based Python notebooks without servers"
  - "Interactive documentation and tutorials"
  - "Offline data analysis in the browser"
  - "Embedded notebooks in web applications"
github_url: https://github.com/jupyterlite/jupyterlite
website_url: https://jupyterlite.readthedocs.io/
docs_url: https://jupyterlite.readthedocs.io/en/stable/
install_command: pip install jupyterlite
category: Dev Tools
is_open_source: true
pricing: free
