name: Spec Kit
description: "Spec Kit is GitHub's toolkit for spec-driven development. It bootstraps projects so specifications, plans, and tasks stay the source of truth, helping humans and coding agents implement features from written specs instead of ad hoc prompts."
tagline: "GitHub toolkit for spec-driven development"
github_url: https://github.com/github/spec-kit
website_url: https://github.github.com/spec-kit/
docs_url: https://github.github.com/spec-kit/
install_command: "uv tool install specify-cli"
category: Dev Tools
tags:
  - spec-driven-development
  - github
  - agents
  - cli
  - planning
  - coding-agents
pricing: free
is_open_source: true
license: MIT
problem_solved: "Coding agents drift when the only spec is a chat thread. Spec Kit gives a CLI and project templates that keep specifications, implementation plans, and tasks in the repo so agents and humans execute against the same written contract."
use_cases:
  - "Bootstrap a repo for spec-driven development with the specify CLI"
  - "Keep feature specs, plans, and tasks in-repo as the source of truth for coding agents"
  - "Standardize how teams hand work to Copilot, Claude, or other agents"
  - "Turn a written specification into an implementation checklist agents can follow"
