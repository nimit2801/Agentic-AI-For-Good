name: Pelican
description: Python static site generator that turns Markdown or reStructuredText into HTML. Pelican uses Jinja templates, plugins, and themes so docs sites, blogs, and project pages ship without a runtime database.
tagline: Python static site generator for Markdown and reST

github_url: https://github.com/getpelican/pelican
website_url: https://getpelican.com
docs_url: https://docs.getpelican.com

install_command: pip install pelican

category: Dev Tools
tags: [python, static-site, markdown, docs, jinja, blogging]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  Shipping project docs or a research blog should not require WordPress, a
  database, or a JavaScript build chain. Pelican compiles Markdown or reST
  into static HTML with themes and plugins, so content lives in git and
  deploys as files.

use_cases:
  - Generate a documentation site from Markdown in a Python repo
  - Publish a research or engineering blog as static HTML
  - Theme a project landing page with Jinja templates
  - Add plugins for sitemap, Atom feeds, and code highlighting
  - Deploy generated HTML to GitHub Pages or object storage
