name: Framer Motion
description: Modern animation library for React and JavaScript, published as the motion package. Gesture, layout, and spring animations for AI consoles, streaming token UIs, and product demos without hand-written CSS keyframes.
tagline: Animation library for React and JavaScript

github_url: https://github.com/motiondivision/motion
website_url: https://motion.dev
docs_url: https://motion.dev/docs
install_command: npm install motion

category: Dev Tools
tags: [react, javascript, animation, typescript, frontend, ui]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Hand-rolled CSS and timers make streaming token UIs and agent
  dashboards feel jumpy. Framer Motion (motion) gives springs,
  layout animations, and gestures so React AI products can animate
  status, traces, and panels with one API.

use_cases:
  - Animate streaming token appearance in a chat console
  - Transition agent status panels and tool-trace drawers
  - Add layout animations when eval results reorder a list
  - Prototype a product demo UI with gesture-driven controls
