name: marked
description: "A fast Markdown parser and compiler for JavaScript. Turn Markdown strings into HTML in the browser or Node with extensions for GitHub-flavored Markdown, headings, and custom renderers."
tagline: "Fast Markdown parser and compiler"
github_url: https://github.com/markedjs/marked
website_url: https://marked.js.org
docs_url: https://marked.js.org
install_command: npm install marked
category: Dev Tools
tags:
  - javascript
  - markdown
  - html
  - parser
  - frontend
pricing: free
is_open_source: true
license: MIT
problem_solved: "LLM answers arrive as Markdown, but product UIs need HTML with sanitization and custom renderers for code blocks or citations. marked compiles Markdown quickly on the client or in Node, with extension hooks. Teams render streaming assistant messages without standing up a heavier processor."
use_cases:
  - "Render streaming LLM Markdown answers to HTML in a chat UI"
  - "Compile README and docs Markdown to HTML in a static catalog build"
  - "Add a custom renderer for citation links inside generated answers"
