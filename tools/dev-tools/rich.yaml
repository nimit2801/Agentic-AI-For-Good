name: Rich
description: "Python library for rich text formatting in terminal applications, providing styled text, tables, markdown rendering, syntax highlighting, progress bars, and tree views. Rich transforms CLI output into visually structured, color-coded displays without requiring GUI toolkits."
tagline: "Python library for rich terminal text formatting and beautiful CLI output"
github_url: https://github.com/Textualize/rich
website_url: https://rich.readthedocs.io
docs_url: https://rich.readthedocs.io
install_command: pip install rich
category: Dev Tools
tags:
  - python
  - terminal
  - cli
  - formatting
  - logging
pricing: free
is_open_source: true
license: MIT
problem_solved: "AI/ML engineers and developers spend significant time building CLI tools for data exploration, model evaluation, and pipeline monitoring, but standard terminal output is plain text that makes it hard to spot patterns, compare results, or present structured information. Rich provides a comprehensive set of components — tables, syntax-highlighted code blocks, collapsible tree views, progress bars, and markdown rendering — that turn terminal output into informative, visually structured displays with minimal code."
use_cases:
  - "Display model evaluation metrics and comparison tables directly in the terminal during training runs and experiments"
  - "Render syntax-highlighted code snippets and markdown documentation in CLI-based AI coding assistants and agents"
  - "Show real-time progress bars for long-running data processing pipelines, model training, and batch inference jobs"
  - "Build interactive CLI dashboards that display dataset statistics, model outputs, and pipeline status in structured layouts"
  - "Format structured log output with color-coded severity levels, collapsible sections, and rich traceback formatting"
