name: Masonite
description: Masonite is a batteries-included Python web framework with an IOC container, craft CLI, and first-class ORM. Teams that outgrow microframeworks can ship model dashboards, agent control planes, and internal APIs with Django-like structure while staying in Python.
tagline: Developer-centric Python web framework

github_url: https://github.com/MasoniteFramework/masonite
website_url: https://docs.masoniteproject.com
docs_url: https://docs.masoniteproject.com
install_command: pip install masonite

category: Dev Tools
tags: [python, web-framework, backend, orm, api, mvc]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Flask is minimal and Django is heavy, so Python teams building ML dashboards
  and agent consoles often invent their own structure. Masonite ships an IOC
  container, craft CLI, and ORM so those apps get Django-like conventions
  without leaving a modern Python framework.

use_cases:
  - Build an internal ML ops dashboard with Masonite controllers and views
  - Expose agent-tool HTTP APIs from a structured Python web app
  - Use the craft CLI to scaffold jobs that kick off training or eval runs
  - Serve model-management UIs with Masonite ORM-backed user and job tables
