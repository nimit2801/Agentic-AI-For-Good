name: BBEdit
description: Professional macOS text, code, and markup editor from Bare Bones Software with grep, multi-file search, text factories, and Git. Used for HTML, logs, scripts, and large-file editing on Mac without a full IDE.
tagline: Professional macOS editor for text, code, and markup

website_url: https://www.barebones.com/products/bbedit/
docs_url: https://www.barebones.com/support/bbedit/

install_command: brew install --cask bbedit

category: Dev Tools
tags: [editor, macos, html, grep, text-processing, git]
pricing: freemium
is_open_source: false

problem_solved: |
  Mac teams still need a dedicated editor for huge logs, HTML, and grep across
  folders that Xcode and lightweight editors handle poorly. BBEdit is a native
  macOS editor with multi-file search, text factories, and Git so engineers can
  transform and review text at scale on the Mac.

use_cases:
  - Search and replace across large source trees with grep and multi-file find
  - Clean HTML, logs, and CSV with text factories and Unix filters
  - Edit scripts and config files in a native Mac UI with Git integration
  - Open very large files that crash lighter editors
