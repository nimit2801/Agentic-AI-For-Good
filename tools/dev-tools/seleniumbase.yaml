name: SeleniumBase
description: SeleniumBase is a Python framework for end-to-end testing, scraping, and stealth browser automation. It wraps Selenium with pytest, CDP mode, Playwright hooks, and an MCP integration so teams can write shorter scripts that still bypass many bot checks.
tagline: Python browser automation for tests, scraping, and stealth
github_url: https://github.com/seleniumbase/SeleniumBase
website_url: https://seleniumbase.io
docs_url: https://seleniumbase.io
install_command: pip install seleniumbase
category: Dev Tools
tags: [python, selenium, pytest, scraping, stealth, playwright, mcp, e2e]
pricing: free
is_open_source: true
license: MIT
problem_solved: |
  Raw Selenium tests are verbose and easy for bot detection to catch, while
  scraping scripts often reimplement waits, reports, and driver setup. SeleniumBase
  gives a batteries-included Python API with pytest, CDP stealth mode, and
  Playwright integration so the same toolkit covers e2e tests and stealth scraping.
use_cases:
  - Write pytest browser tests with less boilerplate than raw Selenium
  - Scrape sites that block stock Selenium using SeleniumBase CDP mode
  - Mix Playwright and Selenium flows in one Python project
  - Expose browser automation to agents through the SeleniumBase MCP integration
  - Record, replay, and debug UI tests with built-in reports and screenshots
