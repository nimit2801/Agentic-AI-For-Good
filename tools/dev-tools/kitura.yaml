name: Kitura
description: Swift web framework and HTTP server with routing, SSL, and Codable APIs. Kitura is a server-side Swift stack for REST services so teams can host model gateways and agent callbacks in Swift on Linux or macOS.
tagline: Swift web framework and HTTP server

github_url: https://github.com/Kitura/Kitura
website_url: https://www.kitura.dev
docs_url: https://github.com/Kitura/Kitura

category: Dev Tools
tags: [swift, web-framework, http, server-side-swift, routing, rest]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Teams that already write Swift clients still need a server for LLM
  proxies and webhooks. Kitura provides routing, SSL, and Codable
  handlers so those services stay in Swift instead of a second
  language for the HTTP layer.

use_cases:
  - Host a REST proxy in front of an LLM or embedding API
  - Receive agent webhooks with Codable Swift handlers
  - Serve health and metrics endpoints for a Swift model worker
  - Share Swift models between an iOS app and a Kitura backend
  - Run a Linux Swift HTTP service next to GPU inference
