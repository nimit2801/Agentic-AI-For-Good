name: libp2p
description: libp2p is a modular network stack for peer-to-peer applications. It provides protocols for transport, security, peer discovery, and content routing that power decentralized systems like IPFS and Filecoin.
tagline: Modular peer-to-peer networking stack

github_url: https://github.com/libp2p/go-libp2p
website_url: https://libp2p.io
docs_url: https://docs.libp2p.io

category: Dev Tools
tags: [p2p, networking, distributed, protocol, decentralized, transport]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Building peer-to-peer applications requires solving transport, NAT traversal, encryption, peer
  discovery, and content routing from scratch. libp2p provides a modular, composable networking
  stack that handles these concerns so developers can focus on application logic.

use_cases:
  - Building decentralized applications with peer-to-peer data exchange
  - Implementing custom transport and security protocols for distributed systems
  - Enabling NAT traversal and relay connectivity for mobile and edge peers
  - Powering content-addressed networking and distributed hash tables
