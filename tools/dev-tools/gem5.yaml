name: gem5
description: gem5 is a modular computer-system architecture simulator. It models CPUs, caches, memory, and full systems so researchers evaluate microarchitecture, ISA, and system software without building hardware.
tagline: Modular computer-system architecture research simulator

github_url: https://github.com/gem5/gem5
website_url: https://www.gem5.org
docs_url: https://www.gem5.org/documentation

category: Dev Tools
tags: [gem5, architecture, simulator, cpu, microarchitecture, risc-v, arm]
pricing: free
is_open_source: true
license: BSD-3-Clause

problem_solved: |
  Evaluating a new CPU, cache, or memory system usually needs RTL
  or silicon. gem5 simulates processors, caches, and full systems
  at configurable fidelity so architecture researchers measure
  designs and OS changes without building hardware.

use_cases:
  - Simulate a new CPU microarchitecture across ARM, RISC-V, and x86
  - Run full-system Linux workloads to study caches, memory, and devices
  - Compare ISA and compiler changes without waiting on FPGA or ASIC silicon
  - Teach computer architecture with a modular, scriptable research simulator
