name: Apache HttpClient
description: A robust, feature-rich HTTP client library for Java that supports synchronous and asynchronous request execution.
tagline: The standard HTTP client for Java with pooling, auth, and proxy support

github_url: https://github.com/apache/httpcomponents-client
website_url: https://hc.apache.org/httpcomponents-client-5.4.x/
docs_url: https://hc.apache.org/httpcomponents-client-5.4.x/current/httpclient5/apidocs/

category: Dev Tools
tags: [java, http, client, networking, rest, apache]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Java's built-in HTTP support is limited and cumbersome for production use. Apache HttpClient
  provides a mature, configurable client with connection pooling, authentication, proxy support,
  and cookie management — the de facto standard for making HTTP requests in Java applications.

use_cases:
  - Execute REST API calls with configurable timeouts, retries, and connection pooling for high-throughput services
  - Handle OAuth2 and basic authentication flows with built-in credential and token management
  - Route requests through corporate proxies with automatic proxy detection and authentication
  - Build asynchronous HTTP pipelines using non-blocking I/O for concurrent API consumption
