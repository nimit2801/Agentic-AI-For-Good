name: Eclipse
description: Open-source Java IDE and plugin platform with a large tooling ecosystem. Teams use Eclipse IDE for Java, plugin development, and enterprise backends that serve data and model APIs.
tagline: Open-source Java IDE and plugin platform

website_url: https://eclipseide.org/
docs_url: https://www.eclipse.org/documentation/
install_command: brew install --cask eclipse-java
github_url: https://github.com/eclipse-platform/eclipse.platform

category: Dev Tools
tags: [ide, java, eclipse, jvm, editor, open-source]
pricing: free
is_open_source: true
license: EPL-2.0

problem_solved: |
  Java services around data and models still need a full IDE with refactoring
  and a plugin ecosystem. Eclipse IDE provides that stack under EPL so teams
  can develop, debug, and extend JVM backends without a commercial license.

use_cases:
  - Develop and debug Java services that wrap inference and data APIs
  - Build Eclipse plugins for internal ML developer tooling
  - Refactor large JVM codebases with Eclipse Java development tools
  - Use Eclipse as the base IDE for language plugins in enterprise stacks
