name: Notepad++
description: Free Windows source-code editor with syntax highlighting, folding, regex search, and a plugin ecosystem. A lightweight alternative to full IDEs for editing configs, scripts, and logs on Windows workstations.
tagline: Lightweight Windows source-code editor with plugins

github_url: https://github.com/notepad-plus-plus/notepad-plus-plus
website_url: https://notepad-plus-plus.org
docs_url: https://npp-user-manual.org

category: Dev Tools
tags: [editor, windows, syntax-highlighting, plugins, text-editor]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Windows machines still need a fast editor for configs, logs, and scripts
  without launching a full IDE. Notepad++ is a GPL editor with syntax
  highlighting, regex search, and plugins so engineers can edit files
  quickly on Windows.

use_cases:
  - Edit YAML, JSON, and Python configs on Windows without opening an IDE
  - Search and replace across large log files with regex and bookmarks
  - Compare and fold source files while reviewing model-training scripts
  - Extend the editor with plugins for FTP, hex, and language support
