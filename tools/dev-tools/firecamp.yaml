name: Firecamp
description: Open-source API workspace that is a Postman and Insomnia alternative. Firecamp gives REST, GraphQL, WebSocket, and Socket.IO playgrounds so teams can exercise LLM gateways, agent tools, and RAG APIs without a proprietary client.
tagline: Open-source API client for REST, GraphQL, and sockets

github_url: https://github.com/firecamp-dev/firecamp
website_url: https://firecamp.io
docs_url: https://firecamp.io/docs

category: Dev Tools
tags: [api, rest, graphql, websocket, testing, desktop, postman]
pricing: free
is_open_source: true
license: AGPL-3.0

problem_solved: |
  AI backends expose REST, GraphQL, and streaming sockets that need
  manual exploration before tests exist. Proprietary API clients lock
  collections and scripts in a vendor. Firecamp is an open desktop
  workspace for those playgrounds so teams can hit model gateways and
  agent tools locally and share collections in git.

use_cases:
  - Call chat and embedding HTTP APIs while iterating on gateway auth
  - Explore GraphQL schemas for agent tool registries and RAG services
  - Debug WebSocket streams from live inference and eval dashboards
  - Share Firecamp collections in-repo instead of a closed Postman workspace
