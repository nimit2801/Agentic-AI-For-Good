name: Logto
description: Logto is authentication and authorization infrastructure for SaaS and AI apps, built on OIDC and OAuth 2.1. It ships multi-tenancy, SSO, and RBAC so products add login without Auth0 or a custom identity service.
tagline: Auth infrastructure for SaaS and AI apps on OIDC

github_url: https://github.com/logto-io/logto
website_url: https://logto.io
docs_url: https://docs.logto.io

category: Dev Tools
tags: [identity, oidc, oauth, sso, rbac, authentication, multi-tenant]
pricing: freemium
is_open_source: true
license: MPL-2.0

problem_solved: |
  SaaS and AI products still hand-roll login or pay Auth0 for multi-tenant
  SSO and RBAC. Logto is open-source auth infrastructure on OIDC and
  OAuth 2.1 with organizations, SSO, and role-based access so you can
  protect agent apps and customer tenants without a custom identity service.

use_cases:
  - Add OIDC login and SSO to a multi-tenant AI SaaS product
  - Enforce RBAC on who can call model APIs and admin consoles
  - Self-host authentication instead of Auth0 for an internal ML platform
  - Issue tokens for agent apps that act on behalf of a signed-in user
