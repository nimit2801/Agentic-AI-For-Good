name: React Hook Form
description: Performant, flexible React forms with tiny re-renders and native HTML validation. Uncontrolled inputs by default, so settings pages, eval configs, and prompt editors stay fast as field counts grow.
tagline: Performant, flexible forms for React

github_url: https://github.com/react-hook-form/react-hook-form
website_url: https://react-hook-form.com
docs_url: https://react-hook-form.com/get-started
install_command: npm install react-hook-form

category: Dev Tools
tags: [react, forms, typescript, validation, frontend, javascript]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Controlled form state re-renders a whole tree on every keystroke.
  React Hook Form keeps values uncontrolled until submit so prompt
  editors, tool configs, and eval forms stay responsive at scale.

use_cases:
  - Build a model and temperature settings form with schema validation
  - Collect eval dataset metadata without laggy controlled inputs
  - Pair with Zod to type agent configuration forms end to end
  - Edit long system prompts in a React admin without extra re-renders
