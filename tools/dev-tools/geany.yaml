name: Geany
description: Fast, lightweight IDE built on GTK and Scintilla, with a small footprint, a terminal, and basic project tools. Useful on remote boxes and low-RAM machines where a full JetBrains or VS Code install is too heavy.
tagline: Fast lightweight IDE for when a full IDE is too much

github_url: https://github.com/geany/geany
website_url: https://www.geany.org
docs_url: https://www.geany.org/documentation/

install_command: brew install geany

category: Dev Tools
tags: [ide, editor, gtk, lightweight, c, python]
pricing: free
is_open_source: true
license: GPL-2.0

problem_solved: |
  Full IDEs eat RAM on jump boxes and older laptops. Geany is a small GTK IDE
  with syntax highlighting, a terminal, and project files, so you can edit
  scripts and C code without waiting on Electron or a JVM.

use_cases:
  - Edit Python and C on a low-RAM remote workstation
  - Use a GUI editor with a built-in terminal without VS Code
  - Open mixed-language projects without a heavyweight IDE
  - Teach or demo code on machines that cannot run IntelliJ
