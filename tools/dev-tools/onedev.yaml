name: OneDev
description: Self-hosted Git server with CI/CD, issue tracking, and package registries in one platform, aimed at teams that want GitHub-like workflows on their own machines.
tagline: Self-hosted Git, CI, and package platform

github_url: https://github.com/theonedev/onedev
website_url: https://onedev.io
docs_url: https://docs.onedev.io

category: Dev Tools
tags: [git, ci-cd, self-hosted, issue-tracking, devops, packages]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  Teams that cannot put model code on GitHub still need repos, CI, issues, and
  package hosting. OneDev combines those in a single self-hosted platform so AI
  groups can review code, run pipelines, and publish artifacts without stitching
  Gitea, Jenkins, and a registry together.

use_cases:
  - Host private Git repos for model training code with built-in CI
  - Run containerized CI jobs next to the Git server that stores the repo
  - Track issues and code review for AI platform work in one UI
  - Publish packages from the same server that holds source and pipelines
