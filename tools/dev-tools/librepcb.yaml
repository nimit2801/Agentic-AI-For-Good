name: LibrePCB
description: LibrePCB is an open-source EDA suite for schematic capture and PCB layout. It lets electronics teams design boards with a modern GUI without a closed ECAD license.
tagline: Open-source schematic and PCB design suite

github_url: https://github.com/LibrePCB/LibrePCB
website_url: https://librepcb.org
docs_url: https://librepcb.org/docs/
install_command: brew install --cask librepcb

category: Dev Tools
tags: [librepcb, pcb, eda, schematic, electronics, hardware, kicad-alternative]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Board design is often locked in paid ECAD tools with file lock-in.
  LibrePCB provides schematic capture and PCB layout in an open suite
  so hardware teams design boards without a vendor CAD license.

use_cases:
  - Capture a schematic and lay out a two-layer PCB for a prototype
  - Maintain a reusable library of footprints and symbols
  - Export Gerber and drill files for a board house
  - Teach PCB design without a closed ECAD subscription
