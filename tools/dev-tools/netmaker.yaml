name: Netmaker
description: Netmaker makes networks with WireGuard. It automates fast, secure, and distributed virtual networks across clouds, data centers, and edge devices with a self-hosted control plane.
tagline: Self-hosted WireGuard network automation platform

github_url: https://github.com/gravitl/netmaker
website_url: https://www.netmaker.io
docs_url: https://docs.netmaker.io

category: Dev Tools
tags: [wireguard, networking, vpn, mesh, self-hosted, infrastructure]
pricing: freemium
is_open_source: true

problem_solved: |
  Teams managing distributed infrastructure need secure virtual networks without relying on
  cloud-provider networking or complex VPN setups. Netmaker automates WireGuard mesh and
  hub-and-spoke networks with a self-hosted control plane, NAT traversal, and access control lists.

use_cases:
  - Automating WireGuard mesh networks across multi-cloud and on-premise infrastructure
  - Connecting edge devices and IoT fleets to central services securely
  - Replacing complex site-to-site VPNs with automated WireGuard tunnels
  - Managing distributed developer access to staging and production networks
