name: Ory Kratos
description: Headless cloud-native identity and user management written in Go. Ory Kratos provides login, registration, MFA, passkeys, social sign-in, and account recovery via APIs so AI products can ship auth without Auth0 or a homegrown user store.
tagline: Headless identity and user management in Go

github_url: https://github.com/ory/kratos
website_url: https://www.ory.sh/kratos
docs_url: https://www.ory.sh/docs/kratos

category: Dev Tools
tags: [go, identity, authentication, oidc, mfa, passkeys, self-hosted]
pricing: freemium
is_open_source: true
license: Apache-2.0

problem_solved: |
  Product teams rebuilding login, MFA, and account recovery for every app
  leak time and security bugs. Ory Kratos is a headless identity server with
  APIs for registration, passkeys, social login, and recovery so you keep UX
  in your app and identity in a dedicated service.

use_cases:
  - Add login, registration, and MFA to an AI product without Auth0 or Firebase
  - Offer passkeys and social sign-in through Kratos APIs while keeping a custom UI
  - Self-host identity next to model-serving apps for data-residency requirements
  - Replace a homegrown user table with recoverable accounts, sessions, and traits
