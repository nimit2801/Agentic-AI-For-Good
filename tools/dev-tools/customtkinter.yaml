name: CustomTkinter
description: A modern, customizable Python UI library built on Tkinter. It ships themed widgets that mix with stock Tkinter so you can build dark-mode desktop apps for ML demos and local tools without learning a heavier GUI stack.
tagline: Modern Tkinter widgets for Python desktop apps

github_url: https://github.com/TomSchimansky/CustomTkinter
website_url: https://customtkinter.tomschimansky.com/

category: Dev Tools
tags: [python, gui, tkinter, desktop, ui, dark-mode]
pricing: free
is_open_source: true
license: MIT

install_command: pip install customtkinter

problem_solved: |
  Stock Tkinter looks dated, so ML engineers wrapping a local model or
  dataset tool in a desktop UI either ship an ugly window or jump to Qt.
  CustomTkinter adds modern, themeable widgets that drop in next to
  existing Tkinter code, with dark mode and high-DPI scaling, so a Python
  script can look like a current desktop app without a new GUI framework.

use_cases:
  - Wrap a local LLM or image model in a dark-mode Python desktop window
  - Mix CustomTkinter widgets with existing Tkinter forms in a research tool
  - Ship a cross-platform ML demo UI without depending on Qt or Electron
  - Prototype settings panels and file pickers for Python data apps quickly
