name: Feathers
description: Feathers is an API and real-time application framework for Node.js and TypeScript. It provides a minimalist, service-oriented architecture for building modern web and mobile applications with real-time communication.
tagline: API and real-time application framework for Node.js

github_url: https://github.com/feathersjs/feathers
website_url: https://feathersjs.com
docs_url: https://feathersjs.com/guides

category: Dev Tools
tags: [nodejs, typescript, api, real-time, web-framework, microservices]
pricing: free
is_open_source: true
license: MIT
install_command: npm install @feathersjs/feathers

problem_solved: |
  Building real-time APIs and services requires wiring together databases, authentication, and
  WebSocket transport manually. Feathers provides a lightweight, service-oriented framework that
  handles REST and real-time APIs, authentication, and database adapters out of the box.

use_cases:
  - Building real-time APIs and microservices with automatic REST and WebSocket endpoints
  - Creating cross-platform chat applications with real-time event synchronization
  - Prototyping full-stack applications with built-in authentication and database adapters
  - Developing IoT backends that handle real-time sensor data streams
