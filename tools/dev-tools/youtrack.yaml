name: YouTrack
description: JetBrains issue tracker for agile teams with knowledge base, helpdesk, and dashboards. Used to plan ML work, link commits, and run sprints without a separate wiki and ticket tool.
tagline: JetBrains issue tracker for agile teams

website_url: https://www.jetbrains.com/youtrack/
docs_url: https://www.jetbrains.com/help/youtrack/

category: Dev Tools
tags: [issue-tracker, agile, jetbrains, project-management, helpdesk]
pricing: freemium
is_open_source: false

problem_solved: |
  ML teams split tickets, docs, and support across too many tools. YouTrack
  combines issues, a knowledge base, and helpdesk so research and platform
  work stay in one JetBrains tracker with workflows that match the sprint.

use_cases:
  - Track model training, eval, and deploy work as YouTrack issues
  - Run sprints and boards for an ML platform team
  - Publish a knowledge base next to tickets for runbooks
  - Handle internal helpdesk requests for GPU and data access
