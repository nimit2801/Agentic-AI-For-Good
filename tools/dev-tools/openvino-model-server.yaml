name: OpenVINO Model Server
description: OpenVINO Model Server is a scalable inference server for models optimized with OpenVINO. It exposes gRPC and REST APIs for model serving, supports multiple frameworks including TensorFlow, PyTorch, and ONNX, and runs on CPU, GPU, and edge devices via Docker or Kubernetes.
tagline: Scalable inference server for OpenVINO-optimized models

github_url: https://github.com/openvinotoolkit/model_server
