name: CotEditor
description: A lightweight plain-text editor for macOS with syntax highlighting, find and replace, character encoding tools, and scripting. Native Cocoa and open source, it is built for coding and text wrangling without becoming a full IDE.
tagline: Lightweight native plain-text editor for macOS

github_url: https://github.com/coteditor/CotEditor
website_url: https://coteditor.com
docs_url: https://coteditor.com/index.html

install_command: brew install --cask coteditor

category: Dev Tools
tags: [editor, macos, cocoa, plain-text, syntax-highlighting, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  macOS developers often want a native plain-text editor with encodings, regex
  find, and syntax highlighting without installing an Electron IDE. CotEditor
  is a Cocoa editor for source, logs, and markup that stays fast and scriptable
  on the Mac.

use_cases:
  - Edit source, logs, and markup in a native macOS text editor
  - Convert character encodings and line endings when exchanging files
  - Use regex find and replace across large text files
  - Script editing tasks with AppleScript or JavaScript for Automation
