name: Heroicons
description: MIT-licensed SVG icon set from the Tailwind CSS team with outline and solid variants, plus first-party React and Vue packages. Drop consistent, high-quality icons into agent consoles, docs, and product UI without a paid icon library.
tagline: Tailwind's free SVG icons for UI work

github_url: https://github.com/tailwindlabs/heroicons
website_url: https://heroicons.com
docs_url: https://heroicons.com
install_command: npm install @heroicons/react

category: Dev Tools
tags: [icons, svg, react, vue, tailwind, frontend, ui]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Product UIs for agents and ML tools need a large, consistent icon set that
  is free to ship. Mixing random SVGs produces uneven stroke weights and
  license risk. Heroicons gives outline and solid icons with official React
  and Vue components so dashboards stay visually consistent.

use_cases:
  - Icon tool, model, and trace actions in a React agent console
  - Use outline and solid variants for navigation versus selected states
  - Pair Heroicons with Tailwind CSS utility classes in an LLM product UI
  - Ship the same icon set in docs, marketing, and the product without a paid license
