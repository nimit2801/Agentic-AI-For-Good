name: PDFKit
description: A JavaScript PDF generation library for Node and the browser that builds documents with text, images, vector graphics, and embeddings from code.
tagline: Generate PDFs in Node and the browser from JavaScript

github_url: https://github.com/foliojs/pdfkit
website_url: http://pdfkit.org/
docs_url: http://pdfkit.org/docs/getting_started.html

install_command: npm install pdfkit

category: Dev Tools
tags: [pdf, javascript, nodejs, documents, generation, browser]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Shipping reports, invoices, or model-eval summaries as PDF often means
  wrapping a heavy headless browser or a hosted renderer. PDFKit lets Node
  and browser apps draw text, images, and vector graphics into a PDF stream
  in code, so document generation stays in the same process as the rest of
  the pipeline.

use_cases:
  - Generate PDF reports from evaluation metrics, logs, or experiment results
  - Render invoices and receipts in a Node API without a browser
  - Build multi-page documents with images, tables, and vector drawings
  - Stream PDFs to clients from serverless functions that process AI outputs
