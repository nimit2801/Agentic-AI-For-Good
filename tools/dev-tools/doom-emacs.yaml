name: Doom Emacs
description: Emacs framework that ships a fast, opinionated config with vim keys, lazy loading, and modules for LSP, Magit, Org, and languages, so you get a batteries-included Emacs without writing a 2,000-line init.
tagline: Fast, modular Emacs framework for stubborn hackers

github_url: https://github.com/doomemacs/core
website_url: https://doomemacs.org
docs_url: https://docs.doomemacs.org

install_command: git clone --depth 1 https://github.com/doomemacs/core ~/.config/emacs

category: Dev Tools
tags: [emacs, editor, vim, lisp, lsp, org-mode, terminal]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Vanilla Emacs is powerful and slow to configure. Doom Emacs is a modular
  framework with vim bindings, lazy loading, and curated modules so researchers
  who want Emacs for code and Org do not spend months on init.el.

use_cases:
  - Install a fast Emacs IDE with vim keys and LSP modules
  - Edit Python and remote files with Magit and TRAMP already wired
  - Write papers and literate configs in Org on top of Doom modules
  - Keep a reproducible Emacs config across laptops via Doom's module system
