name: TQDM
description: "Fast, extensible progress bar library for Python and CLI workflows, providing instant progress feedback for loops, map operations, and data processing pipelines. TQDM works in notebooks, terminals, and Jupyter environments with minimal code changes."
tagline: "Fast, extensible progress bar for Python loops and CLI workflows"
github_url: https://github.com/tqdm/tqdm
website_url: https://tqdm.github.io
docs_url: https://tqdm.github.io
install_command: pip install tqdm
category: Dev Tools
tags:
  - python
  - progress-bar
  - cli
  - notebooks
  - monitoring
pricing: free
is_open_source: true
license: MPL-2.0
problem_solved: "Long-running data processing loops, model training iterations, and batch inference jobs give no feedback about progress or remaining time, leaving engineers guessing whether a task is stuck or simply slow. Manually printing iteration counts and elapsed times produces cluttered output and misses features like rate tracking and ETA estimation. TQDM adds a single-line progress bar to any iterable with zero configuration, providing real-time throughput, elapsed time, estimated completion, and post-iteration statistics."
use_cases:
  - "Track progress of data loading, preprocessing, and transformation loops with real-time throughput and ETA estimates"
  - "Monitor batch inference jobs processing millions of records, displaying completion percentage and remaining time"
  - "Display progress during model training epochs alongside loss and accuracy metrics in the terminal"
  - "Provide visual feedback for long-running API calls, file downloads, and data export operations in CLI tools"
  - "Wrap map and parallel processing operations to show collective progress across worker processes"
