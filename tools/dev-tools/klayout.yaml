name: KLayout
description: KLayout is an open-source GDSII and OASIS layout viewer and editor. It inspects, diffs, and scripts chip masks so ASIC teams review physical layout without a commercial mask tool.
tagline: Open-source GDSII and OASIS layout viewer

github_url: https://github.com/KLayout/klayout
website_url: https://www.klayout.de
docs_url: https://www.klayout.de/doc.html

category: Dev Tools
tags: [klayout, gdsii, oasis, asic, layout, eda, mask]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Viewing and editing GDSII masks usually needs a licensed layout
  editor. KLayout opens GDSII and OASIS files, diffs layers, and
  runs Ruby or Python scripts so ASIC teams inspect physical layout
  without a commercial mask tool.

use_cases:
  - Open a GDSII or OASIS stream and inspect layers before tapeout
  - Diff two chip layouts to catch DRC or merge mistakes
  - Script layer operations in Python or Ruby on a mask database
  - Measure geometries and export screenshots for a design review
