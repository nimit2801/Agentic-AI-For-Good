name: SuperTokens
description: SuperTokens is an open-source alternative to Auth0, Firebase Auth, and Cognito. It provides session management, social login, and passwordless flows you can self-host so AI apps get auth without a vendor lock-in.
tagline: Open-source Auth0 alternative for session and login flows

github_url: https://github.com/supertokens/supertokens-core
website_url: https://supertokens.com
docs_url: https://supertokens.com/docs

category: Dev Tools
tags: [identity, authentication, sessions, oauth, self-hosted, auth0-alternative]
pricing: freemium
is_open_source: true

problem_solved: |
  App teams either pay Auth0 or reinvent sessions, refresh tokens, and
  social login. SuperTokens is a self-hostable auth core with SDKs for
  session management, passwordless, and OAuth so AI products get
  production login without a commercial IdP or custom crypto.

use_cases:
  - Add email, social, and passwordless login to an AI product without Auth0
  - Self-host session management for a multi-tenant agent dashboard
  - Replace Firebase Auth when you need on-prem control of user sessions
  - Issue and rotate sessions for APIs that serve LLM features
