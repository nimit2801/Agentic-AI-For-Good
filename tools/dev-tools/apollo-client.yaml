name: Apollo Client
description: A caching GraphQL client for TypeScript and JavaScript apps, with React, Vue, and Angular bindings, local cache, and developer tools for typed queries.
tagline: Caching GraphQL client for JavaScript and TypeScript

github_url: https://github.com/apollographql/apollo-client
website_url: https://apollographql.com/client
docs_url: https://www.apollographql.com/docs/react/

install_command: npm install @apollo/client

category: Dev Tools
tags: [graphql, react, typescript, javascript, caching, api]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Frontends that talk to GraphQL often refetch the same entities, lose
  cache consistency, and wire queries by hand. Apollo Client normalizes
  results into a local cache, exposes hooks and bindings for React and
  other UI libraries, and keeps typed queries in sync with the schema.

use_cases:
  - Fetch GraphQL data into React UIs for AI dashboards and admin tools
  - Cache and normalize entities so agent consoles do not refetch the same records
  - Type queries and mutations against a GraphQL schema in TypeScript apps
  - Combine remote GraphQL with local state for product and experiment UIs
