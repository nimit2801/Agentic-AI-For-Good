name: OrbStack
description: Fast, light Docker and Linux VM environment for macOS that runs containers and distros with lower overhead than Docker Desktop.
tagline: Fast Docker containers and Linux VMs on macOS

github_url: https://github.com/orbstack/orbstack
website_url: https://orbstack.dev
docs_url: https://docs.orbstack.dev

category: Dev Tools
tags: [docker, macos, containers, linux-vm, developer-tools, local-dev]
pricing: freemium
is_open_source: false

problem_solved: |
  macOS developers running local model servers, GPU-adjacent Docker stacks, and
  Linux tools hit Docker Desktop's weight and licensing. OrbStack runs containers
  and Linux VMs with a lighter runtime so AI engineers can develop against
  Compose stacks and Linux environments without that overhead.

use_cases:
  - Run local Docker Compose stacks for AI APIs and vector databases on macOS
  - Replace Docker Desktop with a lighter container runtime for day-to-day work
  - Boot Linux distros on Mac for tools that do not run natively
  - Iterate on containerized inference services without a heavy VM layer
