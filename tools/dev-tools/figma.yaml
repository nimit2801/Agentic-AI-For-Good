name: Figma
description: Collaborative interface design platform used to prototype product UIs, design systems, and agent consoles. Dev Mode and the Figma MCP server let coding agents read frames and tokens instead of guessing from screenshots.
tagline: Collaborative UI design with Dev Mode and MCP for agents

website_url: https://www.figma.com
docs_url: https://help.figma.com

category: Dev Tools
tags: [design, ui, prototyping, collaboration, mcp, design-systems]
pricing: freemium
is_open_source: false

problem_solved: |
  UI specs live in screenshots that coding agents cannot query, so
  implementations drift from the design system. Figma keeps frames, tokens,
  and components in a shared file, and Dev Mode plus the MCP server expose
  those specs so agents implement the real layout instead of a guess.

use_cases:
  - Prototype an agent console or ML dashboard with designers and engineers in one file
  - Hand off tokens and components to a coding agent through the Figma MCP server
  - Maintain a product design system that maps to React or web UI code
  - Review interactive prototypes of a tool catalog or chat UI before build
