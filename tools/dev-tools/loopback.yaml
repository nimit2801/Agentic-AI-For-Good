name: LoopBack
description: LoopBack makes it easy to build modern applications that require complex integrations. It provides a highly extensible, open-source Node.js framework for creating APIs and microservices with strong typing and OpenAPI support.
tagline: Extensible Node.js framework for APIs and microservices

github_url: https://github.com/strongloop/loopback
website_url: https://loopback.io
docs_url: https://loopback.io/doc

category: Dev Tools
tags: [nodejs, api, microservices, typescript, open-source, framework]
pricing: free
is_open_source: true

problem_solved: |
  Building modern APIs and microservices requires handling data sources, authentication, and
  API documentation across multiple protocols and databases. LoopBack provides an extensible
  framework with built-in connectors, strong typing, and auto-generated OpenAPI specifications.

use_cases:
  - Building REST and GraphQL APIs with auto-generated OpenAPI documentation
  - Creating microservices with built-in connectors to SQL and NoSQL databases
  - Developing enterprise backend systems with authentication and authorization
  - Rapidly prototyping APIs with model-driven development and CLI generators
