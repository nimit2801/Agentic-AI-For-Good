name: OhMyREPL
description: Colorschemes and REPL polish for Julia. OhMyREPL.jl layers named syntax-highlighting themes and extra REPL faces on top of Julia 1.13 built-ins so interactive scientific sessions stay readable without a full IDE.
tagline: Colorschemes and extras for the Julia REPL

github_url: https://github.com/KristofferC/OhMyREPL.jl
website_url: https://kristofferc.github.io/OhMyREPL.jl/latest/
docs_url: https://kristofferc.github.io/OhMyREPL.jl/latest/
install_command: julia -e 'using Pkg; Pkg.add("OhMyREPL")'

category: Dev Tools
tags: [julia, repl, syntax-highlighting, developer-experience, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  The Julia REPL is the daily driver for scientific work, but default
  faces are hard to scan in long sessions. OhMyREPL.jl adds named
  colorschemes and extra REPL styling so interactive debugging stays
  readable without switching to an IDE.

use_cases:
  - Apply a named colorscheme to the Julia REPL
  - Define custom StyledStrings faces for syntax highlighting
  - Keep a readable REPL when working over SSH without VS Code
  - Share a consistent REPL theme across a research team
