name: JupyterHub
description: |-
  Multi-user server for Jupyter notebooks that spawns, manages, and proxies multiple single-user notebook servers for classes, teams, and research groups.
problem_solved: |-
  Organizations need a way to provide Jupyter notebook access to multiple users from a single shared server with authentication and resource management.
use_cases:
  - "University classroom notebook hosting"
  - "Corporate data science workgroups"
  - "Research team collaborative environments"
  - "High-performance computing notebook access"
github_url: https://github.com/jupyterhub/jupyterhub
website_url: https://jupyterhub.readthedocs.io/
docs_url: https://jupyterhub.readthedocs.io/en/latest/
install_command: pip install jupyterhub
category: Dev Tools
is_open_source: true
pricing: free
