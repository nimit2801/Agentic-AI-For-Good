name: TipTap
description: Headless rich text editor framework built on ProseMirror. Compose React or Vue editors with extensions for AI writing tools, prompt workspaces, and knowledge-base UIs without shipping a full WYSIWYG stack.
tagline: Headless rich text editor for the web

github_url: https://github.com/ueberdosis/tiptap
website_url: https://tiptap.dev
docs_url: https://tiptap.dev/docs
install_command: npm install @tiptap/core @tiptap/pm @tiptap/starter-kit

category: Dev Tools
tags: [editor, react, vue, prosemirror, wysiwyg, typescript]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  Prompt workspaces and knowledge UIs need rich text with mentions, slash
  commands, and AI insert, but full WYSIWYG products are heavy and hard to
  theme. TipTap is a headless ProseMirror layer with extensions so teams
  ship a custom editor without owning editor internals.

use_cases:
  - Build an AI writing surface with slash commands that insert model output
  - Edit RAG knowledge articles with mentions, links, and structured blocks
  - Embed a prompt composer in a Vue or React agent console
  - Add collaborative document editing to an internal LLM workspace
