name: Kate
description: KDE's advanced text editor with split views, sessions, a plugin architecture, and language server support. It runs on Linux, Windows, and macOS as a native editor for code and markup, with vi input mode, project plugins, and syntax highlighting for hundreds of languages.
tagline: KDE advanced text editor with LSP and plugins

github_url: https://github.com/KDE/kate
website_url: https://kate-editor.org
docs_url: https://docs.kde.org/stable5/en/kate/kate/

install_command: brew install --cask kate

category: Dev Tools
tags: [editor, kde, linux, lsp, plugins, open-source]
pricing: free
is_open_source: true
license: LGPL-2.0-or-later

problem_solved: |
  Linux and cross-platform developers often need a native graphical editor with
  split views, sessions, and language-server integration without adopting an
  Electron IDE. Kate provides a KDE-based editor with plugins, vi mode, project
  tools, and LSP so code and markup editing stays fast on Linux, Windows, and macOS.

use_cases:
  - Edit source and config files with split views, sessions, and project plugins
  - Use language servers for completion, diagnostics, and go-to-definition
  - Switch to vi input mode for keyboard-driven editing on the desktop
  - Highlight and fold hundreds of languages in a native, non-Electron editor
