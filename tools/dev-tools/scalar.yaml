name: Scalar
description: Open-source API platform with a modern REST client and beautiful OpenAPI references. Drop Scalar into a docs site or desktop to explore, try, and document APIs instead of shipping a stale Swagger UI.
tagline: OpenAPI docs and a modern REST API client

github_url: https://github.com/scalar/scalar
website_url: https://scalar.com
docs_url: https://github.com/scalar/scalar
install_command: npm install @scalar/api-reference

category: Dev Tools
tags: [openapi, swagger, api-docs, rest, typescript, documentation]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  OpenAPI docs often mean an outdated Swagger UI and a separate REST
  client. Scalar is an open-source API platform that renders first-class
  OpenAPI references and a modern client so agent APIs and internal
  services get try-it-now docs from the same spec.

use_cases:
  - Embed interactive OpenAPI docs on a product or SDK site
  - Explore and call a REST API from Scalar instead of Postman
  - Keep agent and inference API references in sync with the spec
  - Replace Swagger UI with a themeable, first-class OpenAPI renderer
