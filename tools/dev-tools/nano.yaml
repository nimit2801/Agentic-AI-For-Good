name: Nano
description: GNU nano is a small, modeless terminal text editor with on-screen shortcuts. It is the usual Pico-style editor on Linux and many Unix systems, meant for quick file edits without learning modal keybindings.
tagline: Friendly modeless terminal text editor

website_url: https://www.nano-editor.org
docs_url: https://www.nano-editor.org/dist/latest/nano.html

install_command: brew install nano

category: Dev Tools
tags: [editor, terminal, gnu, cli, linux, open-source]
pricing: free
is_open_source: true
license: GPL-3.0

problem_solved: |
  Many people need to edit a config file on a server without learning Vim.
  GNU nano is a small modeless editor with visible shortcuts so you can open,
  change, and save files in a terminal without modal commands.

use_cases:
  - Edit configuration files on Linux servers over SSH
  - Make quick code or markup changes in a terminal without modal editing
  - Teach newcomers a simple editor with on-screen keybinding help
  - Use syntax highlighting and search in a lightweight GNU editor
