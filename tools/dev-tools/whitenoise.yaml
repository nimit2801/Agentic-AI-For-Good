name: WhiteNoise
description: Radically simplified static file serving for Python web apps. WhiteNoise lets Django, Flask, and other WSGI/ASGI apps serve their own static files without nginx or S3, including compressed and cached assets.
tagline: Serve static files from Python web apps

github_url: https://github.com/evansd/whitenoise
website_url: https://whitenoise.readthedocs.io
docs_url: https://whitenoise.readthedocs.io/en/latest/
install_command: pip install whitenoise

category: Dev Tools
tags: [python, django, flask, static-files, wsgi, asgi]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Model demos, eval dashboards, and internal ML apps still need CSS, JS,
  and images. Wiring nginx or S3 for that on every PaaS deploy is extra
  infra. WhiteNoise serves compressed, cache-friendly static files from
  the app process so a Python service stays a single deployable unit.

use_cases:
  - Serve static assets for a Django or Flask model-demo app on Heroku or similar PaaS
  - Add gzip and cache headers to frontend files next to an inference API
  - Ship an eval dashboard without a separate nginx container
  - Host docs or report HTML generated by a training job from the same app
