name: OpenFPGA
description: OpenFPGA is an open-source FPGA IP generator. It customizes architecture, fabric, and bitstream so teams prototype FPGA-like chips and SoC fabrics without a closed commercial generator.
tagline: Open-source FPGA IP generator for customizable fabrics

github_url: https://github.com/lnis-uofu/OpenFPGA
website_url: https://openfpga.readthedocs.io
docs_url: https://openfpga.readthedocs.io

category: Dev Tools
tags: [openfpga, fpga, ip-generator, bitstream, asic, verilog, architecture]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Custom FPGA fabrics needed a closed IP generator. OpenFPGA produces
  architecture, Verilog fabric, and bitstream tools so teams prototype
  FPGA-like chips and SoC fabrics from an open flow.

use_cases:
  - Generate a customizable FPGA fabric and bitstream compiler from XML
  - Prototype an FPGA-like SoC block without a commercial IP generator
  - Explore LUT, routing, and tile architectures before tapeout
  - Produce Verilog netlists of an FPGA fabric for ASIC implementation
