name: RediSearch
description: A query and indexing engine for Redis that provides secondary indexing, full-text search, vector similarity search, and aggregations. RediSearch extends Redis with advanced search capabilities including hybrid vector and text queries for AI retrieval pipelines.
tagline: Redis search and query engine with vector similarity search

github_url: https://github.com/RediSearch/RediSearch
website_url: https://redis.io/docs/latest/develop/ai/search-and-query/
docs_url: https://redis.io/docs/latest/develop/ai/search-and-query/

