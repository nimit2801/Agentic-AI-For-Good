name: Patter
description: |-
  Open-source voice-AI SDK that gives AI agents a phone number with STT, TTS, real-time voice, and telephony carrier integrations.
problem_solved: |-
  Developers need an open-source alternative to Vapi and Retell for building voice-enabled AI agents with full provider choice at every layer.
use_cases:
  - "AI agent phone call handling"
  - "Real-time voice bot deployments"
  - "Multi-provider voice stack composition"
  - "Telephony-integrated conversational AI"
github_url: https://github.com/PatterAI/Patter
website_url: https://github.com/PatterAI/Patter
docs_url: https://github.com/PatterAI/Patter
install_command: pip install getpatter
category: Agents
is_open_source: true
pricing: free
