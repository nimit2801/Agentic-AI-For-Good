name: RAG Web UI
description: Open-source knowledge-base chat UI built on retrieval-augmented generation. Teams ingest PDFs and docs, switch OpenAI, DeepSeek, MiniMax, or Ollama backends, and expose an OpenAPI for document Q and A.
tagline: Knowledge-base RAG chat UI with OpenAPI

github_url: https://github.com/rag-web-ui/rag-web-ui
website_url: https://github.com/rag-web-ui/rag-web-ui
docs_url: https://github.com/rag-web-ui/rag-web-ui#readme

category: RAG
tags: [typescript, python, rag, knowledge-base, chat, ollama, open-source]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Building a document Q and A product means wiring chunking, a vector store, an LLM, and a chat UI by hand. RAG Web UI is a full-stack RAG dialogue system so teams can ingest PDFs and docs, switch cloud or local models, and serve knowledge-base chat with citations.

use_cases:
  - Stand up an internal knowledge-base chat over PDFs and Markdown
  - Switch between OpenAI, DeepSeek, MiniMax, and Ollama backends
  - Expose document Q and A through the built-in OpenAPI
  - Deploy a RAG chat stack with Docker Compose and ChromaDB or Qdrant
