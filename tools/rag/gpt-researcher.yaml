name: GPT Researcher
description: Autonomous research agent that plans queries, searches the web, and writes cited reports using any LLM provider. GPT Researcher turns a research question into a structured brief without a human doing the search loop.
tagline: Autonomous agent that researches a topic and writes a cited report

github_url: https://github.com/assafelovic/gpt-researcher
website_url: https://gptr.dev
docs_url: https://docs.gptr.dev

install_command: pip install gpt-researcher

category: RAG
tags: [python, rag, research, agents, web-search, llm, mcp]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Deep research still means opening dozens of tabs, copying quotes, and
  stitching a brief by hand. GPT Researcher plans sub-questions, retrieves
  sources from the web, and writes a cited report so a builder gets a
  grounded brief from one prompt.

use_cases:
  - Produce a cited competitive brief from a single research question
  - Summarize a technical topic with sources before writing a design doc
  - Run multi-source web research inside an agent or MCP workflow
  - Generate a literature-style overview for an AI product decision
  - Attach custom retrievers so the agent searches internal docs plus the web
