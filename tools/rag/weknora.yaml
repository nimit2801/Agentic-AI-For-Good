name: WeKnora
description: WeKnora is Tencent's open-source LLM knowledge platform that turns documents into queryable RAG, an autonomous reasoning agent, and a self-maintaining wiki. It covers hybrid search, multimodal parsing, MCP, and multi-workspace deployments.
tagline: LLM knowledge platform for RAG, agents, and living wikis

github_url: https://github.com/Tencent/WeKnora
website_url: https://weknora.weixin.qq.com
docs_url: https://weknora.weixin.qq.com/docs

category: RAG
tags: [rag, knowledge-base, wiki, agents, tencent, docker, mcp]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Enterprise knowledge is scattered across PDFs, wikis, and chat, so Q&A, multi-step tasks, and documentation drift apart. WeKnora unifies RAG, an agent toolbox, and a living wiki on the same knowledge bases with citations, MCP, and self-hosted Docker or Kubernetes deploys.

use_cases:
  - Deploy a private RAG and wiki over PDFs, Confluence, Notion, or Feishu docs
  - Run multi-step knowledge tasks with WeKnora agents, skills, and MCP tools
  - Sync GitLab or RSS sources into a self-maintaining knowledge wiki
  - Embed WeKnora Q&A into Slack, Telegram, or WeCom with scoped API keys
