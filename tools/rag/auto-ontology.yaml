name: Auto Ontology
description: NVIDIA Python framework that builds a semantic, graph-based reasoning layer over enterprise data. Auto Ontology generates ontologies from metadata, grounds agents on certified metrics, and exposes context through MCP, CLI, and API for retrieval and NL-to-SQL.
tagline: Semantic ontology layer for grounded agent retrieval

github_url: https://github.com/NVIDIA/auto-ontology
website_url: https://github.com/NVIDIA/auto-ontology
docs_url: https://github.com/NVIDIA/auto-ontology

category: RAG
tags: [python, rag, ontology, knowledge-graph, nvidia, mcp, nl-to-sql]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Agents can retrieve documents and query databases, but metric
  answers fail when definitions differ across systems. Auto Ontology
  builds a semantic graph from enterprise metadata, reconciles
  certified meaning, and serves it over MCP, CLI, and API so retrieval
  and NL-to-SQL stay grounded in lineage.

use_cases:
  - Generate an enterprise ontology from warehouse and catalog metadata
  - Ground an agent on certified metric definitions before NL-to-SQL
  - Validate generated SQL against lineage and return provenance
  - Expose the ontology to any agent harness through MCP or REST
