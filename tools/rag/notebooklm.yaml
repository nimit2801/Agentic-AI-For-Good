name: NotebookLM
description: Google source-grounded research assistant for chatting with your own files. Upload PDFs, websites, YouTube videos, audio, Docs, and Slides, then get cited answers, study guides, mind maps, and Audio Overviews from Gemini.
tagline: Chat with your sources and turn them into briefings

website_url: https://notebooklm.google/
docs_url: https://support.google.com/notebooklm

category: RAG
tags: [rag, google, gemini, research, citations, audio-overview, saas]
pricing: freemium
is_open_source: false

problem_solved: |
  Research notes, PDFs, and lecture recordings sit in separate files, so turning
  them into cited answers or study material is slow. NotebookLM grounds Gemini
  in the sources you upload, returning quotes you can check instead of generic chat.

use_cases:
  - Upload papers and notes, then ask questions with inline citations back to the source
  - Turn lecture recordings and textbooks into study guides and Audio Overviews
  - Build a briefing or mind map from a mix of Docs, Slides, websites, and YouTube
  - Ground a writing or research workflow in a private notebook instead of a general chatbot
