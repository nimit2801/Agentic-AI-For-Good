name: NeumAI
description: |-
  Data platform for managing creation and synchronization of vector embeddings at large scale for Retrieval Augmented Generation.
problem_solved: |-
  Developers need a comprehensive solution for RAG that scales with their application and reduces integration time between data connectors, embedding models and vector databases.
use_cases:
  - "Large-scale document embedding pipelines"
  - "Real-time data synchronization for RAG"
  - "Hybrid retrieval with metadata"
  - "Multi-source data connector integration"
github_url: https://github.com/NeumTry/NeumAI
website_url: https://www.neum.ai
docs_url: https://docs.neum.ai
install_command: pip install neumai
category: RAG
is_open_source: true
pricing: freemium
