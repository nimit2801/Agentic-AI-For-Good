name: LaVague
description: Large Action Model framework for AI web agents. Turns a natural-language goal into browser actions with an agent, world model, and Playwright driver so teams can automate sites that have no public API.
tagline: Web agent framework that turns goals into browser actions

github_url: https://github.com/lavague-ai/LaVague
website_url: https://docs.lavague.ai/en/latest/
docs_url: https://docs.lavague.ai/en/latest/

install_command: pip install lavague

category: Agents
tags: [web-agents, browser-automation, playwright, python, large-action-model]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Many internal tools only exist as web UIs, so agents cannot call a REST
  API. LaVague plans and executes browser actions from a goal so you can
  automate form fills, scraping, and multi-step site workflows with an
  LLM in the loop.

use_cases:
  - Automate a multi-step SaaS workflow that has no public API
  - Build a web agent that searches, clicks, and extracts fields from a site
  - Prototype a Large Action Model agent with Playwright as the driver
  - Fill internal admin forms from a natural-language instruction
  - Evaluate web-agent traces when comparing browser-use frameworks
