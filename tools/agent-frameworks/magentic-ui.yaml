name: Magentic-UI
description: Experimental Microsoft agent that works across the browser and local files. Teams use Magentic-UI to try human-in-the-loop web and filesystem agents without building a browser runtime from scratch.
tagline: Browser and filesystem agent from Microsoft Research

github_url: https://github.com/microsoft/magentic-ui
website_url: https://www.microsoft.com/en-us/research/blog/magenticlite-magenticbrain-fara1-5-an-agentic-experience-optimized-for-small-models/
docs_url: https://github.com/microsoft/magentic-ui
install_command: uv pip install magentic_ui

category: Agents
tags: [python, agents, browser, human-in-the-loop, microsoft, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Browser agents usually hide the UI or run fully autonomously. Magentic-UI
  is a research agent that can operate the browser and local files with
  humans in the loop, so teams can study and ship assisted web workflows
  without writing a Playwright agent from zero.

use_cases:
  - Drive a browser agent that a human can steer mid-task
  - Let an agent read and write local files during research
  - Prototype a human-in-the-loop web workflow on Magentic-UI
  - Evaluate small models on browser and filesystem agent tasks
