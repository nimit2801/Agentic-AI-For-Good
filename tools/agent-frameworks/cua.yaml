name: Cua
description: Open-source computer-use stack for AI agents. Background desktop drivers on macOS, Windows, and Linux plus agent-ready sandboxes for any OS, so agents can click, type, and screenshot without stealing focus, locally or in the cloud.
tagline: Background computer-use for agents on any OS

github_url: https://github.com/trycua/cua
website_url: https://cua.ai
docs_url: https://cua.ai/docs
install_command: pip install cua

category: Agents
tags: [python, agents, computer-use, desktop-automation, sandbox, macos, windows, linux]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  Computer-use agents usually seize the mouse and keyboard, so they cannot share a
  machine with a human and are hard to run in the background. Cua provides OS-level
  drivers that click and type without stealing focus, plus the same sandbox API for
  Linux, macOS, Windows, and Android VMs locally or in the cloud, so teams can
  automate real desktops and train computer-use models without a dedicated kiosk.

use_cases:
  - Give a coding agent a background desktop so it can drive native apps without taking the cursor
  - Run computer-use sandboxes for Linux, macOS, Windows, or Android with one Python API
  - Evaluate agents on OSWorld-style benchmarks and export trajectories for training
  - Automate GUI workflows on a shared laptop while the user keeps working
