name: iGibson
description: iGibson is Stanford's Bullet-based simulator for training robots in large realistic indoor scenes. It ships interactive homes with object states so agents can practice navigation and household manipulation from vision.
tagline: Indoor robot simulator with interactive household scenes

github_url: https://github.com/StanfordVL/iGibson
website_url: http://svl.stanford.edu/igibson
docs_url: http://svl.stanford.edu/igibson/docs/
install_command: pip install igibson

category: Agents
tags: [python, robotics, simulation, indoor, navigation, stanford]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Household robot learning needs more than empty gym rooms. iGibson
  provides large reconstructed homes, object states such as cooked or
  soaked, and VR demo collection so agents can train navigation and
  everyday manipulation from visual observations.

use_cases:
  - Train a visual navigation policy inside interactive iGibson homes
  - Practice household tasks that depend on temperature, wetness, or toggled states
  - Collect VR human demonstrations for imitation learning
  - Import CubiCasa or 3D-Front scenes for extra indoor layouts
