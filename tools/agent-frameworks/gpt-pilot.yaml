name: GPT-Pilot
description: An open-source AI developer from Pythagora that works with you to build full software projects. It breaks a spec into tasks, writes code, runs it, and iterates until the app compiles and the features land.
tagline: An AI developer that builds complete apps with you

github_url: https://github.com/Pythagora-io/gpt-pilot
docs_url: https://github.com/Pythagora-io/gpt-pilot#readme

install_command: pip install gpt-pilot

category: Agents
tags: [python, agents, coding-agent, codegen, gpt-4, developer-tools]
pricing: free
is_open_source: true
license: FSL-1.1-MIT

problem_solved: |
  Copilots autocomplete a file. They do not own a product from
  empty folder to running app. GPT-Pilot takes a high-level spec,
  plans tasks, writes code across the repo, and debugs failures
  with the human in the loop. Teams get an agent that builds a
  project instead of a tab-complete plugin.

use_cases:
  - Bootstrap a full-stack app from a written spec with the agent writing and running code
  - Pair with GPT-Pilot while it debugs failing tasks instead of pasting stack traces into chat
  - Research coding agents that own multi-file projects rather than single-file edits
  - Prototype an internal AI developer workflow before adopting a hosted coding agent
