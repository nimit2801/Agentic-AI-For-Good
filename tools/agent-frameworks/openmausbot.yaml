name: OpenMausBot
description: >-
  OpenMausBot is an open-source Grok Bot alternative: a chat app where every
  contact is a real local agent (Claude, Codex, or Grok) with its own personality,
  model, cloud computer, and connected apps.
tagline: Open-source Grok Bot alternative with real local agents

github_url: https://github.com/milind-soni/OpenMausBot
website_url: https://www.openmausbot.com
docs_url: https://github.com/milind-soni/OpenMausBot#readme
install_command: npm install -g openmausbot

category: Agents
tags: [agents, desktop, electron, grok, claude, codex, self-hosted, chat]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Consumer bot apps hide the agent behind a closed chat UI and a vendor model.
  OpenMausBot is a local-first messenger where each bot is Claude, Codex, or Grok
  running on your machine, with its own personality, cloud computer, and apps, so
  you talk to real agents like contacts instead of a single boxed assistant.

use_cases:
  - Run a team of Claude, Codex, and Grok bots as contacts in a desktop chat app
  - Give each bot its own model, personality, and cloud computer for long-running work
  - Self-host the OpenMausBot server and pair phones or extra devices to it
  - Install a Markdown team pack so a whole agent roster lands in one import
