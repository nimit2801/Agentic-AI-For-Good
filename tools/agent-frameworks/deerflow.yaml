name: DeerFlow
description: Open-source SuperAgent harness from ByteDance that researches, codes, and creates over long horizons. Teams use DeerFlow with sandboxes, memory, skills, and subagents for tasks that take minutes to hours instead of a single prompt.
tagline: Long-horizon SuperAgent harness from ByteDance

github_url: https://github.com/bytedance/deer-flow
website_url: https://deerflow.tech
docs_url: https://github.com/bytedance/deer-flow

category: Agents
tags: [python, agents, harness, sandbox, memory, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Most agent demos die after a few tool calls. Long research and coding
  jobs need sandboxes, memory, skills, and subagents. DeerFlow is a
  SuperAgent harness for those minute-to-hour tasks so teams do not rebuild
  orchestration, memory, and isolation from scratch.

use_cases:
  - Run a long-horizon research agent with sandboxed tools
  - Coordinate subagents on a multi-hour coding task
  - Persist agent memory and skills across sessions
  - Self-host a SuperAgent stack instead of a closed copilot
