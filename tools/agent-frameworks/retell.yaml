name: Retell
description: Voice AI platform for automating phone calls with about 600ms latency, realistic voices, and SIP telephony. Build receptionists, appointment setters, and support lines that talk, take notes, and call tools without assembling STT, LLM, and TTS yourself.
tagline: Low-latency voice agents for phone call centers

website_url: https://www.retellai.com
docs_url: https://docs.retellai.com
install_command: pip install retell-sdk

category: Agents
tags: [saas, voice, agents, telephony, call-center, realtime, python]
pricing: paid
is_open_source: false

problem_solved: |
  Call-center voice bots stall on slow turn-taking and custom telephony glue.
  Retell packages speech recognition, an LLM, TTS, and SIP into a sub-second
  loop so operations teams can deploy inbound and outbound phone agents that
  sound human and hit CRM tools without owning the realtime stack.

use_cases:
  - Deploy an inbound receptionist that answers, routes, and books appointments
  - Run outbound lead-qualification or survey calls on existing phone numbers
  - Connect SIP trunks so agents use the company's current telephony provider
  - Drive the Retell API from Python to create agents and inspect call transcripts
