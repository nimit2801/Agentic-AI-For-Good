name: OS-Copilot
description: An open-source library for generalist agents that use a full operating system. FRIDAY-style agents can drive the web, terminals, files, multimedia, and third-party apps, then improve themselves by adding skills.
tagline: Self-improving agents that operate a whole OS

github_url: https://github.com/OS-Copilot/OS-Copilot
docs_url: https://os-copilot.readthedocs.io

install_command: pip install os-copilot

category: Agents
tags: [python, agents, os, computer-use, self-improving, friday, desktop]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Most agents are stuck in a chat box or a single browser tab.
  Real work spans terminals, files, browsers, and desktop apps.
  OS-Copilot gives a generalist agent those OS interfaces and a
  skill system so FRIDAY can learn new tools instead of waiting
  for a developer to hard-code each integration.

use_cases:
  - Build a desktop agent that edits files, runs shell commands, and browses the web in one session
  - Deploy FRIDAY API services so other apps can call an OS-level agent
  - Let the agent store new skills after a successful task and reuse them later
  - Research self-improving computer-use agents that grow beyond a fixed tool list
