name: RuoYi-AI
description: Enterprise AI agent framework with multi-provider LLMs, knowledge bases, visual workflows, and multi-agent coordination. Teams use RuoYi-AI to build production agents on a Java admin stack instead of assembling chat, RAG, and orchestration by hand.
tagline: Enterprise AI agent framework with visual workflows

github_url: https://github.com/ageerle/ruoyi-ai
website_url: https://doc.ruoyiai.chat
docs_url: https://doc.ruoyiai.chat

category: Agents
tags: [java, agents, rag, workflow, enterprise, open-source]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Enterprise teams need LLM routing, knowledge bases, and visual workflows
  on a familiar Java admin stack. RuoYi-AI bundles those pieces so
  developers can ship production agents without wiring chat, RAG, and
  orchestration as separate products.

use_cases:
  - Build an internal knowledge-base Q and A agent on a Java stack
  - Orchestrate multi-agent workflows in a visual editor
  - Route requests across multiple LLM providers from one admin UI
  - Ship an enterprise chat and agent portal with existing RuoYi patterns
