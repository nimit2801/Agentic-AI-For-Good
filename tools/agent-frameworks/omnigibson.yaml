name: OmniGibson
description: OmniGibson is Stanford's photorealistic embodied AI platform on NVIDIA Omniverse. It combines visual realism, fluid and soft-body physics, large indoor scenes, semantic object states, and Gym robots so agents can train everyday household tasks with physical fidelity.
tagline: Photoreal embodied AI simulation on NVIDIA Omniverse

github_url: https://github.com/StanfordVL/BEHAVIOR-1K
website_url: https://behavior.stanford.edu
docs_url: https://behavior.stanford.edu/omnigibson/
install_command: pip install omnigibson

category: Agents
tags: [python, agents, embodied-ai, simulation, robotics, omniverse, gym]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Household robot agents need photoreal scenes with fluids, cloth, and
  object states, but game engines lack that physics and scale. OmniGibson
  puts mobile manipulators in BEHAVIOR-1K indoor scenes so everyday
  activities train with visual and physical fidelity.

use_cases:
  - Train household robots on 1,000 everyday BEHAVIOR-1K activities
  - Simulate fluid and soft-body interactions during manipulation
  - Benchmark mobile manipulators with Gym-compatible controllers
  - Collect photoreal RGB-D data for imitation learning pipelines
