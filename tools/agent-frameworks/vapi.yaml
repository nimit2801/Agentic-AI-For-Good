name: Vapi
description: Platform for building voice AI agents that make and receive phone and web calls. Compose assistants and squads with STT, LLM, TTS, tools, and telephony so teams can ship production voice workflows without assembling a custom realtime stack.
tagline: Voice agents for phone and web calls

website_url: https://vapi.ai
docs_url: https://docs.vapi.ai
install_command: pip install vapi-server-sdk

category: Agents
tags: [saas, voice, agents, telephony, realtime, stt, tts, python]
pricing: paid
is_open_source: false

problem_solved: |
  Building a production voice agent means wiring speech-to-text, an LLM,
  text-to-speech, interruption handling, and PSTN or WebRTC yourself. That
  glue is slow and brittle. Vapi provides assistants, squads, tools, and
  phone or web calling out of the box so product teams can ship voice
  workflows without owning the realtime pipeline.

use_cases:
  - Launch an inbound phone support agent that answers, transfers, and takes notes
  - Embed a web voice assistant that talks to users in the browser
  - Orchestrate multi-assistant squads that hand off across languages or tools
  - Add custom function-calling tools so a voice agent can hit internal APIs mid-call
