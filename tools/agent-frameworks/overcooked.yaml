name: Overcooked
description: Overcooked-AI is a cooperative human-AI benchmark based on the Overcooked video game. Agents must cook and deliver soups by splitting tasks on the fly, making it a standard testbed for coordination research.
tagline: Cooperative human-AI kitchen benchmark for multi-agent RL

github_url: https://github.com/HumanCompatibleAI/overcooked_ai
website_url: https://humancompatibleai.github.io/overcooked-demo/
docs_url: https://github.com/HumanCompatibleAI/overcooked_ai
install_command: pip install overcooked-ai

category: Agents
tags: [python, reinforcement-learning, multi-agent, human-ai, coordination, benchmark]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Fully cooperative human-AI work needs shared layouts where partners
  specialize, hand off, and adapt without a scripted plan. Overcooked-AI
  turns kitchen cooking into a MARL benchmark so researchers can measure
  coordination with other agents and with people.

use_cases:
  - Train two cooperative chefs to cook and deliver soups on cramped kitchen layouts
  - Evaluate human-AI coordination with the Overcooked web demo or logged play data
  - Compare MARL algorithms on layouts that require on-the-fly task allocation
  - Collect human-human or human-AI trajectories for imitation and preference research
