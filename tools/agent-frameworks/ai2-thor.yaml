name: AI2-THOR
description: AI2-THOR is Allen AI's open-source visual AI platform with interactive 3D indoor scenes. Agents can navigate rooms, pick up objects, open cabinets, and run embodied tasks so researchers can study household robotics, visual navigation, and instruction following.
tagline: Interactive 3D indoor scenes for embodied visual AI

github_url: https://github.com/allenai/ai2thor
website_url: https://ai2thor.allenai.org
docs_url: https://ai2thor.allenai.org
install_command: pip install ai2thor

category: Agents
tags: [python, embodied-ai, robotics, simulation, allenai, visual-navigation, household]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Embodied agents need photoreal indoor worlds they can manipulate, but most
  simulators are either visual-only or too slow to script. AI2-THOR gives
  interactive Unity scenes where agents navigate, grasp objects, and complete
  household tasks, so vision and language researchers can train without a
  physical robot.

use_cases:
  - Train a visual navigation agent to find objects in AI2-THOR kitchens and living rooms
  - Benchmark household manipulation such as opening a fridge and placing an item
  - Collect embodied instruction-following data by pairing language goals with THOR actions
  - Prototype a robotic planner against interactive 3D scenes before hardware trials
