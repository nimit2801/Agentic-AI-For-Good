name: Cradle
description: A BAAI framework for general computer control. Foundation models take screenshots and emit keyboard and mouse actions to play games and drive desktop software such as Chrome, Outlook, and CapCut without app-specific APIs.
tagline: Foundation agents that control computers like a human

github_url: https://github.com/BAAI-Agents/Cradle
website_url: https://baai-agents.github.io/Cradle/
docs_url: https://github.com/BAAI-Agents/Cradle#readme

category: Agents
tags: [python, agents, computer-use, gui, multimodal, games, baai, foundation-agents]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Computer-use agents often need accessibility trees or per-app plugins
  that do not exist in games or closed desktop software. Cradle uses the
  same interface people use: pixels in, keyboard and mouse out. The same
  loop has been shown on Red Dead Redemption 2, Stardew Valley, Chrome,
  Outlook, and video editors, so researchers can study general computer
  control instead of one-off integrations.

use_cases:
  - Run a vision-language agent that plays commercial games from screenshots and input events
  - Automate desktop apps such as Chrome, Outlook, or CapCut without official automation APIs
  - Benchmark foundation models on general computer control rather than a single website
  - Prototype GCC agents that switch between an IDE and a target environment during a task
