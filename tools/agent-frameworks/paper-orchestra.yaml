name: Paper Orchestra
description: Multi-agent framework from Google Research for automated AI research paper writing. Paper Orchestra splits ideation, experiments, and drafting across agents so a research loop produces a paper draft instead of a chat log.
tagline: Multi-agent framework for automated research paper writing

github_url: https://github.com/google-research/paper-orchestra
website_url: https://yiwen-song.github.io/paper_orchestra/
docs_url: https://github.com/google-research/paper-orchestra

category: Agents
tags: [python, multi-agent, research, paper-writing, google]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Writing an AI paper still means one person juggling ideas, runs, and
  prose. Paper Orchestra assigns those jobs to cooperating agents so
  a research loop can draft a paper with less manual glue between
  experiment and write-up.

use_cases:
  - Draft an AI research paper from an experiment plan
  - Split ideation, writing, and review across specialized agents
  - Reproduce a paper-writing workflow from the Google Research code
  - Generate related-work sections from a seed topic
  - Prototype an automated research assistant in a lab setting
