name: LIBERO
description: LIBERO is a lifelong robot learning benchmark for knowledge transfer across manipulation tasks. It provides language-conditioned simulation tasks, datasets, and evaluation so agents learn new skills without forgetting prior ones.
tagline: Lifelong robot learning benchmark for knowledge transfer

github_url: https://github.com/Lifelong-Robot-Learning/LIBERO
docs_url: https://github.com/Lifelong-Robot-Learning/LIBERO

category: Agents
tags: [python, agents, robotics, lifelong-learning, manipulation, benchmark, imitation-learning]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Robot agents forget old skills when fine-tuned on new tasks.
  LIBERO benchmarks knowledge transfer across language-conditioned
  manipulation suites so researchers measure lifelong learning
  instead of single-task success.

use_cases:
  - Benchmark lifelong manipulation agents on LIBERO task suites
  - Train language-conditioned policies that transfer across object sets
  - Evaluate catastrophic forgetting in sequential robot learning
  - Collect demonstration data for imitation on LIBERO environments
