name: SAPIEN
description: SAPIEN is an embodied AI simulation platform for robot manipulation research. It provides physically realistic articulated scenes so agents can train vision and control policies in interactive 3D environments.
tagline: Embodied AI simulator for robot manipulation

github_url: https://github.com/haosulab/SAPIEN
website_url: https://sapien.ucsd.edu/
docs_url: https://sapien.ucsd.edu/docs
install_command: pip install sapien

category: Agents
tags: [python, robotics, simulation, embodied-ai, manipulation, gpu]
pricing: free
is_open_source: true
license: Apache-2.0

problem_solved: |
  Robot manipulation research needs fast physics and articulated objects,
  not just rigid-body gym tasks. SAPIEN simulates interactive 3D scenes
  with GPU rendering so agents can learn grasping and part-based control
  before running on hardware.

use_cases:
  - Train a manipulation policy on articulated objects in SAPIEN scenes
  - Render RGB and depth observations for visuomotor robot learning
  - Prototype part-based interaction tasks before deploying on a real arm
  - Benchmark embodied agents in physically realistic indoor environments
