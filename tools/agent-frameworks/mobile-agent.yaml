name: Mobile-Agent
description: A GUI agent family from Alibaba Tongyi Lab that drives smartphones and computers from screenshots, taps, and swipes. Mobile-Agent-v3.5 and GUI-Owl models cover Android, cloud phones, and desktop computer-use without app-specific APIs.
tagline: Multimodal GUI agents for mobile and desktop computer use

github_url: https://github.com/X-PLUG/MobileAgent
docs_url: https://github.com/X-PLUG/MobileAgent#readme

category: Agents
tags: [python, agents, gui, mobile, multimodal, android, computer-use, alibaba]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Most agents talk to apps through APIs that do not exist on consumer phones.
  Mobile-Agent treats the screen as the interface: a vision-language model
  reads screenshots, plans taps and swipes, and runs tasks across Android
  apps and cloud phones. Teams can evaluate and ship GUI agents without
  reverse-engineering each app backend.

use_cases:
  - Automate multi-step Android tasks such as booking, messaging, or settings changes from a natural language goal
  - Benchmark GUI-Owl and other multimodal models on real mobile app workflows
  - Drive a cloud Android phone from Alibaba Cloud Wuying without installing a custom SDK in each app
  - Research computer-use agents that switch between GUI actions and tool calls on mobile screens
