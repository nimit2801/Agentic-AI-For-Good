name: Coze
description: ByteDance no-code and API platform for building AI agents and publishing them across chat apps with WebSDKs. Design workflows visually, connect tools, and ship assistants without standing up your own orchestration runtime.
tagline: Build and publish agents without owning the stack

website_url: https://www.coze.com
docs_url: https://www.coze.com/docs
install_command: pip install cozepy

category: Agents
tags: [saas, agents, no-code, workflows, bytedance, python, chatbot]
pricing: freemium
is_open_source: false

problem_solved: |
  Shipping an agent to chat surfaces means writing orchestration, tool
  calling, and channel adapters yourself. Coze gives a visual builder plus
  APIs and WebSDKs so product teams can compose workflows, plug in tools,
  and publish assistants to multiple apps without running their own agent
  server.

use_cases:
  - Build a customer-support agent in the visual editor and publish it to a website
  - Call Coze workflows from Python with the official OpenAPI SDK
  - Connect internal APIs as tools the agent can invoke during a chat
  - Prototype multi-step outreach or research workflows without writing an orchestrator
