name: Godot RL Agents
description: Godot RL Agents is an open-source package that trains reinforcement learning agents inside the Godot game engine. Game creators and researchers can attach sensors and rewards to scenes so NPCs learn complex behaviors without leaving the Godot editor.
tagline: Train RL agents as NPCs inside the Godot game engine

github_url: https://github.com/edbeeching/godot_rl_agents
install_command: pip install godot-rl

category: Agents
tags: [python, godot, reinforcement-learning, game-ai, npc, simulation]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Game AI usually relies on hand-authored NPC logic, and research RL engines
  are disconnected from Godot scenes. Godot RL Agents lets creators attach
  observations and rewards in the editor so agents learn in-game behavior
  instead of being scripted or trained in a separate simulator.

use_cases:
  - Train an NPC in a Godot scene to navigate, chase, or complete level objectives
  - Connect a Python RL trainer to a Godot environment for game-AI research
  - Prototype learned character controllers without exporting the game to Unity or Gym
  - Let hobbyists add reinforcement learning to an existing Godot project with sensors
