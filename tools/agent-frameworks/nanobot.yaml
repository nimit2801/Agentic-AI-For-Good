name: NanoBot
description: Ultra-lightweight, open-source, self-hosted personal AI agent framework in Python with WebUI, tools, memory, MCP support, multi-agent workflows, automation, and chat apps — deployable on any device with minimal resources.
tagline: Self-hosted personal AI agent that runs anywhere

github_url: https://github.com/HKUDS/nanobot
website_url: https://nanobrowser.cn
docs_url: https://github.com/HKUDS/nanobot#readme

install_command: pip install nanobot

category: Agents
tags: [python, agents, webui, mcp, multi-agent, automation, self-hosted, lightweight]
pricing: free
is_open_source: true
license: MIT

problem_solved: |
  Building and running personal AI agents typically requires significant cloud infrastructure, complex setups, or proprietary platforms. Most agent frameworks are heavy — requiring GPU instances, Docker stacks, or complex orchestration tooling — making them impractical for individual users or resource-constrained environments. NanoBot solves this by providing a complete, self-hosted agent framework that runs on any device with Python: laptops, Raspberry Pis, or cloud VMs. It bundles a WebUI, MCP tools, memory systems, multi-agent orchestration, and chat capabilities in a single lightweight package that starts in seconds.

use_cases:
  - Set up a personal AI assistant with WebUI, tool use, and memory on a laptop or Raspberry Pi in minutes
  - Deploy a multi-agent system where specialized agents collaborate on complex workflows autonomously
  - Build and share MCP tools that expand the agent's capabilities without modifying the core framework
  - Automate daily tasks — email drafting, research, code generation — with a self-hosted agent that respects data privacy
  - Experiment with agent architectures, memory strategies, and tool orchestration in a lightweight sandbox
