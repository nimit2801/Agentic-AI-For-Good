name: Shannon
description: |-
  Production-oriented multi-agent orchestration framework with temporal workflows, time-travel debugging, token budget control, human approval workflows, and WASI sandboxing. Supports swarm collaboration with real-time event streaming and OpenTelemetry tracing.
problem_solved: |-
  Shipping reliable AI agents to production with hard cost controls, full execution visibility, security sandboxing, and vendor-agnostic model support across OpenAI, Anthropic, Google, DeepSeek, xAI, and local models via Ollama.
use_cases:
  - "Multi-agent swarm collaboration with token budget enforcement"
  - "Temporal workflow orchestration with step-by-step replay debugging"
  - "Secure agent code execution via WASI sandbox and OPA policies"
  - "Real-time agent observability with Prometheus metrics and OpenTelemetry"
github_url: https://github.com/Kocoro-lab/Shannon
website_url: https://shannon.run
docs_url: https://docs.shannon.run
category: Agents
tags:
  - multi-agent
  - orchestration
  - temporal
  - sandbox
  - go
  - rust
pricing: free
is_open_source: true
license: MIT
