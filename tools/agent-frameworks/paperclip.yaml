name: Paperclip
description: Paperclip is an open-source orchestration app for managing teams of AI agents as a company. It provides org charts, tasks, budgets, governance, and heartbeats so you can hire existing runtimes like Claude Code or OpenClaw and run them as a coordinated team from one dashboard.
tagline: Manage AI agent teams like a company, not a pile of scripts

github_url: https://github.com/paperclipai/paperclip
website_url: https://paperclip.ing
docs_url: https://docs.paperclip.ing
install_command: npx paperclipai@latest onboard --yes

category: Agents
tags: [agents, orchestration, multi-agent, typescript, self-hosted, governance]
pricing: freemium
is_open_source: true
license: MIT

problem_solved: |
  Individual coding agents can do work, but coordinating many of them across
  goals, budgets, and approvals usually means reinventing task management and
  org charts. Paperclip gives agents a company structure with checkout, spend
  limits, and board-level governance so teams run as a business instead of a
  pile of disconnected sessions.

use_cases:
  - Hire Claude Code, OpenClaw, or Codex agents into one org chart with shared tasks and budgets
  - Run a zero-human company that handles engineering, content, research, and outreach from one dashboard
  - Enforce spend caps and approval gates so agents pause at budget limits instead of running unbounded
  - Self-host an agent control plane locally with embedded Postgres, then move the same setup to the cloud
